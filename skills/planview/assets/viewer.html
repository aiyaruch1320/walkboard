<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>planview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 128 128%22 width=%22128%22 height=%22128%22 role=%22img%22 aria-label=%22planview%22%3E %3Crect width=%22128%22 height=%22128%22 rx=%2228%22 fill=%22%2326215c%22/%3E %3Cpath d=%22M51 40 H71%22 stroke=%22%23e4e1fb%22 stroke-width=%223.5%22 stroke-linecap=%22round%22 stroke-dasharray=%221 7%22/%3E %3Cpath d=%22M84 52 C84 62 78 66 70 68%22 fill=%22none%22 stroke=%22%23e4e1fb%22 stroke-width=%223.5%22 stroke-linecap=%22round%22 stroke-dasharray=%221 7%22/%3E %3Crect x=%2218%22 y=%2228%22 width=%2233%22 height=%2224%22 rx=%228%22 fill=%22%235dcaa5%22/%3E %3Crect x=%2271%22 y=%2228%22 width=%2233%22 height=%2224%22 rx=%228%22 fill=%22%23ef9f27%22/%3E %3Cpath d=%22M38 66 H90 a9 9 0 0 1 9 9 V92 a9 9 0 0 1 -9 9 H56 L42 111 L45 101 H38 a9 9 0 0 1 -9 -9 V75 a9 9 0 0 1 9 -9 Z%22 fill=%22%23afa9ec%22/%3E %3Ccircle cx=%2251%22 cy=%2283.5%22 r=%224%22 fill=%22%2326215c%22/%3E %3Ccircle cx=%2264%22 cy=%2283.5%22 r=%224%22 fill=%22%2326215c%22/%3E %3Ccircle cx=%2277%22 cy=%2283.5%22 r=%224%22 fill=%22%2326215c%22/%3E %3C/svg%3E">
<style>
:root{
  --bg:#f7f6f2;--card:#ffffff;--text:#1f1e1c;--muted:#6b6a65;--line:#d9d7cf;
  --done-bg:#e1f5ee;--done-bd:#1d9e75;--done-tx:#085041;
  --new-bg:#faeeda;--new-bd:#ef9f27;--new-tx:#633806;
  --todo-bg:#f1efe8;--todo-bd:#b4b2a9;--todo-tx:#888780;
  --ext-bg:#e6f1fb;--ext-bd:#378add;--ext-tx:#0c447c;
  --warn-bg:#fcebeb;--warn-bd:#d85a5a;--warn-tx:#7a1f1f;
  --you-bg:#eeedfe;--you-bd:#7f77dd;--you-tx:#3c3489;
  --code:#f1efe8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1b19;--card:#262522;--text:#ecebe6;--muted:#a3a19a;--line:#3d3c38;
  --done-bg:#0b3d31;--done-bd:#5dcaa5;--done-tx:#c8f0e2;
  --new-bg:#4a3006;--new-bd:#ef9f27;--new-tx:#fae3b8;
  --todo-bg:#2c2c2a;--todo-bd:#5f5e5a;--todo-tx:#888780;
  --ext-bg:#0c2a4a;--ext-bd:#85b7eb;--ext-tx:#d6e7f8;
  --warn-bg:#4a1717;--warn-bd:#e07a7a;--warn-tx:#f8d6d6;
  --you-bg:#26215c;--you-bd:#afa9ec;--you-tx:#e4e1fb;
  --code:#2c2c2a;
}}
:root[data-theme="dark"]{
  --bg:#1c1b19;--card:#262522;--text:#ecebe6;--muted:#a3a19a;--line:#3d3c38;
  --done-bg:#0b3d31;--done-bd:#5dcaa5;--done-tx:#c8f0e2;
  --new-bg:#4a3006;--new-bd:#ef9f27;--new-tx:#fae3b8;
  --todo-bg:#2c2c2a;--todo-bd:#5f5e5a;--todo-tx:#888780;
  --ext-bg:#0c2a4a;--ext-bd:#85b7eb;--ext-tx:#d6e7f8;
  --warn-bg:#4a1717;--warn-bd:#e07a7a;--warn-tx:#f8d6d6;
  --you-bg:#26215c;--you-bd:#afa9ec;--you-tx:#e4e1fb;
  --code:#2c2c2a;

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,"Noto Sans Thai","Sarabun",system-ui,sans-serif}
main{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;font-weight:500;margin:0}
.goal{color:var(--muted);margin:2px 0 12px}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.conn{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.conn.on{color:var(--done-tx);background:var(--done-bg);border-color:var(--done-bd)}
.conn.off{color:var(--warn-tx);background:var(--warn-bg);border-color:var(--warn-bd)}
.conn.idle{color:var(--new-tx);background:var(--new-bg);border-color:var(--new-bd)}
.banner,.problems{border:1.5px solid var(--warn-bd);background:var(--warn-bg);color:var(--warn-tx);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.problems{position:fixed;left:16px;bottom:16px;max-width:min(440px,calc(100vw - 32px));max-height:40vh;overflow:auto;margin:0;z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.bar{position:sticky;top:0;z-index:15;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;padding:8px 0;margin-bottom:4px;background:var(--bg);box-shadow:0 1px 0 var(--line)}
.bar button.primary{font-weight:500}
.bar #barExtra{display:contents}
.bar button{font-size:12px;padding:2px 10px;border-radius:999px}
.bar .changes{border-color:var(--you-bd);background:var(--you-bg);color:var(--you-tx)}
.toast{position:fixed;right:16px;top:52px;max-width:min(420px,calc(100vw - 32px));z-index:21;background:var(--card);color:var(--text);border:1.5px solid var(--you-bd);border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.toast ul{margin:6px 0 8px;padding-left:18px}
#view .changed,.chip.changed{outline:3px solid var(--you-bd);outline-offset:3px}
.problems ul{margin:4px 0 0;padding-left:20px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:5px;border:1.5px solid;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-style:normal;line-height:1}
.stepbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1.5px solid;border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;background:var(--card);color:inherit}
.chip.sel{outline:2px solid var(--text);outline-offset:1px}
.chip.all{border-color:var(--line);color:var(--muted)}
.chip.review{background:var(--you-bg);border-color:var(--you-bd);color:var(--you-tx)}
.stepcard.review{border-color:var(--you-bd);border-left:5px solid var(--you-bd)}
.stepcard.review .turn{font-weight:500}
.chip.plain{border-color:var(--line)}
.stepcard .turn{display:inline-block;font-size:12px;border-radius:6px;padding:0 8px;margin-bottom:6px;background:var(--you-bd);color:var(--card)}
.stepcard .detail{margin:0 0 4px;font-size:14px}
.stepcard .donewhen{margin:0;font-size:13px;color:var(--muted)}
.stepcard .passed{font-size:12px;color:var(--done-tx);background:var(--done-bg);border:1px solid var(--done-bd);border-radius:6px;padding:0 8px;margin-left:6px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button.on{border-color:var(--text);font-weight:500}
.lane{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 16px;margin-bottom:14px}
.lane-title{font-size:13px;color:var(--muted);margin-bottom:10px}
.row{display:flex;align-items:stretch;padding:10px 2px 12px}
.lane .scroll{margin:0}
.row .node{flex:0 1 230px;min-width:150px}
.node{flex:1 1 140px;min-width:140px;border:1.5px solid;border-radius:10px;padding:10px 12px;cursor:pointer;position:relative;transition:transform .25s,opacity .25s;display:flex;flex-direction:column}
.nhead{display:flex;align-items:flex-start;gap:8px;padding-right:14px}
.node .name{font-weight:500;font-size:14px;line-height:1.35;flex:1;min-width:0;padding-top:3px;overflow-wrap:break-word}
.node .what{font-size:12px;margin-top:4px}
.node .st{position:absolute;top:8px;right:9px;font-size:13px;line-height:1.3;opacity:.9}
.node .st:empty{display:none}
.icon{flex:none;width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb,currentColor 14%,transparent)}
.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon.fam{box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.node.todo .icon.fam{filter:grayscale(1);opacity:.7}
.vias{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.via{font-size:11px;border:1px solid;border-radius:6px;padding:0 6px;background:var(--card)}
.via-ok{border-color:var(--done-bd);color:var(--done-tx)}
.via-todo{border-color:var(--new-bd);color:var(--new-tx);border-style:dashed}
.via-blocked{border-color:var(--warn-bd);color:var(--warn-tx);border-style:dashed}
.done{background:var(--done-bg);border-color:var(--done-bd);color:var(--done-tx)}
.new,.doing{background:var(--new-bg);border-color:var(--new-bd);color:var(--new-tx)}
.node.new{box-shadow:0 0 0 3px color-mix(in srgb,var(--new-bd) 35%,transparent)}
.todo{background:var(--todo-bg);border-color:var(--todo-bd);color:var(--todo-tx);border-style:dashed}
.node.todo{opacity:.6}
.ext{background:var(--ext-bg);border-color:var(--ext-bd);color:var(--ext-tx)}
.node.ext{background:color-mix(in srgb,var(--ext-bg) 45%,var(--card))}
#view .dim{opacity:.4;filter:saturate(.3)}
#view .node.todo.dim{opacity:.35}
#view .node.todo.instep{opacity:.9}
.node.active{transform:translateY(-3px);opacity:1;outline:2px solid var(--text);outline-offset:2px}
.gap{flex:0 0 12px}
.arrow{flex:0 0 28px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.arrow svg{width:26px;height:14px}
.arrow line{stroke:currentColor;stroke-width:1.6;stroke-dasharray:4 4}
@media (prefers-reduced-motion:no-preference){.node.new{animation:pulse 1.8s ease-in-out infinite}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--new-bd) 35%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--new-bd) 12%,transparent)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:6px}
.panel h3{margin:0 0 4px;font-size:16px;font-weight:500;display:flex;align-items:center;gap:10px}
.panel .back{margin-left:auto;font-size:12px;padding:1px 10px;font-weight:400}
.panel .meta{font-size:13px;color:var(--muted);margin-bottom:12px;word-break:break-all}
.io{display:grid;grid-template-columns:1fr 40px 1fr;gap:10px;align-items:center}
@media (max-width:720px){.io{grid-template-columns:1fr}.io .mid{transform:rotate(90deg)}}
.box{border:1px solid var(--line);border-radius:8px;padding:10px;min-height:70px}
.box .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code);border-radius:6px;padding:8px}
.mid{text-align:center;color:var(--muted);font-size:20px}
.why{margin:12px 0 0;font-size:14px}
.fileline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fileline a{color:inherit}
.fileline button{font-size:12px;padding:1px 8px}
details.code{margin:10px 0 0}
details.code summary{cursor:pointer;font-size:13px;color:var(--muted)}
.code ol{margin:6px 0 0;padding:6px 0;background:var(--code);border-radius:6px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-x:auto;list-style:none}
.code li{white-space:pre;padding:0 10px}
.code li::before{content:attr(data-n);display:inline-block;min-width:3.5ch;margin-right:10px;color:var(--muted);text-align:right}
.code li.focus{background:color-mix(in srgb,var(--new-bd) 25%,transparent)}
.insteps{margin:10px 0 0;font-size:12px;color:var(--muted)}
.controls{display:flex;gap:8px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
button{font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px;font-size:12px;color:var(--muted)}
.badges{align-items:center}
.badges>span{border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.badges>.mode{border:0;padding:0 4px 0 0;font-size:13px;color:var(--text);font-weight:500}
.settings{display:inline-flex;align-items:center;gap:6px 14px;flex-wrap:wrap;border:1.5px solid var(--you-bd);background:color-mix(in srgb,var(--you-bg) 60%,var(--card));color:var(--you-tx);border-radius:10px;padding:4px 12px;font-size:12.5px}
.settings .slabel{font-weight:600}
.switch{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:2px 0;font-size:12.5px;color:inherit;border-radius:6px}
.switch .track{width:30px;height:17px;border-radius:999px;background:var(--todo-bd);position:relative;transition:background .2s;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch.on .track{background:var(--done-bd)}
.switch.on .track::after{transform:translateX(13px)}
.switch .state{font-weight:600;min-width:2.2em}
.seg{display:inline-flex;align-items:center;gap:7px}
.seg .opts{display:inline-flex;border:1px solid var(--you-bd);border-radius:7px;overflow:hidden}
.seg .opts button{border:0;border-radius:0;padding:1px 10px;font-size:12px;background:transparent;color:inherit}
.seg .opts button+button{border-left:1px solid var(--you-bd)}
.seg .opts button[aria-pressed="true"]{background:var(--you-bd);color:var(--card);font-weight:600}
.conn.work{color:var(--you-tx);background:var(--you-bg);border-color:var(--you-bd)}
.msg.typing{display:flex;align-items:center;gap:8px;color:var(--muted)}
.msg.typing .who{display:inline}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--you-bd);opacity:.35}
@media (prefers-reduced-motion:no-preference){.dots i{animation:dot 1.2s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}}
@keyframes dot{0%,80%,100%{opacity:.35;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.msg.typing.stuck .dots{display:none}
.msg.typing.stuck{color:var(--warn-tx);border-color:var(--warn-bd)}
.badges .ok{border-color:var(--done-bd);color:var(--done-tx);background:var(--done-bg)}
.badges .wait{border-color:var(--new-bd);color:var(--new-tx);background:var(--new-bg)}
.stepcard{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.stepcard h3{margin:0 0 6px;font-size:15px;font-weight:500}
.talk{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.talk .quick{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.talk .quick .qlabel{font-size:12px;color:var(--muted);margin-right:2px}
.talk .modes{display:inline-flex;margin-bottom:6px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.talk .modes button{border:0;border-radius:0;padding:3px 12px}
.talk .modes button+button{border-left:1px solid var(--line)}
.talk .modes button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
button:disabled{opacity:.5;cursor:wait}
.talk textarea{width:100%;min-height:56px;resize:vertical;font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.talk .send{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.thread{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.msg{max-width:88%;border-radius:10px;padding:6px 10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--you-bg);color:var(--you-tx)}
.msg.agent{align-self:flex-start;background:var(--code);color:var(--text);border:1px solid var(--line)}
.msg .who{display:block;font-size:11px;opacity:.75}
.count{align-self:flex-end;margin-top:6px;font-size:11px;padding:0 6px;border-radius:6px;border:1px solid var(--ext-bd);background:var(--card);color:var(--ext-tx)}
.plabel .count,.stage .count{position:static;margin-left:6px}
.count.unread,.badges button.unread{border-color:var(--warn-bd);background:var(--warn-bg);color:var(--warn-tx)}
.badges button.unread{font-size:12px;padding:1px 10px;border-radius:999px}
.chip.unread::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn-bd);margin-left:6px;vertical-align:middle}
@media (prefers-reduced-motion:no-preference){.msg.flash{animation:flash 1.6s ease-out}}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--ext-bd)}100%{box-shadow:0 0 0 0 transparent}}
.err{color:var(--warn-tx)}
.diagram{position:relative}
.scroll{overflow-x:auto;margin-bottom:14px}
svg.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.links path{fill:none;stroke-width:1.8}
.l-uses{stroke:var(--muted);stroke-width:1.1!important;opacity:.7}
.l-ok{stroke:var(--done-bd)}
.l-todo{stroke:var(--new-bd);stroke-dasharray:6 4}
.l-blocked{stroke:var(--warn-bd);stroke-dasharray:1.5 5;stroke-linecap:round}
.l-blocked.head{stroke-width:2.6!important}
.k8s{display:grid;grid-template-columns:minmax(130px,170px) 1fr minmax(150px,210px);gap:44px 84px;min-width:920px;align-items:start;padding:12px 8px}
.col{display:flex;flex-direction:column;gap:18px}
.col .node{flex:none;min-width:0}
.ns{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.ns-title{font-size:12px;color:var(--muted);margin-bottom:14px}
.ns-grid{display:grid;grid-template-columns:minmax(150px,1fr) 1.7fr;gap:30px;align-items:start}
.policy{border:1.5px dashed var(--you-bd);border-radius:12px;padding:24px 10px 10px;position:relative;display:flex;flex-direction:column;gap:20px}
.policy.none{border-color:transparent;padding-top:0}
.plabel{position:absolute;top:-12px;left:10px;font-size:12px;background:var(--card);padding:1px 8px 1px 4px;border-radius:6px;border:1px solid var(--you-bd);color:var(--you-tx);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.plabel .icon{width:18px;height:18px;border-radius:5px}
.plabel .icon svg{width:13px;height:13px}
.plabel.active{outline:2px solid var(--text);outline-offset:2px}
.containers{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.containers span{font-size:11px;border:1px solid currentColor;border-radius:6px;padding:0 6px}
.seq{padding:8px 4px 4px}
.seq-head,.seq-row{display:grid;column-gap:12px}
.seq-head{margin-bottom:6px}
.seq-head .node{flex:none;min-width:0}
.seq-row{position:relative;min-height:46px}
.seq-group{border:1.5px dashed var(--you-bd);border-radius:10px;margin:0;padding:0;position:relative}
.seq-row.spacer{min-height:22px}
.seq-group>.glabel{position:absolute;top:-10px;left:10px;font-size:12px;background:var(--bg);color:var(--you-tx);border:1px solid var(--you-bd);border-radius:6px;padding:0 8px}
.seq-cell{position:relative;grid-row:1}
.seq-cell::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1.5px dashed var(--line)}
.seq-msg{grid-row:1;align-self:center;z-index:1;cursor:pointer;border-radius:6px}
.seq-msg:hover .lbl{text-decoration:underline}
.seq-msg .lbl{font-size:13px;text-align:center;line-height:1.3;padding:0 4px}
.seq-msg .lbl>*{background:var(--bg);border-radius:4px;padding:0 3px;position:relative}
#view .seq-msg.dim{opacity:.4}
.seq-msg .num{display:inline-block;min-width:18px;padding:0 5px;line-height:16px;font-size:11px;border-radius:999px;background:var(--text);color:var(--bg);text-align:center;margin-right:4px}
.seq-msg .line{border-top:1.6px solid var(--muted);position:relative;margin-top:4px}
.seq-msg.reply .line{border-top-style:dashed}
.seq-msg .line::after{content:"";position:absolute;top:-6px;border:5px solid transparent}
.seq-msg.right .line::after{right:-3px;border-left-color:var(--muted)}
.seq-msg.left .line::after{left:-3px;border-right-color:var(--muted)}
.seq-msg.self{margin-left:calc(50% + 8px);font-size:13px;border:1px dashed var(--muted);padding:2px 8px;justify-self:start;width:max-content;max-width:calc(100% - 16px);background:var(--bg)}
.tf{display:flex;flex-wrap:wrap;align-items:stretch;row-gap:12px;margin-bottom:14px}
.stage{flex:1 1 230px;min-width:230px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;transition:opacity .25s}
.stage.active{outline:2px solid var(--text);outline-offset:2px}
.stage .shead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.stage .sname{font-weight:500;font-size:14px;border-radius:6px;padding:0 8px;border:1.5px solid}
.stage .slabel{font-size:12px;color:var(--muted)}
.stage table{border-collapse:collapse;width:100%;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
.stage .tbl{overflow-x:auto}
.stage th,.stage td{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
.stage th{white-space:nowrap}
.stage td{overflow-wrap:anywhere;min-width:6ch}
.stage th{background:var(--code);font-weight:500}
.stage .snote{font-size:12px;color:var(--muted);margin:8px 0 0;padding-left:16px}
.term{border-bottom:1.5px dotted currentColor;cursor:help}
.tip{position:absolute;z-index:30;max-width:320px;background:var(--card);color:var(--text);border:1px solid var(--you-bd);border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.tip::before{content:"";position:absolute;top:-6px;left:var(--cx,16px);width:10px;height:10px;background:var(--card);border-left:1px solid var(--you-bd);border-top:1px solid var(--you-bd);transform:translateX(-50%) rotate(45deg)}
.tip.above::before{top:auto;bottom:-6px;transform:translateX(-50%) rotate(225deg)}
.tip b{display:block;color:var(--you-tx)}
details.glossary{margin:-6px 0 14px;font-size:13px}
details.glossary summary{cursor:pointer;color:var(--muted)}
details.glossary dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:8px 0 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details.glossary dt{font-weight:500}
details.glossary dd{margin:0;color:var(--muted)}
.linklegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 6px}
.linklist{margin:0 0 14px;padding-left:18px;font-size:12.5px;color:var(--muted)}
.scrollhint{font-size:12px;color:var(--muted);margin:0 0 4px}

const t = (k, ...a) => {
  const v = STRINGS[lang][k] ?? STRINGS.en[k] ?? k;
  return typeof v === "function" ? v(...a) : v;
};
const unit = (cap) => t((plan?.mode === "explain" ? "stage" : "step").replace(/^./, (c) => (cap ? c.toUpperCase() : c)));

function setLang(code) {
  lang = STRINGS[code] ? code : "en";
  document.documentElement.lang = lang;
  document.getElementById("banner").textContent = t("banner");
  document.getElementById("prev").textContent = t("prev", unit());
  document.getElementById("next").textContent = t("next", unit());
  if (!timer) document.getElementById("play").textContent = t("play", unit());
  if (!nodeId) document.querySelector("#panel > h3:only-child")?.replaceChildren(t("pickBox"));

const curStep = () => steps().find((s) => s.id === stepId) || null;

function msgEl(m) {
  const d = el("div", "msg " + (m.from === "agent" ? "agent" : "user"));
  d.dataset.id = m.id;
  const who = m.from === "agent" ? t("agent") : `${t("you")} · ${t(STRINGS.en[m.kind] ? m.kind : "question")} · ${m.delivered ? t("received") : t("waitingAgent")}`;
  d.append(el("span", "who", who), document.createTextNode(m.text));
  return d;
}

const MARK = {done: "✓", new: "●", todo: "", ext: "↗"}, EXPLAIN_MARK = {done: "", new: "★", todo: "", ext: "↗"};
const statusLabel = (st) => t((plan?.mode === "explain" ? "ex_" : "st_") + (NODE_STATUS[st] ? st : "todo"));

function renderLegend() {
  const items = plan.mode === "explain"
    ? [["done", t("lg_code")], ["new", t("lg_focus")], ["ext", t("lg_ext")]]
    : [["done", t("lg_done")], ["new", t("lg_new")], ["todo", t("lg_todo")], ["ext", t("lg_ext")]];
  document.getElementById("legend").replaceChildren(...items.map(([c, label]) => {
    const sp = el("span");
    sp.append(el("i", "sw " + c, (plan.mode === "explain" ? EXPLAIN_MARK : MARK)[c]), label);
    return sp;
  }), el("span", null, t("talkLegend")));
}

let termRe = null;

let commonGlossary = {}, glossary = {};
const escRe = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// Not inside identifiers or paths such as usecase/extract/extract.go.
const edge = (t) => (/^\w/.test(t) ? "(?<![\\w./-])" : "") + escRe(t) + (/\w$/.test(t) ? "(?![\\w-]|\\.\\w)" : "");

// Shared terms ship with planview; the plan only adds its own. Only terms the plan uses are shown.
function setGlossary(own) {
  const text = JSON.stringify({...plan, glossary: undefined});
  const used = Object.fromEntries(Object.entries(commonGlossary).filter(([t]) => new RegExp(edge(t)).test(text)));
  const pick = (v) => (typeof v === "string" ? v : v?.[lang] ?? v?.en);
  glossary = {...Object.fromEntries(Object.entries(used).map(([k, v]) => [k, pick(v)])), ...(own && typeof own === "object" ? own : {})};
  const g = glossary;
  const terms = Object.keys(g).filter(Boolean).sort((a, b) => b.length - a.length);
  termRe = terms.length ? new RegExp(terms.map(edge).join("|"), "g") : null;
  const box = document.getElementById("glossary");
  box.hidden = !terms.length;
  if (!terms.length) return;
  const dl = el("dl");
  for (const t of [...terms].sort((a, b) => a.localeCompare(b))) dl.append(el("dt", null, t), el("dd", null, g[t]));
  box.replaceChildren(el("summary", null, t(plan.mode === "explain" ? "termsPage" : "terms", terms.length)), dl);
}

// Text with glossary terms that explain themselves on click or tap.
function rich(text) {
  const f = document.createDocumentFragment();
  const str = String(text ?? "");
  if (!termRe) {
    f.append(str);
    return f;
  }
  let last = 0;
  for (const m of str.matchAll(termRe)) {
    f.append(str.slice(last, m.index));
    const t = el("span", "term", m[0]);
    t.tabIndex = 0;
    t.setAttribute("role", "button");
    t.title = glossary[m[0]];
    const open = (e) => {
      e.stopPropagation();
      showTip(t, m[0]);
    };
    t.onclick = open;
    t.onkeydown = (e) => { if (e.key === "Enter") open(e); };
    f.append(t);
    last = m.index + m[0].length;
  }
  f.append(str.slice(last));
  return f;
}

function richEl(tag, cls, text) {
  const e = el(tag, cls);
  e.append(rich(text));
  return e;
}

function showTip(anchor, term) {
  const tip = document.getElementById("tip");
  tip.replaceChildren(el("b", null, term), document.createTextNode(glossary[term]));
  tip.hidden = false;
  const r = anchor.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.left + scrollX - 10, scrollX + document.documentElement.clientWidth - tip.offsetWidth - 8));
  const above = r.bottom + tip.offsetHeight + 14 > innerHeight && r.top > tip.offsetHeight + 14;
  tip.classList.toggle("above", above);
  tip.style.left = left + "px";
  tip.style.top = (above ? r.top + scrollY - tip.offsetHeight - 9 : r.bottom + scrollY + 9) + "px";
  tip.style.setProperty("--cx", Math.max(14, Math.min(tip.offsetWidth - 14, r.left + scrollX + r.width / 2 - left)) + "px");
}
document.addEventListener("click", () => (document.getElementById("tip").hidden = true));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.getElementById("tip").hidden = true; });

const LINK_STATE_KEYS = ["ok", "todo", "blocked"];
const unread = () => thread.filter((m) => m.from === "agent" && !seen.has(m.id));

function refreshThreads() {
  document.querySelectorAll(".thread[data-ctx]").forEach((t) => {
    const c = JSON.parse(t.dataset.ctx);
    const msgs = thread.filter((m) => inCtx(m, c));
    msgs.forEach((m) => m.from === "agent" && seen.add(m.id));
    t.replaceChildren(...msgs.map(msgEl));
    const busy = working().find((m) => inCtx(m, c));
    if (busy) t.append(typingEl(busy));
  });
  const fresh = freshReply && document.querySelector(`.msg[data-id="${CSS.escape(freshReply)}"]`);
  if (fresh) {
    fresh.classList.add("flash");
    fresh.scrollIntoView({block: "nearest", behavior: "smooth"});
  }
  freshReply = null;
  const waitingFor = unread();
  document.querySelectorAll("#view [data-id]").forEach((d) => {
    d.querySelector(":scope > .count")?.remove();
    const n = thread.filter((m) => m.node === d.dataset.id).length;
    if (n) d.append(el("span", "count" + (waitingFor.some((m) => m.node === d.dataset.id) ? " unread" : ""), `💬 ${n}`));
  });
  document.querySelectorAll(".chip[data-step]").forEach((c) => {
    const id = c.dataset.step;
    c.classList.toggle("unread", waitingFor.some((m) => !m.node && (id ? m.step === id : !m.step)));
  });
  renderBadges();
}

function openUnread() {
  const m = unread()[0];
  if (!m) return;
  if (m.node) selectNode(m.node, true);
  else selectStep(m.step || null);
}

async function send(c, kind, text) {
  const body = {kind, text};
  if (c.node) body.node = c.node;
  if (c.step) body.step = c.step;
  if (viewId || plan.views[0]) body.view = viewId || plan.views[0].id;
  if (stepId && !c.step) body.viewingStep = stepId;
  const r = await fetch("/api/feedback?token=" + encodeURIComponent(token), {
    method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
}

// quick: buttons that send at once; modes: what the typed text is sent as.
function talkBox(c, {placeholder, quick = [], modes = ["question"], mode, phase = ""}) {
  const key = ctxKey(c);
  const pickKey = key + "|" + phase;
  let current = modes.includes(picked[pickKey]) ? picked[pickKey] : mode && modes.includes(mode) ? mode : modes[0];
  const box = el("div", "talk");
  const ta = el("textarea");
  ta.dataset.key = key;
  ta.value = drafts[key] || "";
  ta.oninput = () => (drafts[key] = ta.value);
  const note = el("span", "note", hintText());
  const sendBtn = el("button", "primary");
  let busy = false;
  const buttons = [];
  const go = async (kind, fallback) => {
    if (busy) return;
    const text = ta.value.trim() || fallback;
    if (!text) {
      note.textContent = kind === "change" ? t("typeChange") : t("typeFirst");
      note.className = "note err";
      return ta.focus();
    }
    busy = true;
    buttons.forEach((b) => (b.disabled = true));
    try {
      await send(c, kind, text);
      if (ta.value.trim()) ta.value = drafts[key] = "";
      note.textContent = t("sent");
      note.className = "note";
    } catch (e) {
      note.textContent = t("sendFail") + e.message;
      note.className = "note err";
    } finally {
      busy = false;
      buttons.forEach((b) => (b.disabled = false));
    }
  };
  if (quick.length) {
    const row = el("div", "quick");
    row.append(el("span", "qlabel", t("quickLabel")));
    for (const k of quick) {
      const b = el("button", k === "approve" ? "primary" : null, t(k));
      b.title = t("quickTip");
      b.onclick = () => go(k, t("q_" + k));
      buttons.push(b);
      row.append(b);
    }
    box.append(row);
  }
  const setMode = (m) => {
    current = m;
    const x = m === "change" && plan.mode === "explain" ? "_explain" : "";
    ta.placeholder = m === "question" ? placeholder : t("ph_" + m + x);
    sendBtn.textContent = t("send_" + m + x);
    seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  };
  const seg = el("div", "modes");
  if (modes.length > 1) {
    seg.setAttribute("role", "group");
    for (const m of modes) {
      const b = el("button", null, t(m === "change" && plan.mode === "explain" ? "change_explain" : m));
      b.dataset.mode = m;
      b.onclick = () => {
        picked[pickKey] = m;
        setMode(m);
        ta.focus();
      };
      seg.append(b);
    }
    box.append(seg);
  }
  setMode(current);
  sendBtn.onclick = () => go(current, "");
  buttons.push(sendBtn);
  ta.onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) go(current, ""); };
  const row = el("div", "send");
  row.append(note, sendBtn);
  const thr = el("div", "thread");
  thr.dataset.ctx = JSON.stringify(c);
  box.append(ta, row, thr);
  return box;
}

async function saveSetting(change, text) {
  document.querySelectorAll(".settings button").forEach((b) => (b.disabled = true));
  try {
    const r = await fetch("/api/settings?token=" + encodeURIComponent(token), {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({...change, text})});
    if (!r.ok) throw new Error(await r.text());
  } catch (e) {
    const box = document.getElementById("toast");
    box.replaceChildren(t("settingFail") + e.message);
    box.hidden = false;
    renderBadges();
  }
}

// Messages the agent has taken but not answered in the same place, while it is not listening: it is working on them.
function working() {
  if (!connected || waiting) return [];
  return thread.filter((m, i) => m.from !== "agent" && m.delivered && m.kind !== "settings" && !(m.kind === "approve" && plan?.approved) &&
    !thread.slice(i + 1).some((r) => r.from === "agent" && inCtx(r, m.node ? {node: m.node} : m.step ? {step: m.step} : {})));
}

function typingEl(m) {
  const min = Math.floor((Date.now() - Date.parse(m.at)) / 60000);
  const stuck = min >= 10;
  const d = el("div", "msg agent typing" + (stuck ? " stuck" : ""));
  const dots = el("span", "dots");
  dots.append(el("i"), el("i"), el("i"));
  d.append(dots, el("span", null, stuck ? t("noReply", min) : t("working", min)));
  return d;
}

function renderBadges() {
  const conn = document.getElementById("conn");
  const busy = working().length > 0;
  conn.className = "conn " + (!connected ? "off" : waiting ? "on" : busy ? "work" : "idle");
  conn.textContent = !connected ? t(served && rendered ? "connLost" : "connOff") : waiting ? t("connOn") : busy ? t("connWorking") : t("connIdle");
  conn.title = !connected ? t("connLostTip") : waiting ? t("connOnTip") : busy ? t("connWorkingTip") : t("connIdleTip");
  if (!plan) return;
  const s = plan.settings || {};
  const explain = plan.mode === "explain";
  const items = [el("span", "mode", explain ? t("modeExplain") : t("modeBuild"))];
  const box = el("div", "settings");
  box.append(el("span", "slabel", t("agentSettings")));
  const on = teachBackOn(plan);
  const sw = el("button", "switch" + (on ? " on" : ""));
  sw.setAttribute("role", "switch");
  sw.setAttribute("aria-checked", String(on));
  sw.append(el("span", "track"), el("span", null, t("restate", unit())), el("span", "state", on ? t("on") : t("off")));
  sw.onclick = () => saveSetting({teachBack: !on}, `${t("restate", unit())}: ${!on ? t("on") : t("off")}`);
  box.append(sw);
  if (!explain) {
    const seg = el("span", "seg");
    const opts = el("span", "opts");
    for (const [v, label] of [["auto", t("commitAuto")], ["suggest", t("commitOnly")]]) {
      const b = el("button", null, label);
      b.setAttribute("aria-pressed", String(s.commit === v));
      b.onclick = () => s.commit !== v && saveSetting({commit: v}, `${t("commits")}: ${label}`);
      opts.append(b);
    }
    seg.append(el("span", null, t("commits")), opts);
    box.append(seg);
  }
  for (const b of box.querySelectorAll("button")) {
    b.disabled = !connected;
    b.title = t("settingTip");
  }
  items.push(box);
  if (!explain) items.push(plan.approved ? el("span", "ok", t("approved")) : el("span", "wait", t("awaiting")));
  document.getElementById("badges").replaceChildren(...items);
  renderBar();
}

function renderBar() {
  const extra = [];
  const news = unread().length;
  if (news) {
    const b = el("button", "unread", t("newReplies", news));
    b.onclick = openUnread;
    extra.push(b);
  }
  if ((plan.mode ?? "build") === "build" && !plan.approved && connected) {
    const b = el("button", "primary", "✓ " + t("approve"));
    b.title = t("quickTip");
    b.onclick = async (e) => {
      e.stopPropagation();
      b.disabled = true;
      try {
        await send({}, "approve", t("q_approve"));
        b.textContent = t("approveSent");
      } catch {
        b.disabled = false;
      }
    };
    extra.push(b);
  }
  const n = changes.nodes.size + changes.steps.size + changes.notes.length;
  if (n) {
    const b = el("button", "changes", t("changedN", n));
    b.onclick = (e) => {
      e.stopPropagation();
      showChangeList();
    };
    extra.push(b);
  }
  document.getElementById("barExtra").replaceChildren(...extra);
}

function renderStepCard() {
  const card = document.getElementById("stepcard");
  const step = curStep();
  if (!step) {
    const approve = (plan.mode ?? "build") === "build" && !plan.approved ? ["approve"] : [];
    const c = el("div", "stepcard" + (approve.length ? " review" : ""));
    if (approve.length) c.append(el("span", "turn", t("turnApprove")));
    c.append(el("h3", null, t("wholePlan")), talkBox({}, {placeholder: t("askPlan"), quick: approve, modes: ["question", "change"]}));
    card.replaceChildren(c);
  } else {
    const explain = plan.mode === "explain";
    const c = el("div", "stepcard " + (step.status === "review" && !step.confirmed ? "review" : ""));
    if (step.status === "review" && !step.confirmed) c.append(el("span", "turn", teachBackOn(plan) ? t("turnRestate") : t("turnCheck")));
    const h = el("h3", null, `${unit(true)} ${steps().indexOf(step) + 1}: ${step.title}`);
    if (step.confirmed) h.append(el("span", "passed", t("restated")));
    c.append(h);
    if (step.detail) c.append(richEl("p", "detail", step.detail));
    if (step.done) c.append(richEl("p", "donewhen", (explain ? t("understoodWhen") : t("doneWhen")) + step.done));
    const teach = teachBackOn(plan) && ((step.status ?? "todo") !== "todo" || plan.mode === "explain");
    c.append(talkBox({step: step.id}, {
      placeholder: t(explain ? "askStage" : "askStep"),
      quick: plan.mode === "explain" ? ["confused", "deeper"] : ["confused"],
      modes: teach ? ["teachback", "question", "change"] : ["question", "change"],
      mode: teach && step.status === "review" && !step.confirmed ? "teachback" : "question",
      phase: step.status + (step.confirmed ? "+" : ""),
    }));
    card.replaceChildren(c);
  }
  refreshThreads();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function arrow() {
  const a = el("div", "arrow");
  a.innerHTML = '<svg viewBox="0 0 26 14" aria-hidden="true"><line x1="1" y1="7" x2="20" y2="7"/><path d="M17 2l6 5-6 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  return a;
}

// Glyphs are planview's own constants; plan text never goes into innerHTML.
function iconEl(n, id, family) {
  const ic = iconOf(n, id, family);
  if (!ic || !GLYPHS[ic.glyph]) return null;
  const f = FAMILIES[ic.family];
  const s = el("span", "icon" + (f ? " fam" : ""));
  if (f) {
    s.style.background = f.bg;
    s.style.color = f.fg;
    s.title = f.label;
  }
  s.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${GLYPHS[ic.glyph]}</svg>`;
  return s;
}

function nodeBox(id, family = null) {
  const n = plan.nodes[id];
  if (!n) return el("div", "node todo", `? ${id}`);
  const status = NODE_STATUS[n.status] ? n.status : plan.mode === "explain" ? "done" : "todo";
  const d = el("div", "node " + status);
  d.dataset.id = id;
  d.tabIndex = 0;
  d.setAttribute("role", "button");
  const head = el("div", "nhead");
  const ic = iconEl(n, id, family);
  if (ic) head.append(ic);
  const st = el("span", "st", (plan.mode === "explain" ? EXPLAIN_MARK : MARK)[status]);
  st.title = statusLabel(status);
  st.setAttribute("aria-label", statusLabel(status));
  head.append(el("div", "name", n.name), st);
  d.append(head);
  if (n.what) d.append(richEl("div", "what", n.what));
  d.onclick = () => selectNode(id, true);
  d.onkeydown = (e) => { if (e.key === "Enter") selectNode(id, true); };
  return d;
}

function renderFlow(v) {
  const wrap = el("div");
  for (const lane of v.lanes || []) {
    const box = el("div", "lane");
    if (lane.title) box.append(richEl("div", "lane-title", lane.title));
    const row = el("div", "row");
    (lane.nodes || []).forEach((id, i) => {
      if (i > 0 && lane.arrows !== false) row.append(arrow());
      else if (i > 0) row.append(el("div", "gap"));
      row.append(nodeBox(id));
    });
    const sc = el("div", "scroll");
    sc.append(row);
    box.append(sc);
    wrap.append(box);
  }
  return wrap;
}

let linkDrawer = null, linkObserver = null;

function drawLinks(container, specs) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.classList.add("links");
  container.append(svg);
  const box = (id) => container.querySelector(`[data-anchor="${CSS.escape(id)}"]`);
  linkDrawer = () => {
    const base = container.getBoundingClientRect();
    svg.setAttribute("width", container.scrollWidth);
    svg.setAttribute("height", container.scrollHeight);
    svg.replaceChildren();
    const step = curStep();
    const inStep = step ? new Set(step.nodes || []) : null;
    const fan = {}, fanIn = {};
    for (const l of specs) if (!l.down) {
      (fan[l.from] ||= []).push(l);
      (fanIn[l.to] ||= []).push(l);
    }
    const ns = container.querySelector(".ns")?.getBoundingClientRect();
    for (const l of specs) {
      const a = box(l.from)?.getBoundingClientRect(), b = box(l.to)?.getBoundingClientRect();
      if (!a || !b) continue;
      let d, head;
      if (l.down) {
        const x = a.left + a.width / 2 - base.left, y1 = a.bottom - base.top, y2 = b.top - base.top - 2;
        d = `M${x} ${y1} L${x} ${y2}`;
        head = `M${x - 4} ${y2 - 7} L${x} ${y2} L${x + 4} ${y2 - 7}`;
      } else {
        const out = fan[l.from], k = out.indexOf(l), into = fanIn[l.to], j = into.indexOf(l);
        const x2 = b.left - base.left - 4;
        const y1 = a.top + (Math.min(a.height, 120) * 0.8 * (k + 1)) / (out.length + 1) - base.top;
        const y2 = b.top + (Math.min(b.height, 90) * (j + 1)) / (into.length + 1) - base.top;
        // Leave the namespace on a straight line, so a link never runs along its border.
        const leave = ns && a.right <= ns.right && b.left >= ns.right ? ns.right - base.left + 14 : a.right - base.left;
        const x1 = a.right - base.left, dx = Math.max(20, (x2 - leave) / 2);
        d = `M${x1} ${y1} L${leave} ${y1} C${leave + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
        head = l.state === "blocked" ? `M${x2} ${y2 - 6} L${x2} ${y2 + 6}` : `M${x2 - 7} ${y2 - 4} L${x2} ${y2} L${x2 - 7} ${y2 + 4}`;
      }
      const dim = inStep && !(inStep.has(l.from) && (inStep.has(l.to) || l.to === "#namespace"));
      for (const [path, extra] of [[d, ""], [head, " head"]]) {
        const e = document.createElementNS(svg.namespaceURI, "path");
        e.setAttribute("d", path);
        e.setAttribute("class", `l-${l.state || "uses"}${extra}`);
        if (extra) e.style.strokeDasharray = "none";
        if (dim) e.style.opacity = ".15";
        svg.append(e);
      }
    }
  };
  linkObserver?.disconnect();
  linkObserver = new ResizeObserver(() => linkDrawer?.());
  linkObserver.observe(container);
}

function anchored(id, elx = nodeBox(id)) {
  elx.dataset.anchor = id;
  return elx;
}

function linkLegend(states, uses) {
  const lg = el("div", "linklegend");
  if (uses) lg.append(el("span", null, t("usesLegend")));
  lg.append(el("span", null, t("viaLegend")));
  const color = {ok: "var(--done-bd)", todo: "var(--new-bd)", blocked: "var(--warn-bd)"};
  for (const st of states) {
    const sp = el("span", null, (st === "ok" ? "━ " : "╍ ") + t("lk_" + st));
    sp.style.color = color[st];
    lg.append(sp);
  }
  return lg;
}

function renderK8s(v) {
  const scroll = el("div", "scroll");
  const states = [...new Set((v.links || []).map((l) => l.state || "ok"))];
  const uses = (v.outside || []).length || (v.workloads || []).some((w) => (w.uses || []).length);
  if (states.length || uses) scroll.append(linkLegend(states, uses));
  const grid = el("div", "k8s diagram");
  const outside = el("div", "col");
  (v.outside || []).forEach((id) => outside.append(anchored(id)));
  const ns = el("div", "ns");
  ns.dataset.anchor = "#namespace";
  ns.append(el("div", "ns-title", [v.namespace && `namespace ${v.namespace}`, v.cluster && `cluster ${v.cluster}`].filter(Boolean).join(" · ") || "namespace"));
  const nsGrid = el("div", "ns-grid");
  const configs = el("div", "col");
  (v.configs || []).forEach((id) => configs.append(anchored(id, nodeBox(id, "k8s"))));
  const policy = el("div", "policy" + (v.policy ? "" : " none"));
  if (v.policy) {
    const pl = el("span", "plabel");
    pl.append(iconEl(plan.nodes[v.policy] || {}, v.policy, "k8s") || "🛡", plan.nodes[v.policy]?.name || v.policy);
    pl.dataset.id = v.policy;
    pl.tabIndex = 0;
    pl.onclick = () => selectNode(v.policy, true);
    policy.append(pl);
  }
  for (const w of v.workloads || []) {
    const b = anchored(w.node, nodeBox(w.node, "k8s"));
    if (w.containers?.length) {
      const c = el("div", "containers");
      w.containers.forEach((name) => c.append(el("span", null, name)));
      b.append(c);
    }
    policy.append(b);
  }
  nsGrid.append(configs, policy);
  ns.append(nsGrid);
  const targets = el("div", "col");
  (v.targets || []).forEach((id) => targets.append(anchored(id)));
  grid.append(outside, ns, targets);
  scroll.append(grid);
  const specs = [];
  const out = v.outside || [];
  out.forEach((id, i) => specs.push(i < out.length - 1 ? {from: id, to: out[i + 1], down: true, state: "uses"} : {from: id, to: "#namespace", state: "uses"}));
  for (const w of v.workloads || []) for (const u of w.uses || []) specs.push({from: u, to: w.node, state: "uses"});
  for (const l of v.links || []) specs.push({...l, state: l.state || "ok"});
  // Labels (ports, notes) sit on the box the link reaches, not on the line.
  for (const l of v.links || []) {
    const b = l.label && grid.querySelector(`[data-anchor="${CSS.escape(l.to)}"]`);
    if (!b) continue;
    const row = b.querySelector(":scope > .vias") || b.appendChild(el("div", "vias"));
    const chip = el("span", "via via-" + (LINK_STATE_KEYS.includes(l.state) ? l.state : "ok"), "← " + l.label);
    chip.title = `${plan.nodes[l.from]?.name || l.from} → ${plan.nodes[l.to]?.name || l.to}`;
    row.append(chip);
  }
  drawLinks(grid, specs);
  const wrap = el("div");
  wrap.append(scroll);
  const listed = (v.links || []).filter((l) => l.label || (l.state && l.state !== "ok"));
  if (listed.length) {
    const ul = el("ul", "linklist");
    for (const l of listed) {
      const li = el("li");
      li.append(`${plan.nodes[l.from]?.name || l.from} → ${plan.nodes[l.to]?.name || l.to} · ${t("lk_" + (l.state || "ok"))}`);
      if (l.label) li.append(" · ", rich(l.label));
      ul.append(li);
    }
    wrap.append(ul);
  }
  return wrap;
}

function renderSequence(v) {
  const actors = v.actors || [];
  const cols = `repeat(${actors.length}, minmax(130px, 1fr))`;
  const scroll = el("div", "scroll");
  const seq = el("div", "seq");
  seq.style.minWidth = actors.length * 150 + "px";
  const head = el("div", "seq-head");
  head.style.gridTemplateColumns = cols;
  actors.forEach((id) => head.append(nodeBox(id)));
  seq.append(head);
  // Rows of bare lifelines keep the lines unbroken around a group's frame and label.
  const spacer = () => {
    const row = el("div", "seq-row spacer");
    row.style.gridTemplateColumns = cols;
    actors.forEach((_, c) => {
      const cell = el("div", "seq-cell");
      cell.style.gridColumn = String(c + 1);
      row.append(cell);
    });
    return row;
  };
  let group = null, groupName = null;
  (v.messages || []).forEach((m, i) => {
    if ((m.group || null) !== groupName) {
      groupName = m.group || null;
      group = null;
      if (groupName) {
        group = el("div", "seq-group");
        group.append(richEl("span", "glabel", groupName), spacer());
        seq.append(spacer(), group);
      }
    }
    const row = el("div", "seq-row");
    row.style.gridTemplateColumns = cols;
    actors.forEach((_, c) => {
      const cell = el("div", "seq-cell");
      cell.style.gridColumn = String(c + 1);
      row.append(cell);
    });
    const a = actors.indexOf(m.from), b = actors.indexOf(m.to);
    const msg = el("div", "seq-msg");
    if (m.step) msg.dataset.step = m.step;
    const lbl = el("div", "lbl");
    lbl.append(el("span", "num", String(i + 1)), richEl("span", "t", m.text || ""));
    if (a === b) {
      msg.classList.add("self");
      msg.style.gridColumn = String(a + 1);
      msg.append(lbl);
    } else {
      const lo = Math.min(a, b), span = Math.abs(a - b) + 1;
      msg.classList.add(a < b ? "right" : "left");
      if (m.reply) msg.classList.add("reply");
      msg.style.gridColumn = `${lo + 1} / span ${span}`;
      msg.style.margin = `0 calc(50% / ${span})`;
      msg.append(lbl, el("div", "line"));
    }
    const target = m.node || m.to;
    msg.title = t("seeBox", plan.nodes[target]?.name || target);
    msg.onclick = () => selectNode(target, true);
    row.append(msg);
    (group || seq).append(row);
  });
  scroll.append(seq);
  return scroll;
}

function renderTransform(v) {
  const wrap = el("div", "tf");
  (v.stages || []).forEach((st, i) => {
    if (i > 0) wrap.append(arrow());
    const n = plan.nodes[st.node] || {name: st.node};
    const card = el("div", "stage");
    if (st.columns) card.style.flexBasis = Math.max(230, st.columns.length * 120) + "px";
    card.dataset.id = st.node;
    card.tabIndex = 0;
    card.onclick = () => selectNode(st.node, true);
    const head = el("div", "shead");
    const ic = iconEl(n, st.node);
    if (ic) head.append(ic);
    head.append(el("span", "sname " + (NODE_STATUS[n.status] ? n.status : "todo"), n.name));
    if (st.label) head.append(el("span", "slabel", st.label));
    card.append(head);
    if (st.columns) {
      const table = el("table"), tr = el("tr");
      st.columns.forEach((c) => tr.append(el("th", null, c)));
      table.append(tr);
      for (const r of st.rows || []) {
        const row = el("tr");
        r.forEach((c) => row.append(el("td", null, c == null || c === "" ? "∅" : String(c).replace(/^ +| +$/g, (sp) => "␠".repeat(sp.length)))));
        table.append(row);
      }
      const tbl = el("div", "tbl");
      tbl.append(table);
      card.append(tbl);
    }
    if (st.text) card.append(el("pre", null, st.text));
    if (st.notes?.length) {
      const ul = el("ul", "snote");
      st.notes.forEach((t) => ul.append(richEl("li", null, t)));
      card.append(ul);
    }
    wrap.append(card);
  });
  return wrap;
}

const VIEWS = {
  flow: {render: renderFlow},
  k8s: {render: renderK8s, after: () => requestAnimationFrame(() => linkDrawer?.())},
  sequence: {render: renderSequence},
  transform: {render: renderTransform},
};

function renderView() {
  const v = plan.views.find((x) => x.id === viewId) || plan.views[0];
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren(...(plan.views.length > 1 ? plan.views.map((x) => {
    const b = el("button", x.id === v.id ? "on" : "", x.title || x.id);
    b.onclick = () => {
      viewId = x.id;
      renderView();
      if (nodeId && !document.querySelector(`#view [data-id="${CSS.escape(nodeId)}"]`)) clearPanel();
    };
    return b;
  }) : []));
  const kind = VIEWS[v.kind];
  linkDrawer = null;
  linkObserver?.disconnect();
  document.getElementById("view").replaceChildren(kind ? kind.render(v) : el("p", null, t("cannotDraw", v.kind)));
  kind?.after?.();
  highlight();
  requestAnimationFrame(() => {
    // An arrow left at the end of a wrapped row points at nothing.
    for (const a of document.querySelectorAll("#view .tf > .arrow")) a.style.visibility = a.nextElementSibling && a.nextElementSibling.offsetTop > a.offsetTop + a.offsetHeight / 2 ? "hidden" : "";
    for (const sc of document.querySelectorAll("#view .scroll")) {
      sc.querySelector(":scope > .scrollhint")?.remove();
      if (sc.scrollWidth > sc.clientWidth + 4) sc.prepend(el("div", "scrollhint", t("wider")));
    }
  });
}

function renderSteps() {
  const bar = document.getElementById("stepbar");
  const all = el("button", "chip all" + (stepId ? "" : " sel"), t("all"));
  all.dataset.step = "";
  all.onclick = () => { stop(); selectStep(null); };
  bar.replaceChildren(all, ...steps().map((s, i) => {
    const cls = plan.mode === "explain" && !s.status ? "plain" : s.confirmed ? "done" : STEP_STATUS[s.status] || "todo";
    const mark = s.confirmed ? "✓ " : s.status === "review" ? "👉 " : "";
    const c = el("button", "chip " + cls + (s.id === stepId ? " sel" : ""), `${mark}${i + 1}. ${s.title}`);
    c.setAttribute("aria-pressed", String(s.id === stepId));
    c.title = s.confirmed ? t("chipRestated") : s.status === "review" ? t("chipTurn") : "";
    c.dataset.step = s.id;
    c.onclick = () => { stop(); selectStep(s.id); };
    return c;
  }));
}

function highlight() {
  const step = curStep();
  const inStep = step ? new Set(step.nodes || []) : null;
  document.querySelectorAll("#view [data-id]").forEach((d) => {
    d.classList.toggle("dim", !!inStep && !inStep.has(d.dataset.id));
    d.classList.toggle("instep", !!inStep && inStep.has(d.dataset.id));
    d.classList.toggle("active", d.dataset.id === nodeId);
  });
  document.querySelectorAll("#view [data-step]").forEach((d) => d.classList.toggle("dim", !!step && d.dataset.step !== step.id));
  linkDrawer?.();
  markChanges();
}

// Show the step in a picture that contains its boxes.
function followStep(step) {
  const want = new Set(step?.nodes || []);
  if (!want.size || [...document.querySelectorAll("#view [data-id]")].some((e) => want.has(e.dataset.id))) return;
  const v = plan.views.find((x) => KINDS[x.kind]?.refs(x).some((k) => want.has(k)));
  if (v) {
    viewId = v.id;
    renderView();
  }
}

function selectStep(id) {
  stepId = id;
  renderSteps();
  renderStepCard();
  followStep(curStep());
  highlight();
  if (nodeId && curStep() && !(curStep().nodes || []).includes(nodeId)) clearPanel();
}

const EDITOR_URL = {
  vscode: (f, l) => `vscode://file${encodeURI(f)}:${l || 1}`,
  cursor: (f, l) => `cursor://file${encodeURI(f)}:${l || 1}`,
  idea: (f, l) => `idea://open?file=${encodeURIComponent(f)}&line=${l || 1}`,
};

// The editor link appears once the server has resolved the real path (roots may be relative).
function fileLine(file, resolved) {
  const ref = parseFile(file, plan);
  const row = el("div", "meta fileline");
  const editor = plan.settings?.editor ?? "vscode";
  if (resolved && EDITOR_URL[editor]) {
    const a = el("a", null, file);
    a.href = EDITOR_URL[editor](resolved, ref?.line);
    a.title = t("openIn", editor);
    row.append(a);
  } else row.append(el("span", null, file));
  const copy = el("button", null, t("copy"));
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(resolved ? `${resolved}${ref?.line ? ":" + ref.line : ""}` : file);
      copy.textContent = t("copied");
    } catch {
      copy.textContent = t("copyFail");
    }
  };
  row.append(copy);
  return row;
}

function codeBox(id) {
  const box = el("details", "code");
  box.open = true;
  box.append(el("summary", null, t("codeHere")), el("div", "meta", t("loading")));
  fetch(`/api/source?node=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`)
    .then((r) => r.json())
    .then((r) => {
      if (r.error) return box.lastChild.replaceWith(el("div", "meta err", `${t("codeFail")}: ${r.error}`));
      const ol = el("ol");
      r.lines.forEach((t, i) => {
        const n = r.from + i;
        const li = el("li", r.focus && n >= r.focus && n <= r.end ? "focus" : null, t);
        li.dataset.n = n;
        ol.append(li);
      });
      box.lastChild.replaceWith(ol);
      if (nodeId === id && plan.nodes[id]?.file) document.querySelector("#panel .fileline")?.replaceWith(fileLine(plan.nodes[id].file, r.path));
    })
    .catch(() => box.lastChild.replaceWith(el("div", "meta err", t("codeFail"))));
  return box;
}

function clearPanel(text = t("pickBox")) {
  nodeId = null;
  highlight();
  document.getElementById("panel").replaceChildren(el("h3", null, text));
}

function selectNode(id, reveal = false) {
  nodeId = id;
  highlight();
  const n = plan.nodes[id];
  const p = document.getElementById("panel");
  if (!n) return p.replaceChildren(el("h3", null, t("noNode", id)));
  const h = el("h3");
  const ic = iconEl(n, id, document.querySelector(`#view .ns [data-id="${CSS.escape(id)}"]`) ? "k8s" : null);
  if (ic) h.append(ic);
  h.append(richEl("span", null, `${n.name} · ${statusLabel(n.status)}`));
  const back = el("button", "back", t("backUp"));
  back.onclick = () => document.getElementById("tabs").scrollIntoView({block: "start", behavior: "smooth"});
  h.append(back);
  const parts = [h];
  if (n.file) parts.push(fileLine(n.file));
  if (n.in || n.out) {
    const io = el("div", "io");
    for (const [k, txt] of [["in", n.in], ["out", n.out]]) {
      const b = el("div", "box");
      b.append(el("div", "lbl", t(k)), richEl("pre", null, txt || "—"));
      io.append(b);
      if (k === "in") io.append(el("div", "mid", "→"));
    }
    parts.push(io);
  }
  if (n.why) parts.push(richEl("p", "why", n.why));
  if (n.file && parseFile(n.file, plan)?.abs) parts.push(codeBox(id));
  const where = steps().map((s, i) => (s.nodes || []).includes(id) ? `${i + 1}. ${s.title}` : null).filter(Boolean);
  if (where.length) parts.push(el("p", "insteps", (plan.mode === "explain" ? t("inStages") : t("inSteps")) + where.join(", ")));
  parts.push(talkBox({node: id}, {placeholder: t("askBox", n.name), quick: ["ok", "confused", "deeper"], modes: ["question", "change"]}));
  p.replaceChildren(...parts);
  refreshThreads();
  if (reveal) p.scrollIntoView({block: "nearest", behavior: "smooth"});
}

function stop() {
  clearInterval(timer);
  timer = null;
  document.getElementById("play").textContent = t("play", unit());
}
function step(d) {
  const list = steps(), i = list.indexOf(curStep());
  if (!list.length) return;
  selectStep(list[((i < 0 ? (d > 0 ? -1 : 0) : i) + d + list.length) % list.length].id);
}
document.getElementById("prev").onclick = () => { stop(); step(-1); };
document.getElementById("next").onclick = () => { stop(); step(1); };
document.getElementById("play").onclick = () => {
  if (timer) return stop();
  document.getElementById("play").textContent = t("pause");
  step(1);
  timer = setInterval(() => (curStep() === steps().at(-1) ? stop() : step(1)), 3200);
};

// Redraws replace the chat boxes; put the cursor back where the user was typing.
function keepFocus(fn) {
  const a = document.activeElement;
  const key = a?.tagName === "TEXTAREA" ? a.dataset.key : null;
  const sel = key && [a.selectionStart, a.selectionEnd];
  fn();
  const t = key && document.querySelector(`textarea[data-key="${CSS.escape(key)}"]`);
  if (t) {
    t.focus({preventScroll: true});
    t.setSelectionRange(...sel);
  }
}

function render(p) {
  keepFocus(() => draw(p));
}

const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
// What the agent changed since the user last acknowledged; outlines stay until then.
const changes = {nodes: new Set(), steps: new Set(), notes: []};

function noteChanges(prev) {
  for (const id of Object.keys(plan.nodes)) if (!same(prev.nodes?.[id], plan.nodes[id])) changes.nodes.add(id);
  for (const st of steps()) if (!same((prev.steps || []).find((x) => x.id === st.id), st)) changes.steps.add(st.id);
  const views = new Set((prev.views || []).map((v) => v.id));
  for (const v of plan.views) if (!views.has(v.id)) changes.notes.push(t("newView") + (v.title || v.id));
  if (!prev.approved && plan.approved) changes.notes.push(t("planApproved"));
  if (!same(prev.glossary, plan.glossary)) changes.notes.push(t("glossaryChanged"));
  if (prev.title !== plan.title || prev.goal !== plan.goal) changes.notes.push(t("titleChanged"));
  changes.notes = [...new Set(changes.notes)];
}

function markChanges() {
  document.querySelectorAll(".changed").forEach((e) => e.classList.remove("changed"));
  for (const id of changes.nodes) document.querySelectorAll(`#view [data-id="${CSS.escape(id)}"]`).forEach((e) => e.classList.add("changed"));
  for (const id of changes.steps) document.querySelector(`.chip[data-step="${CSS.escape(id)}"]`)?.classList.add("changed");
}

function showChangeList() {
  const box = document.getElementById("toast");
  const ul = el("ul");
  for (const id of changes.steps) {
    const st = steps().find((x) => x.id === id);
    if (st) ul.append(el("li", null, t("chStep") + st.title));
  }
  for (const id of changes.nodes) if (plan.nodes[id]) ul.append(el("li", null, t("chBox") + plan.nodes[id].name));
  for (const n of changes.notes) ul.append(el("li", null, n));
  const ok = el("button", "primary", t("seen"));
  ok.onclick = () => {
    changes.nodes.clear();
    changes.steps.clear();
    changes.notes = [];
    box.hidden = true;
    markChanges();
    renderBar();
  };
  box.replaceChildren(el("b", null, t("changedTitle")), ul, ok);
  box.onclick = (e) => e.stopPropagation();
  box.hidden = false;
}
document.addEventListener("click", () => (document.getElementById("toast").hidden = true));

function draw(p) {
  const prev = plan;
  plan = p;
  plan.nodes ||= {};
  plan.views = viewsOf(plan);
  setLang(langOf(plan));
  document.title = plan.title ? `${plan.title} · planview` : "planview";
  document.getElementById("title").textContent = plan.title || "planview";
  setGlossary(plan.glossary);
  renderLegend();
  document.getElementById("goal").replaceChildren(rich(plan.goal || ""));
  const problems = validate(plan);
  const box = document.getElementById("problems");
  box.hidden = !problems.length;
  if (problems.length) {
    const ul = el("ul");
    problems.forEach((x) => ul.append(el("li", null, x)));
    box.replaceChildren(el("b", null, t("problems")), ul);
  }
  if (stepId && !curStep()) stepId = null;
  renderSteps();
  renderStepCard();
  if (plan.views.length) renderView();
  refreshThreads();
  if (!rendered) {
    rendered = true;
    // Links may open a given step, picture or box: ?step=…&view=…&node=…
    if (plan.views.some((v) => v.id === params.get("view"))) {
      viewId = params.get("view");
      renderView();
    }
    const cur = params.get("step") === "all" ? null : steps().find((s) => s.id === params.get("step")) || steps().find((s) => s.id === plan.start) || steps().find((s) => s.status === "review") || steps().find((s) => s.status === "doing");
    if (cur) selectStep(cur.id);
    if (params.get("view") && plan.views.some((v) => v.id === params.get("view")) && viewId !== params.get("view")) {
      viewId = params.get("view");
      renderView();
    }
    if (Object.hasOwn(plan.nodes, params.get("node") || "")) selectNode(params.get("node"));
  } else if (nodeId && Object.hasOwn(plan.nodes, nodeId)) {
    selectNode(nodeId);
  } else if (nodeId) {
    clearPanel(t("boxRemoved"));
  }
  if (prev && !same(prev, p)) noteChanges(prev);
  markChanges();
  renderBar();
}
let rendered = false, loadedThread = false;

function setConn(on) {
  connected = on;
  if (!on) waiting = 0;
  document.querySelectorAll(".talk .note").forEach((n) => {
    n.textContent = hintText();
    n.className = "note";
  });
  renderBadges();
}

async function fetchPlan() {
  const r = await fetch("/api/plan?token=" + encodeURIComponent(token));
  const box = document.getElementById("problems");
  if (!r.ok) {
    box.hidden = false;
    box.textContent = t("loadFail", r.status) + (await r.text());
    return;
  }
  try {
    render(JSON.parse(await r.text()));
  } catch (e) {
    box.hidden = false;
    box.textContent = t("parseFail") + e.message;
  }
}

async function load() {
  if (!served) {
    document.getElementById("banner").hidden = false;
    return;
  }
  try {
    commonGlossary = await (await fetch("/glossary.json?token=" + encodeURIComponent(token))).json();
  } catch {}
  await fetchPlan();
  const events = new EventSource("/api/events?token=" + encodeURIComponent(token));
  events.onopen = async () => {
    await fetchPlan();
    const r = await fetch("/api/thread?token=" + encodeURIComponent(token));
    if (r.ok) ({items: thread, waiting} = await r.json());
    if (!loadedThread) thread.forEach((m) => m.from === "agent" && seen.add(m.id));
    loadedThread = true;
    thread.sort((a, b) => a.at.localeCompare(b.at));
    setConn(true);
    refreshThreads();
  };
  events.onerror = () => setConn(false);
  events.addEventListener("plan", fetchPlan);
  const on = (name, fn) => events.addEventListener(name, (e) => { fn(JSON.parse(e.data)); refreshThreads(); });
  on("feedback", (m) => {
    thread.push({...m, from: "user", delivered: false});
    freshReply = m.id;
  });
  on("reply", (m) => {
    thread.push(m);
    freshReply = m.id;
  });
  on("delivered", ({ids}) => thread.forEach((m) => { if (ids.includes(m.id)) m.delivered = true; }));
  on("agent", (a) => (waiting = a.waiting));
}
window.__planview = {get plan() { return plan; }, selectStep, selectNode, render};
setLang(lang);
setInterval(() => working().length && refreshThreads(), 30000);
document.querySelector("#panel h3").textContent = t("pickBox");
renderBadges();
load();
</script>
</body>
</html>
