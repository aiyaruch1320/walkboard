<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>planview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 128 128%22 width=%22128%22 height=%22128%22 role=%22img%22 aria-label=%22planview%22%3E %3Crect width=%22128%22 height=%22128%22 rx=%2228%22 fill=%22%2326215c%22/%3E %3Cpath d=%22M51 40 H71%22 stroke=%22%23e4e1fb%22 stroke-width=%223.5%22 stroke-linecap=%22round%22 stroke-dasharray=%221 7%22/%3E %3Cpath d=%22M84 52 C84 62 78 66 70 68%22 fill=%22none%22 stroke=%22%23e4e1fb%22 stroke-width=%223.5%22 stroke-linecap=%22round%22 stroke-dasharray=%221 7%22/%3E %3Crect x=%2218%22 y=%2228%22 width=%2233%22 height=%2224%22 rx=%228%22 fill=%22%235dcaa5%22/%3E %3Crect x=%2271%22 y=%2228%22 width=%2233%22 height=%2224%22 rx=%228%22 fill=%22%23ef9f27%22/%3E %3Cpath d=%22M38 66 H90 a9 9 0 0 1 9 9 V92 a9 9 0 0 1 -9 9 H56 L42 111 L45 101 H38 a9 9 0 0 1 -9 -9 V75 a9 9 0 0 1 9 -9 Z%22 fill=%22%23afa9ec%22/%3E %3Ccircle cx=%2251%22 cy=%2283.5%22 r=%224%22 fill=%22%2326215c%22/%3E %3Ccircle cx=%2264%22 cy=%2283.5%22 r=%224%22 fill=%22%2326215c%22/%3E %3Ccircle cx=%2277%22 cy=%2283.5%22 r=%224%22 fill=%22%2326215c%22/%3E %3C/svg%3E">
<style>
:root{
  --bg:#f7f6f2;--card:#ffffff;--text:#1f1e1c;--muted:#6b6a65;--line:#d9d7cf;
  --done-bg:#e1f5ee;--done-bd:#1d9e75;--done-tx:#085041;
  --new-bg:#faeeda;--new-bd:#ef9f27;--new-tx:#633806;
  --todo-bg:#f1efe8;--todo-bd:#b4b2a9;--todo-tx:#5f5e5a;
  --ext-bg:#e6f1fb;--ext-bd:#378add;--ext-tx:#0c447c;
  --warn-bg:#fcebeb;--warn-bd:#d85a5a;--warn-tx:#7a1f1f;
  --you-bg:#eeedfe;--you-bd:#7f77dd;--you-tx:#3c3489;
  --code:#f1efe8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1b19;--card:#262522;--text:#ecebe6;--muted:#a3a19a;--line:#3d3c38;
  --done-bg:#0b3d31;--done-bd:#5dcaa5;--done-tx:#c8f0e2;
  --new-bg:#4a3006;--new-bd:#ef9f27;--new-tx:#fae3b8;
  --todo-bg:#2c2c2a;--todo-bd:#6f6e69;--todo-tx:#c2c0b8;
  --ext-bg:#0c2a4a;--ext-bd:#85b7eb;--ext-tx:#d6e7f8;
  --warn-bg:#4a1717;--warn-bd:#e07a7a;--warn-tx:#f8d6d6;
  --you-bg:#26215c;--you-bd:#afa9ec;--you-tx:#e4e1fb;
  --code:#2c2c2a;
}}
:root[data-theme="dark"]{
  --bg:#1c1b19;--card:#262522;--text:#ecebe6;--muted:#a3a19a;--line:#3d3c38;
  --done-bg:#0b3d31;--done-bd:#5dcaa5;--done-tx:#c8f0e2;
  --new-bg:#4a3006;--new-bd:#ef9f27;--new-tx:#fae3b8;
  --todo-bg:#2c2c2a;--todo-bd:#6f6e69;--todo-tx:#c2c0b8;
  --ext-bg:#0c2a4a;--ext-bd:#85b7eb;--ext-tx:#d6e7f8;
  --warn-bg:#4a1717;--warn-bd:#e07a7a;--warn-tx:#f8d6d6;
  --you-bg:#26215c;--you-bd:#afa9ec;--you-tx:#e4e1fb;
  --code:#2c2c2a;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,"Noto Sans Thai","Sarabun",system-ui,sans-serif}
main{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;font-weight:500;margin:0}
.goal{color:var(--muted);margin:2px 0 12px}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.conn{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.conn.on{color:var(--done-tx);background:var(--done-bg);border-color:var(--done-bd)}
.conn.off{color:var(--warn-tx);background:var(--warn-bg);border-color:var(--warn-bd)}
.conn.idle{color:var(--new-tx);background:var(--new-bg);border-color:var(--new-bd)}
.banner,.problems{border:1.5px solid var(--warn-bd);background:var(--warn-bg);color:var(--warn-tx);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.problems{position:fixed;left:16px;bottom:16px;max-width:min(440px,calc(100vw - 32px));max-height:40vh;overflow:auto;margin:0;z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.bar{position:sticky;top:0;z-index:15;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;padding:8px 0;margin-bottom:4px;background:var(--bg);box-shadow:0 1px 0 var(--line)}
.bar button.primary{font-weight:500}
.bar #barExtra{display:contents}
.brand{display:inline-flex;align-items:center;gap:7px;margin-right:auto;font-size:14px;letter-spacing:.2px;order:-2}
.modepill{order:-1;margin-right:auto;margin-left:-4px;font-size:12.5px;font-weight:600;border:1.5px solid;border-radius:999px;padding:2px 11px;cursor:help}
.bar .brand{margin-right:10px}
.modepill.build{color:var(--new-tx);background:var(--new-bg);border-color:var(--new-bd)}
.modepill.explain{color:var(--done-tx);background:var(--done-bg);border-color:var(--done-bd)}
.modepill.design{color:var(--you-tx);background:var(--you-bg);border-color:var(--you-bd)}
.brand b{font-weight:600}
.foot{display:flex;justify-content:flex-end;margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:12px}
.foot a{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none}
.foot a:hover{color:var(--text);text-decoration:underline}
.bar button{font-size:12px;padding:2px 10px;border-radius:999px}
.bar .changes{border-color:var(--you-bd);background:var(--you-bg);color:var(--you-tx)}
.toast{position:fixed;right:16px;top:52px;max-width:min(420px,calc(100vw - 32px));z-index:21;background:var(--card);color:var(--text);border:1.5px solid var(--you-bd);border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.15)}
.toast ul{margin:6px 0 8px;padding-left:18px}
#view .changed,.chip.changed{outline:3px solid var(--you-bd);outline-offset:3px}
.problems ul{margin:4px 0 0;padding-left:20px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:5px;border:1.5px solid;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-style:normal;line-height:1}
.stepnav{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:44px;z-index:14;background:var(--bg);padding:2px 0}
.stepbar{display:flex;align-items:center;flex:1 1 480px;min-width:0;overflow-x:auto;padding:5px 6px 7px;scrollbar-width:thin}
.stepbar .chip{flex:none;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepbar .chip.sel{max-width:340px}
/* Fades show that more steps are off to the side. */
.stepbar.fr{-webkit-mask-image:linear-gradient(to right,#000 88%,transparent);mask-image:linear-gradient(to right,#000 88%,transparent)}
.stepbar.fl{-webkit-mask-image:linear-gradient(to left,#000 88%,transparent);mask-image:linear-gradient(to left,#000 88%,transparent)}
.stepbar.fl.fr{-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent)}
.stepbar .link{flex:none;width:16px;border-top:1.5px solid var(--line)}
.stepbar .link.done{border-color:var(--done-bd)}
/* The side panel slides in; the page column narrows with it. */
:root{--side-w:clamp(340px,32vw,440px)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 0px;transition:grid-template-columns .3s ease}
body.side-open .layout{grid-template-columns:minmax(0,1fr) var(--side-w)}
.layout>main{min-width:0;width:100%}
.side{background:var(--card);color:var(--text);position:sticky;top:0;height:100vh;overflow:hidden;visibility:hidden;transition:visibility 0s .3s}
body.side-open .side{visibility:visible;transition-delay:0s;border-left:1px solid var(--line);box-shadow:-6px 0 18px rgba(0,0,0,.08)}
.side-inner{width:var(--side-w);height:100%;overflow:auto;opacity:0;transform:translateX(28px);transition:transform .3s ease,opacity .25s ease}
body.side-open .side-inner{opacity:1;transform:none}
.side-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.side-head b{flex:1;font-weight:500;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-head button{padding:2px 9px}
.side .panel{border:0;border-radius:0;margin:0;padding:14px 16px 24px;background:transparent}
.side .turn{display:inline-block;font-size:12px;border-radius:6px;padding:0 8px;margin-bottom:8px;background:var(--you-bd);color:var(--card);font-weight:500}
@media (max-width:1099px){
  .layout{display:block}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:25;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.3);transform:translateY(100%);transition:transform .3s ease,visibility 0s .3s}
  body.side-open .side{transform:none;border-left:0;transition:transform .3s ease}
  .side-inner{width:auto;height:auto;max-height:80vh;opacity:1;transform:none}
}
@media (prefers-reduced-motion:reduce){.layout,.side,.side-inner{transition:none!important}}
.turnbtn{display:flex;width:100%;align-items:center;gap:8px;margin-top:10px;text-align:left;background:var(--you-bg);color:var(--you-tx);border:1.5px solid var(--you-bd);border-radius:9px;padding:7px 12px;font-weight:500}
.turnbtn::after{content:"→";margin-left:auto}
.talklink{margin-top:10px;font-size:12.5px;padding:3px 10px;border-radius:999px;color:var(--muted)}
.controls .talklink{margin:0 6px 0 0;font-size:12px;color:var(--text)}
#stepcard:empty{display:none}
/* Proposals: things the user wants added, changed or removed, drawn on the picture until they become a plan. */
.propbar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:0 0 12px;padding:8px 12px;border:1.5px dashed var(--you-bd);border-radius:10px;background:color-mix(in srgb,var(--you-bg) 55%,var(--card));color:var(--you-tx);font-size:13px}
.propbar .pc{font-size:12px;font-weight:600;border-radius:6px;padding:0 7px}
.propbar .cta{margin-left:auto}
.propbar .plinks{font-size:12.5px;color:var(--text)}
.propbar .plinks a{color:var(--you-tx)}
.pc-add,.prop-add .pbadge{background:var(--you-bd);color:var(--card)}
.pc-change,.prop-change .pbadge{background:#14a3b8;color:#fff}
.pc-remove,.prop-remove .pbadge{background:var(--warn-bd);color:#fff}
#view .node.prop{opacity:1;filter:none}
.node.prop-add{border:2px dashed var(--you-bd);background:color-mix(in srgb,var(--you-bg) 75%,var(--card));color:var(--you-tx)}
.node.prop-change{border:2px dashed #14a3b8;background:var(--card);color:var(--text)}
.node.prop-remove{border:2px dashed var(--warn-bd);background:var(--card);color:var(--text)}
.node .pnote{font-size:12px;margin-top:5px;padding-top:5px;border-top:1px dashed currentColor;opacity:.9}
.node.prop-remove .name{text-decoration:line-through;text-decoration-color:var(--warn-bd)}
.pbadge{align-self:flex-start;font-size:10.5px;font-weight:600;border-radius:5px;padding:0 6px;margin-bottom:5px}
.sw.prop-add{border:1.5px dashed var(--you-bd);background:var(--you-bg)}
.sw.prop-change{border:1.5px dashed #14a3b8;background:transparent}
.sw.prop-remove{border:1.5px dashed var(--warn-bd);background:transparent}
.propcard{border:1.5px dashed var(--you-bd);border-radius:10px;padding:8px 12px;margin:0 0 12px;background:color-mix(in srgb,var(--you-bg) 45%,var(--card))}
.propcard .pbadge{display:inline-block}
.propcard p{margin:4px 0 8px;font-size:13.5px}
.proplist{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.proplist button{display:flex;gap:8px;align-items:baseline;text-align:left;width:100%;padding:7px 10px;border-radius:8px}
.proplist .pbadge{flex:none;margin:0}
.proplist small{display:block;color:var(--muted);font-size:12px}
.pchoose{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.pchoose button{font-size:12px;padding:2px 10px;border-radius:999px}
.pchoose button[aria-pressed="true"]{border-color:var(--you-bd);background:var(--you-bg);color:var(--you-tx);font-weight:600}
.helpbtn{width:26px;height:26px;padding:0;border-radius:50%;font-weight:600;font-size:13px}
.legendbox{margin:0 0 10px;font-size:13px}
.legendbox summary{cursor:pointer;color:var(--muted);width:max-content}
.legendbox .legend{margin:8px 0 4px}
.thread:empty::before{content:attr(data-empty);display:block;font-size:12.5px;color:var(--muted);line-height:1.5}
.tour{position:fixed;inset:0;z-index:40}
.tour .spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.55),0 0 0 2px var(--you-bd);transition:all .25s ease;pointer-events:none}
.tour .tcard{position:fixed;width:min(360px,calc(100vw - 32px));background:var(--card);color:var(--text);border:1.5px solid var(--you-bd);border-radius:12px;padding:12px 14px;box-shadow:0 12px 36px rgba(0,0,0,.35);transition:top .25s ease,left .25s ease}
.tour .tcard p{margin:0 0 10px;font-size:14px;line-height:1.55}
.tour .trow{display:flex;align-items:center;gap:8px}
.tour #tourStep{font-size:12px;color:var(--muted);margin-right:auto}
.helpcard kbd{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg)}
.helpcard ul{list-style:none;padding:0;margin:8px 0 10px}
.helpcard li{margin:4px 0}
/* design mode */
.cons{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px;font-size:12.5px}
.cons .clabel{color:var(--muted);margin-right:2px}
.cons .cchip{border:1.5px solid var(--done-bd);background:var(--done-bg);color:var(--done-tx);border-radius:999px;padding:1px 10px;font-size:12.5px}
.cons .cchip.assumed{border-style:dashed;border-color:var(--new-bd);background:transparent;color:var(--new-tx)}
.stepnav.nosteps .stepbar,.stepnav.nosteps #prev,.stepnav.nosteps #play,.stepnav.nosteps #next{display:none}
.stepnav.nosteps{justify-content:flex-end}
.tabs .rec{color:var(--you-tx)}
.tabs .pct{font-size:11.5px;color:var(--muted);margin-left:6px}
.optcard .orec{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:0 9px;margin-left:8px;background:var(--you-bd);color:var(--card);vertical-align:2px}
.optcard .why{margin:4px 0 0;font-size:13.5px;color:var(--you-tx)}
.optcard .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.decided{border:1.5px solid var(--done-bd);background:var(--done-bg);color:var(--done-tx);border-radius:9px;padding:7px 12px;margin-top:10px;font-size:13.5px}
.decided.other{border-color:var(--line);background:transparent;color:var(--muted)}
.cmp{margin:16px 0 8px;overflow-x:auto}
.cmp h4{margin:0 0 8px;font-size:14px;font-weight:500}
.cmp table{border-collapse:separate;border-spacing:0;width:100%;min-width:560px;font-size:13px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.cmp thead th{font-weight:500;color:var(--muted);white-space:nowrap}
.cmp thead th.sel,.cmp td.sel{background:color-mix(in srgb,var(--you-bg) 55%,transparent)}
.cmp tbody th{font-weight:500}
.cmp td{cursor:pointer}
.cmp td:hover{background:color-mix(in srgb,var(--you-bg) 35%,transparent)}
.cmp .dots{letter-spacing:1px;color:var(--you-tx)}
.cmp .yes{color:var(--done-tx);font-weight:600}
.cmp .no{color:var(--warn-tx);font-weight:600}
.cmp .na{color:var(--muted)}
.cmp sup{font-size:10px;color:var(--muted);margin-left:3px}
.cmp .wbtn{display:inline-block;margin-top:3px;font-size:11px;padding:0 7px;border-radius:999px;color:var(--muted)}
.cmp tfoot th,.cmp tfoot td{border-bottom:0;font-weight:600}
.cmp .meter{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.cmp .meter i{display:block;height:100%;background:var(--you-bd)}
.node.plain{background:var(--card);border-color:var(--line);color:var(--text)}
.cmp td.best{color:var(--you-tx)}
.sources{margin:10px 0 0;font-size:13px}
.sources summary{cursor:pointer;color:var(--muted)}
.sources ol{margin:8px 0 0;padding-left:22px}
.sources li{margin:3px 0}
.sources a{color:var(--you-tx)}
.sources small{color:var(--muted)}
.node .bmark{align-self:flex-start;margin-top:6px;font-size:10.5px;border:1px solid currentColor;border-radius:5px;padding:0 6px;opacity:.85}
.node.basis-assumed{border-style:dashed}
.basisline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin:0 0 10px}
.basisline a{color:var(--you-tx)}
.cellbig{font-size:22px;margin:4px 0 8px}
.warnbox{border:1.5px dashed var(--new-bd);color:var(--new-tx);border-radius:9px;padding:7px 12px;margin:0 0 10px;font-size:13px}
.chip{border:1.5px solid;border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;background:var(--card);color:inherit}
.chip.doing::before,.sbadge.doing::before,.bar .progress.doing::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--new-bd);margin-right:6px;vertical-align:1px}
@media (prefers-reduced-motion:no-preference){.chip.doing::before,.sbadge.doing::before,.bar .progress.doing::before{animation:blink 1.4s ease-in-out infinite}}
@keyframes blink{50%{opacity:.25}}
.sbadge{display:inline-block;font-size:12px;font-weight:500;border:1px solid;border-radius:999px;padding:0 9px;margin-left:8px;vertical-align:2px}
.sbadge.todo{border-style:dashed}
.implementing{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--new-tx);background:var(--new-bg);border:1px solid var(--new-bd);border-radius:8px;padding:5px 10px;margin:2px 0 8px}
.implementing .dots i{background:var(--new-bd)}
.bar .progress{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.bar .progress.doing{border-color:var(--new-bd);color:var(--new-tx);background:var(--new-bg)}
.bar .progress.review{border-color:var(--you-bd);color:var(--you-tx);background:var(--you-bg)}
.bar .progress.done{border-color:var(--done-bd);color:var(--done-tx);background:var(--done-bg)}
.chip.sel{outline:2px solid var(--text);outline-offset:1px}
.chip.all{border-color:var(--line);color:var(--muted)}
.chip.review{background:var(--you-bg);border-color:var(--you-bd);color:var(--you-tx)}
.stepcard.review{border-color:var(--you-bd);border-left:5px solid var(--you-bd)}
.stepcard.review .turn{font-weight:500}
.commitbox{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.commitbox .lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
.commitbox textarea{width:100%;min-height:52px;resize:vertical;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.commitbox .citem{border:1px solid var(--line);border-left:3px solid var(--you-bd);border-radius:8px;background:var(--card);padding:8px 10px 10px;margin-bottom:10px}
.commitbox .chead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
.commitbox .cnum{min-width:20px;height:20px;border-radius:999px;background:var(--you-bd);color:var(--card);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.commitbox .citem textarea{background:var(--bg)}
.commitbox textarea{field-sizing:content;min-height:2.6em;max-height:16em}
.commitbox .flabel{font-size:11.5px;color:var(--muted);margin:8px 0 4px}
.commitbox .cfiles{display:flex;gap:4px 6px;flex-wrap:wrap}

// ```fenced``` blocks become code blocks and `ticks` inline code; everything stays text, never HTML.
function msgBody(text) {
  const f = document.createDocumentFragment();
  String(text ?? "").split(/```[a-z0-9]*\n?([\s\S]*?)```/i).forEach((part, i) => {
    if (i % 2) return f.append(el("pre", "mcode", part.replace(/\n$/, "")));
    if (i) part = part.replace(/^\n/, "");
    part.split(/`([^`\n]+)`/).forEach((x, j) => {
      if (j % 2) return f.append(el("code", "mcode", x));
      x.split(/(https?:\/\/[^\s<>"'`]+)/).forEach((y, k) => {
        if (!(k % 2)) return f.append(y);
        const a = el("a", null, y);
        a.href = y;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        f.append(a);
      });
    });
  });
  return f;
}

let termRe = null;

let commonGlossary = {}, glossary = {};
const escRe = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// Not inside identifiers or paths such as usecase/extract/extract.go.
const edge = (t) => (/^\w/.test(t) ? "(?<![\\w./-])" : "") + escRe(t) + (/\w$/.test(t) ? "(?![\\w-]|\\.\\w)" : "");

// Shared terms ship with planview; the plan only adds its own. Only terms the plan uses are shown.
function setGlossary(own) {
  const text = JSON.stringify({...plan, glossary: undefined});
  const used = Object.fromEntries(Object.entries(commonGlossary).filter(([t]) => new RegExp(edge(t)).test(text)));
  const pick = (v) => (typeof v === "string" ? v : v?.[lang] ?? v?.en);
  glossary = {...Object.fromEntries(Object.entries(used).map(([k, v]) => [k, pick(v)])), ...(own && typeof own === "object" ? own : {})};
  const g = glossary;
  const terms = Object.keys(g).filter(Boolean).sort((a, b) => b.length - a.length);
  termRe = terms.length ? new RegExp(terms.map(edge).join("|"), "g") : null;
  const box = document.getElementById("glossary");
  box.hidden = !terms.length;
  if (!terms.length) return;
  const dl = el("dl");
  for (const t of [...terms].sort((a, b) => a.localeCompare(b))) dl.append(el("dt", null, t), el("dd", null, g[t]));
  box.replaceChildren(el("summary", null, t(plan.mode === "explain" ? "termsPage" : "terms", terms.length)), dl);
}

// Text with glossary terms that explain themselves on click or tap.
function rich(text) {
  const f = document.createDocumentFragment();
  const str = String(text ?? "");
  if (!termRe) {
    f.append(str);
    return f;
  }
  let last = 0;
  for (const m of str.matchAll(termRe)) {
    f.append(str.slice(last, m.index));
    const t = el("span", "term", m[0]);
    t.tabIndex = 0;
    t.setAttribute("role", "button");
    t.title = glossary[m[0]];
    const open = (e) => {
      e.stopPropagation();
      showTip(t, m[0]);
    };
    t.onclick = open;
    t.onkeydown = (e) => { if (e.key === "Enter") open(e); };
    f.append(t);
    last = m.index + m[0].length;
  }
  f.append(str.slice(last));
  return f;
}

function richEl(tag, cls, text) {
  const e = el(tag, cls);
  e.append(rich(text));
  return e;
}

function showTip(anchor, term) {
  const tip = document.getElementById("tip");
  tip.replaceChildren(el("b", null, term), document.createTextNode(glossary[term]));
  tip.hidden = false;
  const r = anchor.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.left + scrollX - 10, scrollX + document.documentElement.clientWidth - tip.offsetWidth - 8));
  const above = r.bottom + tip.offsetHeight + 14 > innerHeight && r.top > tip.offsetHeight + 14;
  tip.classList.toggle("above", above);
  tip.style.left = left + "px";
  tip.style.top = (above ? r.top + scrollY - tip.offsetHeight - 9 : r.bottom + scrollY + 9) + "px";
  tip.style.setProperty("--cx", Math.max(14, Math.min(tip.offsetWidth - 14, r.left + scrollX + r.width / 2 - left)) + "px");
}

    current = m;
    const x = m === "change" && plan.mode === "explain" ? "_explain" : "";
    ta.placeholder = m === "question" ? placeholder : m === "propose" ? t(c.node ? (pchange ? "ph_propose_" + pchange : "pickChange") : "ph_propose_plan") : t("ph_" + m + x);
    sendBtn.textContent = t("send_" + m + x);
    seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
    choose.hidden = !(m === "propose" && c.node);
    choose.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.change === pchange)));
  };
  const seg = el("div", "modes");
  if (modes.length > 1) {
    seg.setAttribute("role", "group");
    for (const m of modes) {
      const b = el("button", null, t(m === "change" && plan.mode === "explain" ? "change_explain" : m));
      b.dataset.mode = m;
      b.onclick = () => {
        picked[pickKey] = m;
        setMode(m);
        ta.focus();
      };
      seg.append(b);
    }
    box.append(seg);
  }
  box.append(choose);
  setMode(current);
  sendBtn.onclick = () => go(current, "");
  buttons.push(sendBtn);
  ta.onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) go(current, ""); };
  const row = el("div", "send");
  row.append(note, sendBtn);
  const thr = el("div", "thread");
  thr.dataset.ctx = JSON.stringify(c);
  thr.dataset.empty = c.step && !c.node ? t("emptyStep", unit()) : t(c.node ? "emptyBox" : "emptyPlan");
  box.append(ta, row, thr);
  return box;
}

async function saveSetting(change) {
  document.querySelectorAll(".settings button").forEach((b) => (b.disabled = true));
  try {
    const r = await fetch("/api/settings?token=" + encodeURIComponent(token), {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(change)});
    if (!r.ok) throw new Error(await r.text());
  } catch (e) {
    const box = document.getElementById("toast");
    box.replaceChildren(t("settingFail") + e.message);
    box.hidden = false;
    renderBadges();
  }
}

// Messages the agent has taken but not answered in the same place, while it is not listening: it is working on them.
function working() {
  if (!connected || waiting) return [];
  return thread.filter((m, i) => m.from !== "agent" && m.delivered && m.kind !== "settings" && !(m.kind === "approve" && plan?.approved) &&
    !thread.slice(i + 1).some((r) => r.from === "agent" && inCtx(r, m.node ? {node: m.node} : m.step ? {step: m.step} : {})));
}

function typingEl(m) {
  const min = Math.floor((Date.now() - Date.parse(m.at)) / 60000);
  const stuck = min >= 10;
  const d = el("div", "msg agent typing" + (stuck ? " stuck" : ""));
  const dots = el("span", "dots");
  dots.append(el("i"), el("i"), el("i"));
  d.append(dots, el("span", null, stuck ? t("noReply", min) : t("working", min)));
  return d;
}

function renderBadges() {
  const conn = document.getElementById("conn");
  const busy = working().length > 0;
  conn.className = "conn " + (!connected ? "off" : waiting ? "on" : busy ? "work" : "idle");
  conn.textContent = !connected ? t(!served ? "connOff" : everConnected ? "connLost" : "connecting") : waiting ? t("connOn") : busy ? t("connWorking") : t("connIdle");
  conn.title = !connected ? t("connLostTip") : waiting ? t("connOnTip") : busy ? t("connWorkingTip") : t("connIdleTip");
  if (!plan) return;
  const s = plan.settings || {};
  const explain = plan.mode === "explain";
  // The mode is always in sight, next to the logo.
  const mode = MODES_SHOWN.includes(plan.mode) ? plan.mode : "build";
  const pill = document.getElementById("modePill");
  pill.hidden = false;
  pill.className = "modepill " + mode;
  pill.textContent = t("pill_" + mode);
  pill.title = t("pillTip_" + mode);
  const items = [];
  if (plan.mode === "design") {
    document.getElementById("badges").replaceChildren(...items);
    return renderBar();
  }
  // One small box per setting; what the current value means is in its tooltip.
  const box = el("div", "settings");
  box.append(el("span", "slabel", t("agentSettings")));
  const card = (name, control, fx) => {
    const c = el("span", "setting");
    c.title = fx;
    c.append(el("span", "sname", name), control);
    box.append(c);
  };
  const on = teachBackOn(plan);
  const sw = el("button", "switch" + (on ? " on" : ""));
  sw.setAttribute("role", "switch");
  sw.setAttribute("aria-checked", String(on));
  sw.setAttribute("aria-label", t("restate", unit()));
  sw.append(el("span", "track"), el("span", "state", on ? t("on") : t("off")));
  sw.onclick = () => saveSetting({teachBack: !on});
  card(t("restate", unit()), sw, on ? t("restateOnFx", unit()) : t("restateOffFx", unit()));
  if (!explain) {
    const opts = el("span", "opts");
    opts.setAttribute("role", "group");
    opts.setAttribute("aria-label", t("commits"));
    for (const [v, label] of [["auto", t("commitAuto")], ["suggest", t("commitOnly")]]) {
      const b = el("button", null, label);
      b.setAttribute("aria-pressed", String(s.commit === v));
      b.onclick = () => s.commit !== v && saveSetting({commit: v});
      opts.append(b);
    }
    const seg = el("span", "seg");
    seg.append(opts);
    card(t("commits"), seg, s.commit === "auto" ? t("commitAutoFx") : t("commitOnlyFx"));
  }
  for (const b of box.querySelectorAll("button")) b.disabled = !connected;
  if (!explain) items.push(plan.approved ? el("span", "ok", t("approved")) : el("span", "wait", t("awaiting")));
  items.push(box);
  document.getElementById("badges").replaceChildren(...items);
  renderBar();
}

// The step the agent is on, or the one waiting for the user.
const activeStep = (p) => (p?.steps || []).find((s) => s.status === "doing" || yourTurn(s)) || null;

function renderBar() {
  const extra = [];
  const list = steps();
  if (plan.mode !== "explain" && plan.approved && list.length) {
    const a = activeStep(plan);
    const all = list.every((s) => s.status === "done");
    if (a || all) {
      const i = list.indexOf(a) + 1, review = a && a.status !== "doing";
      const more = list.filter((s) => yourTurn(s)).length - (review ? 1 : 0);
      const b = el("button", "progress " + (all ? "done" : review ? "review" : "doing"),
        all ? t("progDone", list.length) : t(review ? "progReview" : "progDoing", i, list.length, a.title) + (more > 0 ? ` (+${more})` : ""));
      if (a) b.onclick = () => {
        selectStep(a.id);
        if (review) openSide({kind: "step", id: a.id});
      };
      extra.push(b);
    }
  }
  const news = unread().length;
  if (news) {
    const b = el("button", "unread", t("newReplies", news));
    b.onclick = openUnread;
    extra.push(b);
  }
  if ((plan.mode ?? "build") === "build" && !plan.approved && connected) {
    const b = el("button", "primary", "✓ " + t("approve"));
    b.title = t("quickTip");
    b.onclick = async (e) => {
      e.stopPropagation();
      if (!approveOk()) return;
      b.disabled = true;
      try {
        await send({}, "approve", t("q_approve"));
        b.textContent = t("approveSent");
      } catch {
        b.disabled = false;
      }
    };
    extra.push(b);
  }
  const n = changes.nodes.size + changes.steps.size + changes.notes.length;
  if (n) {
    const b = el("button", "changes", t("changedN", n));
    b.onclick = (e) => {
      e.stopPropagation();
      showChangeList();
    };
    extra.push(b);
  }
  document.getElementById("barExtra").replaceChildren(...extra);
}

// What a step in review still waits for: a restatement, then (when the user commits) the commit.
const approveOk = () => !proposals().length || confirm(t("approveOpen", proposals().length));

// A step whose answer (restatement or commit) was sent and is waiting for the agent.
const answered = (step) => thread.some((m, i) => m.step === step.id && !m.node && ["teachback", "commit", "committed"].includes(m.kind) &&
  !thread.slice(i + 1).some((x) => x.from === "agent" && x.step === step.id && !x.node));

function yourTurn(step) {
  if (step?.status !== "review") return null;
  if (teachBackOn(plan) && !step.confirmed) return "turnRestate";
  if (plan.mode !== "explain" && plan.settings?.commit === "suggest") return "turnCommit";
  return step.confirmed ? null : "turnCheck";
}

// The agent's suggested commits (one or several, each with its files), editable; the user commits through the agent or says they did it themselves.
function commitBox(step) {
  const list = Array.isArray(step.commits) && step.commits.length ? step.commits : [{message: step.commitMessage ?? ""}];
  const box = el("div", "commitbox");
  box.append(el("div", "lbl", list.length > 1 ? t("commitsLabel", list.length) : t("commitLabel")));
  const areas = list.map((c, i) => {
    const key = `commit:${step.id}:${i}`;
    const item = el("div", "citem");
    const ta = el("textarea");
    ta.dataset.key = key;
    ta.value = drafts[key] ?? c.message ?? "";
    ta.placeholder = t("noCommitMsg");
    ta.oninput = () => {
      drafts[key] = ta.value;
      now.disabled = areas.some((a) => !a.value.trim());
    };
    if (list.length > 1) {
      const head = el("div", "chead");
      head.append(el("span", "cnum", String(i + 1)), t("commitN", i + 1, list.length));
      item.append(head);
    }
    item.append(ta);
    if (c.files?.length) {
      const files = el("div", "cfiles");
      c.files.forEach((f) => files.append(el("code", null, f)));
      item.append(el("div", "flabel", t("filesN", c.files.length)), files);
    }
    box.append(item);
    return ta;
  });
  const now = el("button", "primary", t("commitNow"));
  const mine = el("button", null, t("committed"));
  const note = el("span", "note");
  const go = async (kind, text, extra) => {
    now.disabled = mine.disabled = true;
    try {
      await send({step: step.id}, kind, text, extra);
      note.textContent = t("sent");
    } catch (e) {
      note.textContent = t("sendFail") + e.message;
      now.disabled = areas.some((a) => !a.value.trim());
      mine.disabled = false;
    }
  };
  now.disabled = areas.some((a) => !a.value.trim());
  now.onclick = () => {
    const commits = list.map((c, i) => ({message: areas[i].value.trim(), ...(c.files?.length ? {files: c.files} : {})}));
    go("commit", commits.map((c) => c.message).join("\n\n"), {commits});
  };
  mine.onclick = () => go("committed", t("q_committed"));
  const row = el("div", "row");
  row.append(now, mine, note);
  box.append(row);
  return box;
}

// The main column explains; everything you answer or decide opens in the side panel.
function renderStepCard() {
  const card = document.getElementById("stepcard");
  if (isDesign()) return renderOptionCard();
  const step = curStep();
  const talk = (ctx, label, n) => {
    const b = el("button", "talklink", label);
    b.onclick = () => openSide(ctx);
    return b;
  };
  if (!step) {
    const approve = (plan.mode ?? "build") === "build" && !plan.approved;
    const waitingStep = steps().find((s) => yourTurn(s));
    if (!approve && waitingStep) {
      const c = el("div", "stepcard review");
      const b = el("button", "turnbtn", `👉 ${unit(true)} ${steps().indexOf(waitingStep) + 1}: ${waitingStep.title} · ${t(yourTurn(waitingStep), unit())}`);
      b.onclick = () => {
        selectStep(waitingStep.id);
        openSide({kind: "step", id: waitingStep.id});
      };
      c.append(b);
      card.replaceChildren(c);
      return refreshThreads();
    }
    if (!approve) {
      card.replaceChildren();
      return refreshThreads();
    }
    const c = el("div", "stepcard review");
    const b = el("button", "turnbtn", "👉 " + t("turnApprove"));
    b.onclick = () => openSide({kind: "plan"});
    c.append(b);
    card.replaceChildren(c);
    return refreshThreads();
  }
  const explain = plan.mode === "explain";
  const turn = yourTurn(step);
  const c = el("div", "stepcard " + (turn ? "review" : ""));
  const h = el("h3", null, `${unit(true)} ${steps().indexOf(step) + 1}: ${step.title}`);
  const st = !explain && (turn ? "review" : step.status === "done" || step.confirmed && step.status !== "doing" ? "done" : step.status === "doing" ? "doing" : step.status ? "todo" : null);
  if (st) h.append(el("span", "sbadge " + st, (st === "done" ? "✓ " : "") + t("sb_" + st)));
  if (step.confirmed && step.status !== "done") h.append(el("span", "passed", t("restated")));
  c.append(h);
  if (st === "doing") {
    const line = el("div", "implementing");
    const dots = el("span", "dots");
    dots.append(el("i"), el("i"), el("i"));
    line.append(dots, t("implementing"));
    c.append(line);
  }
  if (step.detail) c.append(richEl("p", "detail", step.detail));
  if (step.done) c.append(richEl("p", "donewhen", (explain ? t("understoodWhen") : t("doneWhen")) + step.done));
  if (turn) {
    const b = el("button", "turnbtn", answered(step) ? "✓ " + t("sentWait") : "👉 " + t(turn, unit()));
    b.onclick = () => openSide({kind: "step", id: step.id});
    c.append(b);
  } else {
    const n = thread.filter((m) => inCtx(m, {step: step.id}) && m.kind !== "settings").length;
    // With restating on in explain mode, every stage offers it right on the card.
    if (explain && teachBackOn(plan) && !step.confirmed) {
      const b = el("button", "turnbtn", t("restateThis", unit()));
      b.onclick = () => {
        picked[`step:${step.id}|${step.status}`] = "teachback";
        openSide({kind: "step", id: step.id});
      };
      c.append(b);
    }
    c.append(talk({kind: "step", id: step.id}, t("talkStep", n, unit())));
  }
  card.replaceChildren(c);
  refreshThreads();
}

const PROP_TYPES = ["add", "change", "remove"];
const propOf = (n) => (PROP_TYPES.includes(n?.proposal?.type) ? n.proposal : null);
const proposals = () => Object.entries(plan?.nodes || {}).filter(([, n]) => propOf(n));

// Outside everything else: how many proposals there are, and the way to turn them into a plan.
function renderProposals() {
  const bar = document.getElementById("proposals");
  const list = proposals();
  const links = (Array.isArray(plan.links) ? plan.links : []).filter((l) => /^https?:\/\//.test(l?.url || ""));
  bar.hidden = !list.length && !links.length;
  const parts = [];
  if (list.length) {
    parts.push(el("b", null, t("propCount", list.length)));
    for (const k of PROP_TYPES) {
      const n = list.filter(([, x]) => x.proposal.type === k).length;
      if (n) parts.push(el("span", "pc pc-" + k, `${{add: "+", change: "~", remove: "−"}[k]}${n}`));
    }
    const see = el("button", null, t("seeProps"));
    see.onclick = () => openSide({kind: "props"});
    const go = el("button", "primary cta", t(plan.mode === "explain" ? "toPlan" : "applyPlan"));
    go.onclick = () => openSide({kind: "props"});
    parts.push(see, go);
  }
  if (links.length) {
    const s = el("span", "plinks", t("linksLabel"));
    for (const l of links) {
      const a = el("a", null, (l.title || l.url) + " ↗");
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      s.append(" ", a);
    }
    parts.push(s);
  }
  bar.replaceChildren(...parts);
}

function renderPropsPanel() {
  document.getElementById("sideTitle").textContent = t("propsTitle");
  const list = el("div", "proplist");
  for (const [id, n] of proposals()) {
    const b = el("button");
    const txt = el("span");
    txt.append(n.name, el("small", null, n.proposal.note || ""));
    b.append(el("span", "pbadge " + "pc-" + n.proposal.type, t("pb_" + n.proposal.type)), txt);
    b.onclick = () => selectNode(id, false);
    list.append(b);
  }
  const build = plan.mode !== "explain";
  const go = el("button", "primary", t(build ? "confirmApply" : "confirmPlan"));
  const ids = proposals().map(([id]) => id);
  go.disabled = !ids.length;
  go.onclick = async () => {
    go.disabled = true;
    await send({}, build ? "apply" : "plan", t(build ? "q_apply" : "q_plan"), {proposals: ids}).catch(() => (go.disabled = false));
  };
  const thr = el("div", "thread");
  thr.dataset.ctx = "{}";
  document.getElementById("panel").replaceChildren(list, go, thr);
  refreshThreads();
}

// ---------- design mode: options, a comparison by weighted criteria, constraints and sources
const BASIS_KEYS = ["iac", "cli", "doc", "assumed"];
const MODES_SHOWN = ["build", "explain", "design"];
const isDesign = () => plan?.mode === "design";
const options = () => (isDesign() && Array.isArray(plan.options) ? plan.options.filter((o) => o?.id) : []);
const criteria = () => (Array.isArray(plan?.criteria) ? plan.criteria.filter((c) => c?.id) : []);
let optionId = null;
const curOption = () => options().find((o) => o.id === optionId) || options().find((o) => o.id === plan.decision?.option) || options().find((o) => o.recommended) || options()[0] || null;
const cell = (o, c) => plan.scores?.[o]?.[c] || null;
const sourceNo = (id) => (plan.sources || []).findIndex((x) => x?.id === id) + 1;
const unconfirmed = () => (plan.constraints || []).filter((c) => c && !c.confirmed).length + Object.values(plan.nodes || {}).filter((n) => n?.basis === "assumed").length;

function totals() {
  return Object.fromEntries(options().map((o) => {
    let got = 0, max = 0;
    for (const c of criteria()) {
      const w = c.weight ?? 1, v = ratingValue(cell(o.id, c.id)?.rating);
      if (!w || v == null) continue;
      got += w * v;
      max += w * 5;
    }
    return [o.id, max ? Math.round((got / max) * 100) : null];
  }));
}

function chooseOption(id) {
  optionId = id;
  viewId = curOption()?.view || viewId;
  renderView();
  renderStepCard();
  renderCompare();
}

function sourceLink(src) {
  const a = el("a", null, `[${sourceNo(src.id)}] ${src.title || src.url} ↗`);
  a.href = src.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  return a;
}

function ratingEl(r) {
  if (r === "yes") return el("span", "yes", "✓");
  if (r === "no") return el("span", "no", "✗");
  const v = ratingValue(r);
  if (v == null) return el("span", "na", "—");
  return el("span", "dots", "●".repeat(Math.round(v)) + "○".repeat(5 - Math.round(v)));
}

function renderConstraints() {
  const bar = document.getElementById("constraints");
  const list = (plan.constraints || []).filter((c) => c?.id);
  bar.hidden = !list.length;
  if (!list.length) return;
  const parts = [el("span", "clabel", t("constraintsLabel"))];
  for (const c of list) {
    const chip = el("span", "cchip" + (c.confirmed ? "" : " assumed"), (c.confirmed ? "✓ " : "❓ ") + c.text);
    if (!c.confirmed) chip.title = t("assumedTip");
    parts.push(chip);
  }
  const check = el("button", "talklink", t("checkCons"));
  check.style.marginTop = "0";
  check.onclick = () => openSide({kind: "constraints"});
  parts.push(check);
  bar.replaceChildren(...parts);
}

function renderOptionCard() {
  const card = document.getElementById("stepcard");
  const o = curOption();
  if (!o) return card.replaceChildren();
  const c = el("div", "stepcard optcard");
  const h = el("h3", null, o.title);
  if (o.recommended) h.append(el("span", "orec", t("recommended")));
  c.append(h);
  if (o.summary) c.append(richEl("p", "detail", o.summary));
  if (o.why) c.append(richEl("p", "why", o.why));
  const d = plan.decision;
  if (d?.option) {
    const mine = d.option === o.id;
    const box = el("div", "decided" + (mine ? "" : " other"), mine ? t("decided", o.title) : t("notChosen"));
    const why = mine ? d.why : d.not?.[o.id];
    if (why) box.append(el("div", null, why));
    c.append(box);
  } else {
    const acts = el("div", "acts");
    const go = el("button", "primary", t("choose"));
    go.onclick = () => openSide({kind: "decide", id: o.id});
    const ask = el("button", "talklink", "💬 " + t("askOption", o.title).replace(/…$/, ""));
    ask.style.marginTop = "0";
    ask.onclick = () => openSide({kind: "option", id: o.id});
    acts.append(go, ask);
    c.append(acts);
  }
  card.replaceChildren(c);
  refreshThreads();
}

function renderCompare() {
  const box = document.getElementById("compare");
  if (!isDesign() || !options().length || !criteria().length) return box.replaceChildren();
  const pct = totals(), best = Math.max(...Object.values(pct).filter((x) => x != null));
  const cur = curOption()?.id;
  const wrap = el("div", "cmp");
  wrap.append(el("h4", null, t("compareTitle")));
  const table = el("table"), head = el("tr");
  head.append(el("th"));
  for (const o of options()) {
    const th = el("th", o.id === cur ? "sel" : "", (o.recommended ? "★ " : "") + o.title);
    th.style.cursor = "pointer";
    th.onclick = () => chooseOption(o.id);
    head.append(th);
  }
  const thead = el("thead");
  thead.append(head);
  const tbody = el("tbody");
  for (const c of criteria()) {
    const tr = el("tr"), th = el("th", null, c.label);
    const w = c.weight ?? 1;
    const wb = el("button", "wbtn", "●".repeat(w) + "○".repeat(3 - w));
    wb.title = t("weightTip");
    wb.onclick = async () => {
      const next = (w + 1) % 4;
      c.weight = next;
      renderCompare();
      renderView();
      await fetch("/api/settings?token=" + encodeURIComponent(token), {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({weights: {[c.id]: next}})}).catch(() => {});
    };
    th.append(el("br"), wb);
    tr.append(th);
    for (const o of options()) {
      const x = cell(o.id, c.id);
      const td = el("td", o.id === cur ? "sel" : "");
      td.append(ratingEl(x?.rating));
      for (const s of x?.sources || []) if (sourceNo(s)) td.append(el("sup", null, `[${sourceNo(s)}]`));
      td.onclick = () => openSide({kind: "cell", option: o.id, criterion: c.id});
      tr.append(td);
    }
    tbody.append(tr);
  }
  const foot = el("tr");
  foot.append(el("th", null, t("total")));
  for (const o of options()) {
    const td = el("td", (o.id === cur ? "sel " : "") + (pct[o.id] === best ? "best" : ""), pct[o.id] == null ? "—" : pct[o.id] + "%");
    const meter = el("span", "meter"), fill = el("i");
    fill.style.width = (pct[o.id] || 0) + "%";
    meter.append(fill);
    td.append(meter);
    foot.append(td);
  }
  const tfoot = el("tfoot");
  tfoot.append(foot);
  table.append(thead, tbody, tfoot);
  wrap.append(table);
  box.replaceChildren(wrap);
}

function renderSources() {
  const box = document.getElementById("sources");
  const list = (plan.sources || []).filter((x) => x?.id && /^https?:\/\//.test(x.url || ""));
  box.hidden = !list.length;
  if (!list.length) return;
  const ol = el("ol");
  for (const src of list) {
    const li = el("li"), a = el("a", null, (src.title || src.url) + " ↗");
    a.href = src.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    li.append(a);
    if (src.checked) li.append(" ", el("small", null, t("checkedOn", src.checked)));
    ol.append(li);
  }
  box.replaceChildren(el("summary", null, t("sourcesTitle", list.length)), ol);
}

function renderDesignPanel() {
  const title = document.getElementById("sideTitle");
  const p = document.getElementById("panel");
  const opt = options().find((o) => o.id === (side.option || side.id));
  const parts = [];
  if (side.kind === "constraints") {
    title.textContent = t("consTitle");
    const list = el("div", "proplist");
    for (const c of (plan.constraints || []).filter((x) => x?.id)) {
      const row = el("div", "propcard");
      row.append(el("p", null, (c.confirmed ? "✓ " : "❓ ") + c.text));
      if (!c.confirmed) {
        const ok = el("button", null, t("confirm"));
        ok.onclick = async () => {
          ok.disabled = true;
          await send({}, "confirm", t("q_confirm", c.text), {constraint: c.id}).catch(() => (ok.disabled = false));
        };
        row.append(ok);
      }
      list.append(row);
    }
    parts.push(list, talkBox({}, {placeholder: t("ph_propose_plan"), modes: ["propose", "question"]}));
  } else if (side.kind === "cell") {
    const c = criteria().find((x) => x.id === side.criterion);
    if (!opt || !c) return closeSide();
    title.textContent = `${c.label} · ${opt.title}`;
    const x = cell(opt.id, c.id);
    const big = el("div", "cellbig");
    big.append(ratingEl(x?.rating));
    parts.push(big);
    if (x?.note) parts.push(richEl("p", "why", x.note));
    const srcs = (x?.sources || []).map((s) => (plan.sources || []).find((y) => y?.id === s)).filter(Boolean);
    if (srcs.length) {
      const ul = el("ul", "linklist");
      for (const src of srcs) {
        const li = el("li");
        li.append(sourceLink(src));
        if (src.checked) li.append(" ", el("small", null, t("checkedOn", src.checked)));
        ul.append(li);
      }
      parts.push(ul);
    }
    parts.push(talkBox({}, {placeholder: t("cellAsk", c.label, opt.title), modes: ["question", "propose"], extra: {option: opt.id, criterion: c.id}}));
  } else if (side.kind === "decide") {
    if (!opt) return closeSide();
    title.textContent = t("decideTitle", opt.title);
    const n = unconfirmed();
    if (n) parts.push(el("div", "warnbox", "⚠ " + t("decideWarn", n)));
    const ta = el("textarea");
    ta.placeholder = t("decideReason");
    ta.dataset.key = "decide:" + opt.id;
    ta.value = drafts[ta.dataset.key] || "";
    ta.oninput = () => (drafts[ta.dataset.key] = ta.value);
    const go = el("button", "primary", t("decideSend"));
    go.onclick = async () => {
      go.disabled = true;
      await send({}, "decide", ta.value.trim() || t("q_decide", opt.title), {option: opt.id}).catch(() => (go.disabled = false));
    };
    const talk = el("div", "talk");
    talk.append(ta, go);
    const thr = el("div", "thread");
    thr.dataset.ctx = "{}";
    parts.push(talk, thr);
  } else {
    if (!opt) return closeSide();
    title.textContent = opt.title;
    parts.push(talkBox({}, {placeholder: t("askOption", opt.title), modes: ["question", "propose"], extra: {option: opt.id}}));
  }
  p.replaceChildren(...parts);
  refreshThreads();
}

let side = null;

function openSide(ctx) {
  side = ctx;
  if (ctx.kind !== "node") nodeId = null;
  const was = document.body.classList.contains("side-open");
  document.getElementById("side").inert = false;
  document.body.classList.add("side-open");
  renderSide();
  highlight();
  // Once the page column has narrowed, keep the box you clicked in sight.
  setTimeout(() => {
    scrollHints();
    document.querySelector("#view .active")?.scrollIntoView({block: "nearest", inline: "nearest", behavior: "smooth"});
  }, was ? 0 : 320);
}

function closeSide() {
  side = null;
  nodeId = null;
  document.getElementById("side").inert = true;
  document.body.classList.remove("side-open");
  highlight();
  setTimeout(scrollHints, 320);
}

function renderSide() {
  if (!side) return;
  const title = document.getElementById("sideTitle");
  const p = document.getElementById("panel");
  if (side.kind === "node") return renderNodePanel(side.id);
  if (side.kind === "props") return renderPropsPanel();
  if (side.kind === "option" || side.kind === "decide" || side.kind === "cell" || side.kind === "constraints") return renderDesignPanel();
  if (side.kind === "step") {
    const step = steps().find((s) => s.id === side.id);
    if (!step) return closeSide();
    title.textContent = `${unit(true)} ${steps().indexOf(step) + 1}: ${step.title}`;
    const turn = yourTurn(step);
    const parts = [];
    if (turn) parts.push(el("span", "turn", answered(step) ? t("sentWait") : t(turn, unit())));
    if (turn === "turnCommit") parts.push(commitBox(step));
    const teach = teachBackOn(plan) && ((step.status ?? "todo") !== "todo" || plan.mode === "explain");
    parts.push(talkBox({step: step.id}, {
      placeholder: t(plan.mode === "explain" ? "askStage" : "askStep"),
      quick: plan.mode === "explain" ? ["confused", "deeper"] : ["confused"],
      modes: teach && (turn === "turnRestate" || plan.mode === "explain") ? ["teachback", "question", "propose"] : ["question", "propose"],
      mode: turn === "turnRestate" ? "teachback" : "question",
      phase: step.status + (step.confirmed ? "+" : ""),
    }));
    p.replaceChildren(...parts);
  } else {
    title.textContent = t("wholePlan");
    const approve = (plan.mode ?? "build") === "build" && !plan.approved ? ["approve"] : [];
    const parts = approve.length ? [el("span", "turn", t("turnApprove"))] : [];
    parts.push(talkBox({}, {placeholder: t("askPlan"), quick: approve, modes: ["question", "propose"]}));
    p.replaceChildren(...parts);
  }
  refreshThreads();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function arrow() {
  const a = el("div", "arrow");
  a.innerHTML = '<svg viewBox="0 0 26 14" aria-hidden="true"><line x1="1" y1="7" x2="20" y2="7"/><path d="M17 2l6 5-6 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  return a;
}

// Glyphs are planview's own constants; plan text never goes into innerHTML.
function iconEl(n, id, family) {
  const ic = iconOf(n, id, family);
  if (!ic || !GLYPHS[ic.glyph]) return null;
  const f = FAMILIES[ic.family];
  const s = el("span", "icon" + (f ? " fam" : ""));
  if (f) {
    s.style.background = f.bg;
    s.style.color = f.fg;
    s.title = f.label;
  }
  s.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${GLYPHS[ic.glyph]}</svg>`;
  return s;
}

function nodeBox(id, family = null) {
  const n = plan.nodes[id];
  if (!n) return el("div", "node todo", `? ${id}`);
  // A design draws options that do not exist yet: neutral boxes unless a status is given.
  const status = NODE_STATUS[n.status] ? n.status : plan.mode === "explain" ? "done" : plan.mode === "design" ? "plain" : "todo";
  const d = el("div", "node " + status);
  d.dataset.id = id;
  d.tabIndex = 0;
  d.setAttribute("role", "button");
  const pr = propOf(n);
  if (pr) {
    d.classList.add("prop", "prop-" + pr.type);
    d.append(el("span", "pbadge", t("pb_" + pr.type)));
  }
  const head = el("div", "nhead");
  const ic = iconEl(n, id, family);
  if (ic) head.append(ic);
  const st = el("span", "st", (plan.mode === "explain" ? EXPLAIN_MARK : MARK)[status]);
  st.title = statusLabel(status);
  st.setAttribute("aria-label", statusLabel(status));
  head.append(el("div", "name", n.name), st);
  d.append(head);
  if (n.what) d.append(richEl("div", "what", n.what));
  if (pr?.note) d.append(richEl("div", "pnote", "→ " + (pr.note.length > 60 ? pr.note.slice(0, 58) + "…" : pr.note)));
  if (BASIS_KEYS.includes(n.basis)) {
    d.classList.add("basis-" + n.basis);
    const m = el("span", "bmark", t("b_" + n.basis));
    if (n.basis === "assumed") m.title = t("assumedTip");
    d.append(m);
  }
  d.onclick = () => selectNode(id);
  d.onkeydown = (e) => { if (e.key === "Enter") selectNode(id); };
  return d;
}

function renderFlow(v) {
  const wrap = el("div");
  for (const lane of v.lanes || []) {
    const box = el("div", "lane");
    if (lane.title) box.append(richEl("div", "lane-title", lane.title));
    const row = el("div", "row");
    (lane.nodes || []).forEach((id, i) => {
      if (i > 0 && lane.arrows !== false) row.append(arrow());
      else if (i > 0) row.append(el("div", "gap"));
      row.append(nodeBox(id));
    });
    const sc = el("div", "scroll");
    sc.append(row);
    box.append(sc);
    wrap.append(box);
  }
  return wrap;
}

let linkDrawer = null, linkObserver = null;

function drawLinks(container, specs) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.classList.add("links");
  container.append(svg);
  const box = (id) => container.querySelector(`[data-anchor="${CSS.escape(id)}"]`);
  linkDrawer = () => {
    const base = container.getBoundingClientRect();
    svg.setAttribute("width", container.scrollWidth);
    svg.setAttribute("height", container.scrollHeight);
    svg.replaceChildren();
    const step = curStep();
    const inStep = step ? new Set(step.nodes || []) : null;
    const fan = {}, fanIn = {};
    for (const l of specs) if (!l.down) {
      (fan[l.from] ||= []).push(l);
      (fanIn[l.to] ||= []).push(l);
    }
    const ns = container.querySelector(".ns")?.getBoundingClientRect();
    for (const l of specs) {
      const a = box(l.from)?.getBoundingClientRect(), b = box(l.to)?.getBoundingClientRect();
      if (!a || !b) continue;
      let d, head;
      if (l.down) {
        const x = a.left + a.width / 2 - base.left, y1 = a.bottom - base.top, y2 = b.top - base.top - 2;
        d = `M${x} ${y1} L${x} ${y2}`;
        head = `M${x - 4} ${y2 - 7} L${x} ${y2} L${x + 4} ${y2 - 7}`;
      } else {
        const out = fan[l.from], k = out.indexOf(l), into = fanIn[l.to], j = into.indexOf(l);
        const x2 = b.left - base.left - 4;
        const y1 = a.top + (Math.min(a.height, 120) * 0.8 * (k + 1)) / (out.length + 1) - base.top;
        const y2 = b.top + (Math.min(b.height, 90) * (j + 1)) / (into.length + 1) - base.top;
        // Leave the namespace on a straight line, so a link never runs along its border.
        const leave = ns && a.right <= ns.right && b.left >= ns.right ? ns.right - base.left + 14 : a.right - base.left;
        const x1 = a.right - base.left, dx = Math.max(20, (x2 - leave) / 2);
        d = `M${x1} ${y1} L${leave} ${y1} C${leave + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
        head = l.state === "blocked" ? `M${x2} ${y2 - 6} L${x2} ${y2 + 6}` : `M${x2 - 7} ${y2 - 4} L${x2} ${y2} L${x2 - 7} ${y2 + 4}`;
      }
      const dim = inStep && !(inStep.has(l.from) && (inStep.has(l.to) || l.to === "#namespace"));
      for (const [path, extra] of [[d, ""], [head, " head"]]) {
        const e = document.createElementNS(svg.namespaceURI, "path");
        e.setAttribute("d", path);
        e.setAttribute("class", `l-${l.state || "uses"}${extra}`);
        if (extra) e.style.strokeDasharray = "none";
        if (dim) e.style.opacity = ".15";
        svg.append(e);
      }
    }
  };
  linkObserver?.disconnect();
  linkObserver = new ResizeObserver(() => linkDrawer?.());
  linkObserver.observe(container);
}

function anchored(id, elx = nodeBox(id)) {
  elx.dataset.anchor = id;
  return elx;
}

function linkLegend(states, uses) {
  const lg = el("div", "linklegend");
  if (uses) lg.append(el("span", null, t("usesLegend")));
  lg.append(el("span", null, t("viaLegend")));
  const color = {ok: "var(--done-bd)", todo: "var(--new-bd)", blocked: "var(--warn-bd)"};
  for (const st of states) {
    const sp = el("span", null, (st === "ok" ? "━ " : "╍ ") + t("lk_" + st));
    sp.style.color = color[st];
    lg.append(sp);
  }
  return lg;
}

function renderK8s(v) {
  const scroll = el("div", "scroll");
  const states = [...new Set((v.links || []).map((l) => l.state || "ok"))];
  const uses = (v.outside || []).length || (v.workloads || []).some((w) => (w.uses || []).length);
  if (states.length || uses) scroll.append(linkLegend(states, uses));
  const grid = el("div", "k8s diagram");
  const outside = el("div", "col");
  (v.outside || []).forEach((id) => outside.append(anchored(id)));
  const ns = el("div", "ns");
  ns.dataset.anchor = "#namespace";
  ns.append(el("div", "ns-title", [v.namespace && `namespace ${v.namespace}`, v.cluster && `cluster ${v.cluster}`].filter(Boolean).join(" · ") || "namespace"));
  const nsGrid = el("div", "ns-grid");
  const configs = el("div", "col");
  (v.configs || []).forEach((id) => configs.append(anchored(id, nodeBox(id, "k8s"))));
  const policy = el("div", "policy" + (v.policy ? "" : " none"));
  if (v.policy) {
    const pl = el("span", "plabel");
    pl.append(iconEl(plan.nodes[v.policy] || {}, v.policy, "k8s") || "🛡", plan.nodes[v.policy]?.name || v.policy);
    pl.dataset.id = v.policy;
    pl.tabIndex = 0;
    pl.onclick = () => selectNode(v.policy);
    policy.append(pl);
  }
  for (const w of v.workloads || []) {
    const b = anchored(w.node, nodeBox(w.node, "k8s"));
    if (w.containers?.length) {
      const c = el("div", "containers");
      w.containers.forEach((name) => c.append(el("span", null, name)));
      b.append(c);
    }
    policy.append(b);
  }
  nsGrid.append(configs, policy);
  ns.append(nsGrid);
  const targets = el("div", "col");
  (v.targets || []).forEach((id) => targets.append(anchored(id)));
  grid.append(outside, ns, targets);
  scroll.append(grid);
  const specs = [];
  const out = v.outside || [];
  out.forEach((id, i) => specs.push(i < out.length - 1 ? {from: id, to: out[i + 1], down: true, state: "uses"} : {from: id, to: "#namespace", state: "uses"}));
  for (const w of v.workloads || []) for (const u of w.uses || []) specs.push({from: u, to: w.node, state: "uses"});
  for (const l of v.links || []) specs.push({...l, state: l.state || "ok"});
  // Labels (ports, notes) sit on the box the link reaches, not on the line.
  for (const l of v.links || []) {
    const b = l.label && grid.querySelector(`[data-anchor="${CSS.escape(l.to)}"]`);
    if (!b) continue;
    const row = b.querySelector(":scope > .vias") || b.appendChild(el("div", "vias"));
    const from = plan.nodes[l.from]?.name || l.from;
    // The same port from several workloads is one chip with a count.
    const same = [...row.children].find((c) => c.dataset.label === l.label && c.dataset.state === (l.state || "ok"));
    if (same) {
      same.dataset.n = (Number(same.dataset.n) || 1) + 1;
      same.textContent = `← ${l.label} ×${same.dataset.n}`;
      same.title += `\n${from} → ${plan.nodes[l.to]?.name || l.to}`;
      continue;
    }
    const chip = el("span", "via via-" + (LINK_STATE_KEYS.includes(l.state) ? l.state : "ok"), "← " + l.label);
    chip.dataset.label = l.label;
    chip.dataset.state = l.state || "ok";
    chip.title = `${from} → ${plan.nodes[l.to]?.name || l.to}`;
    row.append(chip);
  }
  drawLinks(grid, specs);
  const wrap = el("div");
  wrap.append(scroll);
  const listed = (v.links || []).filter((l) => l.label || (l.state && l.state !== "ok"));
  if (listed.length) {
    const ul = el("ul", "linklist");
    for (const l of listed) {
      const li = el("li");
      li.append(`${plan.nodes[l.from]?.name || l.from} → ${plan.nodes[l.to]?.name || l.to} · ${t("lk_" + (l.state || "ok"))}`);
      if (l.label) li.append(" · ", rich(l.label));
      ul.append(li);
    }
    wrap.append(ul);
  }
  return wrap;
}

function renderSequence(v) {
  const actors = v.actors || [];
  const cols = `repeat(${actors.length}, minmax(130px, 1fr))`;
  const scroll = el("div", "scroll");
  const seq = el("div", "seq");
  seq.style.minWidth = actors.length * 150 + "px";
  const head = el("div", "seq-head");
  head.style.gridTemplateColumns = cols;
  actors.forEach((id) => head.append(nodeBox(id)));
  seq.append(head);
  // Rows of bare lifelines keep the lines unbroken around a group's frame and label.
  const spacer = () => {
    const row = el("div", "seq-row spacer");
    row.style.gridTemplateColumns = cols;
    actors.forEach((_, c) => {
      const cell = el("div", "seq-cell");
      cell.style.gridColumn = String(c + 1);
      row.append(cell);
    });
    return row;
  };
  let group = null, groupName = null;
  (v.messages || []).forEach((m, i) => {
    if ((m.group || null) !== groupName) {
      groupName = m.group || null;
      group = null;
      if (groupName) {
        group = el("div", "seq-group");
        group.append(richEl("span", "glabel", groupName), spacer());
        seq.append(spacer(), group);
      }
    }
    const row = el("div", "seq-row");
    row.style.gridTemplateColumns = cols;
    actors.forEach((_, c) => {
      const cell = el("div", "seq-cell");
      cell.style.gridColumn = String(c + 1);
      row.append(cell);
    });
    const a = actors.indexOf(m.from), b = actors.indexOf(m.to);
    const msg = el("div", "seq-msg");
    if (m.step) msg.dataset.step = m.step;
    const lbl = el("div", "lbl");
    lbl.append(el("span", "num", String(i + 1)), richEl("span", "t", m.text || ""));
    if (a === b) {
      msg.classList.add("self");
      // On the last lifeline the note opens to the left, where there is room.
      if (a === actors.length - 1 && actors.length > 1) msg.classList.add("last");
      msg.style.gridColumn = String(a + 1);
      msg.append(lbl);
    } else {
      const lo = Math.min(a, b), span = Math.abs(a - b) + 1;
      msg.classList.add(a < b ? "right" : "left");
      if (m.reply) msg.classList.add("reply");
      msg.style.gridColumn = `${lo + 1} / span ${span}`;
      msg.style.margin = `0 calc(50% / ${span})`;
      msg.append(lbl, el("div", "line"));
    }
    const target = m.node || m.to;
    msg.title = t("seeBox", plan.nodes[target]?.name || target);
    msg.onclick = () => selectNode(target);
    row.append(msg);
    (group || seq).append(row);
  });
  scroll.append(seq);
  return scroll;
}

function renderTransform(v) {
  const wrap = el("div", "tf");
  (v.stages || []).forEach((st, i) => {
    if (i > 0) wrap.append(arrow());
    const n = plan.nodes[st.node] || {name: st.node};
    const card = el("div", "stage");
    if (st.columns) card.style.flexBasis = Math.max(230, st.columns.length * 120) + "px";
    card.dataset.id = st.node;
    card.tabIndex = 0;
    card.onclick = () => selectNode(st.node);
    const head = el("div", "shead");
    const ic = iconEl(n, st.node);
    if (ic) head.append(ic);
    head.append(el("span", "sname " + (NODE_STATUS[n.status] ? n.status : "todo"), n.name));
    if (st.label) head.append(el("span", "slabel", st.label));
    card.append(head);
    if (st.columns) {
      const table = el("table"), tr = el("tr");
      st.columns.forEach((c) => tr.append(el("th", null, c)));
      table.append(tr);
      if (!(st.rows || []).length) {
        const row = el("tr"), td = el("td", "empty", t("noRows"));
        td.colSpan = st.columns.length;
        row.append(td);
        table.append(row);
      }
      for (const r of st.rows || []) {
        const row = el("tr");
        r.forEach((c) => row.append(el("td", null, c == null || c === "" ? "∅" : String(c).replace(/^ +| +$/g, (sp) => "␠".repeat(sp.length)))));
        table.append(row);
      }
      const tbl = el("div", "tbl");
      tbl.append(table);
      card.append(tbl);
    }
    if (st.text) card.append(el("pre", null, st.text));
    if (st.notes?.length) {
      const ul = el("ul", "snote");
      st.notes.forEach((t) => ul.append(richEl("li", null, t)));
      card.append(ul);
    }
    wrap.append(card);
  });
  return wrap;
}

const VIEWS = {
  flow: {render: renderFlow},
  k8s: {render: renderK8s, after: () => requestAnimationFrame(() => linkDrawer?.())},
  sequence: {render: renderSequence},
  transform: {render: renderTransform},
};

// "Wider than the screen" hints, checked again whenever the side panel changes the width.
function scrollHints() {
  for (const sc of document.querySelectorAll("#view .scroll")) {
    sc.querySelector(":scope > .scrollhint")?.remove();
    if (sc.scrollWidth > sc.clientWidth + 4) sc.prepend(el("div", "scrollhint", t("wider")));
  }
}

function renderView() {
  if (isDesign() && !viewId) viewId = curOption()?.view;
  const v = plan.views.find((x) => x.id === viewId) || plan.views[0];
  const tabs = document.getElementById("tabs");
  if (isDesign()) {
    const pct = totals();
    const byView = new Set(options().map((o) => o.view));
    tabs.replaceChildren(...options().map((o) => {

function renderSteps() {

  const all = el("button", "chip all" + (stepId ? "" : " sel"), t("all"));

  const chips = steps().map((s, i) => {
    const turn = yourTurn(s);
    const cls = plan.mode === "explain" && !s.status ? "plain" : turn ? "review" : s.confirmed ? "done" : STEP_STATUS[s.status] || "todo";
    const mark = turn ? "👉 " : s.status === "done" || s.confirmed ? "✓ " : "";

const EDITOR_URL = {

function fileLine(file, resolved) {

function codeBox(id) {
  const box = el("details", "code");
  box.open = true;
  box.append(el("summary", null, t("codeHere")), el("div", "meta", t("loading")));
  fetch(`/api/source?node=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`)
    .then((r) => r.json())
    .then((r) => {
      if (r.error) return box.lastChild.replaceWith(el("div", "meta err", `${t("codeFail")}: ${r.error}`));
      // Only the lines that make the point: "highlight", else a single referenced line; a range alone is just context.
      const node = plan.nodes[id] || {};
      const hl = highlightOf(node.highlight) || {lines: r.focus && r.focus === r.end ? new Set([r.focus]) : new Set(), notes: new Map()};
      const marked = hl.lines;
      const ol = el("ol");
      const indent = Math.min(...r.lines.filter((l) => l.trim()).map((l) => l.match(/^[ \t]*/)[0].length));
      r.lines = r.lines.map((l) => l.slice(Number.isFinite(indent) ? indent : 0));
      r.lines.forEach((t, i) => {
        const n = r.from + i;
        const li = el("li", marked.has(n) ? "focus" : null, t);
        li.dataset.n = n;
        ol.append(li);
        // A highlighted line can say why it matters, right under it.
        if (hl.notes.has(n)) ol.append(el("li", "lnote", "↑ " + hl.notes.get(n)));
      });
      const scroll = el("div", "cscroll" + (codeWrap() ? " wrap" : ""));
      scroll.append(ol);
      const wrapBtn = el("button", "wrapbtn", t("wrapCode"));
      wrapBtn.setAttribute("aria-pressed", String(codeWrap()));
      wrapBtn.onclick = (e) => {
        e.preventDefault();
        const on = !scroll.classList.contains("wrap");
        store.set("planview.wrap", on ? "on" : "off");
        scroll.classList.toggle("wrap", on);
        wrapBtn.setAttribute("aria-pressed", String(on));
        fade();
      };
      box.querySelector("summary").append(wrapBtn);
      new ResizeObserver(() => scroll.style.setProperty("--cw", scroll.clientWidth + "px")).observe(scroll);
      const fade = () => scroll.classList.toggle("more", scroll.scrollLeft + scroll.clientWidth < scroll.scrollWidth - 4);
      scroll.addEventListener("scroll", fade, {passive: true});
      box.lastChild.replaceWith(scroll);
      requestAnimationFrame(fade);
      if (nodeId === id && plan.nodes[id]?.file) document.querySelector("#panel .fileline")?.replaceWith(fileLine(plan.nodes[id].file, r.path));
    })
    .catch(() => box.lastChild.replaceWith(el("div", "meta err", t("codeFail"))));
  return box;
}

// Redraws replace the chat boxes; put the cursor back where the user was typing.
function keepFocus(fn) {
  const a = document.activeElement;
  const key = a?.tagName === "TEXTAREA" ? a.dataset.key : null;
  const sel = key && [a.selectionStart, a.selectionEnd];
  fn();
  const t = key && document.querySelector(`textarea[data-key="${CSS.escape(key)}"]`);
  if (t) {
    t.focus({preventScroll: true});
    t.setSelectionRange(...sel);
  }

const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
// What the agent changed since the user last acknowledged; outlines stay until then.
const changes = {nodes: new Set(), steps: new Set(), notes: []};

// Progress (statuses, restated, suggested commits) is not a change of plan.
const content = (x, skip) => x && Object.fromEntries(Object.entries(x).filter(([k]) => !skip.includes(k)));
function noteChanges(prev) {
  for (const id of Object.keys(plan.nodes)) if (!same(content(prev.nodes?.[id], ["status"]), content(plan.nodes[id], ["status"]))) changes.nodes.add(id);
  for (const st of steps()) if (!same(content((prev.steps || []).find((x) => x.id === st.id), ["status", "confirmed", "commitMessage", "commits"]), content(st, ["status", "confirmed", "commitMessage", "commits"]))) changes.steps.add(st.id);
  const views = new Set((prev.views || []).map((v) => v.id));
  for (const v of plan.views) if (!views.has(v.id)) changes.notes.push(t("newView") + (v.title || v.id));
  if (!prev.approved && plan.approved) changes.notes.push(t("planApproved"));
  if (!same(prev.glossary, plan.glossary)) changes.notes.push(t("glossaryChanged"));
  if (prev.title !== plan.title || prev.goal !== plan.goal) changes.notes.push(t("titleChanged"));
  changes.notes = [...new Set(changes.notes)];
}

function markChanges() {
  document.querySelectorAll(".changed").forEach((e) => e.classList.remove("changed"));
  for (const id of changes.nodes) document.querySelectorAll(`#view [data-id="${CSS.escape(id)}"]`).forEach((e) => e.classList.add("changed"));
  for (const id of changes.steps) document.querySelector(`.chip[data-step="${CSS.escape(id)}"]`)?.classList.add("changed");
}

function showChangeList() {
  const box = document.getElementById("toast");
  const ul = el("ul");
  for (const id of changes.steps) {
    const st = steps().find((x) => x.id === id);
    if (st) ul.append(el("li", null, t("chStep") + st.title));
  }
  for (const id of changes.nodes) if (plan.nodes[id]) ul.append(el("li", null, t("chBox") + plan.nodes[id].name));
  for (const n of changes.notes) ul.append(el("li", null, n));
  box.style.left = box.style.top = box.style.right = "";
  const ok = el("button", "primary", t("seen"));
  ok.onclick = () => {
    changes.nodes.clear();
    changes.steps.clear();
    changes.notes = [];
    box.hidden = true;
    markChanges();
    renderBar();
  };
  box.replaceChildren(el("b", null, t("changedTitle")), ul, ok);
  box.onclick = (e) => e.stopPropagation();
  box.hidden = false;
}
document.addEventListener("click", () => (document.getElementById("toast").hidden = true));

function draw(p) {
  const prev = plan;
  plan = p;
  plan.nodes ||= {};
  plan.views = viewsOf(plan);
  setLang(langOf(plan));
  const mine = ((plan.mode ?? "build") === "build" && !plan.approved) || steps().some((s) => yourTurn(s));
  document.title = (mine ? "👉 " : "") + (plan.title ? `${plan.title} · planview` : "planview");
  document.getElementById("title").textContent = plan.title || "planview";
  setGlossary(plan.glossary);
  renderLegend();
  renderProposals();
  renderConstraints();
  document.getElementById("goal").replaceChildren(rich(plan.goal || ""));
  const problems = validate(plan);
  const box = document.getElementById("problems");
  box.hidden = !problems.length;
  if (problems.length) {
    const ul = el("ul");
    problems.forEach((x) => ul.append(el("li", null, x)));
    box.replaceChildren(el("b", null, t("problems")), ul);
  }
  if (stepId && !curStep()) stepId = null;
  renderSteps();
  renderStepCard();
  if (plan.views.length) renderView();
  renderCompare();
  renderSources();
  refreshThreads();
  if (!rendered) {
    rendered = true;
    if (served && !store.get("planview.tour")) setTimeout(startTour, 700);
    // Links may open a given step, picture or box: ?step=…&view=…&node=…
    if (plan.views.some((v) => v.id === params.get("view"))) {
      viewId = params.get("view");
      renderView();
    }
    const cur = params.get("step") === "all" ? null : steps().find((s) => s.id === params.get("step")) || steps().find((s) => s.id === plan.start) || steps().find((s) => s.status === "review") || steps().find((s) => s.status === "doing");
    if (cur) selectStep(cur.id);
    if (params.get("view") && plan.views.some((v) => v.id === params.get("view")) && viewId !== params.get("view")) {
      viewId = params.get("view");
      renderView();
    }
    if (Object.hasOwn(plan.nodes, params.get("node") || "")) selectNode(params.get("node"), false);
  } else if (side) {
    renderSide();
  }
  if (prev && !same(prev, p)) noteChanges(prev);
  // Follow the agent: when the step you were watching is finished, show the one it moved on to.
  const was = prev && activeStep(prev), now = activeStep(plan);
  if (was && now && stepId === was.id && now.id !== was.id) selectStep(now.id);
  markChanges();
  renderBar();
}

async function fetchPlan() {
  const r = await fetch("/api/plan?token=" + encodeURIComponent(token));
  const box = document.getElementById("problems");
  if (!r.ok) {
    box.hidden = false;
    box.textContent = t("loadFail", r.status) + (await r.text());
    return;
  }
  try {
    render(JSON.parse(await r.text()));
  } catch (e) {

  }
}

async function load() {
  if (!served) {
    document.getElementById("banner").hidden = false;
    return;
  }
  try {
    commonGlossary = await (await fetch("/glossary.json?token=" + encodeURIComponent(token))).json();
  } catch {}
  await fetchPlan();
  const events = new EventSource("/api/events?token=" + encodeURIComponent(token));
  events.onopen = async () => {
    await fetchPlan();
    const r = await fetch("/api/thread?token=" + encodeURIComponent(token));
    if (r.ok) ({items: thread, waiting} = await r.json());
    if (!loadedThread) thread.forEach((m) => m.from === "agent" && seen.add(m.id));
    loadedThread = true;
    thread.sort((a, b) => a.at.localeCompare(b.at));
    setConn(true);
    refreshThreads();
  };
  events.onerror = () => setConn(false);
  events.addEventListener("plan", fetchPlan);
  const on = (name, fn) => events.addEventListener(name, (e) => { fn(JSON.parse(e.data)); refreshThreads(); });
  // Turn bars say "sent, waiting" as soon as you answer, and drop that once the agent replies.
  const turns = () => keepFocus(() => {
    renderStepCard();
    if (side?.kind === "step") renderSide();
  });
  on("feedback", (m) => {
    thread.push({...m, from: "user", delivered: false});
    freshReply = m.id;
    if (m.step) turns();
  });
  on("reply", (m) => {
    thread.push(m);
    freshReply = m.id;
    if (m.step) turns();
  });
  on("delivered", ({ids}) => thread.forEach((m) => { if (ids.includes(m.id)) m.delivered = true; }));
  on("agent", (a) => (waiting = a.waiting));
}

// A three-stop tour the first time someone opens planview in this browser; "?" shows it again.
const store = {

  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
function startTour() {
  const x = plan?.mode === "explain" ? "x" : "";
  const stops = (isDesign() ? [["#view", "tour1d"], ["#tabs", "tour2d"], ["#compare .cmp", "tour3d"]] : [["#view", "tour1" + x], ["#stepbar", "tour2" + x], ["#view [data-id]", "tour3"]])
    .filter(([sel]) => document.querySelector(sel));
  if (!stops.length) return;
  const tour = document.getElementById("tour");
  let i = 0;
  const end = () => {
    tour.hidden = true;
    scrollTo({top: 0, behavior: "smooth"});
    store.set("planview.tour", "seen");
    removeEventListener("resize", place);
  };
  function place() {
    const [sel, key] = stops[i];
    const target = document.querySelector(sel);
    const r = target.getBoundingClientRect();
    const pad = 6, spot = tour.querySelector(".spot"), card = tour.querySelector(".tcard");
    const top = Math.max(8, r.top - pad), height = Math.min(r.height + pad * 2, innerHeight - top - 8);
    Object.assign(spot.style, {left: r.left - pad + "px", top: top + "px", width: r.width + pad * 2 + "px", height: height + "px"});
    document.getElementById("tourText").textContent = t(key);
    document.getElementById("tourStep").textContent = t("tourStep", i + 1, stops.length);
    document.getElementById("tourNext").textContent = t(i === stops.length - 1 ? "tourDone" : "tourNext");
    document.getElementById("tourSkip").textContent = t("tourSkip");
    document.getElementById("tourSkip").hidden = i === stops.length - 1;
    const below = top + height + 12, h = card.offsetHeight || 140;
    card.style.top = (below + h < innerHeight ? below : Math.max(8, top - h - 12)) + "px";
    card.style.left = Math.max(16, Math.min(r.left, innerWidth - card.offsetWidth - 16)) + "px";
  }
  const show = () => {
    document.querySelector(stops[i][0]).scrollIntoView({block: "nearest"});
    requestAnimationFrame(place);
  };
  document.getElementById("tourNext").onclick = () => (++i < stops.length ? show() : end());
  document.getElementById("tourSkip").onclick = end;
  tour.hidden = false;
  addEventListener("resize", place);
  show();
}

  box.style.right = "auto";
  box.onclick = (ev) => ev.stopPropagation();
  box.hidden = false;
};

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement?.tagName || "") || !document.getElementById("tour").hidden) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    stop();
    step(e.key === "ArrowLeft" ? -1 : 1);
  }
});

const legendBox = document.getElementById("legendbox");
legendBox.open = store.get("planview.legend") === "open";
legendBox.ontoggle = () => store.set("planview.legend", legendBox.open ? "open" : "closed");
renderBadges();
load();
</script>
</body>
</html>
