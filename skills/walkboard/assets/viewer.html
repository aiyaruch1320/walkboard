function renderDesignPanel() {
  const title = document.getElementById("sideTitle");
  const p = document.getElementById("panel");
  const opt = options().find((o) => o.id === (side.option || side.id));
  const parts = [];
  if (side.kind === "constraints") {
    title.textContent = t("consTitle");
    // What waits for the user first; the confirmed ones folded below.
    const list = el("div", "proplist");
    const all = (plan.constraints || []).filter((x) => x?.id), done = all.filter((c) => c.confirmed);
    for (const c of all.filter((x) => !x.confirmed)) {
      const row = el("div", "propcard");
      row.append(...guessText(c.ask, c.text, c.detail), ...answerGuess({}, c.ask || c.text, {constraint: c.id}));
      list.append(row);
    }
    if (done.length) {
      const fold = el("details", "consdone");
      fold.open = done.length === all.length;
      fold.append(el("summary", null, t("consDoneFold", done.length)));
      for (const c of done) {
        const row = el("div", "propcard");
        row.append(richEl("p", null, "✓ " + c.text));
        if (c.detail) row.append(richEl("p", "gdetail", c.detail));
        fold.append(row);
      }
      list.append(fold);
    }
    parts.push(list, talkBox({}, {placeholder: t("askPlan")}));
  } else if (side.kind === "cell") {
    const c = criteria().find((x) => x.id === side.criterion);
    if (!opt || !c) return closeSide();
    title.textContent = `${c.label} · ${opt.title}`;
    const x = cell(opt.id, c.id);
    const big = el("div", "cellbig");
    big.append(ratingEl(x?.rating));
    parts.push(big);
    if (x?.note) parts.push(richEl("p", "why", x.note));
    const srcs = (x?.sources || []).map((s) => (plan.sources || []).find((y) => y?.id === s)).filter(Boolean);
    if (srcs.length) {
      const ul = el("ul", "linklist");
      for (const src of srcs) {
        const li = el("li");
        li.append(sourceLink(src));
        if (src.checked) li.append(" ", el("small", null, t("checkedOn", src.checked)));
        ul.append(li);
      }
      parts.push(ul);
    }
    parts.push(talkBox({option: opt.id, criterion: c.id}, {placeholder: t("cellAsk", c.label, opt.title)}));
  } else if (side.kind === "decide") {
    const pv = side.view && plan.views.find((x) => x.id === side.view);
    const name = pv ? pv.title || pv.id : opt?.title;
    if (!name) return closeSide();
    title.textContent = t("decideTitle", name);
    const n = unconfirmed();
    if (n) {
      const warn = el("div", "warnbox", "⚠ " + t("decideWarn", n));
      const items = [...(plan.constraints || []).filter((c) => c?.id && !c.confirmed).map((c) => [c.ask || c.text, {}, {constraint: c.id}]),
        ...Object.entries(plan.nodes || {}).filter(([, x]) => x?.basis === "assumed").map(([id, x]) => [x.ask || x.name || id, {node: id}, {}])];
      const ul = el("ul", "unconf");
      for (const [text, c, extra] of items) {
        const li = el("li");
        li.append(richEl("span", null, "❓ " + text), ...answerGuess(c, text, extra));
        ul.append(li);
      }
      warn.append(ul);
      parts.push(warn);
    }
    const ta = el("textarea");
    ta.placeholder = t("decideReason");
    ta.dataset.key = "decide:" + (opt?.id || side.view);
    ta.value = drafts[ta.dataset.key] || "";
    ta.oninput = () => (drafts[ta.dataset.key] = ta.value);
    const go = el("button", "primary", t("decideSend"));
    go.onclick = async () => {
      go.disabled = true;
      const weights = Object.fromEntries(criteria().map((c) => [c.id, c.weight ?? 1]));
      await send({}, "decide", ta.value.trim() || t("q_decide", name), {...(pv ? {view: pv.id} : {option: opt.id}), weights}).catch(() => (go.disabled = false));
    };
    const talk = el("div", "talk decideform");
    talk.append(ta, go);
    const thr = el("div", "thread");
    thr.dataset.ctx = "{}";
    parts.push(thr, talk);
  } else {
    if (!opt) return closeSide();
    title.textContent = opt.title;
    parts.push(talkBox({option: opt.id}, {placeholder: t("askOption", opt.title)}));
  }
  fillPanel(p, parts);
  refreshThreads();
}

const ANSWER_ICON = '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.8 2.7a1.6 1.6 0 0 1 2.3 2.3L6 12.1l-3 .8.8-3z"/></svg>';
const SEND_ICON = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.8 7.2 8 3l4.2 4.2"/></svg>';

// A guess (an unconfirmed constraint or box) is answered in the user's own words: a yes or no does not answer
// "how many services run there?", and "right" is a word too. The box stays folded behind one small button, so a list of
// guesses reads as a list; an open box stays open across redraws while its draft exists.
function answerGuess(c, text, extra) {
  if (snapshot) return [];
  const key = "guess:" + JSON.stringify([c, extra]);
  const open = el("button", "gopen");
  open.type = "button";
  open.innerHTML = ANSWER_ICON;
  open.append(el("span", null, t("guessOpen")));
  const field = el("div", "gfield");
  const ta = el("textarea");
  ta.rows = 1;
  ta.placeholder = t("guessAnswer");
  ta.dataset.key = key;
  ta.value = drafts[key] || "";
  const go = el("button", "gsend");
  go.type = "button";
  go.innerHTML = SEND_ICON;
  go.title = t("send");
  go.setAttribute("aria-label", go.title);
  field.append(ta, go);
  const show = (on) => {
    field.hidden = !on;
    open.hidden = on;
    if (!on) delete drafts[key];
  };
  const sync = () => (go.disabled = !ta.value.trim());
  show(drafts[key] != null);
  sync();
  open.onclick = () => {
    drafts[key] ??= "";
    show(true);
    ta.focus();
  };
  ta.oninput = () => {
    drafts[key] = ta.value;
    sync();
  };
  // Leaving it empty folds it again.
  ta.onblur = () => setTimeout(() => !ta.value.trim() && document.activeElement !== go && show(false), 120);
  const answer = async () => {
    const a = ta.value.trim();
    if (!a || ta.disabled) return;
    ta.disabled = go.disabled = true;
    await send(c, "confirm", t("q_answer", text, a), {...extra, answer: a}).then(
      () => {
        ta.value = "";
        ta.disabled = false;
        show(false);
      },
      () => (ta.disabled = go.disabled = false),
    );
  };
  go.onclick = answer;
  ta.onkeydown = (e) => {
    if (e.key === "Escape" && !ta.value.trim()) {
      e.stopPropagation();
      show(false);
      open.focus();
    } else if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      answer();
    }
  };
  const box = el("div", "guess");
  box.append(open, field);
  return [box];
}

// What a guess asks, then what was assumed: "How many services run there?" reads better than the box's name.
function guessText(ask, text, detail) {
  const parts = [];
  if (ask) parts.push(richEl("p", "gask", "❓ " + ask), richEl("p", "gwas", `${t("assumedIs")} ${text}`));
  else parts.push(richEl("p", "gask", "❓ " + text));
  if (detail) parts.push(richEl("p", "gdetail", detail));
  return parts;
}

let side = null;

const sideKey = (c) => JSON.stringify([c.kind, c.id ?? null, c.option ?? null, c.criterion ?? null, c.view ?? null]);

// A box taken out of the plan is still known by the name its messages carry.
const inPlan = (id) => Object.hasOwn(plan.nodes, id);
const boxName = (id) => plan.nodes[id]?.name || thread.findLast((m) => m.node === id && m.nodeName)?.nodeName || id;

function sideTitle(c) {
  const opt = options().find((o) => o.id === (c.option || c.id));
  if (c.view) return plan.views.find((x) => x.id === c.view)?.title || c.view;
  if (c.kind === "node") return boxName(c.id);
  if (c.kind === "step") {
    const st = steps().find((s) => s.id === c.id);
    return st ? `${unit(true)} ${steps().indexOf(st) + 1}: ${st.title}` : c.id;
  }
  if (c.kind === "cell") return `${criteria().find((x) => x.id === c.criterion)?.label || c.criterion} · ${opt?.title || c.option}`;
  if (c.kind === "option" || c.kind === "decide") return opt?.title || c.id;
  return t({props: "propsTitle", constraints: "consTitle"}[c.kind] || "wholePlan");
}

// The panel that holds a message's conversation.
const sideOf = (m) => (m.node ? {kind: "node", id: m.node} : m.step ? {kind: "step", id: m.step} : m.option ? (m.criterion ? {kind: "cell", option: m.option, criterion: m.criterion} : {kind: "option", id: m.option}) : {kind: "plan"});

// The panel coming or going, in one View Transition: the panel slides in from the right edge while the page's column
// narrows as a picture of itself, so nothing is laid out again on every frame (which is what made it stutter).
// A narrow window keeps its sheet from the bottom.
function sideMotion(update) {
  const can = document.startViewTransition && innerWidth >= 820 && !snapshot && document.visibilityState === "visible" && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!can) return update();
  const root = document.documentElement;
  root.classList.add("wb-vt");
  document.startViewTransition(update).finished.catch(() => {}).finally(() => root.classList.remove("wb-vt"));
}
function openSide(ctx) {
  side = ctx;
  if (ctx.kind !== "node") nodeId = null;
  else nodeId = ctx.id;
  const was = document.body.classList.contains("side-open");
  // The panel narrows the page column. The picture keeps the width it was laid out at (it scrolls sideways instead of
  // wrapping its zones into another order), and the box that was clicked stays where it was on screen.
  const clicked = ctx.kind === "node" ? document.querySelector(`#view [data-anchor="${CSS.escape(ctx.id)}"]`) : null, top0 = clicked?.getBoundingClientRect().top;
  if (!was) {
    const pic = document.querySelector("#view > .scroll > .diagram");
    if (pic) document.getElementById("view").style.setProperty("--held-w", pic.offsetWidth + "px");
  }
  const show = () => {
    document.getElementById("side").inert = false;
    document.body.classList.add("side-open");
    renderSide();
    highlight();
  };
  if (was) show();
  else sideMotion(show);
  // Open on the latest message, as a chat does.
  requestAnimationFrame(() => document.querySelectorAll("#side .thread").forEach((x) => (x.scrollTop = x.scrollHeight)));
  // Once the page column has narrowed, keep the box you clicked in sight.
  setTimeout(() => {
    scrollHints();
    if (clicked?.isConnected && top0 != null) scrollBy({top: clicked.getBoundingClientRect().top - top0, behavior: "instant"});
    document.querySelector("#view .active")?.scrollIntoView({block: "nearest", inline: "nearest", behavior: "smooth"});
  }, was ? 0 : 320);
}
// A window of another size lays the picture out again, as without the panel.
addEventListener("resize", () => document.getElementById("view")?.style.removeProperty("--held-w"));

function closeSide() {
  // The box that was open stays where it is on screen while the column widens back: the picture keeps its width until
  // the panel is gone (else it is laid out narrow for a moment and the page jumps).
  const open = document.querySelector("#view .active"), top0 = open?.getBoundingClientRect().top;
  side = null;
  nodeId = null;
  sideMotion(() => {
    document.getElementById("side").inert = true;
    document.body.classList.remove("side-open");
    highlight();
  });
  clearTimeout(closeSide.timer);
  closeSide.timer = setTimeout(() => {
    if (!document.body.classList.contains("side-open")) document.getElementById("view").style.removeProperty("--held-w");
    if (open?.isConnected && top0 != null) scrollBy({top: open.getBoundingClientRect().top - top0, behavior: "instant"});
    scrollHints();
  }, 320);
}

// A panel with a conversation keeps the box's explanation at the top and the chat under it, each scrolling on its own,
// so a long conversation never pushes the explanation away.
// Narrow, details and chat each fold away under their heading (either or both; remembered), and a folded part says so.
// Wide, the two sit side by side and one can fold into a thin rail, the other taking the room. Each layout remembers its own.
const folded = {info: store.get("walkboard.fold.info") === "1", chat: store.get("walkboard.fold.chat") === "1"};
const foldedWide = {info: store.get("walkboard.foldw.info") === "1", chat: store.get("walkboard.foldw.chat") === "1"};
const isWide = () => document.body.classList.contains("side-wide");
function showFolds(p) {
  if (!p?.classList.contains("split")) return;
  const f = isWide() ? foldedWide : folded;
  for (const which of ["info", "chat"]) {
    p.classList.toggle("fold-" + which, f[which]);
    p.querySelector(`.fold[data-fold="${which}"]`)?.setAttribute("aria-expanded", String(!f[which]));
  }
}
// Fold or unfold smoothly: measure every part before and after, then slide each from one height to the other.
// What is closing stays drawn (and fades) until it is gone; what opens grows from nothing.
function morph(p, change) {
  const pa = p.querySelector(".pa"), pb = p.querySelector(".pb"), info = pa?.querySelector(".pinfo"), th = pb?.querySelector(".thread");
  const parts = [pa, pb, info, th].filter(Boolean);
  const box = (e) => {
    const cs = getComputedStyle(e);
    return {height: e.getBoundingClientRect().height, shown: cs.display !== "none", pt: cs.paddingTop, pb: cs.paddingBottom, mb: cs.marginBottom};
  };
  // Measured first, so a click in the middle of a slide starts from where things are now.
  const before = parts.map(box);
  parts.forEach((e) => e.getAnimations().forEach((a) => a.cancel()));
  p.classList.remove("morph");
  [info, th].forEach((e) => e?.classList.remove("closing"));
  change();
  const after = parts.map(box);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || innerWidth < 820) return;
  const closing = [info, th].filter((e) => e && before[parts.indexOf(e)].shown && !after[parts.indexOf(e)].shown);
  closing.forEach((e) => e.classList.add("closing"));
  p.classList.add("morph");
  // Hold the last frame until the classes are back, so the end never flashes.
  const opts = {duration: 300, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards"};
  const runs = parts.map((e, i) => {
    const a = before[i], b = after[i];
    if (e === pa || e === pb) return e.animate([{height: a.height + "px"}, {height: b.height + "px"}], opts);
    const open = {height: (b.shown ? b : a).height + "px", opacity: 1, paddingTop: (b.shown ? b : a).pt, paddingBottom: (b.shown ? b : a).pb, marginBottom: (b.shown ? b : a).mb};
    const shut = {height: "0px", opacity: 0, paddingTop: "0px", paddingBottom: "0px", marginBottom: "0px"};
    if (a.shown && !b.shown) return e.animate([{...open, height: a.height + "px"}, shut], opts);
    if (!a.shown && b.shown) return e.animate([shut, open], opts);
    return e.animate([{height: a.height + "px"}, {height: b.height + "px"}], opts);
  });
  Promise.all(runs.map((r) => r.finished)).then(() => {
    p.classList.remove("morph");
    closing.forEach((e) => e.classList.remove("closing"));
    runs.forEach((r) => r.cancel());
  }, () => {});
}

function fillPanel(p, parts) {
  p.classList.remove("fold-info", "fold-chat", "split");
  const i = parts.findIndex((x) => x?.classList?.contains("talk") && !x.classList.contains("decideform"));
  // What waits for the user (your turn, the commit) sits with the chat, by the buttons that answer it.
  const act = (x) => x?.classList?.contains("turn") || x?.classList?.contains("commitbox") || x?.classList?.contains("nextbox");
  const explain = parts.slice(0, Math.max(i, 0)).filter((x) => !act(x));
  if (i < 0 || !explain.length) return p.replaceChildren(...parts);
  const info = el("div", "pinfo");
  info.append(...explain);
  const head = (which, label) => {
    const b = el("button", "fold");
    b.dataset.fold = which;
    b.append(el("span", "chev", "▾"), el("span", "lbl", label));
    b.append(el("span", "fhint", t("foldedHint")));
    b.onclick = () => {
      if (isWide()) {
        foldedWide[which] = !foldedWide[which];
        // Side by side, one part always stays open: folding it while the other is folded swaps them.
        const other = which === "info" ? "chat" : "info";
        if (foldedWide[which]) foldedWide[other] = false;
        store.set("walkboard.foldw.info", foldedWide.info ? "1" : "");
        store.set("walkboard.foldw.chat", foldedWide.chat ? "1" : "");
        return showFolds(p);
      }
      folded[which] = !folded[which];
      store.set("walkboard.fold." + which, folded[which] ? "1" : "");
      b.setAttribute("aria-expanded", String(!folded[which]));
      morph(p, () => p.classList.toggle("fold-" + which, folded[which]));
    };
    return b;
  };
  const a = el("div", "pcol pa"), b = el("div", "pcol pb");
  a.append(head("info", t("foldInfo")), info);
  b.append(head("chat", t("foldChat")), ...parts.slice(0, i).filter(act), ...parts.slice(i));
  p.classList.add("split");
  p.replaceChildren(a, b);
  showFolds(p);
  // Fade the bottom edge while there is more explanation to scroll to.
  const more = () => info.classList.toggle("more", info.scrollTop + info.clientHeight < info.scrollHeight - 4);
  info.onscroll = more;
  new ResizeObserver(more).observe(info);
}

function renderSide() {
  if (!side) return;
  const title = document.getElementById("sideTitle");
  const p = document.getElementById("panel");
  if (side.kind === "node") return renderNodePanel(side.id);
  if (side.kind === "props") return renderPropsPanel();
  if (side.kind === "draft") return renderDraftPanel();
  if (side.kind === "option" || side.kind === "decide" || side.kind === "cell" || side.kind === "constraints") return renderDesignPanel();
  if (side.kind === "step") {
    const step = steps().find((s) => s.id === side.id);
    if (!step) return closeSide();
    title.textContent = `${unit(true)} ${steps().indexOf(step) + 1}: ${step.title}`;
    const turn = yourTurn(step);
    const parts = [];
    if (turn) parts.push(el("span", "turn", answered(step) ? t("sentWait") : t(turn, unit())));
    if (turn === "turnNext" && !answered(step) && connected) parts.push(nextButtons(step, "inpanel"));
    if (turn === "turnCommit" && !answered(step)) {
      const box = commitBox(step);
      parts.push(box);
      // The suggested commits arrive with the step's end: bring them into view once.
      if (commitShown !== step.id) requestAnimationFrame(() => box.scrollIntoView({block: "nearest", behavior: "smooth"}));
      commitShown = step.id;
    }
    parts.push(talkBox({step: step.id}, {
      placeholder: t(plan.mode === "explain" ? "askStage" : "askStep"),
      quick: plan.mode === "explain" ? ["confused", "deeper"] : [],
    }));
    fillPanel(p, parts);
  } else {
    title.textContent = t("wholePlan");
    const approve = (plan.mode ?? "build") === "build" && !plan.approved && !approvePending() && steps().length ? ["approve"] : [];
    const parts = approve.length ? [el("span", "turn", t("turnApprove"))] : [];
    parts.push(talkBox({}, {placeholder: t("askPlan"), quick: approve}));
    fillPanel(p, parts);
  }
  refreshThreads();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function arrow() {
  const a = el("div", "arrow");
  a.innerHTML = '<svg viewBox="0 0 26 14" aria-hidden="true"><line x1="1" y1="7" x2="20" y2="7"/><path d="M17 2l6 5-6 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  return a;
}

// Glyphs are walkboard's own constants; plan text never goes into innerHTML.
function iconEl(n, id, family) {
  // A box or zone of a kind (lib/profiles.mjs) takes that kind's icon unless it picked one.
  const k = PROF.kindOf(n?.kind);
  const ic = iconOf(k && !n.icon ? {...n, icon: k.def.icon} : n, id, family);
  if (!ic || !GLYPHS[ic.glyph]) return null;
  const f = FAMILIES[ic.family];
  const s = el("span", "icon" + (f ? " fam" : ""));
  if (f) {
    s.style.background = f.bg;
    s.style.color = f.fg;
    s.title = f.label;
  }
  s.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${GLYPHS[ic.glyph]}</svg>`;
  return s;
}

// While a picture with a draft is built, its boxes come from the plan with the draft drawn in.
let drawnNodes = null;
const nodeOf = (id) => (drawnNodes || plan.nodes)[id];

function nodeBox(id, family = null) {
  const n = nodeOf(id);
  if (!n) return el("div", "node todo", `? ${id}`);
  // A design draws options that do not exist yet: neutral boxes unless a status is given.
  const status = NODE_STATUS[n.status] ? n.status : plan.mode === "explain" ? "done" : plan.mode === "design" ? "plain" : "todo";
  const d = el("div", "node " + status);
  d.dataset.id = id;
  d.tabIndex = 0;
  d.setAttribute("role", "button");
  const pr = propOf(n);
  if (pr) {
    d.classList.add("prop", "prop-" + pr.type);
    d.append(el("span", "pbadge", t("pb_" + pr.type)));
  }
  const head = el("div", "nhead");
  const ic = iconEl(n, id, family);
  if (ic) head.append(ic);
  const st = el("span", "st", (plan.mode === "explain" ? EXPLAIN_MARK : MARK)[status]);
  st.title = statusLabel(status);
  st.setAttribute("aria-label", statusLabel(status));
  head.append(breakable(el("div", "name"), n.name), st);
  d.append(head);
  // Its kind on a platform, and the props that say most about it: "RDS · postgres · db.t3.medium".
  if (PROF.kindOf(n.kind)) {
    d.dataset.kind = n.kind;
    const words = kindWords(n.kind, n.props, n.name);
    if (words) d.append(el("div", "kindline", words));
  }
  if (n.what) d.append(richEl("div", "what", n.what, true));
  if (pr?.note) d.append(richEl("div", "pnote", "→ " + (pr.note.length > 60 ? pr.note.slice(0, 58) + "…" : pr.note), true));
  if (BASIS_KEYS.includes(n.basis)) {
    d.classList.add("basis-" + n.basis);
    const m = el("span", "bmark", t("b_" + n.basis));
    if (n.basis === "assumed") m.title = t("assumedTip");
    d.append(m);
  }
  d.onclick = () => selectNode(id);
  d.onkeydown = (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    selectNode(id);
  };
  return d;
}

function renderFlow(real) {
  const drafted = applyDraft(plan, draftDrawn() ? draft : null, real.id), v = drafted.view, marks = drafted.marks;
  const wrap = el("div", "flowview");
  drawnNodes = drafted.plan.nodes;
  (v.lanes || []).forEach((lane, li) => {
    const box = el("div", "lane");
    box.dataset.lane = li;
    const lm = marks.lanes?.[li];
    if (lm) box.classList.add("dr-" + lm.mark);
    // A plan's own steps: the lane says which step it is, and dragging it reorders the steps.
    if (lane.title || lm) {
      const title = richEl("div", "lane-title", lane.step ? `${li + 1} · ${lane.title || ""}` : lane.title || "");
      if (lane.step && sketching === real.id) title.title = t("stepLaneTip");
      if (lm) title.append(draftSign(lm));
      box.append(title);
    }
    const row = el("div", "row");
    (lane.nodes || []).forEach((id, i) => {
      if (i > 0 && lane.arrows !== false) row.append(arrow());
      else if (i > 0) row.append(el("div", "gap"));
      const b = anchored(id);
      // A box in several lanes (steps that touch it) is marked moved only in the lane it went to.
      const m = marks.nodes[id]?.mark === "move" && !lane.movedIn?.includes(id) ? null : marks.nodes[id];
      if (m) {
        b.classList.add("dr-" + m.mark);
        b.append(draftSign(m));
      }
      row.append(b);
    });
    const sc = el("div", "scroll");
    sc.append(row);
    box.append(sc);
    wrap.append(box);
  });
  drawnNodes = null;
  const compared = drawingDiff, canMove = () => !compared && canArrange();
  const help = readLine("flow");
  if (!draftShown() || !served || snapshot) {
    const plain = el("div");
    plain.append(help, wrap);
    return plain;
  }
  const tools = layoutTools(real, canMove, renderView, () => ({}), true);
  if (sketching && sketching !== real.id) sketching = null;
  if (sketching === real.id && canMove()) sketchFlow({real, v, drafted, wrap, tools});
  else if (draftOps(real.id).length) sketchApi = passiveApi(real, tools);
  const out = el("div");
  out.append(tools.row, help, wrap);
  return out;
}

let linkDrawer = null, linkObserver = null;
// Pictures add their line drawers; one observer redraws them all when anything resizes.
function addDrawer(fn, container) {
  const prev = linkDrawer;
  linkDrawer = () => {
    prev?.();
    fn();
  };
  (linkObserver ||= new ResizeObserver(() => linkDrawer?.())).observe(container);
}

// Labels (ports, notes) sit on the box the link reaches, not on the line; the same label from several boxes is one chip with a count.
function viaChips(container, links, marks = null) {
  for (const l of links || []) {
    const b = l.label && container.querySelector(`[data-anchor="${CSS.escape(l.to)}"]`);
    if (!b) continue;
    const row = b.querySelector(":scope > .vias") || b.appendChild(el("div", "vias"));
    const state = LINK_STATE_KEYS.includes(l.state) ? l.state : "ok";
    const tip = `${nodeOf(l.from)?.name || l.from} → ${nodeOf(l.to)?.name || l.to}`;
    const dm = marks?.links?.[`${l.from}>${l.to}`]?.mark;
    const same = !dm && [...row.children].find((c) => c.dataset.label === l.label && c.dataset.state === state && !c.dataset.draft);
    if (same) {
      same.dataset.links += ` ${l.from}>${l.to}`;
      same.dataset.n = (Number(same.dataset.n) || 1) + 1;
      same.textContent = `← ${l.label} ×${same.dataset.n}`;
      same.title += "\n" + tip;
      continue;
    }
    const chip = el("span", "via via-" + state + (dm ? " dr-" + dm : ""), "← " + l.label);
    if (dm) chip.dataset.draft = dm;
    chip.dataset.label = l.label;
    chip.dataset.state = state;
    // Which lines it stands for, so pointing at a line can light up its label.
    chip.dataset.links = `${l.from}>${l.to}`;
    chip.title = tip;
    row.append(chip);
  }
}

// The SVG under a picture's boxes that its links are drawn on; clear() resizes it to the picture and returns the picture's rectangle.
function linkLayer(container) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.classList.add("links");
  container.append(svg);
  svg.clear = () => {
    // Out of the way first: the layer must not hold the picture at the size of its last drawing.
    svg.setAttribute("width", 0);
    svg.setAttribute("height", 0);
    svg.setAttribute("width", container.scrollWidth);
    svg.setAttribute("height", container.scrollHeight);
    svg.replaceChildren();
    return container.getBoundingClientRect();
  };
  return svg;
}

// A link is a line plus its head; the head is never dashed.
function linkPaths(svg, line, head, cls, dim, ends) {
  const out = [];
  for (const [d, extra] of [[line, ""], [head, " head"]]) {
    const e = document.createElementNS(svg.namespaceURI, "path");
    e.setAttribute("d", d);

    const fan = {}, fanIn = {};

    const ns = container.querySelector(".ns")?.getBoundingClientRect();
    const lanes = {};

      if (!a || !b) continue;

        head = l.state === "blocked" ? `M${x2} ${y2 - 6} L${x2} ${y2 + 6}` : `M${x2 - 7} ${y2 - 4} L${x2} ${y2} L${x2 - 7} ${y2 + 4}`;

function sketchFlow({real, v, drafted, wrap, tools}) {

// ---------- before / after: two pictures side by side, with what was added, removed or changed marked
const diffSide = {};
function renderDiff(v) {
  const before = plan.views.find((x) => x.id === v.before), after = plan.views.find((x) => x.id === v.after);
  // Wide pictures read better one above the other than squeezed side by side.
  const wrap = el("div", "diffview" + ([v.before, v.after].some((id) => plan.views.find((x) => x.id === id)?.kind !== "flow") ? " stack" : ""));
  if (!before || !after || !VIEWS[before.kind] || !VIEWS[after.kind] || before.kind === "diff" || after.kind === "diff") return el("p", null, t("cannotDraw", "diff"));
  const ids = (x) => new Set(KINDS[x.kind]?.refs(x) || []);
  // changed: ["api"], or {"api": "now publishes instead of sending"} to say what changed.
  const notes = v.changed && typeof v.changed === "object" && !Array.isArray(v.changed) ? v.changed : {};
  const a = ids(before), b = ids(after), changed = new Set(Array.isArray(v.changed) ? v.changed : Object.keys(notes));
  const legend = el("div", "linklegend");
  legend.append(el("span", "dl add", t("dAdd")), el("span", "dl del", t("dDel")), el("span", "dl chg", t("dChg")));
  const half = (view, label, mark) => {
    const h = el("div", "dhalf");
    // Before / after compares the plan's own pictures: their drafts stay on their own tabs.
    drawingDiff = true;
    let pic;
    try {
      pic = VIEWS[view.kind].render(view);
    } finally {
      drawingDiff = false;
    }
    h.append(el("div", "dtitle", `${label} · ${view.title || view.id}`), pic);
    h.querySelectorAll("[data-id]").forEach((d) => {
      const id = d.dataset.id;
      if (changed.has(id)) {
        d.classList.add("d-chg");
        if (typeof notes[id] === "string") d.append(el("div", "dnote", "~ " + notes[id]));
      }
      else if (mark(id)) d.classList.add(label === t("before") ? "d-del" : "d-add");
    });
    return h;
  };
  const halves = [half(before, t("before"), (id) => !b.has(id)), half(after, t("after"), (id) => !a.has(id))];
  wrap.append(...halves);
  // Wide pictures: one at a time on screen, swapped in place, instead of a page twice as long. Paper shows both.
  if (wrap.classList.contains("stack") && !printState) {
    const seg = el("div", "modes diffseg");
    const show = (i) => {
      diffSide[v.id] = i;
      halves.forEach((h, k) => h.classList.toggle("off", k !== i));
      seg.querySelectorAll("button").forEach((x, k) => x.setAttribute("aria-pressed", String(k === i)));
      requestAnimationFrame(() => linkDrawer?.());
    };
    [t("before"), t("after")].forEach((label, i) => {
      const x = el("button", null, label);
      x.onclick = () => show(i);
      seg.append(x);
    });
    wrap.prepend(seg);
    show(diffSide[v.id] ?? 1);
  }
  // Links that exist on one side only: what stops talking to what, and what starts.
  const name = (x) => plan.nodes[x]?.name || x;
  const ea = edgesOf(before), eb = edgesOf(after);
  const gone = [...ea].filter((k) => !eb.has(k)), added = [...eb].filter((k) => !ea.has(k));
  const links = el("div", "dlinks");
  for (const [list, cls, label] of [[gone, "del", t("dLinkGone")], [added, "add", t("dLinkNew")]]) {
    if (!list.length) continue;
    const row = el("div", "drow");
    row.append(el("span", "dl " + cls, label));
    for (const k of list) {
      const [f, to] = k.split("\u0000");
      row.append(el("span", "dedge " + cls, `${name(f)} → ${name(to)}`));
    }
    links.append(row);
  }
  const box = el("div");
  box.append(legend, links, wrap);
  return box;
}

// Who points at whom in a picture, as "from\0to" keys, for comparing two pictures.
function edgesOf(v) {

// Show the step in a picture that contains its boxes; back to the picture the user picked when no step is selected.
let chosenView = null;
// The picture a step should be shown on, or null to stay on the one on screen.
function stepView(step) {
  // A step that tells a story needs the picture that holds the boxes it moves between.
  const ends = stepMoves(step).flatMap((m) => [m.from, m.to]);
  if (ends.length) {
    const has = (v) => ends.filter((e) => (KINDS[v.kind]?.refs(v) || []).includes(e)).length;
    const now = plan.views.find((x) => x.id === viewId) || plan.views[0];
    const best = [...plan.views].sort((a, b) => has(b) - has(a))[0];
    return best && best !== now && has(best) > has(now) ? best.id : null;
  }
  if (!step && chosenView && chosenView !== viewId && plan.views.some((x) => x.id === chosenView)) return chosenView;
  const want = new Set(step?.nodes || []);
  if (!want.size || [...document.querySelectorAll("#view [data-id]")].some((e) => want.has(e.dataset.id))) return null;
  return plan.views.find((x) => KINDS[x.kind]?.refs(x).some((k) => want.has(k)))?.id ?? null;

    }).slice(0, 40);

function codeBox(id) {

      const node = plan.nodes[id] || {};

      const marked = hl.lines;

      r.lines = r.lines.map((l) => l.slice(Number.isFinite(indent) ? indent : 0));

// ---------- story: what travels between boxes in a step (moves), what stays where it arrived (keep), what a box shows (show)
const stepMoves = (st) => (Array.isArray(st?.moves) ? st.moves.filter((m) => m?.from && m?.to) : []);
const storyStill = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const boxEl = (id) => document.querySelector(`#view [data-id="${CSS.escape(id)}"]`);

const story = {token: 0, step: null, done: 0, finished: Promise.resolve()};

// Everything earlier steps left behind, and what this step has delivered so far.
function storyMarks() {
  document.querySelectorAll("#view .mv-kept, #view .mv-show").forEach((e) => e.remove());
  const cur = curStep();
  if (!cur) return;
  const list = steps(), held = new Map(), shown = {};
  for (const st of list.slice(0, list.indexOf(cur) + 1)) {
    const moves = stepMoves(st);
    for (const m of moves.slice(0, st === cur && story.step === st.id ? story.done : moves.length)) if (m.keep && m.label) held.set(m.label, m.to);
    if (st.show && typeof st.show === "object") Object.assign(shown, st.show);
  }
  for (const [id, text] of Object.entries(shown)) boxEl(id)?.append(el("pre", "mv-show", String(text)));
  for (const [label, id] of held) boxEl(id)?.append(el("span", "mv-kept", label));
}

// The line a move travels on: the picture's own link when there is one (either way round), else a curve between the boxes.
function movePath(m, a, b) {
  const link = (x, y) => document.querySelector(`#view svg.links path[data-from="${CSS.escape(x)}"][data-to="${CSS.escape(y)}"]`);
  const real = link(m.from, m.to) || link(m.to, m.from);
  if (real) return {path: real, back: real.dataset.from !== m.from};
  routeLine.dx = routeLine.dy = 0;
  const others = [...document.querySelectorAll("#view [data-id]")].filter((e) => e !== a && e !== b).map((e) => e.getBoundingClientRect());
  const route = routeLine(a.getBoundingClientRect(), b.getBoundingClientRect(), others);
  const layer = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  layer.classList.add("mv-layer");
  const path = document.createElementNS(layer.namespaceURI, "path");
  path.setAttribute("d", route.d);
  layer.append(path);
  document.body.append(layer);
  return {path, back: false, layer};
}

// A move is there to be read: it waits at its start, travels slowly enough to follow, and rests where it arrives.
const MOVE_WAIT = 650, MOVE_REST = 550, MOVE_SPEED = 0.11, MOVE_MIN = 1500, MOVE_MAX = 3600;

function runMove(m, token) {
  return new Promise((done) => {
    const a = boxEl(m.from), b = boxEl(m.to);
    if (!a || !b) return done();
    let line = movePath(m, a, b), start = null, ms = 0;
    const packet = el("div", "mv-packet" + (m.label ? "" : " dot"), m.label || "");
    document.body.append(packet);
    const cutAt = 0.6;
    const isCut = () => m.blocked || line.path.classList.contains("l-blocked");
    const light = () => {
      line.path.classList.add("mv-on");
      // A blocked line lights only as far as the label gets.
      if (isCut()) {
        const len = line.path.getTotalLength();
        line.path.style.strokeDasharray = line.back ? `0 ${len * (1 - cutAt)} ${len * cutAt} ${len}` : `${len * cutAt} ${len}`;
      }
      // The same speed on every line: a short hop is quick, a long one takes its time.
      ms = Math.min(MOVE_MAX, Math.max(MOVE_MIN, line.path.getTotalLength() / MOVE_SPEED));
    };
    light();
    const finish = () => {
      packet.remove();
      line.layer?.remove();
      line.path.classList.remove("mv-on");
      line.path.style.strokeDasharray = "";
      done();
    };
    const place = (e) => {
      const len = line.path.getTotalLength(), p = line.path.getPointAtLength((line.back ? 1 - e : e) * len), c = line.path.getScreenCTM();
      packet.style.transform = `translate(${c.a * p.x + c.c * p.y + c.e}px,${c.b * p.x + c.d * p.y + c.f}px) translate(-50%,calc(-50% - 15px))`;
    };
    const frame = async (now) => {
      if (story.token !== token) return finish();
      // A box that changes size redraws the picture's lines: carry on along the new one.
      if (!line.path.isConnected) {
        line.layer?.remove();
        line = movePath(m, a, b);
        light();
      }
      start ??= now;
      const k = Math.min(1, (now - start) / ms);
      // A blocked line never gets there: the label stops partway and turns red.
      const cut = isCut();
      // It rests just short of the box, so the box's name stays readable.
      const end = cut ? cutAt : Math.max(0.5, 1 - 34 / line.path.getTotalLength());
      place((k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2) * end);
      if (k < 1) return requestAnimationFrame(frame);
      if (cut) {
        packet.classList.add("cut");
        packet.textContent = (m.label ? m.label + " " : "") + "✗";
        await pause(MOVE_REST + 700);
        return finish();
      }
      b.classList.add("mv-hit");
      setTimeout(() => b.classList.remove("mv-hit"), MOVE_REST + 300);
      await pause(MOVE_REST);
      finish();
    };
    place(0);
    setTimeout(() => (story.token === token ? requestAnimationFrame(frame) : finish()), MOVE_WAIT);
  });
}

// Played on the way into a step, however you got there: Play, a chip, the arrows.
function startStory() {
  const st = curStep(), token = ++story.token, moves = stepMoves(st);
  story.step = st?.id ?? null;
  story.began = performance.now();
  story.done = storyStill() ? moves.length : 0;
  storyMarks();
  story.finished = storyStill() || !moves.length ? Promise.resolve() : (async () => {
    await pause(120);
    for (const m of moves) {
      if (story.token !== token) return;
      // Both ends in sight before anything sets off.
      boxEl(m.from)?.scrollIntoView({block: "nearest", inline: "nearest", behavior: "smooth"});
      boxEl(m.to)?.scrollIntoView({block: "nearest", inline: "nearest", behavior: "smooth"});
      await pause(260);
      if (story.token !== token) return;
      await runMove(m, token);
      if (story.token !== token) return;
      story.done++;
      storyMarks();
      await pause(220);
    }
  })();
}

// Long enough to read what the step says, once what it moves has arrived.
const holdFor = (st) => Math.min(9000, Math.max(2200, 1000 + 45 * [st?.title, st?.detail, st?.done].join("").length));
function playOn() {
  const st = curStep();

    step(1);
    await story.finished;

  }, Math.max(1800, holdFor(st) - (performance.now() - story.began)));
}

function stop() {

}

function draw(p) {

async function fetchPlan() {
  const r = await fetch("/api/plan?token=" + encodeURIComponent(token));

    return;

  const layoutsSame = () => (next.views || []).every((v) => JSON.stringify(v?.layout ?? null) === JSON.stringify(plan.views.find((x) => x.id === v?.id)?.layout ?? null));

async function load() {

    document.body.classList.add("snapshot");
    document.body.classList.toggle("with-chat", !!snapshot.thread?.length);
    commonGlossary = snapshot.glossary || {};
    thread = snapshot.thread || [];
    thread.forEach((m) => m.from === "agent" && seen.add(m.id));
    render(snapshot.plan);
    const conn = document.getElementById("conn");
    conn.className = "conn snap";
    conn.textContent = t("snapshotAt", new Date(snapshot.exportedAt).toLocaleString(dateLocale(), {dateStyle: "medium", timeStyle: "short"}));
    conn.title = t("snapshotTip");

    return;
  }
  if (!served) {
    document.getElementById("banner").hidden = false;
    return;
  }
  try {
    commonGlossary = await (await fetch("/glossary.json?token=" + encodeURIComponent(token))).json();
  } catch {}
  await fetchDraft();
  await fetchPlan();
  const events = new EventSource("/api/events?token=" + encodeURIComponent(token));
  events.onopen = async () => {
    await fetchDraft();
    await fetchPlan();
    const r = await fetch("/api/thread?token=" + encodeURIComponent(token));
    if (r.ok) {
      const j = await r.json();
      ({items: thread, waiting} = j);
      listens = j.listens !== false;
    }
    if (!loadedThread) thread.forEach((m) => m.from === "agent" && seen.add(m.id));
    loadedThread = true;
    thread.sort((a, b) => a.at.localeCompare(b.at));
    setConn(true);
    refreshThreads();
  };
  events.onerror = () => setConn(false);

  // being typed, which a reload would lose: then say so.
  let build = null;
  events.addEventListener("hello", (e) => {
    const b = JSON.parse(e.data).build;
    // The first build is this page's own code; a later one is a server that took over, whose code a reload brings.
    if (!build) {
      const v = String(b).split("|")[0];
      if (/^\d+\.\d+\.\d+/.test(v)) (pageVersion = v), renderBadges();
    }
    if (build && b !== build) {
      if (![...document.querySelectorAll("textarea, input")].some((x) => x.value.trim())) return location.reload();
      const box = document.getElementById("toast"), go = el("button", "primary", t("reloadNow"));
      go.onclick = () => location.reload();
      box.className = "toast";
      box.replaceChildren(el("span", null, t("newerPage") + " "), go);
      box.hidden = false;
    }
    build = b;
  });
  events.addEventListener("plan", () => {
    // A drag of ours saved a moment ago is not the agent at work.
    if (Date.now() - layoutSavedAt >= 2000) agentActiveAt = Date.now();
    fetchPlan();
    [...unsaved].forEach(flushDraft);
  });
  events.addEventListener("draft", fetchDraft);
  const on = (name, fn) => events.addEventListener(name, (e) => { fn(JSON.parse(e.data)); refreshThreads(); });
  // Turn bars say "sent, waiting" as soon as you answer, and drop that once the agent replies.
  const turns = () => keepFocus(() => {
    renderStepCard();
    if (side?.kind === "step") renderSide();
  });
  // Approving sent from either button, or the agent answering it: both buttons follow at once.
  const approval = () => keepFocus(() => {
    renderBar();
    if (side?.kind === "plan") renderSide();
  });
  on("feedback", (m) => {
    thread.push({...m, from: "user", delivered: false});
    freshReply = m.id;
    if (m.step) turns();
    if (m.kind === "approve") approval();
  });
  on("reply", (m) => {
    thread.push(m);
    freshReply = m.id;
    if (m.step) turns();
    if (!m.step && !m.node) approval();
  });
  on("delivered", ({ids}) => thread.forEach((m) => { if (ids.includes(m.id)) m.delivered = true; }));
  on("agent", (a) => {
    waiting = a.waiting;
    listens = a.listens !== false;
  });
}

// The first time anyone opens Walkboard on this computer: the picture draws itself along its arrows, then one hint says
// what to do with it. Only opacity and a brief ring move, in one run, so even a big map stays smooth.
function firstLook() {
  const view = document.getElementById("view");
  const parts = [...view.querySelectorAll("[data-id], .arrow")];
  if (!parts.length) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const gap = Math.min(90, 1500 / parts.length), total = still ? 0 : gap * parts.length;
  if (!still) {
    parts.forEach((x, i) => (x.style.animationDelay = Math.round(i * gap) + "ms"));
    view.style.setProperty("--lines-at", Math.round(total * 0.6) + "ms");
    view.classList.add("intro");
    setTimeout(() => {
      view.classList.remove("intro");
      parts.forEach((x) => (x.style.animationDelay = ""));
    }, total + 800);
  }
  setTimeout(showFirstHint, total + 150);
}
function showFirstHint() {
  document.querySelector(".firsthint")?.remove();
  const box = document.querySelector("#view [data-id]");
  if (!box || document.body.classList.contains("side-open")) return;
  const hint = el("div", "firsthint", t("firstHint"));
  const r = box.getBoundingClientRect();
  hint.style.left = r.left + scrollX + 8 + "px";
  hint.style.top = r.bottom + scrollY + 10 + "px";
  document.body.append(hint);
  // Below the box unless the chat bar (or the window's edge) would cover it: then above, pointing down.
  const ask = document.getElementById("askbar"), floor = ask && !ask.hidden ? ask.getBoundingClientRect().top - 8 : innerHeight - 8;
  if (r.bottom + 10 + hint.offsetHeight > floor) {
    hint.classList.add("above");
    hint.style.top = r.top + scrollY - hint.offsetHeight - 10 + "px";
  }
  const gone = () => {
    hint.remove();
    removeEventListener("pointerdown", gone, true);
    removeEventListener("keydown", gone, true);
    removeEventListener("resize", gone);
  };
  addEventListener("pointerdown", gone, true);
  addEventListener("keydown", gone, true);
  addEventListener("resize", gone);
}

// A small card under the button that opened it; a click elsewhere, or on that button again, closes it.
let cardFor = null;
const toastHome = document.getElementById("toast").parentElement;
function showCard(anchor, cls, ...parts) {
  const box = document.getElementById("toast");
  if (!box.hidden && cardFor === anchor && box.classList.contains(cls)) {
    box.hidden = true;
    cardFor = null;
    return;
  }
  cardFor = anchor;
  box.className = "toast " + cls;
  box.replaceChildren(...parts);
  box.onclick = (ev) => ev.stopPropagation();
  // A card under a button of the top bar lives in the bar, so it stays with the button as the page scrolls (the bar
  // sticks to the top). Any other card is placed where its button is.
  const bar = anchor.closest(".bar");
  if (bar) {
    if (box.parentElement !== bar) bar.append(box);
    Object.assign(box.style, {position: "absolute", top: anchor.offsetTop + anchor.offsetHeight + 8 + "px", left: "0px", right: "auto"});
    box.hidden = false;
    const b = bar.getBoundingClientRect(), a = anchor.getBoundingClientRect(), w = box.offsetWidth;
    // Under the button, kept inside the window.
    box.style.left = Math.max(16 - b.left, Math.min(a.left - b.left, innerWidth - 16 - w - b.left)) + "px";

  if (box.parentElement !== toastHome) toastHome.append(box);

// Every conversation on the page in one list under 💬, the one with the newest message on top; new replies are marked.
function conversations() {
  const latest = new Map();
  thread.forEach((m) => {
    if (m.kind === "settings") return;
    const key = sideKey(sideOf(m));
    // A Map keeps the place of a key's first entry: taken out first, a conversation moves to the end with its newest message.
    latest.delete(key);
    latest.set(key, {c: sideOf(m), m});
  });
  return [...latest.values()].reverse();
}

// Printing (PDF) lays out the whole plan, not just what is on screen: every step, every picture one after another, then the boxes.
// Pictures are drawn at full size, their lines drawn, and only then scaled down to the page width, so lines and boxes stay together.
let printState = null;
function journeyList(v) {
  const ol = el("ol", "pjourney");
  for (const s of v.stops || []) {
    const li = el("li");
    li.append(el("b", null, plan.nodes[s.node]?.name || s.node));
    if (s.note) li.append(" ", richEl("span", null, s.note));

// The cited lines on paper: the highlighted ones (else the line cited), with a few around them.
function printCode(n, r) {
  const hl = highlightOf(n.highlight)?.lines || new Set(r.focus ? [r.focus] : []);
  const at = [...hl].filter((x) => x >= r.from && x < r.from + r.lines.length);
  const lo = at.length ? Math.max(r.from, Math.min(...at) - 2) : r.from, hi = at.length ? Math.min(r.from + r.lines.length - 1, Math.max(...at) + 2) : Math.min(r.from + 11, r.from + r.lines.length - 1);
  const pre = el("pre", "pcode");
  for (let i = lo; i <= Math.min(hi, lo + 24); i++) {
    const line = el("span", hl.has(i) ? "hl" : null);
    line.append(el("i", null, String(i)), r.lines[i - r.from] ?? "");
    pre.append(line);
  }

}

// Code for printing an explanation: fetched once, so the print window (which cannot wait) has it.
const codeCache = {};
function prefetchCode() {
  if (!served || plan.mode !== "explain") return;
  for (const [id, n] of Object.entries(plan.nodes)) {
    if (!n?.file || codeCache[id]?.file === n.file) continue;
    fetch(`/api/source?node=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`).then((r) => r.json())
      .then((r) => { if (!r.error) codeCache[id] = {...r, file: n.file}; }, () => {});
  }
}

  // What would come out too small takes a landscape page of its own: first choose (the lines redraw for the new width), then scale.

  const worst = (box, wide, room) => Math.min(...partsOf(box).map((pic) => scaleOf(pic, wide, room)));

  for (const box of [...pics]) {
    if (box.querySelector(".diffview") || !box.printView || Math.max(worst(box, 676, 880), worst(box, 1000, 590)) >= readableScale(box)) continue;
    const made = box.printView.kind === "map" ? splitMapForPaper(box, box.printView) : sheetsForPaper(box, box.printView);
    if (!made.length) continue;
    made.reverse().forEach((s) => box.after(s));
    pics.splice(pics.indexOf(box) + 1, 0, ...made.reverse());
    made.forEach(tidyGuesses);
    // What a box had no room to say goes under its picture.
    for (const s of made) if (s.partOf?.rest?.length) {
      const ul = el("ul", "pxlist");
      s.partOf.rest.forEach((x) => ul.append(el("li", null, x)));
      s.append(ul);
    }
    box.classList.add("poverview");
  }
  linkDrawer?.();
  linkObserver?.disconnect();
  const small = pics.filter((box) => partsOf(box).some((pic) => pic.querySelector("svg.links")) && worst(box, 676, 880) < 0.8).map((box) => [box, worst(box, 676, 880)]);
  small.forEach(([box]) => box.classList.add("landscape"));

    for (const pic of parts) {
      const w = widthOf(pic);

      let room = pageH - (diff && pic === parts[0] ? pic.getBoundingClientRect().top - box.getBoundingClientRect().top : 0) - (picsHead && box.contains(picsHead) ? picsHead.offsetHeight + 16 : 0) - [...box.querySelectorAll(":scope > .pdraft, :scope > .pxlist, :scope > .pzindex")].reduce((n, x) => n + x.offsetHeight + 8, 0);

      }

      const scale = Math.min(1, pageW / w, tall);

        pic.style.zoom = String(scale);

  stepId = printState.stepId;
});

      a.download = "";
      a.click();
      document.getElementById("toast").hidden = true;
    };
    parts.push(...(Object.values(plan.nodes).some((n) => n?.file) ? [codeL] : []), chatL);
    row.append(html);
  }
  const pdf = el("button", served ? null : "primary", t("exportPdf"));
  pdf.onclick = () => {
    document.getElementById("toast").hidden = true;
    printDraft = withDraft?.checked !== false;
    setTimeout(() => print(), 50);
  };
  row.append(pdf);
  parts.push(row);
  showCard(document.getElementById("more"), "exportcard", ...parts);
}

// Light, dark, or follow the system; remembered in this browser.
const THEMES = ["auto", "light", "dark"];
const THEME_ICON = {
  auto: '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></g></svg>',
  dark: '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg>',
};
let theme = ["light", "dark"].includes(params.get("theme")) ? params.get("theme") : store.get("walkboard.theme") || "auto";
function applyTheme() {
  if (theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
}
applyTheme();

// The gear holds what is used now and then: the mode, who commits, export, theme, the guide and shortcuts.
const moreBtn = document.getElementById("more");
moreBtn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M19.13 10.03 L21.49 10.55 L21.49 13.45 L19.13 13.97 L18.44 15.65 L19.73 17.69 L17.69 19.73 L15.65 18.44 L13.97 19.13 L13.45 21.49 L10.55 21.49 L10.03 19.13 L8.35 18.44 L6.31 19.73 L4.27 17.69 L5.56 15.65 L4.87 13.97 L2.51 13.45 L2.51 10.55 L4.87 10.03 L5.56 8.35 L4.27 6.31 L6.31 4.27 L8.35 5.56 L10.03 4.87 L10.55 2.51 L13.45 2.51 L13.97 4.87 L15.65 5.56 L17.69 4.27 L19.73 6.31 L18.44 8.35Z"/><circle cx="12" cy="12" r="3.2"/></svg>';
moreBtn.title = t("moreTip");
moreBtn.setAttribute("aria-label", t("moreTip"));
moreBtn.onclick = (e) => {
  e.stopPropagation();
  const item = (icon, label, fn) => {
    const b = el("button", "mitem");
    b.insertAdjacentHTML("afterbegin", icon);
    b.append(el("span", null, label));
    b.onclick = (ev) => {
      ev.stopPropagation();
      fn();
    };
    return b;
  };
  const themes = el("div", "mthemes");
  themes.append(el("span", null, t("themeLabel")));
  const seg = el("div", "seg");
  for (const k of THEMES) {
    const b = el("button", k === theme ? "on" : null);
    b.innerHTML = THEME_ICON[k];
    b.title = t("theme_" + k);
    b.setAttribute("aria-label", b.title);
    b.onclick = (ev) => {
      ev.stopPropagation();
      theme = k;
      store.set("walkboard.theme", theme);
      applyTheme();
      seg.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
      requestAnimationFrame(() => linkDrawer?.());
    };
    seg.append(b);
  }
  themes.append(seg);
  const exportIcon = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg>';
  const helpIcon = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.3a1.8 1.8 0 1 1 2.4 1.7c-.5.2-.7.6-.7 1.1V9.6"/><circle cx="8" cy="11.6" r=".4" fill="currentColor"/></svg>';
  const bookIcon = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M8 4.2C6.6 3 4.6 2.7 2.5 3v9.3c2.1-.3 4.1 0 5.5 1.2 1.4-1.2 3.4-1.5 5.5-1.2V3c-2.1-.3-4.1 0-5.5 1.2zM8 4.2v9.3"/></svg>';
  // The docs, in the page's language when they have it.
  const guide = docLink("README.md", "", "mitem");
  guide.insertAdjacentHTML("afterbegin", bookIcon);
  guide.append(el("span", null, t("docsTitle")), el("span", "mext", "↗"));
  const cur = MODES_SHOWN.includes(plan?.mode) ? plan.mode : "build";
  const mode = el("div", "mmode");
  // One line; what the mode means is a tooltip, for whoever wonders.
  mode.append(el("b", null, t("pill_" + cur)));
  mode.title = t("pillTip_" + cur);
  const rows = [mode];
  if (plan && cur === "build" && !snapshot) {
    const commits = el("div", "mthemes"), opts = el("div", "seg words");
    commits.append(el("span", null, t("commits")));
    for (const [v, label, fx] of [["auto", t("commitAuto"), t("commitAutoFx")], ["suggest", t("commitOnly"), t("commitOnlyFx")]]) {
      const b = el("button", plan.settings?.commit === v ? "on" : null, label);
      b.title = fx;
      b.disabled = !connected;
      b.onclick = (ev) => {
        ev.stopPropagation();
        if (plan.settings?.commit === v) return;
        opts.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
        saveSetting({commit: v});
      };
      opts.append(b);
    }
    commits.append(opts);
    rows.push(commits);
  }
  showCard(moreBtn, "menucard", ...rows, item(exportIcon, t("exportTitle"), openExport), themes, guide, item(helpIcon, t("helpTitle"), openHelp), ...(pageVersion ? [el("div", "mversion", `Walkboard ${pageVersion}`)] : []));
};

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement?.tagName || "")) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    stop();
    step(e.key === "ArrowLeft" ? -1 : 1);
  }
});

renderBadges();
load();
</script>
</body>
</html>
