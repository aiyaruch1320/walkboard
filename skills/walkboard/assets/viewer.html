<script src="strings.js"></script>
<script type="module">
const params = new URLSearchParams(location.search);
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const token = params.get("token");
// An exported file carries its plan (and code, and the chat if chosen) inside: it reads that and never calls a server.
const snapshot = (() => {
  try {
    return JSON.parse(document.getElementById("wb-snapshot")?.textContent || "null");
  } catch {
    return null;
  }
})();
const served = !snapshot && location.protocol !== "file:" && token;
const moduleUrl = (name) => window.__walkboardModules?.[name] || `/${name}.mjs?token=${encodeURIComponent(token)}`;
const {NODE_STATUS, STEP_STATUS, KINDS, validate, parseFile, highlightOf, ratingValue, failsMust, viewsOf, langOf, teachBackOn} = served || snapshot ? await import(moduleUrl("schema")) : {NODE_STATUS: {}, STEP_STATUS: {}, KINDS: {}, validate: () => [], parseFile: () => null, highlightOf: () => null, ratingValue: () => null, failsMust: () => [], viewsOf: () => [], langOf: () => "en", teachBackOn: () => true};
const {GLYPHS, FAMILIES, iconOf} = served || snapshot ? await import(moduleUrl("icons")) : {GLYPHS: {}, FAMILIES: {}, iconOf: () => null};

let lang = /^th\b/i.test(navigator.language) ? "th" : "en";
const t = (k, ...a) => {
  const v = STRINGS[lang][k] ?? STRINGS.en[k] ?? k;
  return typeof v === "function" ? v(...a) : v;
};
// Thai text, Gregorian years: 2026, not 2569, as in code and commits.
const dateLocale = () => (lang === "th" ? "th-TH-u-ca-gregory" : lang);
const unit = (cap) => t((plan?.mode === "explain" ? "stage" : "step").replace(/^./, (c) => (cap ? c.toUpperCase() : c)));

function setLang(code) {
  lang = STRINGS[code] ? code : "en";
  document.documentElement.lang = lang;
  document.getElementById("banner").textContent = t("banner");
  for (const [id, label] of [["prev", t("prev", unit())], ["next", t("next", unit())], ["play", t("play", unit())]]) {
    const b = document.getElementById(id);
    b.title = label;
    b.setAttribute("aria-label", label);
  }
  document.getElementById("prev").textContent = "◀";
  document.getElementById("next").textContent = "▶";
  if (!timer) document.getElementById("play").textContent = t("playShort");
}
let plan, viewId, stepId = null, nodeId = null, timer = null;
const steps = () => plan.steps || [];
const curStep = () => steps().find((s) => s.id === stepId) || null;
let thread = [], waiting = 0, connected = false;
// Unsent text survives a reload of this tab.
const draftKey = "walkboard.drafts." + token;
const drafts = (() => {
  try {
    return JSON.parse(sessionStorage.getItem(draftKey)) || {};
  } catch {
    return {};
  }
})();
addEventListener("pagehide", () => {
  try {
    sessionStorage.setItem(draftKey, JSON.stringify(drafts));
  } catch {}
});
const touch = matchMedia("(pointer: coarse)").matches;
const picked = {};
const seen = new Set();
let freshReply = null;
const hintText = () => (connected ? "" : t("noAgent"));

// Where a message belongs: a box, a step, a design option or one of its cells, or the whole plan.
const ctxKey = (c) => (c.node ? "node:" + c.node : c.step ? "step:" + c.step : c.option ? `option:${c.option}:${c.criterion || ""}` : "plan");
const ctxOf = (m) => (m.node ? {node: m.node} : m.step ? {step: m.step} : m.option ? {option: m.option, criterion: m.criterion} : {});
const inCtx = (m, c) => ctxKey(ctxOf(m)) === ctxKey(c);
// An option's thread also keeps whole-plan replies that answered it, in case the agent replied without --option.
const inThread = (m, c, i) => inCtx(m, c) || (!!c.option && m.from === "agent" && inCtx(m, {}) && inCtx(thread.slice(0, i).findLast((x) => x.from !== "agent" && x.kind !== "settings") || {}, c));

function msgEl(m) {
  const d = el("div", "msg " + (m.from === "agent" ? "agent" : "user"));
  d.dataset.id = m.id;
  const who = m.from === "agent" ? t("agent") : `${t("you")} · ${t(STRINGS.en[m.kind] ? m.kind : "question")} · ${m.delivered ? t("received") : t("waitingAgent")}`;
  d.append(el("span", "who", who), msgBody(m.text));
  return d;
}

// **bold** and *italic* (or _italic_), still as text nodes.
function emphasis(text) {
  const f = document.createDocumentFragment();
  text.split(/(\*\*[^*\n]+\*\*|(?<![\w*])\*[^*\s][^*\n]*\*(?![\w*])|(?<!\w)_[^_\s][^_\n]*_(?!\w))/).forEach((p, i) => {
    if (!(i % 2)) return p && f.append(p);
    f.append(p.startsWith("**") ? el("strong", null, p.slice(2, -2)) : el("em", null, p.slice(1, -1)));
  });
  return f;
}

// ```fenced``` blocks become code blocks and `ticks` inline code; everything stays text, never HTML.
function msgBody(text) {
  const f = document.createDocumentFragment();
  String(text ?? "").split(/```[a-z0-9]*\n?([\s\S]*?)```/i).forEach((part, i) => {
    if (i % 2) return f.append(el("pre", "mcode", part.replace(/\n$/, "")));
    if (i) part = part.replace(/^\n/, "");
    part.split(/`([^`\n]+)`/).forEach((x, j) => {
      if (j % 2) return f.append(el("code", "mcode", x));
      x.split(/(https?:\/\/[^\s<>"'`]+)/).forEach((y, k) => {
        if (!(k % 2)) return f.append(emphasis(y));
        const a = el("a", null, y);
        a.href = y;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        f.append(a);
      });
    });
  });
  return f;
}

const MARK = {done: "✓", new: "●", todo: "", ext: "↗"}, EXPLAIN_MARK = {done: "", new: "★", todo: "", ext: "↗"};
const statusLabel = (st) => t((plan?.mode === "explain" ? "ex_" : "st_") + (NODE_STATUS[st] ? st : plan?.mode === "explain" ? "done" : "todo"));

function renderLegend() {
  document.getElementById("legendSum").textContent = t("legendSum");
  if (plan.mode === "design") {
    const marks = BASIS_KEYS.filter((k) => Object.values(plan.nodes || {}).some((n) => n?.basis === k));
    return document.getElementById("legend").replaceChildren(...marks.map((k) => el("span", null, `${t("b_" + k)} ${t("lb_" + k)}`)), el("span", null, t("talkLegend")));
  }
  const items = plan.mode === "explain"
    ? [["done", t("lg_code")], ["new", t("lg_focus")], ["ext", t("lg_ext")]]
    : [["done", t("lg_done")], ["new", t("lg_new")], ["todo", t("lg_todo")], ["ext", t("lg_ext")]];
  document.getElementById("legend").replaceChildren(...items.map(([c, label]) => {
    const sp = el("span");
    sp.append(el("i", "sw " + c, (plan.mode === "explain" ? EXPLAIN_MARK : MARK)[c]), label);
    return sp;
  }), ...PROP_TYPES.filter((k) => proposals().some(([, n]) => n.proposal.type === k)).map((k) => {
    const sp = el("span");
    sp.append(el("i", "sw prop-" + k), t("lg_" + k));
    return sp;
  }), el("span", null, t("talkLegend")));
}

let termRe = null;

let commonGlossary = {}, glossary = {};
const escRe = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// Not inside identifiers or paths such as usecase/extract/extract.go.
const edge = (t) => (/^\w/.test(t) ? "(?<![\\w./-])" : "") + escRe(t) + (/\w$/.test(t) ? "(?![\\w-]|\\.\\w)" : "");

// Shared terms ship with walkboard; the plan only adds its own. Only terms the plan uses are shown.
function setGlossary(own) {
  // Only the words people read: not field names ("settings.commit") and not addresses ("token" in a URL).
  const NOT_PROSE = new Set(["glossary", "settings", "url", "file", "root", "roots", "links", "anchor", "highlight", "id", "icon", "kind", "status", "basis", "type", "key",
    "nodes", "node", "from", "to", "actors", "states", "start", "end", "before", "after", "changed", "uses", "configs", "outside", "targets", "policy", "view", "option", "proposals", "sources", "source", "ref"]);
  const words = [];
  const walk = (x, k) => {
    if (NOT_PROSE.has(k)) return;
    if (typeof x === "string") words.push(x);
    else if (x && typeof x === "object") for (const [kk, v] of Object.entries(x)) walk(v, Array.isArray(x) ? k : kk);
  };
  walk(plan, "");
  const text = words.join("\n");
  const used = Object.fromEntries(Object.entries(commonGlossary).filter(([t]) => new RegExp(edge(t)).test(text)));
  const pick = (v) => (typeof v === "string" ? v : v?.[lang] ?? v?.en);
  glossary = {...Object.fromEntries(Object.entries(used).map(([k, v]) => [k, pick(v)])), ...(own && typeof own === "object" ? own : {})};
  const g = glossary;
  const terms = Object.keys(g).filter(Boolean).sort((a, b) => b.length - a.length);
  termRe = terms.length ? new RegExp(terms.map(edge).join("|"), "g") : null;
}

// Text with glossary terms that explain themselves on click or tap.
// Inside a box (passive) a term only underlines and shows its meaning on hover: a tap opens the box.
function rich(text, passive = false) {
  const f = document.createDocumentFragment();
  const str = String(text ?? "");
  if (!termRe) {
    f.append(str);
    return f;
  }
  let last = 0;
  for (const m of str.matchAll(termRe)) {
    f.append(str.slice(last, m.index));
    const t = el("span", "term", m[0]);
    t.title = glossary[m[0]];
    f.append(t);
    last = m.index + m[0].length;
    if (passive) continue;
    t.tabIndex = 0;
    t.setAttribute("role", "button");
    const open = (e) => {
      e.stopPropagation();
      showTip(t, m[0]);
    };
    t.onclick = open;
    t.onkeydown = (e) => { if (e.key === "Enter") open(e); };
  }
  f.append(str.slice(last));
  return f;
}

// Long identifiers (feedback.jsonl, order_events) may break after . / _ - instead of mid-word.
function breakable(e, text) {
  String(text ?? "").split(/(?<=[./_-])(?=\w)/).forEach((part, i) => {
    if (i) e.append(el("wbr"));
    e.append(part);
  });
  return e;
}

function richEl(tag, cls, text, passive) {
  const e = el(tag, cls);
  e.append(rich(text, passive));
  return e;
}

let tipFor = null;
function showTip(anchor, term) {
  const tip = document.getElementById("tip");
  // Tapping the same word again closes its explanation.
  if (!tip.hidden && tipFor === anchor) {
    tip.hidden = true;
    tipFor = null;
    return;
  }
  tipFor = anchor;
  tip.replaceChildren(el("b", null, term), document.createTextNode(glossary[term]));
  tip.hidden = false;
  const r = anchor.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.left + scrollX - 10, scrollX + document.documentElement.clientWidth - tip.offsetWidth - 8));
  const above = r.bottom + tip.offsetHeight + 14 > innerHeight && r.top > tip.offsetHeight + 14;
  tip.classList.toggle("above", above);
  tip.style.left = left + "px";
  tip.style.top = (above ? r.top + scrollY - tip.offsetHeight - 9 : r.bottom + scrollY + 9) + "px";
  tip.style.setProperty("--cx", Math.max(14, Math.min(tip.offsetWidth - 14, r.left + scrollX + r.width / 2 - left)) + "px");
}
document.addEventListener("click", () => (document.getElementById("tip").hidden = true));
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const tip = document.getElementById("tip");
  if (!tip.hidden) tip.hidden = true;
  else if (side && !(document.activeElement?.tagName === "TEXTAREA" && document.activeElement.value.trim())) closeSide();
});

// Every clickable box in a picture opens with Enter or Space too, whatever drew it.
document.addEventListener("keydown", (e) => {
  const d = e.target;
  if ((e.key !== "Enter" && e.key !== " ") || !d?.matches?.("#view [data-id][tabindex]") || d.onkeydown || e.repeat) return;
  e.preventDefault();
  d.click();
});

const LINK_STATE_KEYS = ["ok", "todo", "blocked"];
const unread = () => thread.filter((m) => m.from === "agent" && !seen.has(m.id));

// 💬 on every box that has a conversation, in whatever picture is drawn: a conversation belongs to the box, not to one picture.
function drawCounts() {
  const waitingFor = unread();
  document.querySelectorAll("#view [data-id]").forEach((d) => {
    d.querySelector(":scope > .count")?.remove();
    const n = thread.filter((m) => m.node === d.dataset.id).length;
    if (n) d.append(el("span", "count" + (waitingFor.some((m) => m.node === d.dataset.id) ? " unread" : ""), `💬 ${n}`));
  });
  document.querySelectorAll(".chip[data-step]").forEach((c) => {
    const id = c.dataset.step;
    c.classList.toggle("unread", waitingFor.some((m) => !m.node && (id ? m.step === id : !m.step)));
  });
}

function refreshThreads() {
  document.querySelectorAll(".thread[data-ctx]").forEach((t) => {
    const c = JSON.parse(t.dataset.ctx);
    // Like a chat: open on the newest message and stay there, also when the chat is unfolded, the panel widened
    // or the window resized, until you scroll up to read older ones. A hidden chat cannot be measured, so it remembers.
    if (!t.dataset.follow) {
      t.dataset.follow = "1";
      t.addEventListener("scroll", () => (t.dataset.follow = t.scrollHeight - t.scrollTop - t.clientHeight < 40 ? "1" : "0"));
      new ResizeObserver(() => t.dataset.follow === "1" && (t.scrollTop = t.scrollHeight)).observe(t);
    }
    const end = t.dataset.follow === "1";
    const msgs = thread.filter((m, i) => inThread(m, c, i) && m.kind !== "settings");
    msgs.forEach((m) => m.from === "agent" && seen.add(m.id));
    t.replaceChildren(...msgs.map(msgEl));
    const busy = working().find((m) => inCtx(m, c));
    if (busy) t.append(typingEl(busy));
    // Follow the conversation while you are at its end, as a chat does.
    if (end) t.scrollTop = t.scrollHeight;
    const lbl = t.closest(".pb")?.querySelector(".fold .lbl");
    if (lbl) lbl.dataset.n = msgs.length || "";
  });
  const fresh = freshReply && document.querySelector(`.msg[data-id="${CSS.escape(freshReply)}"]`);
  if (fresh) {
    fresh.classList.add("flash");
    fresh.scrollIntoView({block: "nearest", behavior: "smooth"});
  }
  freshReply = null;
  drawCounts();
  const planTalk = document.getElementById("planTalk");
  planTalk.textContent = t("talkPlan", thread.filter((m) => inCtx(m, {}) && m.kind !== "settings").length);
  planTalk.onclick = () => openSide({kind: "plan"});
  renderBadges();
}

async function send(c, kind, text, extra = {}) {
  const body = {...extra, kind, text};
  if (c.node) body.node = c.node;
  if (c.step) body.step = c.step;
  if (c.option) body.option = c.option;
  if (c.criterion) body.criterion = c.criterion;
  if (viewId || plan.views[0]) body.view = viewId || plan.views[0].id;
  if (stepId && !c.step) body.viewingStep = stepId;
  const r = await fetch("/api/feedback?token=" + encodeURIComponent(token), {
    method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
}

// quick: buttons that send at once; modes: what the typed text is sent as.
// to, prefix, sent: for a conversation that continues elsewhere (a box taken out of the plan continues in the whole plan's).
function talkBox(c, {placeholder, quick = [], modes = ["question"], mode, phase = "", extra = {}, to = c, prefix = "", sent = null}) {
  if (snapshot) {
    // Read-only: the conversation if it was exported, nothing to type into.
    const box = el("div", "talk");
    const thr = el("div", "thread");
    thr.dataset.ctx = JSON.stringify(c);
    box.append(thr);
    return box;
  }
  const key = ctxKey(c);
  const pickKey = key + "|" + phase;
  let current = modes.includes(picked[pickKey]) ? picked[pickKey] : mode && modes.includes(mode) ? mode : modes[0];
  const box = el("div", "talk");
  const comp = el("div", "composer");
  const ta = el("textarea");
  ta.dataset.key = key;
  ta.value = drafts[key] || "";
  ta.oninput = () => (drafts[key] = ta.value);
  const note = el("span", "note", hintText());
  const sendBtn = el("button", "primary");
  let busy = false;
  const buttons = [];
  let pchange = null;
  const go = async (kind, fallback) => {
    if (busy) return;
    const text = ta.value.trim() || fallback;
    if (kind === "propose" && c.node && !pchange) {
      note.textContent = t("pickChange");
      note.className = "note err";
      return choose.querySelector("button")?.focus();
    }
    if (!text) {
      note.textContent = kind === "change" ? t("typeChange") : t("typeFirst");
      note.className = "note err";
      return ta.focus();
    }
    busy = true;
    buttons.forEach((b) => (b.disabled = true));
    try {
      await send(to, kind, prefix + text, kind === "propose" ? {...extra, change: c.node ? pchange : "add"} : extra);
      if (ta.value.trim()) ta.value = drafts[key] = "";
      if (sent) return sent();
      note.textContent = t("sent");
      note.className = "note";
    } catch (e) {
      note.textContent = /413/.test(e.message) ? t("tooLong") : t("sendFail") + e.message;
      note.className = "note err";
    } finally {
      busy = false;
      buttons.forEach((b) => (b.disabled = false));
    }
  };
  if (quick.length) {
    const row = el("div", "quick");
    for (const k of quick) {
      const b = el("button", k === "approve" ? "primary" : null, t(k));
      b.title = t("quickTip");
      b.onclick = () => (k !== "approve" || approveOk()) && go(k, t("q_" + k));
      buttons.push(b);
      row.append(b);
    }
    comp.append(row);
  }
  // Proposing on a box: add something after it, change it, or remove it.
  const choose = el("div", "pchoose");
  for (const k of ["add", "change", "remove"]) {
    const b = el("button", null, t("pc_" + k));
    b.dataset.change = k;
    b.onclick = () => {
      pchange = k;
      note.textContent = hintText();
      note.className = "note";
      setMode("propose");
      ta.focus();
    };
    choose.append(b);
  }
  const setMode = (m) => {
    current = m;
    ta.placeholder = m === "question" ? placeholder : m === "propose" ? t(c.node ? (pchange ? "ph_propose_" + pchange : "pickChange") : "ph_propose_plan") : t("ph_" + m, unit());
    sendBtn.textContent = t("send_" + m);
    seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
    choose.hidden = !(m === "propose" && c.node);
    choose.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.change === pchange)));
  };
  const seg = el("div", "modes");
  if (modes.length > 1) {
    seg.setAttribute("role", "group");
    for (const m of modes) {
      const b = el("button", null, t(m));
      b.dataset.mode = m;
      b.onclick = () => {
        picked[pickKey] = m;
        setMode(m);
        ta.focus();
      };
      seg.append(b);
    }
    comp.append(seg);
  }
  comp.append(choose);
  setMode(current);
  sendBtn.onclick = () => go(current, "");
  buttons.push(sendBtn);
  // Enter sends, as in any chat; Shift+Enter starts a new line.
  ta.onkeydown = (e) => {
    if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
    e.preventDefault();
    go(current, "");
  };
  const row = el("div", "send");
  row.append(note, sendBtn);
  const thr = el("div", "thread");
  thr.dataset.ctx = JSON.stringify(c);
  // Like a chat: the conversation first, what you type under it.
  comp.append(ta, row);
  box.append(thr, comp);
  return box;
}

async function saveSetting(change) {
  document.querySelectorAll(".settings button").forEach((b) => (b.disabled = true));
  try {
    const r = await fetch("/api/settings?token=" + encodeURIComponent(token), {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(change)});
    if (!r.ok) throw new Error(await r.text());
  } catch (e) {
    const box = document.getElementById("toast");
    box.className = "toast";
    box.replaceChildren(t("settingFail") + e.message);
    box.hidden = false;
    renderBadges();
  }
}

// Messages the agent has taken but not answered in the same place, while it is not listening: it is working on them.
function working() {
  if (!connected || waiting) return [];
  return thread.filter((m, i) => m.from !== "agent" && m.delivered && m.kind !== "settings" && !(m.kind === "approve" && plan?.approved) &&
    !thread.slice(i + 1).some((r, j) => r.from === "agent" && inThread(r, ctxOf(m), i + 1 + j)));
}

function typingEl(m) {
  const min = Math.floor((Date.now() - Date.parse(m.at)) / 60000);
  const stuck = min >= 10;
  const d = el("div", "msg agent typing" + (stuck ? " stuck" : ""));
  const dots = el("span", "dots");
  dots.append(el("i"), el("i"), el("i"));
  d.append(dots, el("span", null, stuck ? t("noReply", min) : t("working", min)));
  return d;
}

function renderBadges() {
  const conn = document.getElementById("conn");
  const busy = working().length > 0, building = !!plan && steps().some((x) => x.status === "doing");
  // A snapshot says when it was exported instead (set once in load).
  if (!snapshot) {
    conn.className = "conn " + (!connected ? "off" : waiting ? "on" : busy || building ? "work" : "idle");
    conn.textContent = !connected ? t(!served ? "connOff" : everConnected ? "connLost" : "connecting") : waiting ? t("connOn") : busy ? t("connWorking") : building ? t("connBuilding") : t("connIdle");
    conn.title = !connected ? t("connLostTip") : waiting ? t("connOnTip") : busy ? t("connWorkingTip") : t("connIdleTip");
    conn.setAttribute("aria-label", conn.textContent + ". " + conn.title);
  }
  if (!plan) return;
  updateTitle();
  const s = plan.settings || {};
  const explain = plan.mode === "explain";
  // The mode is always in sight, next to the logo.
  const mode = MODES_SHOWN.includes(plan.mode) ? plan.mode : "build";
  const pill = document.getElementById("modePill");
  pill.hidden = false;
  pill.className = "modepill " + mode;
  pill.textContent = t("pill_" + mode);
  pill.title = t("pillTip_" + mode);
  const items = [];
  if (plan.mode === "design") {
    document.getElementById("badges").replaceChildren(...items);
    return renderBar();
  }
  // One small box per setting; what the current value means is in its tooltip.
  const box = el("div", "settings");
  box.append(el("span", "slabel", t("agentSettings")));
  const card = (name, control, fx) => {
    const c = el("span", "setting");
    c.title = fx;
    c.append(el("span", "sname", name), control);
    box.append(c);
  };
  const on = teachBackOn(plan);
  const sw = el("button", "switch" + (on ? " on" : ""));
  sw.setAttribute("role", "switch");
  sw.setAttribute("aria-checked", String(on));
  sw.setAttribute("aria-label", t("restate", unit()));
  sw.append(el("span", "track"), el("span", "state", on ? t("on") : t("off")));
  sw.onclick = () => saveSetting({teachBack: !on});
  card(t("restate", unit()), sw, on ? t("restateOnFx", unit()) : t("restateOffFx", unit()));
  if (!explain) {
    const opts = el("span", "opts");
    opts.setAttribute("role", "group");
    opts.setAttribute("aria-label", t("commits"));
    for (const [v, label] of [["auto", t("commitAuto")], ["suggest", t("commitOnly")]]) {
      const b = el("button", null, label);
      b.setAttribute("aria-pressed", String(s.commit === v));
      b.onclick = () => s.commit !== v && saveSetting({commit: v});
      opts.append(b);
    }
    const seg = el("span", "seg");
    seg.append(opts);
    card(t("commits"), seg, s.commit === "auto" ? t("commitAutoFx") : t("commitOnlyFx"));
  }
  for (const b of box.querySelectorAll("button")) b.disabled = !connected;
  if (!explain) items.push(plan.approved ? el("span", "ok", t("approved")) : el("span", "wait", t("awaiting")));
  items.push(box);
  document.getElementById("badges").replaceChildren(...items);
  renderBar();
}

// The step the agent is on, or the one waiting for the user.
const activeStep = (p) => (p?.steps || []).find((s) => s.status === "doing" || yourTurn(s)) || null;

function renderBar() {
  const extra = [];
  const list = steps();
  if (plan.mode !== "explain" && plan.approved && list.length) {
    const a = activeStep(plan);
    const all = list.every((s) => s.status === "done");
    if (a || all) {
      // Answered and waiting for the agent is no longer the user's turn.
      const i = list.indexOf(a) + 1, review = a && a.status !== "doing" && !answered(a);
      const more = list.filter((s) => yourTurn(s) && !answered(s)).length - (review ? 1 : 0);
      const b = el("button", "progress " + (all ? "done" : review ? "review" : "doing"),
        all ? t("progDone", list.length) : t(review ? "progReview" : "progDoing", i, list.length, a.title) + (more > 0 ? ` (+${more})` : ""));
      if (a) b.onclick = () => {
        selectStep(a.id);
        if (review) openSide({kind: "step", id: a.id});
      };
      extra.push(b);
    }
  }
  renderTalksBtn();
  if ((plan.mode ?? "build") === "build" && !plan.approved && connected && steps().length) {
    const sent = approvePending();
    const b = el("button", "primary", sent ? t("approveSent") : "✓ " + t("approve"));
    b.disabled = sent;
    b.title = t("quickTip");
    b.onclick = async (e) => {
      e.stopPropagation();
      if (!approveOk()) return;
      b.disabled = true;
      try {
        await send({}, "approve", t("q_approve"));
        b.textContent = t("approveSent");
      } catch {
        b.disabled = false;
      }
    };
    extra.push(b);
  }
  const n = changes.nodes.size + changes.steps.size + changes.notes.length;
  if (n) {
    const b = el("button", "changes", t("changedN", n));
    b.onclick = (e) => {
      e.stopPropagation();
      showChangeList();
    };
    extra.push(b);
  }
  document.getElementById("barExtra").replaceChildren(...extra);
}

// What a step in review still waits for: a restatement, then (when the user commits) the commit.
// Approved and not yet answered: the agent replying (e.g. with a question) gives the button back.
const approvePending = () => {
  const i = thread.findLastIndex((m) => m.kind === "approve" && m.from !== "agent");
  return i >= 0 && !thread.slice(i + 1).some((m) => m.from === "agent");
};
const approveOk = () => !proposals().length || confirm(t("approveOpen", proposals().length));

// A step whose answer (restatement or commit) was sent and is waiting for the agent.
const answered = (step) => thread.some((m, i) => m.step === step.id && !m.node && ["teachback", "commit", "committed"].includes(m.kind) &&
  !thread.slice(i + 1).some((x) => x.from === "agent" && x.step === step.id && !x.node));

function yourTurn(step) {
  if (snapshot || step?.status !== "review") return null;
  if (teachBackOn(plan) && !step.confirmed) return "turnRestate";
  if (plan.mode !== "explain" && plan.settings?.commit === "suggest") return "turnCommit";
  // Restating off and the agent commits itself: nothing waits for the user.
  return null;
}

// The agent's suggested commits (one or several, each with its files), editable; the user commits through the agent or says they did it themselves.
let commitShown = null;
function commitBox(step) {
  const list = Array.isArray(step.commits) && step.commits.length ? step.commits : [{message: step.commitMessage ?? ""}];
  const box = el("div", "commitbox");
  box.append(el("div", "lbl", list.length > 1 ? t("commitsLabel", list.length) : t("commitLabel")));
  const areas = list.map((c, i) => {
    const key = `commit:${step.id}:${i}`;
    const item = el("div", "citem");
    const ta = el("textarea");
    ta.dataset.key = key;
    ta.value = drafts[key] ?? c.message ?? "";
    ta.placeholder = t("noCommitMsg");
    ta.oninput = () => {
      drafts[key] = ta.value;
      now.disabled = areas.some((a) => !a.value.trim());
    };
    if (list.length > 1) {
      const head = el("div", "chead");
      head.append(el("span", "cnum", String(i + 1)), t("commitN", i + 1, list.length));
      item.append(head);
    }
    item.append(ta);
    if (c.files?.length) {
      const files = el("div", "cfiles");
      c.files.forEach((f) => files.append(el("code", null, f)));
      item.append(el("div", "flabel", t("filesN", c.files.length)), files);
    }
    box.append(item);
    return ta;
  });
  const now = el("button", "primary", t(list.length > 1 ? "commitNow" : "commitNow1"));
  const mine = el("button", null, t("committed"));
  const note = el("span", "note");
  const go = async (kind, text, extra) => {
    now.disabled = mine.disabled = true;
    try {
      await send({step: step.id}, kind, text, extra);
      note.textContent = t("sent");
    } catch (e) {
      note.textContent = t("sendFail") + e.message;
      now.disabled = areas.some((a) => !a.value.trim());
      mine.disabled = false;
    }
  };
  now.disabled = areas.some((a) => !a.value.trim());
  now.onclick = () => {
    const commits = list.map((c, i) => ({message: areas[i].value.trim(), ...(c.files?.length ? {files: c.files} : {})}));
    go("commit", commits.map((c) => c.message).join("\n\n"), {commits});
  };
  mine.onclick = () => go("committed", t("q_committed"));
  const row = el("div", "row");
  row.append(now, mine, note);
  box.append(row);
  return box;
}

// The main column explains; everything you answer or decide opens in the side panel.
function renderStepCard() {
  const card = document.getElementById("stepcard");
  if (isDesign()) return renderOptionCard();
  const step = curStep();
  const talk = (ctx, label, n) => {
    const b = el("button", "talklink", label);
    b.onclick = () => openSide(ctx);
    return b;
  };
  if (!step) {
    const approve = (plan.mode ?? "build") === "build" && !plan.approved;
    const waitingStep = steps().find((s) => yourTurn(s));
    if (!approve && waitingStep) {
      const c = el("div", "stepcard review");
      const b = el("button", "turnbtn", `👉 ${unit(true)} ${steps().indexOf(waitingStep) + 1}: ${waitingStep.title} · ${t(yourTurn(waitingStep), unit())}`);
      b.onclick = () => {
        selectStep(waitingStep.id);
        openSide({kind: "step", id: waitingStep.id});
      };
      c.append(b);
      card.replaceChildren(c);
      return refreshThreads();
    }
    if (!approve) {
      card.replaceChildren();
      return refreshThreads();
    }
    const c = el("div", "stepcard review");
    const b = el("button", "turnbtn", "👉 " + t("turnApprove"));
    b.onclick = () => openSide({kind: "plan"});
    c.append(b);
    card.replaceChildren(c);
    return refreshThreads();
  }
  const explain = plan.mode === "explain";
  const turn = yourTurn(step);
  const c = el("div", "stepcard " + (turn ? "review" : ""));
  const h = el("h3", null, `${unit(true)} ${steps().indexOf(step) + 1}: ${step.title}`);
  // Before approval every step is only proposed: no status to show yet.
  const st = !explain && (plan.approved || (plan.mode ?? "build") !== "build") && (turn ? "review" : step.status === "done" || step.confirmed && step.status !== "doing" ? "done" : step.status === "doing" ? "doing" : step.status ? "todo" : null);
  if (st) h.append(el("span", "sbadge " + st, (st === "done" ? "✓ " : "") + t("sb_" + st)));
  if (step.confirmed && step.status !== "done") h.append(el("span", "passed", t("restated")));
  c.append(h);
  if (st === "doing") {
    const line = el("div", "implementing");
    const dots = el("span", "dots");
    dots.append(el("i"), el("i"), el("i"));
    line.append(dots, t("implementing"));
    c.append(line);
  }
  if (step.detail) c.append(richEl("p", "detail", step.detail));
  if (step.done) c.append(richEl("p", "donewhen", (explain ? t("understoodWhen") : t("doneWhen")) + step.done));
  if (turn) {
    const b = el("button", "turnbtn", answered(step) ? "✓ " + t("sentWait") : "👉 " + t(turn, unit()));
    b.onclick = () => openSide({kind: "step", id: step.id});
    c.append(b);
  } else {
    const n = thread.filter((m) => inCtx(m, {step: step.id}) && m.kind !== "settings").length;
    // With restating on in explain mode, every stage offers it right on the card.
    if (explain && teachBackOn(plan) && !step.confirmed) {
      const b = el("button", "turnbtn", t("restateThis", unit()));
      b.onclick = () => {
        picked[`step:${step.id}|${step.status}`] = "teachback";
        openSide({kind: "step", id: step.id});
      };
      c.append(b);
    }
    c.append(talk({kind: "step", id: step.id}, t("talkStep", n, unit())));
    if (stepMoves(step).length) {
      const again = el("button", "talklink mv-again", "↻ " + t("replayStep"));
      again.onclick = () => {
        stop();
        startStory();
      };
      c.append(again);
    }
  }
  card.replaceChildren(c);
  refreshThreads();
}

const PROP_TYPES = ["add", "change", "remove"];
const propOf = (n) => (PROP_TYPES.includes(n?.proposal?.type) ? n.proposal : null);
const proposals = () => Object.entries(plan?.nodes || {}).filter(([, n]) => propOf(n));

// ---------- design mode: options, a comparison by weighted criteria, constraints and sources
const BASIS_KEYS = ["iac", "cli", "doc", "assumed"];
const MODES_SHOWN = ["build", "explain", "design"];
const isDesign = () => plan?.mode === "design";
const options = () => (isDesign() && Array.isArray(plan.options) ? plan.options.filter((o) => o?.id) : []);
const criteria = () => (Array.isArray(plan?.criteria) ? plan.criteria.filter((c) => c?.id) : []);
let optionId = null;
const curOption = () => options().find((o) => o.id === optionId) || options().find((o) => o.id === plan.decision?.option) || options().find((o) => o.recommended) || options()[0] || null;
const cell = (o, c) => plan.scores?.[o]?.[c] || null;
const sourceNo = (id) => (plan.sources || []).findIndex((x) => x?.id === id) + 1;
const unconfirmed = () => (plan.constraints || []).filter((c) => c && !c.confirmed).length + Object.values(plan.nodes || {}).filter((n) => n?.basis === "assumed").length;

function totals() {
  return Object.fromEntries(options().map((o) => {
    let got = 0, max = 0;
    for (const c of criteria()) {
      // A missing score counts as 0, so leaving a cell out never lifts an option; "na" leaves the criterion out.
      const w = c.weight ?? 1, r = cell(o.id, c.id)?.rating, v = ratingValue(r) ?? 0;
      if (!w || r === "na") continue;
      got += w * v;
      max += w * 5;
    }
    return [o.id, max ? Math.round((got / max) * 100) : null];
  }));
}

function chooseOption(id) {
  optionId = id;
  viewId = curOption()?.view || viewId;
  renderView();
  renderStepCard();
  renderCompare();
}

function sourceLink(src) {
  const a = el("a", null, `[${sourceNo(src.id)}] ${src.title || src.url} ↗`);
  if (!/^https?:\/\//.test(src.url || "")) return el("span", null, a.textContent.replace(/ ↗$/, ""));
  a.href = src.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  return a;
}

function ratingEl(r) {
  if (r === "yes") return el("span", "yes", "✓");
  if (r === "no") return el("span", "no", "✗");
  const v = ratingValue(r);
  if (v == null) return el("span", "na", "—");
  return el("span", "dots", "●".repeat(Math.round(v)) + "○".repeat(5 - Math.round(v)));
}

function renderConstraints() {
  const bar = document.getElementById("constraints");
  const list = (plan.constraints || []).filter((c) => c?.id);
  bar.hidden = !list.length;
  if (!list.length) return;
  const parts = [el("span", "clabel", t("constraintsLabel"))];
  for (const c of list) {
    const chip = el("span", "cchip" + (c.confirmed ? "" : " assumed"), (c.confirmed ? "✓ " : "❓ ") + c.text);
    if (!c.confirmed) chip.title = t("assumedTip");
    parts.push(chip);
  }
  const check = el("button", "talklink", t("checkCons"));
  check.style.marginTop = "0";
  check.onclick = () => openSide({kind: "constraints"});
  parts.push(check);
  bar.replaceChildren(...parts);
}

function renderOptionCard() {
  const card = document.getElementById("stepcard");
  const o = curOption();
  if (!o) return card.replaceChildren();
  const c = el("div", "stepcard optcard");
  const h = el("h3", null, o.title);
  if (o.recommended) h.append(el("span", "orec", t("recommended")));
  c.append(h);
  if (o.summary) c.append(richEl("p", "detail", o.summary));
  if (o.why) c.append(richEl("p", "why", o.why));
  const d = plan.decision;
  if (d?.option) {
    const mine = d.option === o.id;
    const box = el("div", "decided" + (mine ? "" : " other"), mine ? t("decided", o.title) : t("notChosen"));
    // Who chose and when: from the decision, else from the user's "decide" message.
    const asked = thread.findLast((m) => m.kind === "decide" && m.option === d.option && m.from !== "agent");
    const when = d.at || asked?.at;
    if (mine && (d.by || when)) box.append(el("div", "dwho", [d.by, when && new Date(when).toLocaleString(dateLocale(), {dateStyle: "medium", timeStyle: "short"})].filter(Boolean).join(" · ")));
    const why = mine ? d.why : d.not?.[o.id];
    if (why) box.append(el("div", null, why));
    // The record in one place: why the others lost, and the plan the choice became.
    if (mine) {
      for (const [id, reason] of Object.entries(d.not || {})) {
        const other = options().find((x) => x.id === id);
        if (other && typeof reason === "string") box.append(el("div", "dnot", `✗ ${other.title}: ${reason}`));
      }
      for (const l of (plan.links || []).filter((x) => /^https?:\/\//.test(x?.url || ""))) {
        const a = el("a", "dlink", "→ " + (l.title || l.url));
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        box.append(a);
      }
    }
    c.append(box);
  } else {
    const acts = el("div", "acts");
    const go = el("button", "primary", t("choose"));
    go.onclick = () => openSide({kind: "decide", id: o.id});
    const ask = el("button", "talklink", "💬 " + t("askOption", o.title).replace(/…$/, ""));
    ask.style.marginTop = "0";
    ask.onclick = () => openSide({kind: "option", id: o.id});
    acts.append(go, ask);
    c.append(acts);
  }
  card.replaceChildren(c);
  refreshThreads();
}

function renderCompare() {
  const box = document.getElementById("compare");
  if (!isDesign() || !options().length || !criteria().length) return box.replaceChildren();
  const pct = totals(), out = Object.fromEntries(options().map((o) => [o.id, failsMust(plan, o.id).length > 0]));
  const best = Math.max(...options().filter((o) => !out[o.id] && pct[o.id] != null).map((o) => pct[o.id]));
  const cur = curOption()?.id;
  const wrap = el("div", "cmp");
  wrap.append(el("h4", null, t("compareTitle")));
  const table = el("table"), head = el("tr");
  // The dots under each criterion are its weight; say so once, where the eye starts.
  head.append(el("th", "whead", t(snapshot ? "weightHeadRO" : "weightHead")));
  for (const o of options()) {
    const th = el("th", (o.id === cur ? "sel" : "") + (out[o.id] ? " out" : ""), (o.recommended ? "★ " : "") + o.title);
    th.style.cursor = "pointer";
    th.onclick = () => chooseOption(o.id);
    head.append(th);
  }
  const thead = el("thead");
  thead.append(head);
  const tbody = el("tbody");
  for (const c of criteria()) {
    const tr = el("tr"), th = el("th", null, c.label);
    const w = c.weight ?? 1;
    const wb = el("button", "wbtn", "●".repeat(w) + "○".repeat(3 - w));
    wb.title = t("weightTip");
    th.append(el("span", "wtext", ` ×${w}`));
    wb.onclick = async () => {
      const next = (w + 1) % 4;
      c.weight = next;
      renderCompare();
      renderView();
      await fetch("/api/settings?token=" + encodeURIComponent(token), {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({weights: {[c.id]: next}})}).catch(() => {});
    };
    if (c.must) th.append(" ", el("span", "must", t("must")));
    const guess = (plan.constraints || []).filter((k) => k && !k.confirmed && Array.isArray(k.affects) && k.affects.includes(c.id));
    if (guess.length) {
      const q = el("span", "cguess", " ❓");
      q.title = t("restsOn") + guess.map((k) => k.text).join("; ");
      th.append(q);
    }
    th.append(el("br"), wb);
    tr.append(th);
    for (const o of options()) {
      const x = cell(o.id, c.id);
      const td = el("td", (o.id === cur ? "sel" : "") + (out[o.id] ? " out" : ""));
      td.append(ratingEl(x?.rating));
      for (const s of x?.sources || []) if (sourceNo(s)) td.append(el("sup", null, `[${sourceNo(s)}]`));
      if (x?.value) td.append(el("div", "cval", String(x.value)));
      td.onclick = () => openSide({kind: "cell", option: o.id, criterion: c.id});
      tr.append(td);
    }
    tbody.append(tr);
  }
  const foot = el("tr");
  foot.append(el("th", null, t(snapshot ? "totalShared" : "total")));
  for (const o of options()) {
    if (out[o.id]) {
      const td = el("td", (o.id === cur ? "sel " : "") + "out", "✗ " + t("failsMust"));
      td.title = failsMust(plan, o.id).map((id) => criteria().find((c) => c.id === id)?.label || id).join(", ");
      foot.append(td);
      continue;
    }
    const td = el("td", (o.id === cur ? "sel " : "") + (pct[o.id] === best ? "best" : ""), pct[o.id] == null ? "—" : pct[o.id] + "%");
    const meter = el("span", "meter"), fill = el("i");
    fill.style.width = (pct[o.id] || 0) + "%";
    meter.append(fill);
    td.append(meter);
    foot.append(td);
  }
  const tfoot = el("tfoot");
  tfoot.append(foot);
  table.append(thead, tbody, tfoot);
  wrap.append(table, el("p", "cmplegend", t("ratingLegend")));
  // When the user's weights (or a failed must) put another option ahead of the agent's pick, say so and offer a re-check.
  const rec = options().find((o) => o.recommended);
  const lead = options().find((o) => !out[o.id] && pct[o.id] === best);
  if (rec && lead && lead.id !== rec.id && !plan.decision?.option && (out[rec.id] || pct[lead.id] > pct[rec.id])) {
    const note = el("div", "cmpnote", t(out[rec.id] ? "recFails" : snapshot ? "leadShared" : "leadNote", lead.title, rec.title));
    const ask = el("button", null, t("askRecheck"));
    ask.onclick = async () => {
      ask.disabled = true;
      // The answer comes in the plan's conversation: open it where it will appear.
      openSide({kind: "plan"});
      await send({}, "question", t("q_recheck", lead.title, rec.title)).catch(() => (ask.disabled = false));
    };
    note.append(ask);
    wrap.append(note);
  }
  box.replaceChildren(wrap);
}

function renderSources() {
  const box = document.getElementById("sources");
  const list = (plan.sources || []).filter((x) => x?.id && /^https?:\/\//.test(x.url || ""));
  box.hidden = !list.length;
  if (!list.length) return;
  const ol = el("ol");
  for (const src of list) {
    const li = el("li"), a = el("a", null, (src.title || src.url) + " ↗");
    a.href = src.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    li.append(a);
    if (src.checked) li.append(" ", el("small", null, t("checkedOn", src.checked)));
    ol.append(li);
  }
  box.replaceChildren(el("summary", null, t("sourcesTitle", list.length)), ol);
}

function renderDesignPanel() {
  const title = document.getElementById("sideTitle");
  const p = document.getElementById("panel");
  const opt = options().find((o) => o.id === (side.option || side.id));
  const parts = [];
  if (side.kind === "constraints") {
    title.textContent = t("consTitle");
    const list = el("div", "proplist");
    for (const c of (plan.constraints || []).filter((x) => x?.id)) {
      const row = el("div", "propcard");
      row.append(el("p", null, (c.confirmed ? "✓ " : "❓ ") + c.text));
      if (!c.confirmed) {
        row.append(...answerGuess({}, c.text, {constraint: c.id}));
      }
      list.append(row);
    }
    parts.push(list, talkBox({}, {placeholder: t("ph_propose_plan"), modes: ["propose", "question"]}));
  } else if (side.kind === "cell") {
    const c = criteria().find((x) => x.id === side.criterion);
    if (!opt || !c) return closeSide();
    title.textContent = `${c.label} · ${opt.title}`;
    const x = cell(opt.id, c.id);
    const big = el("div", "cellbig");
    big.append(ratingEl(x?.rating));
    parts.push(big);
    if (x?.note) parts.push(richEl("p", "why", x.note));
    const srcs = (x?.sources || []).map((s) => (plan.sources || []).find((y) => y?.id === s)).filter(Boolean);
    if (srcs.length) {
      const ul = el("ul", "linklist");
      for (const src of srcs) {
        const li = el("li");
        li.append(sourceLink(src));
        if (src.checked) li.append(" ", el("small", null, t("checkedOn", src.checked)));
        ul.append(li);
      }
      parts.push(ul);
    }
    parts.push(talkBox({option: opt.id, criterion: c.id}, {placeholder: t("cellAsk", c.label, opt.title), modes: ["question", "propose"]}));
  } else if (side.kind === "decide") {
    if (!opt) return closeSide();
    title.textContent = t("decideTitle", opt.title);
    const n = unconfirmed();
    if (n) {
      const warn = el("div", "warnbox", "⚠ " + t("decideWarn", n));
      const items = [...(plan.constraints || []).filter((c) => c?.id && !c.confirmed).map((c) => [c.text, {}, {constraint: c.id}]),
        ...Object.entries(plan.nodes || {}).filter(([, x]) => x?.basis === "assumed").map(([id, x]) => [x.name || id, {node: id}, {}])];
      const ul = el("ul", "unconf");
      for (const [text, c, extra] of items) {
        const li = el("li", null, "❓ " + text + " ");
        li.append(...answerGuess(c, text, extra));
        ul.append(li);
      }
      warn.append(ul);
      parts.push(warn);
    }
    const ta = el("textarea");
    ta.placeholder = t("decideReason");
    ta.dataset.key = "decide:" + opt.id;
    ta.value = drafts[ta.dataset.key] || "";
    ta.oninput = () => (drafts[ta.dataset.key] = ta.value);
    const go = el("button", "primary", t("decideSend"));
    go.onclick = async () => {
      go.disabled = true;
      const weights = Object.fromEntries(criteria().map((c) => [c.id, c.weight ?? 1]));
      await send({}, "decide", ta.value.trim() || t("q_decide", opt.title), {option: opt.id, weights}).catch(() => (go.disabled = false));
    };
    const talk = el("div", "talk decideform");
    talk.append(ta, go);
    const thr = el("div", "thread");
    thr.dataset.ctx = "{}";
    parts.push(talk, thr);
  } else {
    if (!opt) return closeSide();
    title.textContent = opt.title;
    parts.push(talkBox({option: opt.id}, {placeholder: t("askOption", opt.title), modes: ["question", "propose"]}));
  }
  fillPanel(p, parts);
  refreshThreads();
}

// A guess (an unconfirmed constraint or box) is either right or wrong; "wrong" asks the agent to find out what is true.
function answerGuess(c, text, extra) {
  const ok = el("button", null, t("confirm")), no = el("button", null, t("wrongGuess"));
  const go = (wrong) => async () => {
    ok.disabled = no.disabled = true;
    await send(c, "confirm", t(wrong ? "q_wrong" : "q_confirm", text), wrong ? {...extra, wrong: true} : extra).catch(() => (ok.disabled = no.disabled = false));
  };
  ok.onclick = go(false);
  no.onclick = go(true);
  return [ok, " ", no];
}

let side = null;

const sideKey = (c) => JSON.stringify([c.kind, c.id ?? null, c.option ?? null, c.criterion ?? null]);

// A box taken out of the plan is still known by the name its messages carry.
const inPlan = (id) => Object.hasOwn(plan.nodes, id);
const boxName = (id) => plan.nodes[id]?.name || thread.findLast((m) => m.node === id && m.nodeName)?.nodeName || id;

function sideTitle(c) {
  const opt = options().find((o) => o.id === (c.option || c.id));
  if (c.kind === "node") return boxName(c.id);
  if (c.kind === "step") {
    const st = steps().find((s) => s.id === c.id);
    return st ? `${unit(true)} ${steps().indexOf(st) + 1}: ${st.title}` : c.id;
  }
  if (c.kind === "cell") return `${criteria().find((x) => x.id === c.criterion)?.label || c.criterion} · ${opt?.title || c.option}`;
  if (c.kind === "option" || c.kind === "decide") return opt?.title || c.id;
  return t({props: "propsTitle", constraints: "consTitle"}[c.kind] || "wholePlan");
}

// The panel that holds a message's conversation.
const sideOf = (m) => (m.node ? {kind: "node", id: m.node} : m.step ? {kind: "step", id: m.step} : m.option ? (m.criterion ? {kind: "cell", option: m.option, criterion: m.criterion} : {kind: "option", id: m.option}) : {kind: "plan"});

function openSide(ctx) {
  side = ctx;
  if (ctx.kind !== "node") nodeId = null;
  else nodeId = ctx.id;
  const was = document.body.classList.contains("side-open");
  document.getElementById("side").inert = false;
  document.body.classList.add("side-open");
  renderSide();
  highlight();
  // Open on the latest message, as a chat does.
  requestAnimationFrame(() => document.querySelectorAll("#side .thread").forEach((x) => (x.scrollTop = x.scrollHeight)));
  // Once the page column has narrowed, keep the box you clicked in sight.
  setTimeout(() => {
    scrollHints();
    document.querySelector("#view .active")?.scrollIntoView({block: "nearest", inline: "nearest", behavior: "smooth"});
  }, was ? 0 : 320);
}

function closeSide() {
  side = null;
  nodeId = null;
  document.getElementById("side").inert = true;
  document.body.classList.remove("side-open");
  highlight();
  setTimeout(scrollHints, 320);
}

// A panel with a conversation keeps the box's explanation at the top and the chat under it, each scrolling on its own,
// so a long conversation never pushes the explanation away.
// Narrow, details and chat each fold away under their heading (either or both; remembered), and a folded part says so.
// Wide (⤢), the two sit side by side and nothing folds.
const folded = {info: store.get("walkboard.fold.info") === "1", chat: store.get("walkboard.fold.chat") === "1"};
// Fold or unfold smoothly: measure every part before and after, then slide each from one height to the other.
// What is closing stays drawn (and fades) until it is gone; what opens grows from nothing.
function morph(p, change) {
  const pa = p.querySelector(".pa"), pb = p.querySelector(".pb"), info = pa?.querySelector(".pinfo"), th = pb?.querySelector(".thread");
  const parts = [pa, pb, info, th].filter(Boolean);
  const box = (e) => {
    const cs = getComputedStyle(e);
    return {height: e.getBoundingClientRect().height, shown: cs.display !== "none", pt: cs.paddingTop, pb: cs.paddingBottom, mb: cs.marginBottom};
  };
  // Measured first, so a click in the middle of a slide starts from where things are now.
  const before = parts.map(box);
  parts.forEach((e) => e.getAnimations().forEach((a) => a.cancel()));
  p.classList.remove("morph");
  [info, th].forEach((e) => e?.classList.remove("closing"));
  change();
  const after = parts.map(box);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || innerWidth < 820) return;
  const closing = [info, th].filter((e) => e && before[parts.indexOf(e)].shown && !after[parts.indexOf(e)].shown);
  closing.forEach((e) => e.classList.add("closing"));
  p.classList.add("morph");
  // Hold the last frame until the classes are back, so the end never flashes.
  const opts = {duration: 300, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards"};
  const runs = parts.map((e, i) => {
    const a = before[i], b = after[i];
    if (e === pa || e === pb) return e.animate([{height: a.height + "px"}, {height: b.height + "px"}], opts);
    const open = {height: (b.shown ? b : a).height + "px", opacity: 1, paddingTop: (b.shown ? b : a).pt, paddingBottom: (b.shown ? b : a).pb, marginBottom: (b.shown ? b : a).mb};
    const shut = {height: "0px", opacity: 0, paddingTop: "0px", paddingBottom: "0px", marginBottom: "0px"};
    if (a.shown && !b.shown) return e.animate([{...open, height: a.height + "px"}, shut], opts);
    if (!a.shown && b.shown) return e.animate([shut, open], opts);
    return e.animate([{height: a.height + "px"}, {height: b.height + "px"}], opts);
  });
  Promise.all(runs.map((r) => r.finished)).then(() => {
    p.classList.remove("morph");
    closing.forEach((e) => e.classList.remove("closing"));
    runs.forEach((r) => r.cancel());
  }, () => {});
}

function fillPanel(p, parts) {
  p.classList.remove("fold-info", "fold-chat", "split");
  const i = parts.findIndex((x) => x?.classList?.contains("talk") && !x.classList.contains("decideform"));
  // What waits for the user (your turn, the commit) sits with the chat, by the buttons that answer it.
  const act = (x) => x?.classList?.contains("turn") || x?.classList?.contains("commitbox");
  const explain = parts.slice(0, Math.max(i, 0)).filter((x) => !act(x));
  if (i < 0 || !explain.length) return p.replaceChildren(...parts);
  const info = el("div", "pinfo");
  info.append(...explain);
  const head = (which, label) => {
    const b = el("button", "fold");
    b.dataset.fold = which;
    b.append(el("span", "chev", "▾"), el("span", "lbl", label));
    b.append(el("span", "fhint", t("foldedHint")));
    b.onclick = () => {
      folded[which] = !folded[which];
      store.set("walkboard.fold." + which, folded[which] ? "1" : "");
      b.setAttribute("aria-expanded", String(!folded[which]));
      morph(p, () => p.classList.toggle("fold-" + which, folded[which]));
    };
    b.setAttribute("aria-expanded", String(!folded[which]));
    return b;
  };
  const a = el("div", "pcol pa"), b = el("div", "pcol pb");
  a.append(head("info", t("foldInfo")), info);
  b.append(head("chat", t("foldChat")), ...parts.slice(0, i).filter(act), ...parts.slice(i));
  p.classList.add("split");
  p.classList.toggle("fold-info", folded.info);
  p.classList.toggle("fold-chat", folded.chat);
  p.replaceChildren(a, b);
  // Fade the bottom edge while there is more explanation to scroll to.
  const more = () => info.classList.toggle("more", info.scrollTop + info.clientHeight < info.scrollHeight - 4);
  info.onscroll = more;
  new ResizeObserver(more).observe(info);
}

function renderSide() {
  if (!side) return;
  const title = document.getElementById("sideTitle");
  const p = document.getElementById("panel");
  if (side.kind === "node") return renderNodePanel(side.id);
  if (side.kind === "props") return renderPropsPanel();
  if (side.kind === "option" || side.kind === "decide" || side.kind === "cell" || side.kind === "constraints") return renderDesignPanel();
  if (side.kind === "step") {
    const step = steps().find((s) => s.id === side.id);
    if (!step) return closeSide();
    title.textContent = `${unit(true)} ${steps().indexOf(step) + 1}: ${step.title}`;
    const turn = yourTurn(step);
    const parts = [];
    if (turn) parts.push(el("span", "turn", answered(step) ? t("sentWait") : t(turn, unit())));
    if (turn === "turnCommit" && !answered(step)) {
      const box = commitBox(step);
      parts.push(box);
      // The suggested commits appear after a restatement passes: bring them into view once.
      if (commitShown !== step.id) requestAnimationFrame(() => box.scrollIntoView({block: "nearest", behavior: "smooth"}));
      commitShown = step.id;
    }
    const teach = teachBackOn(plan) && ((step.status ?? "todo") !== "todo" || plan.mode === "explain");
    parts.push(talkBox({step: step.id}, {
      placeholder: t(plan.mode === "explain" ? "askStage" : "askStep"),
      quick: plan.mode === "explain" ? ["confused", "deeper"] : thread.some((m) => m.from === "agent" && m.step === step.id && !m.node) ? ["confused"] : [],
      modes: teach && (turn === "turnRestate" || plan.mode === "explain") ? ["teachback", "question", "propose"] : ["question", "propose"],
      mode: turn === "turnRestate" ? "teachback" : "question",
      phase: step.status + (step.confirmed ? "+" : ""),
    }));
    fillPanel(p, parts);
  } else {
    title.textContent = t("wholePlan");
    const approve = (plan.mode ?? "build") === "build" && !plan.approved && !approvePending() && steps().length ? ["approve"] : [];
    const parts = approve.length ? [el("span", "turn", t("turnApprove"))] : [];
    parts.push(talkBox({}, {placeholder: t("askPlan"), quick: approve, modes: ["question", "propose"]}));
    fillPanel(p, parts);
  }
  refreshThreads();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function arrow() {
  const a = el("div", "arrow");
  a.innerHTML = '<svg viewBox="0 0 26 14" aria-hidden="true"><line x1="1" y1="7" x2="20" y2="7"/><path d="M17 2l6 5-6 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  return a;
}

// Glyphs are walkboard's own constants; plan text never goes into innerHTML.
function iconEl(n, id, family) {
  const ic = iconOf(n, id, family);
  if (!ic || !GLYPHS[ic.glyph]) return null;
  const f = FAMILIES[ic.family];
  const s = el("span", "icon" + (f ? " fam" : ""));
  if (f) {
    s.style.background = f.bg;
    s.style.color = f.fg;
    s.title = f.label;
  }
  s.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${GLYPHS[ic.glyph]}</svg>`;
  return s;
}

function nodeBox(id, family = null) {
  const n = plan.nodes[id];
  if (!n) return el("div", "node todo", `? ${id}`);
  // A design draws options that do not exist yet: neutral boxes unless a status is given.
  const status = NODE_STATUS[n.status] ? n.status : plan.mode === "explain" ? "done" : plan.mode === "design" ? "plain" : "todo";
  const d = el("div", "node " + status);
  d.dataset.id = id;
  d.tabIndex = 0;
  d.setAttribute("role", "button");
  const pr = propOf(n);
  if (pr) {
    d.classList.add("prop", "prop-" + pr.type);
    d.append(el("span", "pbadge", t("pb_" + pr.type)));
  }
  const head = el("div", "nhead");
  const ic = iconEl(n, id, family);
  if (ic) head.append(ic);
  const st = el("span", "st", (plan.mode === "explain" ? EXPLAIN_MARK : MARK)[status]);
  st.title = statusLabel(status);
  st.setAttribute("aria-label", statusLabel(status));
  head.append(breakable(el("div", "name"), n.name), st);
  d.append(head);
  if (n.what) d.append(richEl("div", "what", n.what, true));
  if (pr?.note) d.append(richEl("div", "pnote", "→ " + (pr.note.length > 60 ? pr.note.slice(0, 58) + "…" : pr.note), true));
  if (BASIS_KEYS.includes(n.basis)) {
    d.classList.add("basis-" + n.basis);
    const m = el("span", "bmark", t("b_" + n.basis));
    if (n.basis === "assumed") m.title = t("assumedTip");
    d.append(m);
  }
  d.onclick = () => selectNode(id);
  d.onkeydown = (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    selectNode(id);
  };
  return d;
}

function renderFlow(v) {
  const wrap = el("div");
  for (const lane of v.lanes || []) {
    const box = el("div", "lane");
    if (lane.title) box.append(richEl("div", "lane-title", lane.title));
    const row = el("div", "row");
    (lane.nodes || []).forEach((id, i) => {
      if (i > 0 && lane.arrows !== false) row.append(arrow());
      else if (i > 0) row.append(el("div", "gap"));
      row.append(nodeBox(id));
    });
    const sc = el("div", "scroll");
    sc.append(row);
    box.append(sc);
    wrap.append(box);
  }
  return wrap;
}

let linkDrawer = null, linkObserver = null;
// Pictures add their line drawers; one observer redraws them all when anything resizes.
function addDrawer(fn, container) {
  const prev = linkDrawer;
  linkDrawer = () => {
    prev?.();
    fn();
  };
  (linkObserver ||= new ResizeObserver(() => linkDrawer?.())).observe(container);
}

// Labels (ports, notes) sit on the box the link reaches, not on the line; the same label from several boxes is one chip with a count.
function viaChips(container, links) {
  for (const l of links || []) {
    const b = l.label && container.querySelector(`[data-anchor="${CSS.escape(l.to)}"]`);
    if (!b) continue;
    const row = b.querySelector(":scope > .vias") || b.appendChild(el("div", "vias"));
    const state = LINK_STATE_KEYS.includes(l.state) ? l.state : "ok";
    const tip = `${plan.nodes[l.from]?.name || l.from} → ${plan.nodes[l.to]?.name || l.to}`;
    const same = [...row.children].find((c) => c.dataset.label === l.label && c.dataset.state === state);
    if (same) {
      same.dataset.n = (Number(same.dataset.n) || 1) + 1;
      same.textContent = `← ${l.label} ×${same.dataset.n}`;
      same.title += "\n" + tip;
      continue;
    }
    const chip = el("span", "via via-" + state, "← " + l.label);
    chip.dataset.label = l.label;
    chip.dataset.state = state;
    chip.title = tip;
    row.append(chip);
  }
}

// The SVG under a picture's boxes that its links are drawn on; clear() resizes it to the picture and returns the picture's rectangle.
function linkLayer(container) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.classList.add("links");
  container.append(svg);
  svg.clear = () => {
    svg.setAttribute("width", container.scrollWidth);
    svg.setAttribute("height", container.scrollHeight);
    svg.replaceChildren();
    return container.getBoundingClientRect();
  };
  return svg;
}

// A link is a line plus its head; the head is never dashed.
function linkPaths(svg, line, head, cls, dim, ends) {
  for (const [d, extra] of [[line, ""], [head, " head"]]) {
    const e = document.createElementNS(svg.namespaceURI, "path");
    e.setAttribute("d", d);
    if (!extra && ends) [e.dataset.from, e.dataset.to] = ends;
    e.setAttribute("class", cls + extra);
    if (extra) e.style.strokeDasharray = "none";
    if (dim) e.style.opacity = ".15";
    svg.append(e);
  }
}

function drawLinks(container, specs) {
  const svg = linkLayer(container);
  const box = (id) => container.querySelector(`[data-anchor="${CSS.escape(id)}"]`);
  const draw = () => {
    const base = svg.clear();
    const step = curStep();
    const inStep = step ? new Set(step.nodes || []) : null;
    const fan = {}, fanIn = {};
    for (const l of specs) if (!l.down) {
      (fan[l.from] ||= []).push(l);
      (fanIn[l.to] ||= []).push(l);
    }
    const ns = container.querySelector(".ns")?.getBoundingClientRect();
    const lanes = {};
    for (const l of specs) {
      const a = box(l.from)?.getBoundingClientRect(), b = box(l.to)?.getBoundingClientRect();
      if (!a || !b) continue;
      let d, head;
      if (l.down) {
        const x = a.left + a.width / 2 - base.left, y1 = a.bottom - base.top, y2 = b.top - base.top - 2;
        d = `M${x} ${y1} L${x} ${y2}`;
        head = `M${x - 4} ${y2 - 7} L${x} ${y2} L${x + 4} ${y2 - 7}`;
      } else {
        const out = fan[l.from], k = out.indexOf(l), into = fanIn[l.to], j = into.indexOf(l);
        const x2 = b.left - base.left - 4;
        const y1 = a.top + (Math.min(a.height, 120) * 0.8 * (k + 1)) / (out.length + 1) - base.top;
        const y2 = b.top + (Math.min(b.height, 90) * (j + 1)) / (into.length + 1) - base.top;
        // Leave the namespace on a straight line, so a link never runs along its border.
        const leave = ns && a.right <= ns.right && b.left >= ns.right ? ns.right - base.left + 14 : a.right - base.left;
        const x1 = a.right - base.left, dx = Math.max(20, (x2 - leave) / 2);
        d = `M${x1} ${y1} L${leave} ${y1} C${leave + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
        head = l.state === "blocked" ? `M${x2} ${y2 - 6} L${x2} ${y2 + 6}` : `M${x2 - 7} ${y2 - 4} L${x2} ${y2} L${x2 - 7} ${y2 + 4}`;
      }
      // The usual line unless it would run through another box; then around it.
      if (!l.down) {
        const others = [...container.querySelectorAll("[data-id]")].filter((e) => e !== box(l.from) && e !== box(l.to) && !e.contains(box(l.from)) && !e.contains(box(l.to))).map((e) => e.getBoundingClientRect());
        // Boxes one above the other: side to side would cut across both of them.
        const stacked = a.left < b.right && b.left < a.right;
        if (stacked || lineHits(d, others, base.left, base.top).hits) {
          routeLine.dx = base.left;
          routeLine.dy = base.top;
          const o = (x, y) => `${x - base.left} ${y - base.top}`;
          const route = routeLine(a, b, others, lanes, o);
          d = route.d;
          const [tx, ty] = route.tip, tip = (k) => o(tx - 7 * Math.cos(route.ang + k), ty - 7 * Math.sin(route.ang + k));
          head = l.state === "blocked" ? `M${o(tx - 6 * Math.sin(route.ang), ty + 6 * Math.cos(route.ang))} L${o(tx + 6 * Math.sin(route.ang), ty - 6 * Math.cos(route.ang))}` : `M${tip(0.45)} L${o(tx, ty)} L${tip(-0.45)}`;
        }
      }
      const dim = inStep && !(inStep.has(l.from) && (inStep.has(l.to) || l.to === "#namespace"));
      linkPaths(svg, d, head, `l-${l.state || "uses"}`, dim, [l.from, l.to]);
    }
  };
  addDrawer(draw, container);
}

function anchored(id, elx = nodeBox(id)) {
  elx.dataset.anchor = id;
  return elx;
}

function linkLegend(states, uses) {
  const lg = el("div", "linklegend");
  if (uses) lg.append(el("span", null, t("usesLegend")));
  lg.append(el("span", null, t("viaLegend")));
  const color = {ok: "var(--done-bd)", todo: "var(--new-bd)", blocked: "var(--warn-bd)"};
  for (const st of states) {
    const sp = el("span", null, (st === "ok" ? "━ " : "╍ ") + t("lk_" + st));
    sp.style.color = color[st];
    lg.append(sp);
  }
  return lg;
}

function renderK8s(v) {
  const scroll = el("div", "scroll");
  const states = [...new Set((v.links || []).map((l) => l.state || "ok"))];
  const uses = (v.outside || []).length || (v.workloads || []).some((w) => (w.uses || []).length);
  if (states.length || uses) scroll.append(linkLegend(states, uses));
  const grid = el("div", "k8s diagram");
  const outside = el("div", "col");
  (v.outside || []).forEach((id) => outside.append(anchored(id)));
  const ns = el("div", "ns");
  ns.dataset.anchor = "#namespace";
  ns.append(el("div", "ns-title", [v.namespace && `namespace ${v.namespace}`, v.cluster && `cluster ${v.cluster}`].filter(Boolean).join(" · ") || "namespace"));
  const nsGrid = el("div", "ns-grid");
  const configs = el("div", "col");
  (v.configs || []).forEach((id) => configs.append(anchored(id, nodeBox(id, "k8s"))));
  const policy = el("div", "policy" + (v.policy ? "" : " none"));
  if (v.policy) {
    const pl = el("span", "plabel");
    pl.append(iconEl(plan.nodes[v.policy] || {}, v.policy, "k8s") || "🛡", plan.nodes[v.policy]?.name || v.policy);
    pl.dataset.id = v.policy;
    pl.tabIndex = 0;
    pl.setAttribute("role", "button");
    pl.onclick = () => selectNode(v.policy);
    policy.append(pl);
  }
  for (const w of v.workloads || []) {
    const b = anchored(w.node, nodeBox(w.node, "k8s"));
    if (w.containers?.length) {
      const c = el("div", "containers");
      w.containers.forEach((name) => c.append(el("span", null, name)));
      b.append(c);
    }
    policy.append(b);
  }
  nsGrid.append(configs, policy);
  ns.append(nsGrid);
  const targets = el("div", "col");
  (v.targets || []).forEach((id) => targets.append(anchored(id)));
  grid.append(outside, ns, targets);
  scroll.append(grid);
  const specs = [];
  const out = v.outside || [];
  out.forEach((id, i) => specs.push(i < out.length - 1 ? {from: id, to: out[i + 1], down: true, state: "uses"} : {from: id, to: "#namespace", state: "uses"}));
  for (const w of v.workloads || []) for (const u of w.uses || []) specs.push({from: u, to: w.node, state: "uses"});
  for (const l of v.links || []) specs.push({...l, state: l.state || "ok"});
  viaChips(grid, v.links);
  drawLinks(grid, specs);
  const wrap = el("div");
  wrap.append(scroll);
  const listed = (v.links || []).filter((l) => l.label || (l.state && l.state !== "ok"));
  if (listed.length) {
    const ul = el("ul", "linklist");
    for (const l of listed) {
      const li = el("li");
      li.append(`${plan.nodes[l.from]?.name || l.from} → ${plan.nodes[l.to]?.name || l.to} · ${t("lk_" + (l.state || "ok"))}`);
      if (l.label) li.append(" · ", rich(l.label));
      ul.append(li);
    }
    wrap.append(ul);
  }
  return wrap;
}

function renderSequence(v) {
  const actors = v.actors || [];
  // Wide enough for the longest word of a name, so names never break in the middle of a word.
  const word = Math.max(0, ...actors.flatMap((id) => String(plan.nodes[id]?.name || id).match(/[\w./-]+/g) || []).map((w) => w.length));
  const cols = `repeat(${actors.length}, minmax(${Math.min(260, Math.max(130, word * 8 + 64))}px, 1fr))`;
  const scroll = el("div", "scroll");
  const seq = el("div", "seq");
  seq.style.minWidth = actors.length * 150 + "px";
  const head = el("div", "seq-head");
  head.style.gridTemplateColumns = cols;
  actors.forEach((id) => head.append(nodeBox(id)));
  seq.append(head);
  // Rows of bare lifelines keep the lines unbroken around a group's frame and label.
  const spacer = () => {
    const row = el("div", "seq-row spacer");
    row.style.gridTemplateColumns = cols;
    actors.forEach((_, c) => {
      const cell = el("div", "seq-cell");
      cell.style.gridColumn = String(c + 1);
      row.append(cell);
    });
    return row;
  };
  let group = null, groupName = null;
  (v.messages || []).forEach((m, i) => {
    if ((m.group || null) !== groupName) {
      groupName = m.group || null;
      group = null;
      if (groupName) {
        group = el("div", "seq-group");
        group.append(richEl("span", "glabel", groupName), spacer());
        seq.append(spacer(), group);
      }
    }
    const row = el("div", "seq-row");
    row.style.gridTemplateColumns = cols;
    actors.forEach((_, c) => {
      const cell = el("div", "seq-cell");
      cell.style.gridColumn = String(c + 1);
      row.append(cell);
    });
    const a = actors.indexOf(m.from), b = actors.indexOf(m.to);
    const msg = el("div", "seq-msg");
    if (m.step) msg.dataset.step = m.step;
    const lbl = el("div", "lbl");
    lbl.append(el("span", "num", String(i + 1)), richEl("span", "t", m.text || ""));
    if (a === b) {
      msg.classList.add("self");
      // On the last lifeline the note opens to the left, where there is room.
      if (a === actors.length - 1 && actors.length > 1) msg.classList.add("last");
      msg.style.gridColumn = String(a + 1);
      msg.append(lbl);
    } else {
      const lo = Math.min(a, b), span = Math.abs(a - b) + 1;
      msg.classList.add(a < b ? "right" : "left");
      if (m.reply) msg.classList.add("reply");
      msg.style.gridColumn = `${lo + 1} / span ${span}`;
      msg.style.margin = `0 calc(50% / ${span})`;
      msg.append(lbl, el("div", "line"));
    }
    const target = m.node || m.to;
    msg.title = t("seeBox", plan.nodes[target]?.name || target);
    msg.onclick = () => selectNode(target);
    row.append(msg);
    (group || seq).append(row);
  });
  scroll.append(seq);
  return scroll;
}

function renderTransform(v) {
  const wrap = el("div", "tf");
  (v.stages || []).forEach((st, i) => {
    if (i > 0) wrap.append(arrow());
    const n = plan.nodes[st.node] || {name: st.node};
    const card = el("div", "stage");
    if (st.columns) card.style.flexBasis = Math.max(230, st.columns.length * 120) + "px";
    card.dataset.id = st.node;
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.onclick = () => selectNode(st.node);
    const head = el("div", "shead");
    const ic = iconEl(n, st.node);
    if (ic) head.append(ic);
    head.append(el("span", "sname " + (NODE_STATUS[n.status] ? n.status : "todo"), n.name));
    if (st.label) head.append(el("span", "slabel", st.label));
    card.append(head);
    if (st.columns) {
      const table = el("table"), tr = el("tr");
      st.columns.forEach((c) => tr.append(el("th", null, c)));
      table.append(tr);
      if (!(st.rows || []).length) {
        const row = el("tr"), td = el("td", "empty", t("noRows"));
        td.colSpan = st.columns.length;
        row.append(td);
        table.append(row);
      }
      for (const r of st.rows || []) {
        const row = el("tr");
        r.forEach((c) => row.append(el("td", null, c == null || c === "" ? "∅" : String(c).replace(/^ +| +$/g, (sp) => "␠".repeat(sp.length)))));
        table.append(row);
      }
      const tbl = el("div", "tbl");
      tbl.append(table);
      card.append(tbl);
    }
    if (st.text) card.append(el("pre", null, st.text));
    if (st.notes?.length) {
      const ul = el("ul", "snote");
      st.notes.forEach((t) => ul.append(richEl("li", null, t)));
      card.append(ul);
    }
    wrap.append(card);
  });
  return wrap;
}

// ---------- map: zones inside zones, links routed between boxes on whichever sides face each other
function zoneEl(z, depth) {
  const box = el("div", `zone z${Math.min(depth, 3)}`);
  const head = el("div", "zhead");
  const ic = iconEl({name: z.label, icon: z.icon}, "", null);
  if (ic) head.append(ic);
  head.append(richEl("span", null, z.label || ""));
  if (z.note) head.append(el("small", null, z.note));
  const body = el("div", "zbody" + (z.stack ? " stack" : ""));
  for (const c of (z.zones || []).filter((x) => x && typeof x === "object")) body.append(zoneEl(c, depth + 1));
  for (const id of z.nodes || []) body.append(anchored(id));
  box.append(head, body);
  return box;
}

// How much of a line runs through the given boxes. dx, dy: from the line's coordinates to the screen's.
function lineHits(d, boxes, dx = 0, dy = 0) {
  const probe = document.createElementNS("http://www.w3.org/2000/svg", "path");
  probe.setAttribute("d", d);
  const len = probe.getTotalLength();
  let hits = 0;
  for (let at = 0; at <= len; at += 6) {
    const p = probe.getPointAtLength(at), x = p.x + dx, y = p.y + dy;
    if (boxes.some((r) => x > r.left - 3 && x < r.right + 3 && y > r.top - 3 && y < r.bottom + 3)) hits++;
  }
  return {hits, len};
}

// A line between two boxes that goes around the others: across when the way is clear, else along a lane
// below, above or beside them. Lanes are shared per draw (lanes), so lines running the same way stay apart.
function routeLine(a, b, others, lanes = {}, o = (x, y) => `${x} ${y}`) {
  const ax = a.left + a.width / 2, ay = a.top + a.height / 2, bx = b.left + b.width / 2, by = b.top + b.height / 2;
  const between = (lo, hi, f) => others.filter((r) => f(r, lo, hi));
  const inX = (r, lo, hi) => r.right > lo && r.left < hi, inY = (r, lo, hi) => r.bottom > lo && r.top < hi;
  const xs = [Math.min(a.left, b.left), Math.max(a.right, b.right)], ys = [Math.min(a.top, b.top), Math.max(a.bottom, b.bottom)];
  const elbow = (p, q, r, s, rad = 8) => {
    // p → corner q → corner r → s, with rounded corners.
    const toward = (u, v) => {
      const d = Math.hypot(v[0] - u[0], v[1] - u[1]) || 1, k = Math.min(rad, d / 2) / d;
      return [u[0] + (v[0] - u[0]) * k, u[1] + (v[1] - u[1]) * k];
    };
    return `M${o(...p)} L${o(...toward(q, p))} Q${o(...q)} ${o(...toward(q, r))} L${o(...toward(r, q))} Q${o(...r)} ${o(...toward(r, s))} L${o(...s)}`;
  };
  const candidates = [];
  if (Math.abs(bx - ax) >= Math.abs(by - ay)) {
    const dir = bx > ax ? 1 : -1, x1 = dir > 0 ? a.right : a.left, x2 = dir > 0 ? b.left - 4 : b.right + 4;
    const dx = Math.max(24, Math.abs(x2 - x1) / 2) * dir;
    candidates.push({kind: "direct", d: `M${o(x1, ay)} C${o(x1 + dx, ay)}, ${o(x2 - dx, by)}, ${o(x2, by)}`, tip: [x2, by], ang: dir > 0 ? 0 : Math.PI});
  } else {
    const dir = by > ay ? 1 : -1, y1 = dir > 0 ? a.bottom : a.top, y2 = dir > 0 ? b.top - 4 : b.bottom + 4;
    const dy = Math.max(20, Math.abs(y2 - y1) / 2) * dir;
    candidates.push({kind: "direct", d: `M${o(ax, y1)} C${o(ax, y1 + dy)}, ${o(bx, y2 - dy)}, ${o(bx, y2)}`, tip: [bx, y2], ang: dir > 0 ? Math.PI / 2 : -Math.PI / 2});
  }
  // Leave and arrive off centre, so a line going one way and one coming back do not share a point.
  const sx = bx > ax ? 1 : -1, sy = by > ay ? 1 : -1;
  const px = ax + sx * a.width * 0.22, qx = bx - sx * b.width * 0.22, py = ay + sy * a.height * 0.22, qy = by - sy * b.height * 0.22;
  const under = Math.max(a.bottom, b.bottom, ...between(...xs, inX).map((r) => r.bottom)) + 12 + 9 * (lanes.under || 0);
  candidates.push({kind: "under", d: elbow([px, a.bottom], [px, under], [qx, under], [qx, b.bottom + 4]), tip: [qx, b.bottom + 4], ang: -Math.PI / 2});
  const over = Math.min(a.top, b.top, ...between(...xs, inX).map((r) => r.top)) - 12 - 9 * (lanes.over || 0);
  candidates.push({kind: "over", d: elbow([px, a.top], [px, over], [qx, over], [qx, b.top - 4]), tip: [qx, b.top - 4], ang: Math.PI / 2});
  const right = Math.max(a.right, b.right, ...between(...ys, inY).map((r) => r.right)) + 12 + 9 * (lanes.right || 0);
  candidates.push({kind: "right", d: elbow([a.right, py], [right, py], [right, qy], [b.right + 4, qy]), tip: [b.right + 4, qy], ang: Math.PI});
  const left = Math.min(a.left, b.left, ...between(...ys, inY).map((r) => r.left)) - 12 - 9 * (lanes.left || 0);
  candidates.push({kind: "left", d: elbow([a.left, py], [left, py], [left, qy], [b.left - 4, qy]), tip: [b.left - 4, qy], ang: 0});
  // Through the nearest gap: around one side, or out of one side and into the facing side of the other box.
  const step = (kind) => 14 + 9 * (lanes[kind] || 0);
  const nearUnder = Math.max(a.bottom, b.bottom) + step("near-under"), nearOver = Math.min(a.top, b.top) - step("near-over");
  const nearRight = Math.max(a.right, b.right) + step("near-right"), nearLeft = Math.min(a.left, b.left) - step("near-left");
  candidates.push({kind: "near-under", d: elbow([px, a.bottom], [px, nearUnder], [qx, nearUnder], [qx, b.bottom + 4]), tip: [qx, b.bottom + 4], ang: -Math.PI / 2});
  candidates.push({kind: "near-over", d: elbow([px, a.top], [px, nearOver], [qx, nearOver], [qx, b.top - 4]), tip: [qx, b.top - 4], ang: Math.PI / 2});
  candidates.push({kind: "near-right", d: elbow([a.right, py], [nearRight, py], [nearRight, qy], [b.right + 4, qy]), tip: [b.right + 4, qy], ang: Math.PI});
  candidates.push({kind: "near-left", d: elbow([a.left, py], [nearLeft, py], [nearLeft, qy], [b.left - 4, qy]), tip: [b.left - 4, qy], ang: 0});
  const across = (kind, xOrY, build) => candidates.push({kind, ...build(xOrY)});
  if (b.right < a.left) for (const [kind, x] of [["z-a", a.left - step("z-a")], ["z-b", b.right + step("z-b")]]) across(kind, x, (v) => ({d: elbow([a.left, py], [v, py], [v, qy], [b.right + 4, qy]), tip: [b.right + 4, qy], ang: Math.PI}));
  if (b.left > a.right) for (const [kind, x] of [["z-a", a.right + step("z-a")], ["z-b", b.left - step("z-b")]]) across(kind, x, (v) => ({d: elbow([a.right, py], [v, py], [v, qy], [b.left - 4, qy]), tip: [b.left - 4, qy], ang: 0}));
  if (b.top > a.bottom) for (const [kind, y] of [["z-c", a.bottom + step("z-c")], ["z-d", b.top - step("z-d")]]) across(kind, y, (v) => ({d: elbow([px, a.bottom], [px, v], [qx, v], [qx, b.top - 4]), tip: [qx, b.top - 4], ang: Math.PI / 2}));
  if (b.bottom < a.top) for (const [kind, y] of [["z-c", a.top - step("z-c")], ["z-d", b.bottom + step("z-d")]]) across(kind, y, (v) => ({d: elbow([px, a.top], [px, v], [qx, v], [qx, b.bottom + 4]), tip: [qx, b.bottom + 4], ang: -Math.PI / 2}));
  // Fewest boxes crossed, then the shortest; the direct line wins whenever it is clear.
  let best = null;
  for (const c of candidates) {
    const {hits, len} = lineHits(c.d, others, routeLine.dx, routeLine.dy);
    const score = hits * 1e5 + len;
    if (!best || score < best.score) best = {...c, score};
  }
  if (best.kind !== "direct") lanes[best.kind] = (lanes[best.kind] || 0) + 1;
  return best;
}

function renderMap(v) {
  const scroll = el("div", "scroll");
  const states = [...new Set((v.links || []).map((l) => l.state || "ok"))];
  if (states.length) scroll.append(linkLegend(states, false));
  // Many boxes: smaller ones, and zones stay side by side, so the whole system fits in one look.
  const many = new Set(KINDS.map.refs(v)).size > 12;
  const map = el("div", "map diagram" + ((v.links || []).length ? " linked" : "") + (many ? " dense" : ""));
  for (const z of (v.zones || []).filter((x) => x && typeof x === "object")) map.append(zoneEl(z, 0));
  scroll.append(map);
  viaChips(map, v.links);
  const svg = linkLayer(map);
  const draw = () => {
    const base = svg.clear();
    const inStep = curStep() ? new Set(curStep().nodes || []) : null;
    const rects = {}, lanes = {};
    for (const e of map.querySelectorAll("[data-anchor]")) rects[e.dataset.anchor] = e.getBoundingClientRect();
    const all = Object.values(rects);
    for (const l of v.links || []) {
      const a = rects[l.from], b = rects[l.to];
      if (!a || !b) continue;
      const o = (x, y) => `${x - base.left} ${y - base.top}`;
      routeLine.dx = base.left;
      routeLine.dy = base.top;
      const route = routeLine(a, b, all.filter((r) => r !== a && r !== b), lanes, o);
      const [x2, y2] = route.tip, ang = route.ang;
      const tip = (k) => o(x2 - 7 * Math.cos(ang + k), y2 - 7 * Math.sin(ang + k));
