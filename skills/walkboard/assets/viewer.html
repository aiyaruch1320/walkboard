      const head = l.state === "blocked" ? `M${o(x2 - 6 * Math.sin(ang), y2 + 6 * Math.cos(ang))} L${o(x2 + 6 * Math.sin(ang), y2 - 6 * Math.cos(ang))}` : `M${tip(0.45)} L${o(x2, y2)} L${tip(-0.45)}`;
      linkPaths(svg, route.d, head, `l-${l.state || "ok"}`, inStep && !(inStep.has(l.from) && inStep.has(l.to)), [l.from, l.to]);
    }
  };
  addDrawer(draw, map);
  return scroll;
}

// ---------- journey: one piece of data moving stop by stop; each stop shows the data there, changes marked
const journeyAt = {}, journeyPos = {};
let journeyTimer = null;

function renderJourney(v) {
  const stops = (v.stops || []).filter((s) => s?.node);
  const i = Math.min(journeyAt[v.id] ?? 0, stops.length - 1);
  const wrap = el("div", "journey");
  const scroll = el("div", "scroll");
  const track = el("div", "jtrack");
  stops.forEach((s, k) => {
    if (k) track.append(arrow());
    const b = nodeBox(s.node);
    b.classList.toggle("jhere", k === i);
    b.classList.toggle("jpast", k < i);
    track.append(b);
  });
  const packet = el("div", "jpacket", "✉ " + (v.item || "data"));
  track.append(packet);
  scroll.append(track);
  // The envelope starts where it was and slides to this stop.
  const target = () => {
    const here = track.querySelector(".jhere");
    return here && {left: here.offsetLeft + here.offsetWidth / 2 - packet.offsetWidth / 2, top: here.offsetTop - packet.offsetHeight - 6};
  };
  const put = (p) => {
    packet.style.left = p.left + "px";
    packet.style.top = p.top + "px";
  };
  requestAnimationFrame(() => {
    const to = target();
    if (!to) return;
    put(journeyPos[v.id] || to);
    track.querySelector(".jhere")?.scrollIntoView({block: "nearest", inline: "center", behavior: "smooth"});
    requestAnimationFrame(() => {
      packet.classList.add("ready");
      put(to);
      journeyPos[v.id] = to;
    });
  });
  new ResizeObserver(() => {
    const to = target();
    if (to && packet.classList.contains("ready")) {
      put(to);
      journeyPos[v.id] = to;
    }
  }).observe(track);
  const go = (k) => {
    journeyAt[v.id] = Math.max(0, Math.min(stops.length - 1, k));
    renderView();
  };
  const bar = el("div", "jbar");
  const prev = el("button", null, "◀"), next = el("button", null, "▶"), play = el("button", "primary", journeyTimer ? "❚❚" : t("jPlay"));
  prev.onclick = () => { clearInterval(journeyTimer); journeyTimer = null; go(i - 1); };
  next.onclick = () => { clearInterval(journeyTimer); journeyTimer = null; go(i + 1); };
  play.onclick = () => {
    if (journeyTimer) {
      clearInterval(journeyTimer);
      journeyTimer = null;
      return renderView();
    }
    if (i >= stops.length - 1) journeyAt[v.id] = 0;
    journeyTimer = setInterval(() => {
      const at = journeyAt[v.id] ?? 0;
      if (at >= stops.length - 1 || plan.views.find((x) => x.id === viewId)?.id !== v.id) {
        clearInterval(journeyTimer);
        journeyTimer = null;
        return renderView();
      }
      go(at + 1);
    }, 2400);
    renderView();
  };
  bar.append(prev, el("span", "jpos", t("jStop", i + 1, stops.length)), next, play);
  // A trailing comma or spacing is not a change.
  const norm = (l) => l.trim().replace(/,$/, "");
  const s = stops[i], before = new Set(String(stops[i - 1]?.data ?? "").split("\n").map(norm));
  const card = el("div", "jcard");
  card.append(el("div", "jtitle", plan.nodes[s.node]?.name || s.node));
  if (s.note) card.append(richEl("p", "jnote", s.note));
  if (s.data != null) {
    const pre = el("pre", "jdata");
    // Lines that were not there at the previous stop are what this stop changed.
    for (const line of String(s.data).split("\n")) pre.append(el("span", i && line.trim() && !before.has(norm(line)) ? "jnew" : null, line + "\n"));
    card.append(pre);
  }
  wrap.append(scroll, bar, card);
  return wrap;
}


// ---------- graphs: boxes in columns by distance from the start; back edges arc over, self loops loop
let pictureHook = null;
function bezierMid(p0, p1, p2, p3) {
  return [(p0[0] + 3 * p1[0] + 3 * p2[0] + p3[0]) / 8, (p0[1] + 3 * p1[1] + 3 * p2[1] + p3[1]) / 8];
}

function renderGraph(v, {ids, edges, starts = [], shape, wrap = false}) {
  const known = new Set(ids);
  edges = edges.filter((e) => known.has(e.from) && known.has(e.to));
  const out = {};
  edges.forEach((e) => (out[e.from] ||= []).push(e));
  const incoming = new Set(edges.filter((e) => e.from !== e.to).map((e) => e.to));
  // Edges that close a cycle are drawn as arcs; the rest set the columns by longest path,
  // so a box always sits right of everything that leads to it.
  const roots = starts.filter((x) => known.has(x));
  const seeds = [...(roots.length ? roots : ids.filter((x) => !incoming.has(x))), ...ids];
  const back = new Set(), state = {}, order = [];
  const visit = (x) => {
    state[x] = 1;
    for (const e of out[x] || []) {
      if (state[e.to] === 1) back.add(e);
      else if (!state[e.to]) visit(e.to);
    }
    state[x] = 2;
    order.unshift(x);
  };
  for (const x of seeds) if (!state[x]) visit(x);
  const depth = {};
  for (const x of order) depth[x] ??= 0;
  for (const x of order) for (const e of out[x] || []) if (!back.has(e) && e.from !== e.to) depth[e.to] = Math.max(depth[e.to] ?? 0, depth[x] + 1);
  order.sort((a, b) => depth[a] - depth[b]);
  const cols = {};
  for (const id of order) (cols[depth[id]] ||= []).push(id);
  // Within a column, sit next to what leads in (fewer crossings).
  const at = {};
  for (const d of Object.keys(cols).map(Number).sort((a, b) => a - b)) {
    const pred = (id) => edges.filter((e) => e.to === id && e.from !== id && !back.has(e) && at[e.from] != null).map((e) => at[e.from]);
    const key = (id) => (pred(id).length ? pred(id).reduce((a, b) => a + b, 0) / pred(id).length : cols[d].indexOf(id));
    cols[d].sort((a, b) => key(a) - key(b)).forEach((id, i) => (at[id] = i));
  }
  // A long chain wider than the screen continues on the next row (wrap), like lines of text.
  const nCols = Object.keys(cols).length;
  const fit = Math.max(2, Math.floor(((document.getElementById("view")?.clientWidth || 900) + 120) / 330));
  const per = wrap && nCols > fit ? fit : nCols, tall = Math.max(...Object.values(cols).map((l) => l.length));
  const band = (x) => Math.floor(depth[x] / per);
  const grid = el("div", "graph diagram" + (per < nCols ? " wrapped" : ""));
  grid.style.gridTemplateColumns = `repeat(${per}, minmax(150px, 210px))`;
  for (const [d, list] of Object.entries(cols)) list.forEach((id, i) => {
    const b = anchored(id);
    b.style.gridColumn = String((Number(d) % per) + 1);
    b.style.gridRow = String(Math.floor(Number(d) / per) * (tall + 1) + i + 1);
    shape?.(b, id, out[id] || []);
    grid.append(b);
  });
  for (let k = 1; k * per < nCols; k++) {
    const gap = el("div", "gband");
    gap.style.gridRow = String(k * (tall + 1));
    grid.append(gap);
  }
  const bandBottom = (k, base) => Math.max(...ids.filter((x) => band(x) === k).map(box).filter(Boolean).map((r) => r.bottom - base.top));
  const svg = linkLayer(grid);
  const labels = el("div", "elabels");
  grid.append(labels);
  const box = (id) => grid.querySelector(`[data-anchor="${CSS.escape(id)}"]`)?.getBoundingClientRect();
  const draw = () => {
    const base = svg.clear();
    labels.replaceChildren();
    const inStep = curStep() ? new Set(curStep().nodes || []) : null;
    let arcs = 0;
    const lanes = [];
    // Edges leaving or entering the same box spread along its side instead of sharing one point.
    const outs = {}, ins = {};
    for (const e of edges) if (e.from !== e.to) {
      (outs[e.from] ||= []).push(e);
      (ins[e.to] ||= []).push(e);
    }
    // Ports in the order of what is at the other end, so lines leaving one box never cross each other.
    const top = (id) => box(id)?.top ?? 0;
    for (const l of Object.values(outs)) l.sort((x, y) => top(x.to) - top(y.to));
    for (const l of Object.values(ins)) l.sort((x, y) => top(x.from) - top(y.from));
    const spread = (list, e, r) => r.top + (r.height * (list.indexOf(e) + 1)) / (list.length + 1);
    // A question is a hexagon: its sides slant 10px in, so a line meets the side where it really is.
    const isQ = (id) => grid.querySelector(`[data-anchor="${CSS.escape(id)}"]`)?.classList.contains("g-q");
    const slant = (id, r, y) => (isQ(id) ? (10 * Math.abs(y - (r.top + r.height / 2))) / (r.height / 2) : 0);
    for (const e of edges) {
      const a = box(e.from), b = box(e.to);
      if (!a || !b) continue;
      const P = (x, y) => [x - base.left, y - base.top];
      let p0, p1, p2, p3;
      if (e.from === e.to) {
        p0 = P(a.right - 22, a.bottom); p3 = P(a.right, a.bottom - 14); p1 = [p0[0] + 4, p0[1] + 34]; p2 = [p3[0] + 38, p3[1] + 6];
      } else if (band(e.to) > band(e.from) && !back.has(e)) {
        // On to the next row: out to the right, along the gap between the rows, in from the left.
        p0 = P(a.right, spread(outs[e.from], e, a)); p3 = P(b.left - 4, spread(ins[e.to], e, b));
        const y = bandBottom(band(e.from), base) + 39 + 6 * arcs, xr = p0[0] + 22 + 6 * arcs, xl = p3[0] - 26 - 6 * arcs++;
        p1 = p0; p2 = [xl, p3[1]];
        lanes.push({d: `M${p0} L${[xr, p0[1]]} L${[xr, y]} L${[xl, y]} L${[xl, p3[1]]} L${p3}`, mid: [(xr + xl) / 2, y], left: true});
      } else if (depth[e.to] > depth[e.from] && !back.has(e)) {
        const y0 = spread(outs[e.from], e, a), y3 = spread(ins[e.to], e, b);
        p0 = P(a.right - slant(e.from, a, y0), y0); p3 = P(b.left - 4 + slant(e.to, b, y3), y3);
        const dx = Math.max(30, (p3[0] - p0[0]) / 2);
        p1 = [p0[0] + dx, p0[1]]; p2 = [p3[0] - dx, p3[1]];
        // Skipping a column and a box is in the way: go around it, above or below.
        const between = ids.filter((x) => depth[x] > depth[e.from] && depth[x] < depth[e.to]).map(box).filter(Boolean).map((r) => [r.left - base.left, r.right - base.left, r.top - base.top, r.bottom - base.top]);
        const lo = Math.min(p0[1], p3[1]) - 8, hi = Math.max(p0[1], p3[1]) + 8;
        if (between.some(([, , top, bottom]) => bottom > lo && top < hi)) {
          const above = Math.min(...between.map((r) => r[2])) - 16 - 10 * arcs;
          const below = Math.max(...between.map((r) => r[3])) + 16 + 10 * arcs++;
          const y = Math.abs((p0[1] + p3[1]) / 2 - above) <= Math.abs((p0[1] + p3[1]) / 2 - below) ? above : below;
          const xa = Math.min(...between.map((r) => r[0])) - 20, xb = Math.max(...between.map((r) => r[1])) + 20;
          lanes.push({d: `M${p0} C${[xa, p0[1]]}, ${[xa, y]}, ${[xa + 10, y]} L${[xb - 10, y]} C${[xb, y]}, ${[xb, p3[1]]}, ${p3}`, mid: [(xa + xb) / 2, y]});
        }
      } else if (depth[e.to] === depth[e.from]) {
        // Same column: a bracket around the right side.
        p0 = P(a.right, a.top + a.height / 2); p3 = P(b.right + 4, b.top + b.height / 2);
        const out = Math.max(a.right, b.right) - base.left + 36 + 10 * arcs++;
        p1 = [out, p0[1]]; p2 = [out, p3[1]];
      } else {
        // Going back (a loop or a retry): arc over the boxes.
        const lift = 34 + 14 * arcs++;
        p0 = P(a.left + a.width / 2, a.top); p3 = P(b.left + b.width / 2 + 8, b.top - 4);
        p1 = [p0[0], Math.min(p0[1], p3[1]) - lift]; p2 = [p3[0], Math.min(p0[1], p3[1]) - lift];
      }
      const detour = lanes.pop();
      if (detour) p2 = [(detour.left ?? detour.mid[0] < p3[0]) ? p3[0] - 30 : p3[0] + 30, p3[1]];
      const ang = Math.atan2(p3[1] - p2[1], p3[0] - p2[0]);
      const tip = (k) => `${p3[0] - 7 * Math.cos(ang + k)} ${p3[1] - 7 * Math.sin(ang + k)}`;
      const dim = inStep && !(inStep.has(e.from) && inStep.has(e.to));
      const flat = (d) => d.replaceAll(",", " ").replace(/ +/g, " ");
      linkPaths(svg, flat(detour ? detour.d : `M${p0} C${p1}, ${p2}, ${p3}`), flat(`M${tip(0.45)} L${p3} L${tip(-0.45)}`), `l-${e.state || "flow"}`, dim, [e.from, e.to]);
      if (e.label) {
        const [mx, my] = detour ? detour.mid : bezierMid(p0, p1, p2, p3);
        const lab = el("span", "elabel" + (dim ? " dim" : ""));
        lab.append(rich(e.label));
        lab.style.left = mx + "px";
        lab.style.top = my + "px";
        labels.append(lab);
      }
    }
    // Labels that land on each other step down until each can be read.
    const placed = [];
    for (const lab of labels.children) {
      for (let k = 0; k < 6; k++) {
        const r = lab.getBoundingClientRect();
        const hit = placed.find((p) => r.left < p.right && r.right > p.left && r.top < p.bottom + 2 && r.bottom + 2 > p.top);
        if (!hit) break;
        lab.style.top = parseFloat(lab.style.top) + (hit.bottom - r.top) + 3 + "px";
      }
      placed.push(lab.getBoundingClientRect());
    }
  };
  addDrawer(draw, grid);
  const scroll = el("div", "scroll");
  scroll.append(grid);
  return scroll;
}

function renderState(v) {
  const ends = new Set(v.end || []);
  return renderGraph(v, {
    ids: [...new Set([...(v.states || []), ...(v.transitions || []).flatMap((x) => [x.from, x.to])])],
    edges: v.transitions || [],
    starts: v.start ? [v.start] : [],
    wrap: true,
    shape: (b, id) => {
      b.classList.add("g-state");
      if (id === v.start) b.prepend(el("span", "g-start", t("gStart")));
      if (ends.has(id)) b.classList.add("g-end");
    },
  });
}

function renderDecision(v) {
  return renderGraph(v, {
    ids: [...new Set([...(v.nodes || []), ...(v.edges || []).flatMap((x) => [x.from, x.to])])],
    edges: v.edges || [],
    starts: v.start ? [v.start] : [],
    shape: (b, id, outs) => b.classList.add(outs.length > 1 ? "g-q" : outs.length ? "g-do" : "g-out"),
  });
}

// "from" depends on "to". Opening a box shows what breaks if it goes down, and what it needs.
function renderImpact(v) {
  const edges = v.edges || [];
  const wrap = el("div");
  const banner = el("div", "impbar", t("impHint"));
  wrap.append(banner, renderGraph(v, {ids: [...new Set([...(v.nodes || []), ...edges.flatMap((x) => [x.from, x.to])])], edges, starts: v.start ? [v.start] : []}));
  const walk = (from, next) => {
    const seen = new Set(), todo = [from];
    while (todo.length) for (const x of next(todo.shift())) if (!seen.has(x)) {
      seen.add(x);
      todo.push(x);
    }
    seen.delete(from);
    return seen;
  };
  pictureHook = () => {
    const boxes = wrap.querySelectorAll("[data-id]");
    boxes.forEach((d) => d.classList.remove("imp-hit", "imp-need", "imp-me"));
    wrap.classList.toggle("imp-on", !!nodeId && [...boxes].some((d) => d.dataset.id === nodeId));
    if (!nodeId || ![...boxes].some((d) => d.dataset.id === nodeId)) return banner.replaceChildren(t("impHint"));
    const hit = walk(nodeId, (x) => edges.filter((e) => e.to === x).map((e) => e.from));
    const need = walk(nodeId, (x) => edges.filter((e) => e.from === x).map((e) => e.to));
    boxes.forEach((d) => d.classList.toggle("imp-me", d.dataset.id === nodeId) || d.classList.toggle("imp-hit", hit.has(d.dataset.id)) || d.classList.toggle("imp-need", need.has(d.dataset.id)));
    const name = (x) => plan.nodes[x]?.name || x;
    banner.replaceChildren(hit.size ? t("impHit", name(nodeId), hit.size, [...hit].map(name).join(", ")) : t("impNone", name(nodeId)));
  };
  return wrap;
}

// ---------- timeline: lanes on a time axis; points, spans and marks such as a timeout
function niceStep(range) {
  const raw = range / 8, mag = 10 ** Math.floor(Math.log10(raw || 1));
  return [1, 2, 5, 10].map((m) => m * mag).find((x) => x >= raw) || raw;
}

function renderTimeline(v) {
  const lanes = (v.lanes || []).filter((l) => l?.node);
  const times = lanes.flatMap((l) => (l.events || []).flatMap((e) => [e.at, e.to])).concat((v.marks || []).map((m) => m.at)).filter((x) => typeof x === "number");
  const min = Math.min(0, ...times), max = Math.max(...times, 1);
  const pos = (x) => ((x - min) / (max - min)) * 100 + "%";
  const step = niceStep(max - min);
  const wrap = el("div", "timeline");
  const axis = el("div", "tl-row tl-axis");
  const ticks = el("div", "tl-track");
  for (let x = Math.ceil(min / step) * step; x <= max + 1e-9; x += step) {
    const tk = el("span", "tl-tick", `${+x.toFixed(3)}${v.unit ? " " + v.unit : ""}`);
    tk.style.left = pos(x);
    ticks.append(tk);
  }
  for (const m of v.marks || []) {
    const mk = el("span", "tl-mlabel" + ((m.at - min) / (max - min) > 0.8 ? " end" : ""), m.label || "");
    mk.style.left = pos(m.at);
    ticks.append(mk);
  }
  axis.append(el("span"), ticks);
  wrap.append(axis);
  for (const l of lanes) {
    const row = el("div", "tl-row");
    const who = el("button", "tl-who");
    const ic = iconEl(plan.nodes[l.node] || {}, l.node);
    if (ic) who.append(ic);
    who.append(plan.nodes[l.node]?.name || l.node);
    who.dataset.id = l.node;
    who.onclick = () => selectNode(l.node);
    const track = el("div", "tl-track");
    for (const m of v.marks || []) {
      const line = el("span", "tl-mark");
      line.style.left = pos(m.at);
      track.append(line);
    }
    let lastPoint = -Infinity, flip = false;
    for (const e of l.events || []) {
      if (typeof e.at !== "number") continue;
      const state = LINK_STATE_KEYS.includes(e.state) ? e.state : "ok";
      if (typeof e.to === "number" && e.to > e.at) {
        const bar = el("span", "tl-span tl-" + state);
        bar.style.left = pos(e.at);
        bar.style.width = ((e.to - e.at) / (max - min)) * 100 + "%";
        const lab = el("span", "tl-slabel");
        lab.append(rich(e.label || ""));
        bar.append(lab);
        bar.title = e.label || "";
        track.append(bar);
        requestAnimationFrame(() => bar.classList.toggle("out", lab.scrollWidth > bar.clientWidth - 8));
      } else {
        // Points close together put their labels on alternate sides.
        flip = (e.at - lastPoint) / (max - min) < 0.12 ? !flip : false;
        lastPoint = e.at;
        const dot = el("span", "tl-point tl-" + state + (flip ? " low" : ""));
        dot.style.left = pos(e.at);
        const lab = el("span", "tl-plabel");
        lab.append(rich(e.label || ""));
        dot.append(lab);
        track.append(dot);
      }
    }
    // The bars belong to the box too: a click anywhere on the lane opens it.
    track.onclick = () => selectNode(l.node);
    track.style.cursor = "pointer";
    row.append(who, track);
    wrap.append(row);
  }
  const scroll = el("div", "scroll");
  scroll.append(wrap);
  return scroll;
}

// ---------- data model: tables, keys and relations between columns
function renderDataModel(v) {
  const tables = (v.tables || []).filter((x) => x?.node);
  // A column that points at another table is a foreign key, whatever "key" says: a shared primary key (1:1) is both PK and FK.
  const pointing = new Set([...tables.flatMap((tb) => (tb.columns || []).filter((c) => c?.ref).map((c) => `${tb.node}.${c.name}`)), ...(v.relations || []).map((r) => r?.from)]);
  const keyEl = (tb, c) => {
    if (c.copy) return el("span", "erkey copy", "⧉");
    const keys = [...new Set([...String(c.key || "").toUpperCase().split(/[\s,]+/).filter(Boolean), ...(pointing.has(`${tb.node}.${c.name}`) ? ["FK"] : [])])];
    const k = el("span", "erkey " + (keys.length > 1 ? "both" : (keys[0] || "").toLowerCase()));
    keys.forEach((x) => k.append(el("span", x.toLowerCase(), x)));
    return k;
  };
  const grid = el("div", "er diagram");
  // A table sits right of the tables it points to; tables pointing to the same one stack.
  const level = {};
  const lv = (tb, seen = new Set()) => {
    if (level[tb.node] != null) return level[tb.node];
    if (seen.has(tb.node)) return 0;
    seen.add(tb.node);
    const refs = (tb.columns || []).filter((c) => c.ref).map((c) => tables.find((x) => x.node === String(c.ref).split(".")[0])).filter((x) => x && x !== tb);
    return (level[tb.node] = refs.length ? 1 + Math.max(...refs.map((x) => lv(x, seen))) : 0);
  };
  tables.forEach((tb) => lv(tb));
  // Groups frame tables that belong together; in the automatic layout a group's tables stack in one column.
  const frameDefs = (v.groups || []).filter((g) => g?.label && Array.isArray(g.tables));
  const groupOf = {};
  frameDefs.forEach((g, i) => g.tables.forEach((id) => level[id] != null && groupOf[id] == null && (groupOf[id] = i)));
  frameDefs.forEach((g, i) => {
    const ids = g.tables.filter((id) => groupOf[id] === i);
    const m = Math.min(...ids.map((id) => level[id]));
    ids.forEach((id) => (level[id] = m));
  });
  const ordered = [];
  for (const tb of tables) if (!ordered.includes(tb)) ordered.push(...(groupOf[tb.node] == null ? [tb] : tables.filter((x) => groupOf[x.node] === groupOf[tb.node])));
  if (frameDefs.length) grid.classList.add("grouped");

  // Moving tables: the automatic layout until the first drag, then every table at its own x, y, saved in plan.json.
  const cards = () => [...grid.querySelectorAll(":scope > .ertable")];
  const canMove = () => !snapshot && served && innerWidth >= 820 && matchMedia("(pointer: fine)").matches;
  let free = false, dragged = false, keySave = null;
  const fit = () => {
    grid.style.width = Math.max(...cards().map((c) => c.offsetLeft + c.offsetWidth)) + 40 + "px";
    grid.style.height = Math.max(...cards().map((c) => c.offsetTop + c.offsetHeight)) + 30 + "px";
  };
  const freeze = () => {
    if (free) return;
    const at = cards().map((c) => [c, v.layout?.[c.dataset.id] || {x: c.offsetLeft, y: c.offsetTop}]);
    free = true;
    grid.classList.add("free");
    for (const [c, q] of at) {
      c.style.left = q.x + "px";
      c.style.top = q.y + "px";
    }
    fit();
  };
  const save = () => {
    // The picture starts at its top left corner: no empty band left where tables used to be.
    const at = cards().map((c) => [c, c.offsetLeft, c.offsetTop]);
    const dx = Math.min(...at.map((p) => p[1])) - (frameDefs.length ? 24 : 6), dy = Math.min(...at.map((p) => p[2])) - (frameDefs.length ? 44 : 10);
    if (dx || dy) shift(at.map(([c, x, y]) => [c, x - dx, y - dy]), 0, 0);
    const positions = Object.fromEntries(cards().map((c) => [c.dataset.id, {x: c.offsetLeft, y: c.offsetTop}]));
    v.layout = positions;
    reset.hidden = false;
    fetch("/api/layout?token=" + encodeURIComponent(token), {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({view: v.id, positions})}).catch(() => {});
  };
  const shift = (list, dx, dy) => {
    for (const [c, x, y] of list) {
      c.style.left = Math.max(0, x + dx) + "px";
      c.style.top = Math.max(0, y + dy) + "px";
    }
    fit();
    draw();
  };
  function movable(card, handle, members) {
    handle.addEventListener("pointerdown", (e) => {
      if (!canMove() || e.button !== 0) return;
      const sx = e.clientX, sy = e.clientY;
      let start = null;
      handle.setPointerCapture(e.pointerId);
      const move = (ev) => {
        if (!start) {
          if (Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 5) return;
          freeze();
          start = members().map((c) => [c, c.offsetLeft, c.offsetTop]);
          grid.classList.add("dragging");
        }
        shift(start, ev.clientX - sx, ev.clientY - sy);
      };
      const up = () => {
        for (const [n, fn] of [["pointermove", move], ["pointerup", up], ["pointercancel", up]]) handle.removeEventListener(n, fn);
        grid.classList.remove("dragging");
        if (!start) return;
        // The click that ends a drag does not open the table.
        dragged = true;
        setTimeout(() => (dragged = false));
        save();
      };
      for (const [n, fn] of [["pointermove", move], ["pointerup", up], ["pointercancel", up]]) handle.addEventListener(n, fn);
    });
    if (!card) return;
    // Arrow keys move a focused table (Shift: further); Enter still opens it.
    card.addEventListener("keydown", (e) => {
      const d = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]}[e.key];
      if (!d || !canMove() || e.altKey || e.metaKey || e.ctrlKey) return;
      e.preventDefault();
      e.stopPropagation();
      freeze();
      const k = e.shiftKey ? 40 : 10;
      shift([[card, card.offsetLeft, card.offsetTop]], d[0] * k, d[1] * k);
      clearTimeout(keySave);
      keySave = setTimeout(save, 500);
    });
    if (canMove()) handle.title = t("dragTip");
  }
  const reset = el("button", "talklink erreset", "↺ " + t("autoLayout"));
  reset.hidden = !v.layout || !canMove();
  reset.onclick = () => {
    delete v.layout;
    fetch("/api/layout?token=" + encodeURIComponent(token), {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({view: v.id, positions: null})}).catch(() => {});
    renderView();
  };
  const frames = frameDefs.map((g, i) => {
    const f = el("div", "erframe"), label = el("span", "erframe-label", g.label);
    f.append(label);
    movable(null, label, () => cards().filter((c) => groupOf[c.dataset.id] === i));
    grid.append(f);
    return [f, i];
  });
  const placeFrames = () => {
    for (const [f, i] of frames) {
      const members = cards().filter((c) => groupOf[c.dataset.id] === i);
      f.hidden = !members.length;
      if (!members.length) continue;
      const l = Math.min(...members.map((c) => c.offsetLeft)), tp = Math.min(...members.map((c) => c.offsetTop));
      const r = Math.max(...members.map((c) => c.offsetLeft + c.offsetWidth)), b = Math.max(...members.map((c) => c.offsetTop + c.offsetHeight));
      Object.assign(f.style, {left: l - 14 + "px", top: tp - 32 + "px", width: r - l + 28 + "px", height: b - tp + 46 + "px"});
    }
  };
  const rows = {};
  for (const tb of ordered) {
    const card = anchored(tb.node, el("div", "ertable"));
    card.dataset.id = tb.node;
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.onclick = () => !dragged && selectNode(tb.node);
    const head = el("div", "erhead");
    const ic = iconEl(plan.nodes[tb.node] || {}, tb.node);
    if (ic) head.append(ic);
    head.append(plan.nodes[tb.node]?.name || tb.node);
    const ul = el("ul");
    for (const c of tb.columns || []) {
      const li = el("li");
      li.dataset.col = `${tb.node}.${c.name}`;
      li.append(keyEl(tb, c), el("span", "ername", c.name), el("span", "ertype", c.type || ""));
      if (c.copy) li.classList.add("ercopy", ...(c.keep ? ["keep"] : []));
      if (c.note || c.copy) li.title = [c.copy && t("erCopyOf", c.copy), c.note].filter(Boolean).join("\n");
      ul.append(li);
    }
    card.append(head, ul);
    movable(card, head, () => [card]);
    card.style.gridColumn = String(level[tb.node] + 1);
    card.style.gridRow = String((rows[level[tb.node]] = (rows[level[tb.node]] || 0) + 1));
    grid.append(card);
  }
  const cols = (f) => tables.flatMap((tb) => (tb.columns || []).filter((c) => c?.[f]).map((c) => ({from: `${tb.node}.${c.name}`, to: c[f]})));
  // Copies point back to their original; a copy of a copy belongs to the same original.
  const copyOf = Object.fromEntries(cols("copy").map((r) => [r.from, r.to]));
  const root = (k, n = 0) => (copyOf[k] && n < 9 ? root(copyOf[k], n + 1) : k);
  const rels = [...cols("ref").map((r) => ({...r, kind: "N:1"})), ...(v.relations || []), ...cols("copy").map((r) => ({...r, copy: root(r.to)}))];
  // The same data kept in several places: one group per original. Its lines show only while you point at one of them.
  const groups = {};
  for (const r of cols("copy")) (groups[root(r.to)] ||= []).push(r.from);
  let lit = null;
  const light = (orig) => {
    lit = orig;
    grid.querySelectorAll("li[data-col]").forEach((li) => li.classList.toggle("same", !!orig && (li.dataset.col === orig || root(li.dataset.col) === orig)));
    svg.querySelectorAll(".l-copy").forEach((p) => p.classList.toggle("show", p.dataset.group === orig));
  };
  for (const [orig, copies] of Object.entries(groups)) for (const k of [orig, ...copies]) {
    const li = grid.querySelector(`[data-col="${CSS.escape(k)}"]`);
    if (!li) continue;
    li.onmouseenter = () => light(orig);
    li.onmouseleave = () => light(null);
  }
  const svg = linkLayer(grid);
  const row = (key) => grid.querySelector(`[data-col="${CSS.escape(key)}"]`)?.getBoundingClientRect();
  const draw = () => {
    if (v.layout && !free) freeze();
    placeFrames();
    const base = svg.clear();
    for (const r of rels) {
      const a = row(r.from), b = row(r.to);
      if (!a || !b) continue;
      const y1 = a.top + a.height / 2 - base.top, y2 = b.top + b.height / 2 - base.top;
      // Tables one above the other: leave and arrive on the right, a loop beside them, never across a table.
      const stacked = a.left < b.right && b.left < a.right;
      const right = stacked || b.left + b.width / 2 > a.left + a.width / 2;
      const x1 = (right ? a.right : a.left) - base.left, x2 = (stacked ? b.right : right ? b.left : b.right) - base.left;
      const dx = stacked ? Math.min(90, 28 + Math.abs(y2 - y1) / 6) : Math.max(30, Math.abs(x2 - x1) / 2) * (right ? 1 : -1);
      const path = document.createElementNS(svg.namespaceURI, "path");
      path.setAttribute("d", stacked ? `M${x1} ${y1} C${Math.max(x1, x2) + dx} ${y1} ${Math.max(x1, x2) + dx} ${y2} ${x2} ${y2}` : `M${x1} ${y1} C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`);
      path.setAttribute("class", r.copy ? "l-copy" + (r.copy === lit ? " show" : "") : "l-flow");
      if (r.copy) path.dataset.group = r.copy;
      svg.append(path);
      if (r.copy) continue;
      const [m, n] = String(r.kind || "N:1").split(":");
      for (const [txt, x, y, anchor] of [[m, x1 + (right ? 6 : -6), y1 - 5, right ? "start" : "end"], [n, x2 + (stacked ? 6 : right ? -6 : 6), y2 - 5, stacked || !right ? "start" : "end"]]) {
        const tx = document.createElementNS(svg.namespaceURI, "text");
        tx.setAttribute("x", x);
        tx.setAttribute("y", y);
        tx.setAttribute("text-anchor", anchor);
        tx.setAttribute("class", "ercard");
        tx.textContent = txt;
        svg.append(tx);
      }
    }
  };
  addDrawer(draw, grid);
  const scroll = el("div", "scroll");
  scroll.append(grid);
  const n = Object.values(groups).reduce((a, x) => a + x.length, 0);
  if (!n) {
    const wrap = el("div");
    wrap.append(reset, scroll);
    return wrap;
  }
  const kept = tables.flatMap((tb) => (tb.columns || []).filter((c) => c?.copy && c.keep)).length;
  const sum = el("div", "ersum");
  sum.append(el("span", null, t("erCopies", n, kept)));
  for (const [orig, copies] of Object.entries(groups)) {
    const chip = el("button", "ergroup", `${orig} ×${copies.length + 1}`);
    chip.title = copies.join("\n");
    chip.onmouseenter = chip.onfocus = () => light(orig);
    chip.onmouseleave = chip.onblur = () => light(null);
    sum.append(chip);
  }
  const wrap = el("div");
  wrap.append(sum, reset, scroll);
  return wrap;
}

// ---------- before / after: two pictures side by side, with what was added, removed or changed marked
function renderDiff(v) {
  const before = plan.views.find((x) => x.id === v.before), after = plan.views.find((x) => x.id === v.after);
  // Wide pictures read better one above the other than squeezed side by side.
  const wrap = el("div", "diffview" + ([v.before, v.after].some((id) => plan.views.find((x) => x.id === id)?.kind !== "flow") ? " stack" : ""));
  if (!before || !after || !VIEWS[before.kind] || !VIEWS[after.kind] || before.kind === "diff" || after.kind === "diff") return el("p", null, t("cannotDraw", "diff"));
  const ids = (x) => new Set(KINDS[x.kind]?.refs(x) || []);
  // changed: ["api"], or {"api": "now publishes instead of sending"} to say what changed.
  const notes = v.changed && typeof v.changed === "object" && !Array.isArray(v.changed) ? v.changed : {};
  const a = ids(before), b = ids(after), changed = new Set(Array.isArray(v.changed) ? v.changed : Object.keys(notes));
  const legend = el("div", "linklegend");
  legend.append(el("span", "dl add", t("dAdd")), el("span", "dl del", t("dDel")), el("span", "dl chg", t("dChg")));
  const half = (view, label, mark) => {
    const h = el("div", "dhalf");
    h.append(el("div", "dtitle", `${label} · ${view.title || view.id}`), VIEWS[view.kind].render(view));
    h.querySelectorAll("[data-id]").forEach((d) => {
      const id = d.dataset.id;
      if (changed.has(id)) {
        d.classList.add("d-chg");
        if (typeof notes[id] === "string") d.append(el("div", "dnote", "~ " + notes[id]));
      }
      else if (mark(id)) d.classList.add(label === t("before") ? "d-del" : "d-add");
    });
    return h;
  };
  wrap.append(half(before, t("before"), (id) => !b.has(id)), half(after, t("after"), (id) => !a.has(id)));
  // Links that exist on one side only: what stops talking to what, and what starts.
  const name = (x) => plan.nodes[x]?.name || x;
  const ea = edgesOf(before), eb = edgesOf(after);
  const gone = [...ea].filter((k) => !eb.has(k)), added = [...eb].filter((k) => !ea.has(k));
  const links = el("div", "dlinks");
  for (const [list, cls, label] of [[gone, "del", t("dLinkGone")], [added, "add", t("dLinkNew")]]) {
    if (!list.length) continue;
    const row = el("div", "drow");
    row.append(el("span", "dl " + cls, label));
    for (const k of list) {
      const [f, to] = k.split("\u0000");
      row.append(el("span", "dedge " + cls, `${name(f)} → ${name(to)}`));
    }
    links.append(row);
  }
  const box = el("div");
  box.append(legend, links, wrap);
  return box;
}

// Who points at whom in a picture, as "from\0to" keys, for comparing two pictures.
function edgesOf(v) {
  const pairs = [];
  if (v.kind === "flow") for (const l of v.lanes || []) if (l?.arrows !== false) (l.nodes || []).forEach((x, i, a) => i && pairs.push([a[i - 1], x]));
  for (const e of [...(v.links || []), ...(v.edges || []), ...(v.transitions || []), ...(v.kind === "sequence" ? (v.messages || []).filter((m) => !m?.reply) : [])]) if (e?.from && e?.to && e.from !== e.to) pairs.push([e.from, e.to]);
  for (const w of v.workloads || []) for (const u of w?.uses || []) pairs.push([w.node, u]);
  return new Set(pairs.map(([f, to]) => f + "\u0000" + to));
}

const VIEWS = {
  flow: {render: renderFlow},
  state: {render: renderState, after: () => requestAnimationFrame(() => linkDrawer?.())},
  decision: {render: renderDecision, after: () => requestAnimationFrame(() => linkDrawer?.())},
  impact: {render: renderImpact, after: () => requestAnimationFrame(() => linkDrawer?.())},
  timeline: {render: renderTimeline},
  datamodel: {render: renderDataModel, after: () => requestAnimationFrame(() => linkDrawer?.())},
  diff: {render: renderDiff, after: () => requestAnimationFrame(() => linkDrawer?.())},
  map: {render: renderMap, after: () => requestAnimationFrame(() => linkDrawer?.())},
  journey: {render: renderJourney},
  k8s: {render: renderK8s, after: () => requestAnimationFrame(() => linkDrawer?.())},
  sequence: {render: renderSequence},
  transform: {render: renderTransform},
};

// "Wider than the screen" hints, checked again whenever the side panel changes the width.
// A picture wider than the screen fades at the edge that has more, instead of saying so.
function scrollHints() {
  for (const sc of document.querySelectorAll("#view .scroll")) {
    const fade = () => {
      sc.classList.toggle("more-r", sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 4);
      sc.classList.toggle("more-l", sc.scrollLeft > 4);
    };
    sc.onscroll = fade;
    fade();
  }
}

function renderView() {
  if (isDesign() && !viewId) viewId = curOption()?.view;
  const v = plan.views.find((x) => x.id === viewId) || plan.views[0];
  const tabs = document.getElementById("tabs");
  if (isDesign()) {
    const pct = totals();
    const byView = new Set(options().map((o) => o.view));
    tabs.replaceChildren(...options().map((o) => {
      const b = el("button", (o.id === curOption()?.id ? "on " : "") + (o.recommended ? "rec" : ""), (o.recommended ? "★ " : "") + o.title);
      // Out of the running (fails a must): no percentage to compare, as in the table.
      if (failsMust(plan, o.id).length) b.append(el("span", "pct out", "✗"));
      else if (pct[o.id] != null) b.append(el("span", "pct", pct[o.id] + "%"));
      b.onclick = () => chooseOption(o.id);
      return b;
    }), ...plan.views.filter((x) => !byView.has(x.id)).map((x) => {
      const b = el("button", x.id === v.id ? "on" : "", x.title || x.id);
      b.onclick = () => {
        viewId = chosenView = x.id;
        renderView();
      };
      return b;
    }));
  } else tabs.replaceChildren(...(plan.views.length > 1 ? plan.views.map((x) => {
    const b = el("button", x.id === v.id ? "on" : "", x.title || x.id);
    b.onclick = () => {
      viewId = chosenView = x.id;
      renderView();
    };
    return b;
  }) : []));
  const kind = VIEWS[v.kind];
  linkDrawer = null;
  pictureHook = null;
  linkObserver?.disconnect();
  linkObserver = null;
  // One picture that cannot be drawn must not take the rest of the page with it.
  let pic;
  try {
    pic = kind ? kind.render(v) : el("p", null, t("cannotDraw", v.kind));
  } catch (e) {
    pic = el("p", "drawfail", t("drawFail", v.title || v.id, e.message));
  }
  document.getElementById("view").replaceChildren(pic);
  try {
    kind?.after?.();
  } catch {}
  if (side?.kind === "node" && nodeId && !inPlan(nodeId) && !thread.some((m) => m.node === nodeId)) closeSide();
  drawCounts();
  highlight();
  requestAnimationFrame(() => {
    // An arrow left at the end of a wrapped row points at nothing.
    for (const a of document.querySelectorAll("#view .tf > .arrow")) a.style.visibility = a.nextElementSibling && a.nextElementSibling.offsetTop > a.offsetTop + a.offsetHeight / 2 ? "hidden" : "";
    scrollHints();
  });
}

function stepFades() {
  const bar = document.getElementById("stepbar");
  bar.classList.toggle("fl", bar.scrollLeft > 4);
  bar.classList.toggle("fr", bar.scrollLeft + bar.clientWidth < bar.scrollWidth - 4);
}
document.getElementById("stepbar").addEventListener("scroll", stepFades, {passive: true});
addEventListener("resize", stepFades);

function renderSteps() {
  const bar = document.getElementById("stepbar");
  document.querySelector(".stepnav").classList.toggle("nosteps", !steps().length);
  const all = el("button", "chip all" + (stepId ? "" : " sel"), t("all"));
  all.dataset.step = "";
  all.onclick = () => { stop(); selectStep(null); };
  const chips = steps().map((s, i) => {
    const turn = yourTurn(s);
    const cls = plan.mode === "explain" && !s.status ? "plain" : turn ? "review" : s.confirmed ? "done" : STEP_STATUS[s.status] || "todo";
    const mark = turn ? "👉 " : s.status === "done" || s.confirmed ? "✓ " : "";
    const c = el("button", "chip " + cls + (s.id === stepId ? " sel" : ""), `${mark}${i + 1}. ${s.title}`);
    c.setAttribute("aria-pressed", String(s.id === stepId));
    c.title = s.confirmed ? t("chipRestated") : s.status === "review" ? t("chipTurn") : "";
    c.dataset.step = s.id;
    c.onclick = () => { stop(); selectStep(s.id); };
    return c;
  });
  // Steps read as a line: ① ─ ② ─ ③, green where finished.
  const row = [all];
  chips.forEach((c, i) => {
    if (i) row.push(el("i", "link" + (steps()[i - 1].status === "done" ? " done" : "")));
    row.push(c);
  });
  all.style.marginRight = "10px";
  bar.replaceChildren(...row);
  requestAnimationFrame(stepFades);
  drawCounts();
}

function highlight() {
  const step = curStep();
  const inStep = step ? new Set(step.nodes || []) : null;
  document.querySelectorAll("#view [data-id]").forEach((d) => {
    d.classList.toggle("dim", !!inStep && !inStep.has(d.dataset.id));
    d.classList.toggle("instep", !!inStep && inStep.has(d.dataset.id));
    d.classList.toggle("active", d.dataset.id === nodeId);
  });
  document.querySelectorAll("#view [data-step]").forEach((d) => d.classList.toggle("dim", !!step && d.dataset.step !== step.id));
  linkDrawer?.();
  pictureHook?.();
  storyMarks();
  markChanges();
  syncUrl();
}

// The address keeps what is shown, so a reload or a shared link opens the same place.
function syncUrl() {
  if (!rendered) return;
  const u = new URL(location.href);
  for (const [k, v] of [["view", viewId], ["step", stepId || (steps().length ? "all" : null)], ["node", nodeId]]) v ? u.searchParams.set(k, v) : u.searchParams.delete(k);
  if (u.href !== location.href) history.replaceState(null, "", u);
}

// Show the step in a picture that contains its boxes; back to the picture the user picked when no step is selected.
let chosenView = null;
function followStep(step) {
  // A step that tells a story needs the picture that holds the boxes it moves between.
  const ends = stepMoves(step).flatMap((m) => [m.from, m.to]);
  if (ends.length) {
    const has = (v) => ends.filter((e) => (KINDS[v.kind]?.refs(v) || []).includes(e)).length;
    const now = plan.views.find((x) => x.id === viewId) || plan.views[0];
    const best = [...plan.views].sort((a, b) => has(b) - has(a))[0];
    if (best && best !== now && has(best) > has(now)) {
      viewId = best.id;
      renderView();
    }
    return;
  }
  if (!step && chosenView && chosenView !== viewId && plan.views.some((x) => x.id === chosenView)) {
    viewId = chosenView;
    return renderView();
  }
  const want = new Set(step?.nodes || []);
  if (!want.size || [...document.querySelectorAll("#view [data-id]")].some((e) => want.has(e.dataset.id))) return;
  const v = plan.views.find((x) => KINDS[x.kind]?.refs(x).some((k) => want.has(k)));
  if (v) {
    viewId = v.id;
    renderView();
  }
}

function selectStep(id) {
  stepId = id;
  renderSteps();
  renderStepCard();
  followStep(curStep());
  highlight();
  document.querySelector(".stepbar .chip.sel")?.scrollIntoView({block: "nearest", inline: "center"});
  stepFades();
  startStory();
}

const EDITOR_URL = {
  vscode: (f, l) => `vscode://file${encodeURI(f)}:${l || 1}`,
  cursor: (f, l) => `cursor://file${encodeURI(f)}:${l || 1}`,
  idea: (f, l) => `idea://open?file=${encodeURIComponent(f)}&line=${l || 1}`,
};

// The editor link appears once the server has resolved the real path (roots may be relative).
function fileLine(file, resolved) {
  const ref = parseFile(file, plan);
  const row = el("div", "meta fileline");
  const editor = plan.settings?.editor ?? "vscode";
  if (resolved && EDITOR_URL[editor]) {
    const a = el("a", null, file);
    a.href = EDITOR_URL[editor](resolved, ref?.line);
    a.title = t("openIn", editor);
    row.append(a);
  } else row.append(el("span", null, file));
  const copy = el("button", null, t("copy"));
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(resolved ? `${resolved}${ref?.line ? ":" + ref.line : ""}` : file);
      copy.textContent = t("copied");
    } catch {
      copy.textContent = t("copyFail");
    }
  };
  row.append(copy);
  return row;
}

// Long lines wrap on narrow screens unless the reader chose otherwise.
const codeWrap = () => (store.get("walkboard.wrap") ?? (innerWidth < 700 ? "on" : "off")) === "on";

function codeBox(id) {
  const box = el("details", "code");
  box.open = true;
  box.append(el("summary", null, t("codeHere")), el("div", "meta", t("loading")));
  (snapshot ? Promise.resolve(snapshot.sources?.[id] || {error: t("codeNotIncluded")}) : fetch(`/api/source?node=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`).then((r) => r.json()))
    .then((r) => {
      if (r.error) return box.lastChild.replaceWith(el("div", "meta err", `${t("codeFail")}: ${r.error}`));
      // Only the lines that make the point: "highlight", else a single referenced line; a range alone is just context.
      const node = plan.nodes[id] || {};
      const hl = highlightOf(node.highlight) || {lines: r.focus && r.focus === r.end ? new Set([r.focus]) : new Set(), notes: new Map()};
      const marked = hl.lines;
      const ol = el("ol");
      const indent = Math.min(...r.lines.filter((l) => l.trim()).map((l) => l.match(/^[ \t]*/)[0].length));
      r.lines = r.lines.map((l) => l.slice(Number.isFinite(indent) ? indent : 0));
      r.lines.forEach((t, i) => {
        const n = r.from + i;
        const li = el("li", marked.has(n) ? "focus" : null, t);
        li.dataset.n = n;
        ol.append(li);
        // A highlighted line can say why it matters, right under it.
        if (hl.notes.has(n)) ol.append(el("li", "lnote", "↑ " + hl.notes.get(n)));
      });
      const scroll = el("div", "cscroll" + (codeWrap() ? " wrap" : ""));
      scroll.append(ol);
      const wrapBtn = el("button", "wrapbtn", t("wrapCode"));
      wrapBtn.setAttribute("aria-pressed", String(codeWrap()));
      wrapBtn.onclick = (e) => {
        e.preventDefault();
        const on = !scroll.classList.contains("wrap");
        store.set("walkboard.wrap", on ? "on" : "off");
        scroll.classList.toggle("wrap", on);
        wrapBtn.setAttribute("aria-pressed", String(on));
        fade();
      };
      box.querySelector("summary").append(wrapBtn);
      if (r.moved != null) box.querySelector("summary").after(el("div", "meta err", "⚠ " + t("codeMoved", r.moved)));
      new ResizeObserver(() => scroll.style.setProperty("--cw", scroll.clientWidth + "px")).observe(scroll);
      const fade = () => scroll.classList.toggle("more", scroll.scrollLeft + scroll.clientWidth < scroll.scrollWidth - 4);
      scroll.addEventListener("scroll", fade, {passive: true});
      box.lastChild.replaceWith(scroll);
      requestAnimationFrame(fade);
      if (nodeId === id && plan.nodes[id]?.file) document.querySelector("#panel .fileline")?.replaceWith(fileLine(plan.nodes[id].file, r.path));
    })
    .catch(() => box.lastChild.replaceWith(el("div", "meta err", t("codeFail"))));
  return box;
}

// Clicking the box whose panel is open closes it again.
function selectNode(id, toggle = true) {
  if (toggle && side?.kind === "node" && side.id === id) return closeSide();
  nodeId = id;
  openSide({kind: "node", id});
}

function renderNodePanel(id) {

  if (!n) {
    const name = boxName(id);

    p.replaceChildren(el("p", "gone", t("boxGone")), talkBox({node: id}, {placeholder: t("askGone", name), to: {}, prefix: t("aboutGone", name), sent: () => openSide({kind: "plan"})}));
    return refreshThreads();
  }
  title.textContent = n.name;
  const h = el("h3");
  const ic = iconEl(n, id, document.querySelector(`#view .ns [data-id="${CSS.escape(id)}"]`) ? "k8s" : null);
  if (ic) h.append(ic);
  h.append(richEl("span", null, `${n.name} · ${statusLabel(n.status)}`));
  const parts = [];
  const pr = propOf(n);

  }

  if (BASIS_KEYS.includes(n.basis)) {

    }

  }
  if (n.what) parts.push(richEl("p", "meta", n.what));
  // A table's columns that store data again: where each comes from, and why a kept one is kept.
  const copies = plan.views.filter((v) => v.kind === "datamodel").flatMap((v) => (v.tables || []).filter((tb) => tb?.node === id)).flatMap((tb) => (tb.columns || []).filter((c) => c?.copy));
  if (copies.length) {
    const ul = el("ul", "copylist");
    for (const c of copies) ul.append(el("li", c.keep ? "keep" : null, `⧉ ${c.name} ← ${c.copy}${c.keep ? " · " + t("kept") : ""}${c.note ? ": " + c.note : ""}`));
    parts.push(ul);
  }
  if (n.file) parts.push(fileLine(n.file));
  if (n.in || n.out) {

    for (const [k, txt] of [["in", n.in], ["out", n.out]]) {
      const b = el("div", "box");
      b.append(el("div", "lbl", t(k)), richEl("pre", null, txt || "—"));
      io.append(b);
      if (k === "in") io.append(el("div", "mid", "→"));
    }
    parts.push(io);
  }
  if (n.why) parts.push(richEl("p", "why", n.why));
  if (n.file && parseFile(n.file, plan)?.abs) parts.push(codeBox(id));
  const where = steps().map((s, i) => (s.nodes || []).includes(id) ? `${i + 1}. ${s.title}` : null).filter(Boolean);
  if (where.length) parts.push(el("p", "insteps", (plan.mode === "explain" ? t("inStages") : t("inSteps")) + where.join(", ")));
  parts.push(talkBox({node: id}, {placeholder: t("askBox", n.name), quick: ["confused", "deeper"], modes: ["question", "propose"]}));
  fillPanel(p, parts);
  refreshThreads();
}

// ---------- story: what travels between boxes in a step (moves), what stays where it arrived (keep), what a box shows (show)
const stepMoves = (st) => (Array.isArray(st?.moves) ? st.moves.filter((m) => m?.from && m?.to) : []);
const storyStill = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const boxEl = (id) => document.querySelector(`#view [data-id="${CSS.escape(id)}"]`);
const pause = (ms) => new Promise((r) => setTimeout(r, ms));
const story = {token: 0, step: null, done: 0, finished: Promise.resolve()};

// Everything earlier steps left behind, and what this step has delivered so far.
function storyMarks() {
  document.querySelectorAll("#view .mv-kept, #view .mv-show").forEach((e) => e.remove());
  const cur = curStep();
  if (!cur) return;
  const list = steps(), held = new Map(), shown = {};
  for (const st of list.slice(0, list.indexOf(cur) + 1)) {
    const moves = stepMoves(st);
    for (const m of moves.slice(0, st === cur && story.step === st.id ? story.done : moves.length)) if (m.keep && m.label) held.set(m.label, m.to);
    if (st.show && typeof st.show === "object") Object.assign(shown, st.show);
  }
  for (const [id, text] of Object.entries(shown)) boxEl(id)?.append(el("pre", "mv-show", String(text)));
  for (const [label, id] of held) boxEl(id)?.append(el("span", "mv-kept", label));
}

// The line a move travels on: the picture's own link when there is one (either way round), else a curve between the boxes.
function movePath(m, a, b) {
  const link = (x, y) => document.querySelector(`#view svg.links path[data-from="${CSS.escape(x)}"][data-to="${CSS.escape(y)}"]`);
  const real = link(m.from, m.to) || link(m.to, m.from);
  if (real) return {path: real, back: real.dataset.from !== m.from};
  routeLine.dx = routeLine.dy = 0;
  const others = [...document.querySelectorAll("#view [data-id]")].filter((e) => e !== a && e !== b).map((e) => e.getBoundingClientRect());
  const route = routeLine(a.getBoundingClientRect(), b.getBoundingClientRect(), others);
  const layer = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  layer.classList.add("mv-layer");
  const path = document.createElementNS(layer.namespaceURI, "path");
  path.setAttribute("d", route.d);
  layer.append(path);
  document.body.append(layer);
  return {path, back: false, layer};
}

// A move is there to be read: it waits at its start, travels slowly enough to follow, and rests where it arrives.
const MOVE_WAIT = 650, MOVE_REST = 550, MOVE_SPEED = 0.11, MOVE_MIN = 1500, MOVE_MAX = 3600;

function runMove(m, token) {
  return new Promise((done) => {
    const a = boxEl(m.from), b = boxEl(m.to);
    if (!a || !b) return done();
    let line = movePath(m, a, b), start = null, ms = 0;
    const packet = el("div", "mv-packet" + (m.label ? "" : " dot"), m.label || "");
    document.body.append(packet);
    const cutAt = 0.6;
    const isCut = () => m.blocked || line.path.classList.contains("l-blocked");
    const light = () => {
      line.path.classList.add("mv-on");
      // A blocked line lights only as far as the label gets.
      if (isCut()) {
        const len = line.path.getTotalLength();
        line.path.style.animation = "none";
        line.path.style.strokeDasharray = line.back ? `0 ${len * (1 - cutAt)} ${len * cutAt} ${len}` : `${len * cutAt} ${len}`;
      }
      // The same speed on every line: a short hop is quick, a long one takes its time.
      ms = Math.min(MOVE_MAX, Math.max(MOVE_MIN, line.path.getTotalLength() / MOVE_SPEED));
    };
    light();
    const finish = () => {
      packet.remove();
      line.layer?.remove();
      line.path.classList.remove("mv-on");
      line.path.style.animation = line.path.style.strokeDasharray = "";
      done();
    };
    const place = (e) => {
      const len = line.path.getTotalLength(), p = line.path.getPointAtLength((line.back ? 1 - e : e) * len), c = line.path.getScreenCTM();
      packet.style.transform = `translate(${c.a * p.x + c.c * p.y + c.e}px,${c.b * p.x + c.d * p.y + c.f}px) translate(-50%,-50%)`;
    };
    const frame = async (now) => {
      if (story.token !== token) return finish();
      // A box that changes size redraws the picture's lines: carry on along the new one.
      if (!line.path.isConnected) {
        line.layer?.remove();
        line = movePath(m, a, b);
        light();
      }
      start ??= now;
      const k = Math.min(1, (now - start) / ms);
      // A blocked line never gets there: the label stops partway and turns red.
      const cut = isCut();
      place((k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2) * (cut ? cutAt : 1));
      if (k < 1) return requestAnimationFrame(frame);
      if (cut) {
        packet.classList.add("cut");
        packet.textContent = (m.label ? m.label + " " : "") + "✗";
        await pause(MOVE_REST + 700);
        return finish();
      }
      b.classList.add("mv-hit");
      setTimeout(() => b.classList.remove("mv-hit"), MOVE_REST + 300);
      await pause(MOVE_REST);
      finish();
    };
    place(0);
    setTimeout(() => (story.token === token ? requestAnimationFrame(frame) : finish()), MOVE_WAIT);
  });
}

// Played on the way into a step, however you got there: Play, a chip, the arrows.
function startStory() {
  const st = curStep(), token = ++story.token, moves = stepMoves(st);
  story.step = st?.id ?? null;
  story.began = performance.now();
  story.done = storyStill() ? moves.length : 0;
  storyMarks();
  story.finished = storyStill() || !moves.length ? Promise.resolve() : (async () => {
    await pause(120);
    for (const m of moves) {
      if (story.token !== token) return;
      // Both ends in sight before anything sets off.
      boxEl(m.from)?.scrollIntoView({block: "nearest", inline: "nearest", behavior: "smooth"});
      boxEl(m.to)?.scrollIntoView({block: "nearest", inline: "nearest", behavior: "smooth"});
      await pause(260);
      if (story.token !== token) return;
      await runMove(m, token);
      if (story.token !== token) return;
      story.done++;
      storyMarks();
      await pause(220);
    }
  })();
}

// Long enough to read what the step says, once what it moves has arrived.
const holdFor = (st) => Math.min(9000, Math.max(2200, 1000 + 45 * [st?.title, st?.detail, st?.done].join("").length));
function playOn() {
  const st = curStep();
  timer = setTimeout(async () => {
    if (st === steps().at(-1)) return stop();
    step(1);
    await story.finished;
    if (timer) playOn();
  }, Math.max(1800, holdFor(st) - (performance.now() - story.began)));
}

function stop() {
  clearTimeout(timer);
  timer = null;
  document.getElementById("play").textContent = t("playShort");
}
function step(d) {
  const list = steps(), i = list.indexOf(curStep());
  if (!list.length) return;
  selectStep(list[((i < 0 ? (d > 0 ? -1 : 0) : i) + d + list.length) % list.length].id);
}
document.getElementById("prev").onclick = () => { stop(); step(-1); };
document.getElementById("next").onclick = () => { stop(); step(1); };
document.getElementById("play").onclick = () => {
  if (timer) return stop();
  document.getElementById("play").textContent = t("pauseShort");
  timer = -1;
  if (curStep()) startStory();
  else step(1);
  story.finished.then(() => timer && playOn());
};

// Redraws replace the chat boxes; put the cursor back where the user was typing.
function keepFocus(fn) {
  const a = document.activeElement;
  const key = a?.tagName === "TEXTAREA" ? a.dataset.key : null;
  const sel = key && [a.selectionStart, a.selectionEnd];
  fn();
  const t = key && document.querySelector(`textarea[data-key="${CSS.escape(key)}"]`);
  if (t) {
    t.focus({preventScroll: true});
    t.setSelectionRange(...sel);
  }
}

function render(p) {
  keepFocus(() => draw(p));
}

const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
// What the agent changed since the user last acknowledged; outlines stay until then.
const changes = {nodes: new Set(), steps: new Set(), notes: [], was: {}};

// Progress (statuses, restated, suggested commits) is not a change of plan.
const content = (x, skip) => x && Object.fromEntries(Object.entries(x).filter(([k]) => !skip.includes(k)));
function noteChanges(prev) {
  // The first status seen before a change, so the list can say "todo → done" however many reloads it took.
  const was = (key, a, b) => a?.status !== b?.status && !(key in changes.was) && (changes.was[key] = a?.status ?? "todo");
  for (const id of Object.keys(plan.nodes)) if (!same(content(prev.nodes?.[id], ["status"]), content(plan.nodes[id], ["status"]))) changes.nodes.add(id);
  for (const id of Object.keys(plan.nodes)) if (prev.nodes?.[id]) was("n:" + id, prev.nodes[id], plan.nodes[id]);
  for (const st of steps()) {
    const before = (prev.steps || []).find((x) => x.id === st.id);
    if (!same(content(before, ["status", "confirmed", "commitMessage", "commits"]), content(st, ["status", "confirmed", "commitMessage", "commits"]))) changes.steps.add(st.id);
    if (before) was("s:" + st.id, before, st);
  }
  const views = new Set((prev.views || []).map((v) => v.id));
  for (const v of plan.views) if (!views.has(v.id)) changes.notes.push(t("newView") + (v.title || v.id));
  if (!same(prev.glossary, plan.glossary)) changes.notes.push(t("glossaryChanged"));
  if (prev.title !== plan.title || prev.goal !== plan.goal) changes.notes.push(t("titleChanged"));
  changes.notes = [...new Set(changes.notes)];
}

function markChanges() {
  document.querySelectorAll(".changed").forEach((e) => e.classList.remove("changed"));
  for (const id of changes.nodes) document.querySelectorAll(`#view [data-id="${CSS.escape(id)}"]`).forEach((e) => e.classList.add("changed"));
  for (const id of changes.steps) document.querySelector(`.chip[data-step="${CSS.escape(id)}"]`)?.classList.add("changed");
}

function showChangeList() {
  const box = document.getElementById("toast");
  // A second click on "Plan changed" closes the list.
  if (!box.hidden && box.classList.contains("chlist")) return (box.hidden = true);
  box.className = "toast chlist";
  const ul = el("ul");
  for (const id of changes.steps) {
    const st = steps().find((x) => x.id === id);
    const from = changes.was["s:" + id];
    if (st) ul.append(el("li", null, t("chStep") + st.title + (from != null && from !== (st.status ?? "todo") ? `: ${t("sb_" + from)} → ${t("sb_" + (st.status ?? "todo"))}` : "")));
  }
  for (const id of changes.nodes) {
    const n = plan.nodes[id], from = changes.was["n:" + id];
    if (n) ul.append(el("li", null, t("chBox") + n.name + (from != null && from !== n.status ? `: ${statusLabel(from)} → ${statusLabel(n.status)}` : "")));
  }
  for (const n of changes.notes) ul.append(el("li", null, n));
  box.style.left = box.style.top = box.style.right = "";
  const ok = el("button", "primary", t("seen"));
  ok.onclick = () => {
    changes.nodes.clear();
    changes.was = {};
    changes.steps.clear();
    changes.notes = [];
    box.hidden = true;
    markChanges();
    renderBar();
  };
  box.replaceChildren(el("b", null, t("changedTitle")), ul, ok);
  box.onclick = (e) => e.stopPropagation();
  box.hidden = false;
}
document.addEventListener("click", () => (document.getElementById("toast").hidden = true));

// The tab title says when it is your turn, and stops saying so once you have answered.
function updateTitle() {
  const mine = !snapshot && (((plan.mode ?? "build") === "build" && !plan.approved && !approvePending()) || steps().some((s) => yourTurn(s) && !answered(s)));
  document.title = (mine ? "👉 " : "") + (plan.title ? `${plan.title} · Walkboard` : "Walkboard");
}

function draw(p) {
  const prev = plan;
  plan = p;
  plan.nodes ||= {};
  plan.views = viewsOf(plan);
  setLang(langOf(plan));
  updateTitle();
  document.getElementById("title").textContent = plan.title || "Walkboard";
  setGlossary(plan.glossary);
  renderLegend();
  renderProposals();
  renderConstraints();
  document.getElementById("goal").replaceChildren(rich(plan.goal || ""));
  const problems = validate(plan);
  const box = document.getElementById("problems");
  box.hidden = !problems.length;
  if (problems.length) {
    const ul = el("ul");
    problems.forEach((x) => ul.append(el("li", null, x)));
    box.replaceChildren(el("b", null, t("problems")), ul);
  }
  if (stepId && !curStep()) stepId = null;
  renderSteps();
  renderStepCard();
  if (plan.views.length) renderView();
  else document.getElementById("view").replaceChildren();
  renderCompare();
  renderSources();
  refreshThreads();
  if (!rendered) {
    rendered = true;
    if (served && !store.get("walkboard.tour")) setTimeout(startTour, 700);
    // Links may open a given step, picture or box: ?step=…&view=…&node=…
    if (plan.views.some((v) => v.id === params.get("view"))) {
      viewId = params.get("view");
      renderView();
    }
    const cur = params.get("step") === "all" ? null : steps().find((s) => s.id === params.get("step")) || steps().find((s) => s.id === plan.start) || steps().find((s) => s.status === "review") || steps().find((s) => s.status === "doing");
    if (cur) selectStep(cur.id);
    if (params.get("view") && plan.views.some((v) => v.id === params.get("view")) && viewId !== params.get("view")) {
      viewId = params.get("view");
      renderView();
    }
    if (Object.hasOwn(plan.nodes, params.get("node") || "")) selectNode(params.get("node"), false);
  } else if (side) {
    renderSide();
  }
  if (prev && !same(prev, p)) noteChanges(prev);
  // Follow the agent: when the step you were watching is finished, show the one it moved on to.
  const was = prev && activeStep(prev), now = activeStep(plan);
  if (was && now && now.id !== was.id) {
    if (stepId === was.id) selectStep(now.id);
    if (side?.kind === "step" && side.id === was.id) openSide({kind: "step", id: now.id});
  }
  markChanges();
  renderBar();
  prefetchCode();
}
let rendered = false, loadedThread = false;

let everConnected = false;
function setConn(on) {
  connected = on;
  everConnected ||= on;
  if (!on) waiting = 0;
  document.querySelectorAll(".talk .note").forEach((n) => {
    n.textContent = hintText();
    n.className = "note";
  });
  renderBadges();
}

async function fetchPlan() {
  const r = await fetch("/api/plan?token=" + encodeURIComponent(token));
  const box = document.getElementById("problems");
  if (!r.ok) {
    box.hidden = false;
    box.textContent = t("loadFail", r.status) + (await r.text());
    return;
  }
  let next;
  try {
    next = JSON.parse(await r.text());
  } catch (e) {
    box.hidden = false;
    box.textContent = t("parseFail") + e.message;
    return;
  }
  try {
    render(next);
  } catch (e) {
    box.hidden = false;
    box.append(el("div", null, t("drawFail", "plan.json", e.message)));
  }
}

async function load() {
  if (snapshot) {
    document.body.classList.add("snapshot");
    document.body.classList.toggle("with-chat", !!snapshot.thread?.length);
    commonGlossary = snapshot.glossary || {};
    thread = snapshot.thread || [];
    thread.forEach((m) => m.from === "agent" && seen.add(m.id));
    render(snapshot.plan);
    const conn = document.getElementById("conn");
    conn.className = "conn snap";
    conn.textContent = t("snapshotAt", new Date(snapshot.exportedAt).toLocaleString(dateLocale(), {dateStyle: "medium", timeStyle: "short"}));
    conn.title = t("snapshotTip");
    refreshThreads();
    return;
  }
  if (!served) {
    document.getElementById("banner").hidden = false;
    return;
  }
  try {
    commonGlossary = await (await fetch("/glossary.json?token=" + encodeURIComponent(token))).json();
  } catch {}
  await fetchPlan();
  const events = new EventSource("/api/events?token=" + encodeURIComponent(token));
  events.onopen = async () => {
    await fetchPlan();
    const r = await fetch("/api/thread?token=" + encodeURIComponent(token));
    if (r.ok) ({items: thread, waiting} = await r.json());
    if (!loadedThread) thread.forEach((m) => m.from === "agent" && seen.add(m.id));
    loadedThread = true;
    thread.sort((a, b) => a.at.localeCompare(b.at));
    setConn(true);
    refreshThreads();
  };
  events.onerror = () => setConn(false);
  events.addEventListener("plan", fetchPlan);
  const on = (name, fn) => events.addEventListener(name, (e) => { fn(JSON.parse(e.data)); refreshThreads(); });
  // Turn bars say "sent, waiting" as soon as you answer, and drop that once the agent replies.
  const turns = () => keepFocus(() => {
    renderStepCard();
    if (side?.kind === "step") renderSide();
  });
  // Approving sent from either button, or the agent answering it: both buttons follow at once.
  const approval = () => keepFocus(() => {
    renderBar();
    if (side?.kind === "plan") renderSide();
  });
  on("feedback", (m) => {
    thread.push({...m, from: "user", delivered: false});
    freshReply = m.id;
    if (m.step) turns();
    if (m.kind === "approve") approval();
  });
  on("reply", (m) => {
    thread.push(m);
    freshReply = m.id;
    if (m.step) turns();
    if (!m.step && !m.node) approval();
  });
  on("delivered", ({ids}) => thread.forEach((m) => { if (ids.includes(m.id)) m.delivered = true; }));
  on("agent", (a) => (waiting = a.waiting));
}

// A three-stop tour the first time someone opens walkboard in this browser; "?" shows it again.
function startTour() {
  const x = plan?.mode === "explain" ? "x" : "";
  const stops = (isDesign() ? [["#view", "tour1d"], ["#tabs", "tour2d"], ["#compare .cmp", "tour3d"]] : [["#view", "tour1" + x], ["#stepbar", "tour2" + x], ["#view [data-id]", "tour3"]])
    .filter(([sel]) => document.querySelector(sel));
  // Nothing drawn yet: a tour of empty bars explains nothing.
  if (!stops.length || !document.querySelector("#view [data-id]")) return;
  const tour = document.getElementById("tour");
  let i = 0;
  const end = () => {
    tour.hidden = true;
    scrollTo({top: 0, behavior: "smooth"});
    store.set("walkboard.tour", "seen");
    removeEventListener("resize", place);
  };
  function place() {
    const [sel, key] = stops[i];
    const target = document.querySelector(sel);
    const r = target.getBoundingClientRect();
    const pad = 6, spot = tour.querySelector(".spot"), card = tour.querySelector(".tcard");
    const top = Math.max(8, r.top - pad), height = Math.min(r.height + pad * 2, innerHeight - top - 8);
    Object.assign(spot.style, {left: r.left - pad + "px", top: top + "px", width: r.width + pad * 2 + "px", height: height + "px"});
    document.getElementById("tourText").textContent = t(key);
    document.getElementById("tourStep").textContent = t("tourStep", i + 1, stops.length);
    document.getElementById("tourNext").textContent = t(i === stops.length - 1 ? "tourDone" : "tourNext");
    document.getElementById("tourSkip").textContent = t("tourSkip");
    document.getElementById("tourSkip").hidden = i === stops.length - 1;
    const below = top + height + 12, h = card.offsetHeight || 140;
    card.style.top = (below + h < innerHeight ? below : Math.max(8, top - h - 12)) + "px";
    card.style.left = Math.max(16, Math.min(r.left, innerWidth - card.offsetWidth - 16)) + "px";
  }
  const show = () => {
    document.querySelector(stops[i][0]).scrollIntoView({block: "nearest"});
    requestAnimationFrame(place);
  };
  document.getElementById("tourNext").onclick = () => (++i < stops.length ? show() : end());
  document.getElementById("tourSkip").onclick = end;
  const esc = (e) => {
    if (e.key !== "Escape") return;
    removeEventListener("keydown", esc);
    if (!tour.hidden) end();
  };
  addEventListener("keydown", esc);
  tour.hidden = false;
  addEventListener("resize", place);
  show();
}

// A small card under the button that opened it; a click elsewhere, or on that button again, closes it.
let cardFor = null;
function showCard(anchor, cls, ...parts) {
  const box = document.getElementById("toast");
  if (!box.hidden && cardFor === anchor && box.classList.contains(cls)) {
    box.hidden = true;
    cardFor = null;

  cardFor = anchor;

// Every conversation on the page in one list under 💬, newest first; new replies first in line and marked.
function conversations() {
  const latest = new Map();
  thread.forEach((m) => m.kind !== "settings" && latest.set(sideKey(sideOf(m)), {c: sideOf(m), m}));
  return [...latest.values()].reverse();
}

function renderTalksBtn() {

}

function goTalk(c) {
  document.getElementById("toast").hidden = true;
  if (c.kind === "node") {
    if (!document.querySelector(`#view [data-id="${CSS.escape(c.id)}"]`)) {
      const v = plan.views.find((x) => KINDS[x.kind]?.refs(x).includes(c.id));
      if (v) {

// Printing (PDF) lays out the whole plan, not just what is on screen: every step, every picture one after another, then the boxes.
// Pictures are drawn at full size, their lines drawn, and only then scaled down to the page width, so lines and boxes stay together.
let printState = null;
function journeyList(v) {
  const ol = el("ol", "pjourney");
  for (const s of v.stops || []) {
    const li = el("li");
    li.append(el("b", null, plan.nodes[s.node]?.name || s.node));
    if (s.note) li.append(" ", richEl("span", null, s.note));
    if (s.data) li.append(el("pre", null, s.data));
    ol.append(li);
  }
  return ol;
}

// The cited lines on paper: the highlighted ones (else the line cited), with a few around them.
function printCode(n, r) {
  const hl = highlightOf(n.highlight)?.lines || new Set(r.focus ? [r.focus] : []);
  const at = [...hl].filter((x) => x >= r.from && x < r.from + r.lines.length);
  const lo = at.length ? Math.max(r.from, Math.min(...at) - 2) : r.from, hi = at.length ? Math.min(r.from + r.lines.length - 1, Math.max(...at) + 2) : Math.min(r.from + 11, r.from + r.lines.length - 1);
  const pre = el("pre", "pcode");
  for (let i = lo; i <= Math.min(hi, lo + 24); i++) {
    const line = el("span", hl.has(i) ? "hl" : null);
    line.append(el("i", null, String(i)), r.lines[i - r.from] ?? "");
    pre.append(line);
  }
  return pre;
}

// Code for printing an explanation: fetched once, so the print window (which cannot wait) has it.
const codeCache = {};
function prefetchCode() {
  if (!served || plan.mode !== "explain") return;
  for (const [id, n] of Object.entries(plan.nodes)) {
    if (!n?.file || codeCache[id]?.file === n.file) continue;
    fetch(`/api/source?node=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`).then((r) => r.json())
      .then((r) => { if (!r.error) codeCache[id] = {...r, file: n.file}; }, () => {});
  }
}

addEventListener("beforeprint", () => {
  if (!plan || printState) return;
  // Colours for paper come from the print stylesheet, so the screen never flips to light behind the print window.
  // The printout is drawn off screen, so the page behind the print window never changes.
  printState = {stepId, linkDrawer, linkObserver, pictureHook};
  stepId = null;
  document.body.classList.add("printing");
  linkDrawer = null;
  pictureHook = null;
  linkObserver = null;
  const date = new Date().toLocaleDateString(dateLocale(), {dateStyle: "medium"});
  const parts = [el("p", "pcover", [t("pill_" + (MODES_SHOWN.includes(plan.mode) ? plan.mode : "build")), date, steps().length && `${steps().length} ${t(plan.mode === "explain" ? "printStages" : "printSteps")}`, `${plan.views.length} ${t("printPictures")}`].filter(Boolean).join(" · "))];
  if (steps().length) {
    const ol = el("ol", "psteps");
    steps().forEach((st, i) => {
      const li = el("li", "pstep ps-" + (st.status || "todo"));
      const body = el("div");
      const h = el("h3", null, st.title);
      if (st.status) h.append(el("span", "pchip", t("sb_" + st.status)));
      body.append(h);
      if (st.detail) body.append(richEl("p", null, st.detail));
      for (const m of stepMoves(st)) body.append(el("p", "pmeta", `${boxName(m.from)} → ${boxName(m.to)}${m.label ? ": " + m.label : ""}`));
      if (st.done) body.append(richEl("p", "pmeta", t("doneWhen") + st.done));
      li.append(el("span", "pnum", String(i + 1)), body);
      ol.append(li);
    });
    parts.push(el("h2", "ph", t(plan.mode === "explain" ? "printStages" : "printSteps")), ol);
  }
  // A design on paper opens with the answer: what was chosen (or is recommended) and why, why not the others, which boxes are still a guess.
  if (isDesign() && options().length) {
    const sum = el("div", "psum"), d = plan.decision, rec = options().find((o) => o.recommended);
    const chosen = options().find((o) => o.id === d?.option);
    if (chosen) {
      sum.append(el("b", null, t("decided", chosen.title)));
      const who = [d.by, d.at && new Date(d.at).toLocaleDateString(dateLocale(), {dateStyle: "medium"})].filter(Boolean).join(" · ");
      if (who) sum.append(el("div", "pmeta", who));
      if (d.why) sum.append(richEl("p", null, d.why));
      for (const [id, why] of Object.entries(d.not || {})) {
        const o = options().find((x) => x.id === id);
        if (o && typeof why === "string") sum.append(el("p", "pnot", `✗ ${o.title}: ${why}`));
      }
    } else if (rec) {
      sum.append(el("b", null, `${t("recommended")}: ${rec.title}`));
      if (rec.why) sum.append(richEl("p", null, rec.why));
    }
    // Unconfirmed constraints are already above, as on screen; the boxes drawn on a guess are not.
    const open = Object.values(plan.nodes).filter((n) => n?.basis === "assumed").map((n) => n.name);
    if (open.length) {
      const ul = el("ul", "popen");
      open.forEach((x) => ul.append(el("li", null, "❓ " + x)));
      sum.append(el("div", "pmeta", t("printOpen")), ul);
    }
    if (sum.childNodes.length) parts.push(sum);
    const cmp = document.querySelector("#compare .cmp");
    if (cmp) parts.push(cmp.cloneNode(true));
  }
  const pics = [];
  if (plan.views.length) parts.push(el("h2", "ph newpage", t("printPictures")));
  for (const v of plan.views) {
    const box = el("section", "pview");
    // In design mode a picture belongs to an option: its name, whether it is recommended, and its summary.
    const opt = options().find((o) => o.view === v.id);
    box.append(el("div", "pcap", opt ? (opt.recommended ? "★ " : "") + opt.title : v.title || v.id));
    if (opt?.summary) box.append(richEl("p", "pmeta", opt.summary));
    let pic;
    try {
      // A journey plays on screen; on paper it is its stops, one under the other.
      pic = v.kind === "journey" ? journeyList(v) : VIEWS[v.kind] ? VIEWS[v.kind].render(v) : el("p", null, t("cannotDraw", v.kind));
    } catch (e) {
      pic = el("p", "drawfail", t("drawFail", v.title || v.id, e.message));
    }
    box.append(pic);
    parts.push(box);
    pics.push(box);
  }
  const grid = el("div", "pnodes");
  for (const [id, n] of Object.entries(plan.nodes)) {
    if (!n) continue;
    const card = el("div", "pnode");
    const h = el("div", "pnh");
    h.append(el("b", null, n.name || id));
    if (!isDesign() && (plan.mode !== "explain" || n.file)) h.append(el("span", "pchip", statusLabel(n.status)));
    card.append(h);
    if (n.what) card.append(richEl("div", "pwhat", n.what));
    for (const k of ["in", "out"]) if (n[k]) card.append(richEl("p", null, `${t(k)}: ${n[k]}`));
    if (n.why) card.append(richEl("p", null, n.why));
    if (n.file) card.append(el("code", null, n.file));
    const src = plan.mode === "explain" && n.file && (snapshot ? snapshot.sources?.[id] : codeCache[id]);
    if (src?.lines) {
      card.classList.add("wide");
      card.append(printCode(n, src));
    }
    grid.append(card);
  }
  parts.push(el("h2", "ph newpage", t("printBoxes")), grid);
  if (snapshot?.thread?.length) {
    const ul = el("ul", "pchat");
    for (const m of snapshot.thread) {
      const li = el("li", m.from === "agent" ? "agent" : "user");
      li.append(el("b", null, `${t(m.from === "agent" ? "agent" : "you")} · ${sideTitle(sideOf(m))}`), richEl("div", null, m.text));
      ul.append(li);
    }
    parts.push(el("h2", "ph", t("printChat")), ul);
  }
  const sources = document.getElementById("sources");
  printState.sourcesOpen = sources.open;
  sources.open = true;
  // Laid out at the width of an A4 page, so what fits flows and only what is wider gets scaled.
  const out = document.getElementById("printout");
  out.replaceChildren(...parts);
  linkDrawer?.();
  linkObserver?.disconnect();
  for (const box of pics) {
    const pic = box.lastElementChild, w = Math.max(pic.scrollWidth, ...[...pic.querySelectorAll(".scroll, .diagram")].map((x) => x.scrollWidth));
    if (w > 676) pic.style.zoom = String(676 / w);
    // A picture that fits on one page is never split; a taller one breaks between its rows.
    box.classList.toggle("fit", box.getBoundingClientRect().height < 960);
  }
  ({linkDrawer, linkObserver, pictureHook} = printState);
  stepId = printState.stepId;
});
addEventListener("afterprint", () => {
  if (!printState) return;
  document.getElementById("sources").open = printState.sourcesOpen;
  document.body.classList.remove("printing");
  document.getElementById("printout").replaceChildren();
  printState = null;
});

  e.stopPropagation();
  const cur = MODES_SHOWN.includes(plan?.mode) ? plan.mode : "build";
  showCard(e.currentTarget, "tipcard", el("span", null, t("pillTip_" + cur)));
};

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement?.tagName || "") || !document.getElementById("tour").hidden) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    stop();
    step(e.key === "ArrowLeft" ? -1 : 1);
  }
});

const legendBox = document.getElementById("legendbox");
legendBox.open = store.get("walkboard.legend") === "open";
legendBox.ontoggle = () => store.set("walkboard.legend", legendBox.open ? "open" : "closed");
renderBadges();
load();
</script>
</body>
</html>
