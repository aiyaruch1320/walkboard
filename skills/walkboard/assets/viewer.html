<script type="module">
const params = new URLSearchParams(location.search);
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const token = params.get("token");
// An exported file carries its plan (and code, and the chat if chosen) inside: it reads that and never calls a server.
const snapshot = (() => {
  try {
    return JSON.parse(document.getElementById("wb-snapshot")?.textContent || "null");
  } catch {
    return null;
  }
})();
const served = !snapshot && location.protocol !== "file:" && token;
const moduleUrl = (name) => window.__walkboardModules?.[name] || `/${name}.mjs?token=${encodeURIComponent(token)}`;
const {NODE_STATUS, STEP_STATUS, KINDS, validate, parseFile, highlightOf, ratingValue, failsMust, viewsOf, langOf, useProfiles} = served || snapshot ? await import(moduleUrl("schema")) : {NODE_STATUS: {}, STEP_STATUS: {}, KINDS: {}, validate: () => [], parseFile: () => null, highlightOf: () => null, ratingValue: () => null, failsMust: () => [], viewsOf: () => [], langOf: () => "en", teachBackOn: () => true, useProfiles: () => {}};

const PROF = served || snapshot ? await import(moduleUrl("profiles")) : {PROFILES: {}, kindOf: () => null, lineKindOf: () => null, kindNames: () => [], lineKindNames: () => [], kindWarning: () => null, kindProblems: () => []};
useProfiles(PROF);
const {GLYPHS, FAMILIES, iconOf, iconNames} = served || snapshot ? await import(moduleUrl("icons")) : {GLYPHS: {}, FAMILIES: {}, iconOf: () => null, iconNames: () => []};
const {applyDraft, describeDraft, draftable, isNewId, rebaseOps, cleanText} = served || snapshot ? await import(moduleUrl("draft")) : {rebaseOps: (b, l) => l, cleanText: (x) => String(x ?? "").trim(), applyDraft: (p, d, id) => ({plan: p, view: p.views.find((x) => x.id === id), marks: {nodes: {}, zones: {}, links: {}}, pending: [], stale: [], done: []}), describeDraft: () => ({changes: []}), draftable: () => false, isNewId: () => false};

let lang = /^th\b/i.test(navigator.language) ? "th" : "en";
const t = (k, ...a) => {
  const v = STRINGS[lang][k] ?? STRINGS.en[k] ?? k;
  return typeof v === "function" ? v(...a) : v;
};
// Thai text, Gregorian years: 2026, not 2569, as in code and commits.
const dateLocale = () => (lang === "th" ? "th-TH-u-ca-gregory" : lang);
const unit = (cap) => t((plan?.mode === "explain" ? "stage" : "step").replace(/^./, (c) => (cap ? c.toUpperCase() : c)));

function setLang(code) {
  lang = STRINGS[code] ? code : "en";
  document.documentElement.lang = lang;
  document.getElementById("banner").textContent = t("banner");
  for (const [id, label] of [["prev", t("prev", unit())], ["next", t("next", unit())], ["play", t("play", unit())]]) {
    const b = document.getElementById(id);
    b.title = label;
    b.setAttribute("aria-label", label);
  }
  // The panel's buttons: their words change with the language too, whichever width it is at.
  const wide = document.getElementById("sideWide"), grip = document.getElementById("sideGrip");
  wide.title = t(document.body.classList.contains("side-wide") ? "narrowPanel" : "widePanel");
  wide.setAttribute("aria-label", wide.title);
  grip.title = t("resizePanel");
  grip.setAttribute("aria-label", grip.title);
  document.getElementById("prev").textContent = "◀";
  document.getElementById("next").textContent = "▶";
  if (!timer) document.getElementById("play").textContent = t("playShort");
}
let plan, viewId, stepId = null, nodeId = null, timer = null;
const steps = () => plan.steps || [];
const curStep = () => steps().find((s) => s.id === stepId) || null;
let thread = [], waiting = 0, connected = false;
// false while no agent has ever waited on this page: it is not woken by clicks, so messages wait until the user tells
// it in its own chat ("check the page"). Servers before 0.11 do not say, and count as listening.
let listens = true;
const chatMode = () => connected && !waiting && !listens;
// The words to type in the agent's chat, copied with one click.
function copyCheck() {
  const b = el("button", "copycheck", t("copyCheck"));
  b.type = "button";
  b.onclick = async (e) => {
    e.stopPropagation();
    try {
      await navigator.clipboard.writeText(t("checkPhrase"));
      b.textContent = "✓ " + t("copied");
    } catch {
      b.textContent = t("checkPhrase");
    }
  };
  return b;
}
function openChatCard() {
  const conn = document.getElementById("conn");
  showCard(conn, "chatcard", el("b", null, t("connChat")), el("p", null, t("chatHow")), copyCheck());
}
// The Walkboard this page's code came from, for the menu and the connection dot; none for a snapshot or a copy without a version.
let pageVersion = null;
// Unsent text survives a reload of this tab.
const draftKey = "walkboard.drafts." + token;
const drafts = (() => {
  try {
    return JSON.parse(sessionStorage.getItem(draftKey)) || {};
  } catch {
    return {};
  }
})();
addEventListener("pagehide", () => {
  try {
    sessionStorage.setItem(draftKey, JSON.stringify(drafts));
  } catch {}
});
const touch = matchMedia("(pointer: coarse)").matches;
const seen = new Set();
let freshReply = null;
const hintText = () => (connected ? "" : t("noAgent"));

// Where a message belongs: a box, a step, a design option or one of its cells, or the whole plan.
const ctxKey = (c) => (c.node ? "node:" + c.node : c.step ? "step:" + c.step : c.option ? `option:${c.option}:${c.criterion || ""}` : "plan");
const ctxOf = (m) => (m.node ? {node: m.node} : m.step ? {step: m.step} : m.option ? {option: m.option, criterion: m.criterion} : {});
const inCtx = (m, c) => ctxKey(ctxOf(m)) === ctxKey(c);
// An option's thread also keeps whole-plan replies that answered it, in case the agent replied without --option.
const inThread = (m, c, i) => inCtx(m, c) || (!!c.option && m.from === "agent" && inCtx(m, {}) && inCtx(thread.slice(0, i).findLast((x) => x.from !== "agent" && x.kind !== "settings") || {}, c));

function msgEl(m) {
  const d = el("div", "msg " + (m.from === "agent" ? "agent" : "user"));
  d.dataset.id = m.id;
  const who = m.from === "agent" ? t("agent") : `${t("you")} · ${m.delivered ? t("received") : t("waitingAgent")}`;
  d.append(el("span", "who", who), msgBody(m.text));
  if (m.images?.length) d.append(msgImages(m.images));
  return d;
}
const imageUrl = (name) => `/api/image?token=${encodeURIComponent(token)}&name=${encodeURIComponent(name)}`;
function msgImages(names) {
  const box = el("div", "msgimgs");
  for (const n of names) {
    // An exported copy has no server to ask for them.
    if (snapshot) {
      box.append(el("span", "imggone", t("imageLeftOut")));
      continue;
    }
    const a = el("a");
    a.href = imageUrl(n);
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    const img = el("img");
    img.src = a.href;
    img.alt = t("imageAlt");
    img.loading = "lazy";
    img.decoding = "async";
    a.append(img);
    box.append(a);
  }
  return box;
}

// Images waiting to go with the next message, by conversation: a panel drawn again keeps them. Nothing reaches the server until it is sent.
const pendingImages = {};
const IMAGE_ACCEPT = ["image/png", "image/jpeg", "image/gif", "image/webp"], MAX_MSG_IMAGES = 5, MAX_IMAGE_BYTES = 10 * 1024 * 1024;
// Past these a model scales it down anyway: doing it here sends less, stores less, and costs the agent about 1,500 tokens at most.
const IMAGE_SIDE = 1568, IMAGE_PIXELS = 1.15e6;
async function shrinkImage(file) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, IMAGE_SIDE / Math.max(bmp.width, bmp.height), Math.sqrt(IMAGE_PIXELS / (bmp.width * bmp.height)));
    if (k === 1 && file.size <= 1024 * 1024) return file;
    const c = new OffscreenCanvas(Math.round(bmp.width * k), Math.round(bmp.height * k));
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const small = await c.convertToBlob({type: "image/webp", quality: 0.9});
    return small.size < file.size || k < 1 ? small : file;
  } catch {
    return file;
  }
}
async function uploadImage(blob) {
  const r = await fetch("/api/image?token=" + encodeURIComponent(token), {method: "POST", body: blob});
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return (await r.json()).name;
}

// **bold** and *italic* (or _italic_), still as text nodes.
function emphasis(text) {
  const f = document.createDocumentFragment();
  text.split(/(\*\*[^*\n]+\*\*|(?<![\w*])\*[^*\s][^*\n]*\*(?![\w*])|(?<!\w)_[^_\s][^_\n]*_(?!\w))/).forEach((p, i) => {
    if (!(i % 2)) return p && f.append(p);
    f.append(p.startsWith("**") ? el("strong", null, p.slice(2, -2)) : el("em", null, p.slice(1, -1)));
  });
  return f;
}

// [[node:id]], [[step:id]], [[option:id]], [[plan]] in an agent's reply: a link to that place, by its name.
const REF = /\[\[(?:(node|step|option):([^\]\s]+)|(plan))\]\]/g;
const refTarget = (kind, id) => (kind === "node" ? {kind: "node", id} : kind === "step" ? {kind: "step", id} : kind === "option" ? {kind: "option", id} : {kind: "plan"});
function talkLink(c, label = sideTitle(c)) {
  const b = el("button", "msglink", label);
  b.type = "button";
  b.onclick = () => goTalk(c);
  return b;
}
function linked(text) {
  const f = document.createDocumentFragment();
  let last = 0;
  for (const m of text.matchAll(REF)) {
    f.append(emphasis(text.slice(last, m.index)), talkLink(refTarget(m[1] || "plan", m[2])));
    last = m.index + m[0].length;
  }
  f.append(emphasis(text.slice(last)));
  return f;
}
// The same words where a link cannot go (a list's preview, paper).
const plainRefs = (text) => String(text ?? "").replace(REF, (_, kind, id) => sideTitle(refTarget(kind || "plan", id)));

// ```fenced``` blocks become code blocks and `ticks` inline code; everything stays text, never HTML.
function msgBody(text) {
  const f = document.createDocumentFragment();
  String(text ?? "").split(/```[a-z0-9]*\n?([\s\S]*?)```/i).forEach((part, i) => {
    if (i % 2) return f.append(el("pre", "mcode", part.replace(/\n$/, "")));
    if (i) part = part.replace(/^\n/, "");
    part.split(/`([^`\n]+)`/).forEach((x, j) => {
      if (j % 2) return f.append(el("code", "mcode", x));
      x.split(/(https?:\/\/[^\s<>"'`]+)/).forEach((y, k) => {
        if (!(k % 2)) return f.append(linked(y));
        const a = el("a", null, y);
        a.href = y;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        f.append(a);
      });
    });
  });
  return f;
}

const MARK = {done: "✓", new: "●", todo: "", ext: "↗"}, EXPLAIN_MARK = {done: "", new: "★", todo: "", ext: "↗"};
const statusLabel = (st) => t((plan?.mode === "explain" ? "ex_" : "st_") + (NODE_STATUS[st] ? st : plan?.mode === "explain" ? "done" : "todo"));

// Most boxes on a guess: a small ❓ on each and the words once, so the picture does not look like an error.
function tidyGuesses(root) {
  const marks = [...root.querySelectorAll(".basis-assumed > .bmark")];
  if (marks.length < 4) return;
  for (const m of marks) {
    m.textContent = "❓";
    m.classList.add("short");
  }
  root.prepend(el("p", "assumednote", t("assumedMany", marks.length)));
}

// What the colours and marks mean, in the card behind "?".
function legendItems() {
  if (plan.mode === "design") {
    const marks = BASIS_KEYS.filter((k) => Object.values(plan.nodes || {}).some((n) => n?.basis === k));
    return [...marks.map((k) => el("span", null, `${t("b_" + k)} ${t("lb_" + k)}`)), el("span", null, t("talkLegend"))];
  }
  const items = plan.mode === "explain"
    ? [["done", t("lg_code")], ["new", t("lg_focus")], ["ext", t("lg_ext")]]
    : [["done", t("lg_done")], ["new", t("lg_new")], ["todo", t("lg_todo")], ["ext", t("lg_ext")]];
  return [...items.map(([c, label]) => {
    const sp = el("span");
    sp.append(el("i", "sw " + c, (plan.mode === "explain" ? EXPLAIN_MARK : MARK)[c]), label);
    return sp;
  }), ...PROP_TYPES.filter((k) => proposals().some(([, n]) => n.proposal.type === k)).map((k) => {

    return sp;
  }), el("span", null, t("talkLegend"))];
}

let termRe = null;

let commonGlossary = {}, glossary = {};
const escRe = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
// Not inside identifiers or paths such as usecase/extract/extract.go.
const edge = (t) => (/^\w/.test(t) ? "(?<![\\w./-])" : "") + escRe(t) + (/\w$/.test(t) ? "(?![\\w-]|\\.\\w)" : "");

// Shared terms ship with walkboard; the plan only adds its own. Only terms the plan uses are shown.
function setGlossary(own) {
  // Only the words people read: not field names ("settings.commit") and not addresses ("token" in a URL).
  const NOT_PROSE = new Set(["glossary", "settings", "url", "file", "root", "roots", "links", "anchor", "highlight", "id", "icon", "kind", "status", "basis", "type", "key",
    "nodes", "node", "from", "to", "actors", "states", "start", "end", "before", "after", "changed", "uses", "configs", "outside", "targets", "policy", "view", "option", "proposals", "sources", "source", "ref"]);

  const walk = (x, k) => {
    if (NOT_PROSE.has(k)) return;
    if (typeof x === "string") words.push(x);

  };
  walk(plan, "");
  const text = words.join("\n");
  const used = Object.fromEntries(Object.entries(commonGlossary).filter(([t]) => new RegExp(edge(t)).test(text)));

  glossary = {...Object.fromEntries(Object.entries(used).map(([k, v]) => [k, pick(v)])), ...(own && typeof own === "object" ? own : {})};
  const g = glossary;
  const terms = Object.keys(g).filter(Boolean).sort((a, b) => b.length - a.length);
  termRe = terms.length ? new RegExp(terms.map(edge).join("|"), "g") : null;
}

// Text with glossary terms that explain themselves on click or tap.
// Inside a box (passive) a term only underlines and shows its meaning on hover: a tap opens the box.
function rich(text, passive = false) {
  const f = document.createDocumentFragment();
  const str = String(text ?? "");
  if (!termRe) {
    f.append(str);
    return f;
  }
  let last = 0;
  for (const m of str.matchAll(termRe)) {
    f.append(str.slice(last, m.index));
    const t = el("span", "term", m[0]);
    t.title = glossary[m[0]];
    f.append(t);
    last = m.index + m[0].length;
    if (passive) continue;
    t.tabIndex = 0;
    t.setAttribute("role", "button");
    const open = (e) => {
      e.stopPropagation();
      showTip(t, m[0]);
    };
    t.onclick = open;
    t.onkeydown = (e) => { if (e.key === "Enter") open(e); };
  }
  f.append(str.slice(last));
  return f;
}

// Long identifiers (feedback.jsonl, order_events) may break after . / _ - instead of mid-word.
function breakable(e, text) {
  String(text ?? "").split(/(?<=[./_-])(?=\w)/).forEach((part, i) => {
    if (i) e.append(el("wbr"));
    e.append(part);
  });
  return e;
}

function richEl(tag, cls, text, passive) {
  const e = el(tag, cls);
  e.append(rich(text, passive));
  return e;
}

let tipFor = null;
function showTip(anchor, term) {
  const tip = document.getElementById("tip");
  // Tapping the same word again closes its explanation.
  if (!tip.hidden && tipFor === anchor) {
    tip.hidden = true;
    tipFor = null;
    return;
  }
  tipFor = anchor;
  tip.replaceChildren(el("b", null, term), document.createTextNode(glossary[term]));
  tip.hidden = false;
  const r = anchor.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.left + scrollX - 10, scrollX + document.documentElement.clientWidth - tip.offsetWidth - 8));
  const above = r.bottom + tip.offsetHeight + 14 > innerHeight && r.top > tip.offsetHeight + 14;
  tip.classList.toggle("above", above);
  tip.style.left = left + "px";
  tip.style.top = (above ? r.top + scrollY - tip.offsetHeight - 9 : r.bottom + scrollY + 9) + "px";
  tip.style.setProperty("--cx", Math.max(14, Math.min(tip.offsetWidth - 14, r.left + scrollX + r.width / 2 - left)) + "px");

document.addEventListener("click", () => (document.getElementById("tip").hidden = true));
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const tip = document.getElementById("tip");
  if (!tip.hidden) tip.hidden = true;
  else if (side && !(document.activeElement?.tagName === "TEXTAREA" && document.activeElement.value.trim())) closeSide();
});

// Every clickable box in a picture opens with Enter or Space too, whatever drew it.
document.addEventListener("keydown", (e) => {
  const d = e.target;
  if ((e.key !== "Enter" && e.key !== " ") || !d?.matches?.("#view [data-id][tabindex]") || d.onkeydown || e.repeat) return;
  e.preventDefault();
  d.click();
});

const LINK_STATE_KEYS = ["ok", "todo", "blocked", "standby"];
const unread = () => thread.filter((m) => m.from === "agent" && !seen.has(m.id));

// 💬 on every box that has a conversation, in whatever picture is drawn: a conversation belongs to the box, not to one picture.
function drawCounts() {
  const waitingFor = unread(), counts = new Map(), news = new Set(waitingFor.map((m) => m.node));
  for (const m of thread) if (m.node) counts.set(m.node, (counts.get(m.node) || 0) + 1);
  document.querySelectorAll("#view [data-id]").forEach((d) => {
    d.querySelector(":scope > .count")?.remove();
    const n = counts.get(d.dataset.id);
    if (n) d.append(el("span", "count" + (news.has(d.dataset.id) ? " unread" : ""), `💬 ${n}`));
  });
  document.querySelectorAll(".chip[data-step]").forEach((c) => {
    const id = c.dataset.step;
    c.classList.toggle("unread", waitingFor.some((m) => !m.node && (id ? m.step === id : !m.step)));
  });
}

// A message keeps its element while it does not change, so an event does not build a long chat again and text selected
// in it stays selected. One thread at a time holds an element: a second thread showing the message makes its own.
const msgCache = new Map();
function msgFor(m, holder) {
  const key = `${lang}|${m.delivered ? 1 : 0}`;
  let c = msgCache.get(m.id);
  if (!c || c.key !== key) msgCache.set(m.id, c = {key, el: msgEl(m)});
  return c.el.isConnected && c.el.parentElement !== holder ? msgEl(m) : c.el;
}

function refreshThreads() {
  // No poll waiting on the page: what was sent waits in line, and what was taken is being worked on.
  const open = snapshot ? [] : unanswered(), noPoll = connected && !waiting;
  const queue = snapshot || !noPoll ? [] : thread.filter((m) => m.from !== "agent" && !m.delivered && m.kind !== "settings");
  document.querySelectorAll(".thread[data-ctx]").forEach((t) => {
    const c = JSON.parse(t.dataset.ctx);
    // Like a chat: open on the newest message and stay there, also when the chat is unfolded, the panel widened
    // or the window resized, until you scroll up to read older ones. A hidden chat cannot be measured, so it remembers.
    if (!t.dataset.follow) {
      t.dataset.follow = "1";
      t.addEventListener("scroll", () => (t.dataset.follow = t.scrollHeight - t.scrollTop - t.clientHeight < 40 ? "1" : "0"));
      new ResizeObserver(() => t.dataset.follow === "1" && (t.scrollTop = t.scrollHeight)).observe(t);
    }
    const end = t.dataset.follow === "1";
    const msgs = thread.filter((m, i) => inThread(m, c, i) && m.kind !== "settings");
    msgs.forEach((m) => m.from === "agent" && seen.add(m.id));
    const els = msgs.map((m) => msgFor(m, t)), have = [...t.children].filter((x) => !x.classList.contains("typing"));
    if (els.length === have.length && els.every((x, i) => x === have[i])) t.querySelectorAll(":scope > .typing").forEach((x) => x.remove());
    else t.replaceChildren(...els);
    const busy = open.findLast((m) => inCtx(m, c));
    const other = busy && thread.findLast((r) => r.from === "agent" && r.at > busy.at);
    if (other) hiddenNotes.has(busy.id) || t.append(elsewhereEl(busy, other));
    else if (busy && noPoll && !(quiet(busy) && hiddenNotes.has(busy.id))) t.append(typingEl(busy));
    const waitingHere = queue.findLast((m) => inCtx(m, c));
    if (waitingHere) t.append(queuedEl(waitingHere, queue, open));
    // Follow the conversation while you are at its end, as a chat does.
    if (end) t.scrollTop = t.scrollHeight;
    const lbl = t.closest(".pb")?.querySelector(".fold .lbl");
    if (lbl) lbl.dataset.n = msgs.length || "";
  });
  const fresh = freshReply && document.querySelector(`.msg[data-id="${CSS.escape(freshReply)}"]`);
  if (fresh) {
    fresh.classList.add("flash");
    setTimeout(() => fresh.classList.remove("flash"), 2500);
    fresh.scrollIntoView({block: "nearest", behavior: "smooth"});
  }
  freshReply = null;
  drawCounts();
  renderAskBar();
  renderBadges();
}

// One way in to every conversation, at the bottom of the page: it talks about what is on screen and opens the panel to type in.
function renderAskBar() {
  const bar = document.getElementById("askbar");
  if (snapshot || !plan) return;
  const opt = isDesign() ? shownOption() : null, step = curStep();
  const c = opt ? {option: opt.id} : step ? {step: step.id} : {};
  const n = thread.filter((m) => inCtx(m, c) && m.kind !== "settings").length;
  const words = opt ? t("askOption", opt.title) : step ? t(plan.mode === "explain" ? "askStage" : "askStep") : t("askPlan");
  const label = el("span", "asklabel", words);
  bar.replaceChildren(el("span", "askicon", "💬"), label, ...(n ? [el("span", "askn", String(n))] : []));
  bar.setAttribute("aria-label", words);
  bar.hidden = false;
  bar.onclick = () => {
    const open = () => {
      openSide(opt ? {kind: "option", id: opt.id} : step ? {kind: "step", id: step.id} : {kind: "plan"});
      // Faded until the panel has arrived (it is hidden while the panel is open), so it never shows again on the way.
      setTimeout(() => bar.classList.remove("leaving"), 600);
      // The panel arrives in a View Transition: type into it once it is there.
      setTimeout(() => document.querySelector("#panel textarea")?.focus({preventScroll: true}), 380);
    };
    // The bar fades away first, then the panel opens where the talk goes on.
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return open();
    bar.classList.add("leaving");
    setTimeout(open, 230);
  };
}

async function send(c, kind, text, extra = {}) {
  const body = {...extra, kind, text};
  if (c.node) body.node = c.node;
  if (c.step) body.step = c.step;
  if (c.option) body.option = c.option;
  if (c.criterion) body.criterion = c.criterion;
  body.view ||= viewId || plan.views[0]?.id;
  if (!body.view) delete body.view;
  if (stepId && !c.step) body.viewingStep = stepId;
  const r = await fetch("/api/feedback?token=" + encodeURIComponent(token), {
    method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
}

// quick: buttons that send at once. Everything typed goes in one box; the agent tells a question from a request to change something.
// to, prefix, sent: for a conversation that continues elsewhere (a box taken out of the plan continues in the whole plan's).
function talkBox(c, {placeholder, quick = [], extra = {}, to = c, prefix = "", sent = null}) {
  if (snapshot) {
    // Read-only: the conversation if it was exported, nothing to type into.
    const box = el("div", "talk");
    const thr = el("div", "thread");
    thr.dataset.ctx = JSON.stringify(c);
    box.append(thr);
    return box;
  }
  const key = ctxKey(c);
  const box = el("div", "talk");
  const comp = el("div", "composer");
  const ta = el("textarea");
  ta.dataset.key = key;
  ta.value = drafts[key] || "";
  ta.placeholder = placeholder;
  ta.oninput = () => (drafts[key] = ta.value);
  const note = el("span", "note", hintText());
  const sendBtn = el("button", "primary", t("send"));
  const thumbs = el("div", "attached");
  thumbs.dataset.key = key;
  thumbs.draw = () => {
    thumbs.replaceChildren(...(pendingImages[key] || []).map((im) => {
      const d = el("span", "thumb"), img = el("img"), x = el("button", null, "×");
      img.src = im.url;
      img.alt = t("imageAlt");
      x.type = "button";
      x.title = t("imageRemove");
      x.setAttribute("aria-label", x.title);
      x.onclick = () => {
        URL.revokeObjectURL(im.url);
        pendingImages[key] = pendingImages[key].filter((o) => o !== im);
        thumbs.draw();
      };
      d.append(img, x);
      return d;
    }));
  };
  thumbs.draw();
  const redrawThumbs = () => document.querySelectorAll(`.attached[data-key="${CSS.escape(key)}"]`).forEach((x) => x.draw());
  const addImages = async (files) => {
    for (const file of files) {
      if ((pendingImages[key] || []).length >= MAX_MSG_IMAGES) {
        note.textContent = t("imageMany", MAX_MSG_IMAGES);
        note.className = "note err";
        break;
      }
      const blob = IMAGE_ACCEPT.includes(file.type) ? await shrinkImage(file) : null;
      if (!blob || blob.size > MAX_IMAGE_BYTES) {
        note.textContent = t(blob ? "imageBig" : "imageKind");
        note.className = "note err";
        continue;
      }
      (pendingImages[key] ||= []).push({blob, url: URL.createObjectURL(blob)});
      redrawThumbs();
    }
  };
  // A paste that also carries words (a cell from a spreadsheet) stays words.
  ta.onpaste = (e) => {
    const files = [...e.clipboardData.files].filter((x) => x.type.startsWith("image/"));
    if (!files.length || e.clipboardData.getData("text/plain")) return;
    e.preventDefault();
    addImages(files);
  };
  comp.ondragover = (e) => {
    if (!e.dataTransfer?.types.includes("Files")) return;
    e.preventDefault();
    comp.classList.add("dropping");
  };
  comp.ondragleave = (e) => !comp.contains(e.relatedTarget) && comp.classList.remove("dropping");
  comp.ondrop = (e) => {
    comp.classList.remove("dropping");
    if (!e.dataTransfer?.files.length) return;
    e.preventDefault();
    addImages([...e.dataTransfer.files]);
  };
  const picker = el("input");
  picker.type = "file";
  picker.accept = IMAGE_ACCEPT.join(",");
  picker.multiple = true;
  picker.hidden = true;
  picker.onchange = () => {
    addImages([...picker.files]);
    picker.value = "";
  };
  const clip = el("button", "clip", "📎");
  clip.type = "button";
  clip.title = t("imageAttach");
  clip.setAttribute("aria-label", clip.title);
  clip.onclick = () => picker.click();
  let busy = false;
  const buttons = [sendBtn];
  const go = async (kind, fallback) => {
    if (busy) return;
    const images = pendingImages[key] || [];
    const text = ta.value.trim() || fallback || (images.length ? t("q_image") : "");
    if (!text) {
      note.textContent = t("typeFirst");
      note.className = "note err";
      return ta.focus();
    }
    busy = true;
    buttons.forEach((b) => (b.disabled = true));
    // The box empties now, not when the server answers: the message comes back over the live stream first, and that can
    // draw this panel again from `drafts`, with a new box still holding the text. A failed send puts it back.
    const typed = ta.value;
    if (typed.trim()) ta.value = drafts[key] = "";
    pendingImages[key] = [];
    redrawThumbs();
    const live = () => document.querySelector(`textarea[data-key="${CSS.escape(key)}"]`) || ta;
    const say = (text, cls) => {
      const n = live().closest(".composer")?.querySelector(".note") || note;
      n.textContent = text;
      n.className = cls;
    };
    try {
      const names = await Promise.all(images.map((im) => uploadImage(im.blob)));
      await send(to, kind, prefix + text, names.length ? {...extra, images: names} : extra);
      images.forEach((im) => URL.revokeObjectURL(im.url));
      if (sent) return sent();
      say(t(chatMode() ? "sentChat" : "sent"), "note");
      if (chatMode()) (live().closest(".composer")?.querySelector(".note") || note).append(" ", copyCheck());
      // The message and what happens next sit at the panel's bottom: show them, wherever the panel was scrolled.
      requestAnimationFrame(() => live().closest(".composer")?.scrollIntoView({block: "nearest"}));
    } catch (e) {
      if (typed.trim() && !live().value.trim()) live().value = drafts[key] = typed;
      pendingImages[key] = [...images, ...(pendingImages[key] || [])];
      redrawThumbs();
      say(/413/.test(e.message) ? t("tooLong") : t("sendFail") + e.message, "note err");
    } finally {
      busy = false;
      buttons.forEach((b) => (b.disabled = false));
    }
  };
  if (quick.length) {
    const row = el("div", "quick");
    for (const k of quick) {
      const b = el("button", k === "approve" ? "primary" : null, t(k));
      b.title = t("quickTip");
      b.onclick = () => (k !== "approve" || approveOk()) && go(k, t("q_" + k));
      buttons.push(b);
      row.append(b);
    }
    comp.append(row);
  }
  sendBtn.onclick = () => go("question", "");
  // Enter sends, as in any chat; Shift+Enter starts a new line.
  ta.onkeydown = (e) => {
    if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
    e.preventDefault();
    go("question", "");
  };
  const row = el("div", "send");
  row.append(clip, picker, note, sendBtn);
  const thr = el("div", "thread");
  thr.dataset.ctx = JSON.stringify(c);
  // Like a chat: the conversation first, what you type under it.
  comp.append(thumbs, ta, row);
  box.append(thr, comp);
  return box;
}

async function saveSetting(change) {
  try {
    const r = await fetch("/api/settings?token=" + encodeURIComponent(token), {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(change)});
    if (!r.ok) throw new Error(await r.text());
  } catch (e) {
    const box = document.getElementById("toast");
    box.className = "toast";
    box.replaceChildren(t("settingFail") + e.message);
    box.hidden = false;
    renderBadges();
  }
}

// Messages the agent has taken but not answered in the same place, while it is not listening: it is working on them.
function working() {
  return connected && !waiting ? unanswered() : [];
}
// Messages the agent took and has not answered in the same place. One pass from the newest: a chat can be long, and this
// runs on every event. A whole-plan reply also answers the option message right before it (see inThread).
function unanswered() {
  const answered = new Set(), out = [];
  let planReply = false;
  for (let i = thread.length - 1; i >= 0; i--) {
    const m = thread[i];
    if (m.kind === "settings") continue;
    if (m.from === "agent") {
      answered.add(ctxKey(ctxOf(m)));
      if (inCtx(m, {})) planReply = true;
      continue;
    }
    const key = ctxKey(ctxOf(m));
    if (planReply && m.option) answered.add(key);
    planReply = false;
    if (m.delivered && !answered.has(key) && !(m.kind === "approve" && plan?.approved) && !(STEP_ANSWERS.includes(m.kind) && plan?.steps?.find((x) => x.id === m.step)?.status !== "review")) out.unshift(m);
  }
  return out;
}

// Ten minutes with no sign of the agent (a reply anywhere, a change to the plan) since this message: it may well have
// answered in its own chat or stopped, which the page cannot tell apart, so it says what it knows and stops saying "typing".
const QUIET_MIN = 10;
let agentActiveAt = 0;
const quiet = (m) => {
  const replied = thread.findLast((r) => r.from === "agent")?.at;
  return Date.now() - Math.max(Date.parse(m.at), agentActiveAt, replied ? Date.parse(replied) : 0) >= QUIET_MIN * 60000;
};
const hiddenNotes = new Set((() => {
  try {
    return JSON.parse(store.get("walkboard.quiet." + token)) || [];
  } catch {
    return [];
  }
})());

// A message answered somewhere else: where, as a link, instead of looking as if nothing came back.
function elsewhereEl(m, reply) {
  const d = el("div", "msg agent typing stuck elsewhere");
  const line = el("span");
  line.append(t("answeredAt") + " ", talkLink(sideOf(reply)));
  d.append(line, hideBtn(m, d));
  return d;
}
function hideBtn(m, d) {
  const hide = el("button", "typing-x", "×");
  hide.title = t("hideNote");
  hide.setAttribute("aria-label", hide.title);
  hide.onclick = () => {
    hiddenNotes.add(m.id);
    store.set("walkboard.quiet." + token, JSON.stringify([...hiddenNotes]));
    d.remove();
  };
  return hide;
}

// A message still waiting its turn, and what it waits for. queue: every message not yet taken, oldest first.
function queuedEl(m, queue, open) {
  const d = el("div", "msg agent typing stuck queued"), line = el("span");
  const n = queue.indexOf(m) + 1, busy = open.findLast((x) => sideKey(sideOf(x)) !== sideKey(sideOf(m)) && !quiet(x)), doing = steps().find((s) => s.status === "doing");
  line.append(`⏳ ${t("queued", n)} · `);
  if (busy) line.append(t("queuedAnswering") + " ", talkLink(sideOf(busy)));
  else if (open.some((x) => sideKey(sideOf(x)) === sideKey(sideOf(m)) && !quiet(x))) line.append(t("queuedSame"));
  // Not woken by the page: the user has to tell the agent, whatever step it is on.
  else if (chatMode()) line.append(t("queuedChat"), " ", copyCheck());
  else if (doing) line.append(t("queuedBuilding") + " ", talkLink({kind: "step", id: doing.id}));
  else line.append(t("queuedAway"));
  d.append(line);
  return d;
}

function typingEl(m) {
  const min = Math.floor((Date.now() - Date.parse(m.at)) / 60000);
  const stuck = quiet(m);
  const d = el("div", "msg agent typing" + (stuck ? " stuck" : ""));
  const dots = el("span", "dots");
  dots.append(el("i"), el("i"), el("i"));
  d.append(dots, el("span", null, stuck ? t("noReply", min) : t("working", min)));
  if (stuck) d.append(hideBtn(m, d));
  return d;
}

function renderBadges() {
  const conn = document.getElementById("conn");
  const busy = working().some((m) => !quiet(m) && !thread.some((r) => r.from === "agent" && r.at > m.at)), building = !!plan && steps().some((x) => x.status === "doing");
  // A snapshot says when it was exported instead (set once in load).
  if (!snapshot) {
    const inLineN = connected && !waiting ? thread.filter((m) => m.from !== "agent" && !m.delivered && m.kind !== "settings").length : 0;
    // A dot while all is well; words when something is off or waiting.
    const chat = chatMode() && !busy;
    // Not woken by the page: words, never just a dot, and a click says what to do.
    conn.className = "conn " + (!connected ? "off" : waiting ? "on" : chat ? "chat" : busy || building ? "work" : "idle") + (connected && !inLineN && !chat ? " dot" : "");
    conn.onclick = chat ? (e) => (e.stopPropagation(), openChatCard()) : null;
    conn.tabIndex = chat ? 0 : -1;
    conn.onkeydown = chat ? (e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), openChatCard()) : null;
    if (chat) conn.setAttribute("role", "button");
    else conn.removeAttribute("role");
    const inLine = connected && !waiting ? thread.filter((m) => m.from !== "agent" && !m.delivered && m.kind !== "settings").length : 0;
    const connWords = !connected ? t(!served ? "connOff" : everConnected ? "connLost" : "connecting") : waiting ? t("connOn") : chat ? t("connChat") : busy ? t("connWorking") : building ? t("connBuilding") : t("connIdle");
    // Not live: the words go on a phone, the ✉ and the count stay; a tap still opens the card that says it all.
    if (connected && chat) conn.replaceChildren(`✉ ${inLine ? inLine : ""}`, el("span", "cwords", `${inLine ? " · " : ""}${t("connChatShort")}`));
    else conn.textContent = !connected ? connWords : inLine ? `⏳ ${inLine}` : "";
    conn.title = (!connected ? t("connLostTip") : waiting ? t("connOnTip") : chat ? t("connChatTip") : busy ? t("connWorkingTip") : t("connIdleTip")) + (inLine ? `. ${t("queuedCount", inLine)}` : "") + (pageVersion ? ` · Walkboard ${pageVersion}` : "");
    conn.setAttribute("aria-label", connWords + ". " + conn.title);
  }
  if (!plan) return;
  updateTitle();
  renderBar();
}

// The step the agent is on, or the one waiting for the user.
const activeStep = (p) => (p?.steps || []).find((s) => s.status === "doing" || yourTurn(s)) || null;

function renderBar() {
  const extra = [];
  const list = steps();
  if (plan.mode !== "explain" && plan.approved && list.length) {
    const a = activeStep(plan);
    const all = list.every((s) => s.status === "done");
    if (a || all) {
      // Answered and waiting for the agent is no longer the user's turn.
      const i = list.indexOf(a) + 1, review = a && a.status !== "doing" && !answered(a);
      const more = list.filter((s) => yourTurn(s) && !answered(s)).length - (review ? 1 : 0);
      const b = el("button", "progress " + (all ? "done" : review ? "review" : "doing"),
        all ? t("progDone", list.length) : t(review ? "progReview" : "progDoing", i, list.length) + (more > 0 ? ` (+${more})` : ""));
      if (a) b.onclick = () => {
        selectStep(a.id);
        if (review) openSide({kind: "step", id: a.id});
      };
      extra.push(b);
      if (review && yourTurn(a) === "turnNext" && connected) extra.push(nextButtons(a));
      if (review && yourTurn(a) === "turnCommit") {
        const c = el("button", "primary", t("checkCommit"));
        c.onclick = b.onclick;
        extra.push(c);
      }
    }
  }
  renderTalksBtn();
  if ((plan.mode ?? "build") === "build" && !plan.approved && connected && steps().length) {
    const sent = approvePending();
    const b = el("button", "primary", sent ? t("approveSent") : "✓ " + t("approve"));
    b.disabled = sent;
    b.title = t("quickTip");
    b.onclick = async (e) => {
      e.stopPropagation();
      if (!approveOk()) return;
      b.disabled = true;
      try {
        await send({}, "approve", t("q_approve"));
        b.textContent = t("approveSent");
      } catch {
        b.disabled = false;
      }
    };
    extra.push(b);
  }
  const n = changes.nodes.size + changes.steps.size + changes.notes.length;
  if (n) {
    const b = el("button", "changes", t("changedN", n));
    b.onclick = (e) => {
      e.stopPropagation();
      showChangeList();
    };
    extra.push(b);
  }
  document.getElementById("barExtra").replaceChildren(...extra);
}

// What a step in review still waits for: the commit when the user commits, else the word to go on.
// Approved and not yet answered: the agent replying (e.g. with a question) gives the button back.
const STEP_ANSWERS = ["commit", "committed", "next"];
const approvePending = () => {
  const i = thread.findLastIndex((m) => m.kind === "approve" && m.from !== "agent");
  return i >= 0 && !thread.slice(i + 1).some((m) => m.from === "agent");
};
const approveOk = () => !proposals().length || confirm(t("approveOpen", proposals().length));

// A step whose answer (commit or go on) was sent and is waiting for the agent.
const answered = (step) => thread.some((m, i) => m.step === step.id && !m.node && STEP_ANSWERS.includes(m.kind) &&
  !thread.slice(i + 1).some((x) => x.from === "agent" && x.step === step.id && !x.node));

function yourTurn(step) {
  if (snapshot || step?.status !== "review" || plan.mode === "explain") return null;
  return plan.settings?.commit === "suggest" && suggested(step) ? "turnCommit" : "turnNext";
}
// The agent says what to commit, and only when the step changed files: a step that changed none has nothing to fill in.
const suggested = (step) => !!step.commitMessage?.trim() || !!step.commits?.some((c) => c?.message?.trim());

// A finished step goes on when the user says so; on the last step that ends the plan.
// "Run the rest" only when the agent commits by itself: otherwise each step still waits for its commit.
function nextButtons(step, cls = "") {
  const list = steps(), after = list[list.indexOf(step) + 1];
  const box = el("span", "nextbox " + cls);
  const go = el("button", "primary", after ? t("nextStep", after.title) : t("finishPlan"));
  const rest = after && plan.settings?.commit !== "suggest" && list.indexOf(after) < list.length - 1 ? el("button", "quiet", t("runRest")) : null;
  const say = async (text, extra) => {
    go.disabled = true;
    if (rest) rest.disabled = true;
    try {
      await send({step: step.id}, "next", text, extra);
    } catch (e) {
      go.disabled = false;
      if (rest) rest.disabled = false;
      const box = document.getElementById("toast");
      box.className = "toast";
      box.replaceChildren(t("sendFail") + e.message);
      box.hidden = false;
    }
  };
  go.onclick = () => say(t(after ? "q_next" : "q_finish"));
  box.append(go);
  if (rest) {
    rest.onclick = () => say(t("q_runRest"), {all: true});
    box.append(rest);
  }
  return box;
}

// The agent's suggested commits (one or several, each with its files), editable; the user commits through the agent or says they did it themselves.
let commitShown = null;
function commitBox(step) {
  const list = Array.isArray(step.commits) && step.commits.length ? step.commits : [{message: step.commitMessage ?? ""}];
  const box = el("div", "commitbox");
  box.append(el("div", "lbl", list.length > 1 ? t("commitsLabel", list.length) : t("commitLabel")));
  const areas = list.map((c, i) => {
    const key = `commit:${step.id}:${i}`;
    const item = el("div", "citem");
    const ta = el("textarea");
    ta.dataset.key = key;
    ta.value = drafts[key] ?? c.message ?? "";
    ta.placeholder = t("noCommitMsg");
    ta.oninput = () => {
      drafts[key] = ta.value;
      now.disabled = areas.some((a) => !a.value.trim());
    };
    if (list.length > 1) {
      const head = el("div", "chead");
      head.append(el("span", "cnum", String(i + 1)), t("commitN", i + 1, list.length));
      item.append(head);
    }
    item.append(ta);
    if (c.files?.length) {
      const files = el("div", "cfiles");
      c.files.forEach((f) => files.append(el("code", null, f)));
      item.append(el("div", "flabel", t("filesN", c.files.length)), files);
    }
    box.append(item);
    return ta;
  });
  const now = el("button", "primary", t(list.length > 1 ? "commitNow" : "commitNow1"));
  const mine = el("button", null, t("committed"));
  const note = el("span", "note");
  const go = async (kind, text, extra) => {
    now.disabled = mine.disabled = true;
    try {
      await send({step: step.id}, kind, text, extra);
      note.textContent = t("sent");
    } catch (e) {
      note.textContent = t("sendFail") + e.message;
      now.disabled = areas.some((a) => !a.value.trim());
      mine.disabled = false;
    }
  };
  now.disabled = areas.some((a) => !a.value.trim());
  now.onclick = () => {
    const commits = list.map((c, i) => ({message: areas[i].value.trim(), ...(c.files?.length ? {files: c.files} : {})}));
    go("commit", commits.map((c) => c.message).join("\n\n"), {commits});
  };
  mine.onclick = () => go("committed", t("q_committed"));
  const row = el("div", "row");
  row.append(now, mine, note);
  box.append(row);
  return box;
}

// ---------- design mode: options, a comparison by weighted criteria, constraints and sources
const BASIS_KEYS = ["iac", "cli", "doc", "assumed"];
const MODES_SHOWN = ["build", "explain", "design"];
const isDesign = () => plan?.mode === "design";
const options = () => (isDesign() && Array.isArray(plan.options) ? plan.options.filter((o) => o?.id) : []);
const criteria = () => (Array.isArray(plan?.criteria) ? plan.criteria.filter((c) => c?.id) : []);
let optionId = null;
const curOption = () => options().find((o) => o.id === optionId) || options().find((o) => o.id === plan.decision?.option) || options().find((o) => o.recommended) || options()[0] || null;
// The option the picture on screen belongs to: its main picture, or one marked "option". None for a picture of its own.
const shownOption = () => {
  const v = plan.views.find((x) => x.id === viewId), c = curOption();
  const owns = (o) => o.view === v.id || v.option === o.id;
  return !v || !c?.view || owns(c) ? c : options().find(owns) || null;
};
const cell = (o, c) => plan.scores?.[o]?.[c] || null;
const sourceNo = (id) => (plan.sources || []).findIndex((x) => x?.id === id) + 1;
const unconfirmed = () => (plan.constraints || []).filter((c) => c && !c.confirmed).length + Object.values(plan.nodes || {}).filter((n) => n?.basis === "assumed").length;

function totals() {
  return Object.fromEntries(options().map((o) => {
    let got = 0, max = 0;
    for (const c of criteria()) {
      // A missing score counts as 0, so leaving a cell out never lifts an option; "na" leaves the criterion out.
      const w = c.weight ?? 1, r = cell(o.id, c.id)?.rating, v = ratingValue(r) ?? 0;
      if (!w || r === "na") continue;
      got += w * v;
      max += w * 5;
    }
    return [o.id, max ? Math.round((got / max) * 100) : null];
  }));
}

function chooseOption(id) {
  crossPicture(() => {
    optionId = id;
    viewId = curOption()?.view || viewId;
    renderView();
    renderStepCard();
    renderCompare();
  });
}

function sourceLink(src) {
  const a = el("a", null, `[${sourceNo(src.id)}] ${src.title || src.url} ↗`);
  if (!/^https?:\/\//.test(src.url || "")) return el("span", null, a.textContent.replace(/ ↗$/, ""));
  a.href = src.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  return a;
}

function ratingEl(r) {
  if (r === "yes") return el("span", "yes", "✓");
  if (r === "no") return el("span", "no", "✗");
  const v = ratingValue(r);
  if (v == null) return el("span", "na", "—");
  return el("span", "dots", "●".repeat(Math.round(v)) + "○".repeat(5 - Math.round(v)));
}

function renderConstraints() {
  const bar = document.getElementById("constraints");
  const list = (plan.constraints || []).filter((c) => c?.id);
  bar.hidden = !list.length;
  if (!list.length) return;
  // One line on screen: the first few still to confirm, then counts; the side panel has them all. Print shows every chip.
  const open = list.filter((c) => !c.confirmed), done = list.filter((c) => c.confirmed), SHOWN = 3;
  const show = () => openSide({kind: "constraints"});
  const parts = [el("span", "clabel", t("constraintsLabel"))];
  for (const c of [...open, ...done]) {
    const chip = el("span", "cchip" + (c.confirmed ? "" : " assumed") + (c.confirmed || open.indexOf(c) >= SHOWN ? " more" : ""), (c.confirmed ? "✓ " : "❓ ") + c.text);
    chip.title = c.text + (c.confirmed ? "" : `\n${t("assumedTip")}`);
    chip.onclick = show;
    parts.push(chip);
  }
  if (open.length > SHOWN) parts.push(el("span", "ccount cmore", t("consMore", open.length - SHOWN)));
  // A phone has no room for the chips: how many wait instead, one tap from the list.
  if (open.length) {
    const n = el("span", "ccount copen", t("consOpen", open.length));
    n.onclick = show;
    parts.push(n);
  }
  if (done.length) parts.push(el("span", "ccount ok", t("consDone", done.length)));
  const check = el("button", "talklink", t(open.length ? "consAnswer" : "consAll"));
  check.onclick = show;
  parts.push(check);
  bar.replaceChildren(...parts);
}

function renderOptionCard() {
  const card = document.getElementById("stepcard");
  const o = shownOption();
  if (!o) {
    // A picture no option owns can still be what the user wants: choosing it tells the agent which picture.
    const v = plan.views.find((x) => x.id === viewId);
    if (!options().length || !v) return card.replaceChildren();
    const c = el("div", "stepcard optcard");
    c.append(el("h3", null, v.title || v.id));
    if (!plan.decision?.option) {
      const acts = el("div", "acts"), go = el("button", "primary", t("chooseView"));
      go.onclick = () => openSide({kind: "decide", view: v.id});
      acts.append(go);
      c.append(acts);
    }
    card.replaceChildren(c);
    return refreshThreads();
  }
  const c = el("div", "stepcard optcard");
  const h = el("h3", null, o.title);
  if (o.recommended) h.append(el("span", "orec", t("recommended")));
  c.append(h);
  if (o.summary) c.append(richEl("p", "detail", o.summary));
  if (o.why) c.append(richEl("p", "why", o.why));
  const d = plan.decision;
  if (d?.option) {
    const mine = d.option === o.id;
    const box = el("div", "decided" + (mine ? "" : " other"), mine ? t("decided", o.title) : t("notChosen"));
    // Who chose and when: from the decision, else from the user's "decide" message.
    const asked = thread.findLast((m) => m.kind === "decide" && m.option === d.option && m.from !== "agent");
    const when = d.at || asked?.at;
    if (mine && (d.by || when)) box.append(el("div", "dwho", [d.by, when && new Date(when).toLocaleString(dateLocale(), {dateStyle: "medium", timeStyle: "short"})].filter(Boolean).join(" · ")));
    const why = mine ? d.why : d.not?.[o.id];
    if (why) box.append(el("div", null, why));
    // The record in one place: why the others lost, and the plan the choice became.
    if (mine) {
      for (const [id, reason] of Object.entries(d.not || {})) {
        const other = options().find((x) => x.id === id);
        if (other && typeof reason === "string") box.append(el("div", "dnot", `✗ ${other.title}: ${reason}`));
      }
      for (const l of (plan.links || []).filter((x) => /^https?:\/\//.test(x?.url || ""))) {
        const a = el("a", "dlink", "→ " + (l.title || l.url));
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        box.append(a);
      }
    }
    c.append(box);
  } else {
    const acts = el("div", "acts");
    const go = el("button", "primary", t("choose"));
    go.onclick = () => openSide({kind: "decide", id: o.id});
    acts.append(go);
    c.append(acts);
  }
  card.replaceChildren(c);
  refreshThreads();
}

function renderCompare() {
  const box = document.getElementById("compare");
  if (!isDesign() || !options().length || !criteria().length) return box.replaceChildren();
  const pct = totals(), out = Object.fromEntries(options().map((o) => [o.id, failsMust(plan, o.id).length > 0]));
  const best = Math.max(...options().filter((o) => !out[o.id] && pct[o.id] != null).map((o) => pct[o.id]));
  const cur = shownOption()?.id;
  const wrap = el("div", "cmp");
  wrap.append(el("h4", null, t("compareTitle")));
  const table = el("table"), head = el("tr");
  // The dots under each criterion are its weight; say so once, where the eye starts.
  head.append(el("th", "whead", t(snapshot ? "weightHeadRO" : "weightHead")));
  for (const o of options()) {
    const th = el("th", (o.id === cur ? "sel" : "") + (out[o.id] ? " out" : ""), (o.recommended ? "★ " : "") + o.title);
    th.style.cursor = "pointer";
    th.onclick = () => chooseOption(o.id);
    head.append(th);
  }
  const thead = el("thead");
  thead.append(head);
  const tbody = el("tbody");
  for (const c of criteria()) {
    const tr = el("tr"), th = el("th", null, c.label);
    const w = c.weight ?? 1;
    const wb = el("button", "wbtn", "●".repeat(w) + "○".repeat(3 - w));
    wb.title = t("weightTip");
    th.append(el("span", "wtext", ` ×${w}`));
    wb.onclick = async () => {
      const next = (w + 1) % 4;
      c.weight = next;
      renderCompare();
      renderView();
      await fetch("/api/settings?token=" + encodeURIComponent(token), {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({weights: {[c.id]: next}})}).catch(() => {});
    };
    if (c.must) th.append(" ", el("span", "must", t("must")));
    const guess = (plan.constraints || []).filter((k) => k && !k.confirmed && Array.isArray(k.affects) && k.affects.includes(c.id));
    if (guess.length) {
      const q = el("span", "cguess", " ❓");
      q.title = t("restsOn") + guess.map((k) => k.text).join("; ");
      th.append(q);
    }
    th.append(el("br"), wb);
    tr.append(th);
    for (const o of options()) {
      const x = cell(o.id, c.id);
      const td = el("td", (o.id === cur ? "sel" : "") + (out[o.id] ? " out" : ""));
      td.append(ratingEl(x?.rating));
      for (const s of x?.sources || []) if (sourceNo(s)) td.append(el("sup", null, `[${sourceNo(s)}]`));
      if (x?.basis === "judgment") {
        const j = el("sup", "cjudge", "✎");
        j.title = t("judgment");
        td.append(j);
      }
      if (x?.value) td.append(el("div", "cval", String(x.value)));
      td.onclick = () => openSide({kind: "cell", option: o.id, criterion: c.id});
      tr.append(td);
    }
    tbody.append(tr);
  }
  const foot = el("tr");
  foot.append(el("th", null, t(snapshot ? "totalShared" : "total")));
  for (const o of options()) {
    if (out[o.id]) {
      const td = el("td", (o.id === cur ? "sel " : "") + "out", "✗ " + t("failsMust"));
      td.title = failsMust(plan, o.id).map((id) => criteria().find((c) => c.id === id)?.label || id).join(", ");
      foot.append(td);
      continue;
    }
    const td = el("td", (o.id === cur ? "sel " : "") + (pct[o.id] === best ? "best" : ""), pct[o.id] == null ? "—" : pct[o.id] + "%");
    const meter = el("span", "meter"), fill = el("i");
    fill.style.width = (pct[o.id] || 0) + "%";
    meter.append(fill);
    td.append(meter);
    foot.append(td);
  }
  const tfoot = el("tfoot");
  tfoot.append(foot);
  table.append(thead, tbody, tfoot);
  wrap.append(table, el("p", "cmplegend", t("ratingLegend")));
  // When the user's weights (or a failed must) put another option ahead of the agent's pick, say so and offer a re-check.
  const rec = options().find((o) => o.recommended);
  const lead = options().find((o) => !out[o.id] && pct[o.id] === best);
  if (rec && lead && lead.id !== rec.id && !plan.decision?.option && (out[rec.id] || pct[lead.id] > pct[rec.id])) {
    const note = el("div", "cmpnote", t(out[rec.id] ? "recFails" : snapshot ? "leadShared" : "leadNote", lead.title, rec.title));
    const ask = el("button", null, t("askRecheck"));
    ask.onclick = async () => {
      ask.disabled = true;
      // The answer comes in the plan's conversation: open it where it will appear.
      openSide({kind: "plan"});
      await send({}, "question", t("q_recheck", lead.title, rec.title)).catch(() => (ask.disabled = false));
    };
    note.append(ask);
    wrap.append(note);
  }
  box.replaceChildren(wrap);
}
