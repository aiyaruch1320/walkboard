<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>planview</title>
<style>
:root{
  --bg:#f7f6f2;--card:#ffffff;--text:#1f1e1c;--muted:#6b6a65;--line:#d9d7cf;
  --done-bg:#e1f5ee;--done-bd:#1d9e75;--done-tx:#085041;
  --new-bg:#faeeda;--new-bd:#ef9f27;--new-tx:#633806;
  --todo-bg:#f1efe8;--todo-bd:#b4b2a9;--todo-tx:#888780;
  --ext-bg:#e6f1fb;--ext-bd:#378add;--ext-tx:#0c447c;
  --warn-bg:#fcebeb;--warn-bd:#d85a5a;--warn-tx:#7a1f1f;
  --code:#f1efe8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1b19;--card:#262522;--text:#ecebe6;--muted:#a3a19a;--line:#3d3c38;
  --done-bg:#0b3d31;--done-bd:#5dcaa5;--done-tx:#c8f0e2;
  --new-bg:#4a3006;--new-bd:#ef9f27;--new-tx:#fae3b8;
  --todo-bg:#2c2c2a;--todo-bd:#5f5e5a;--todo-tx:#888780;
  --ext-bg:#0c2a4a;--ext-bd:#85b7eb;--ext-tx:#d6e7f8;
  --warn-bg:#4a1717;--warn-bd:#e07a7a;--warn-tx:#f8d6d6;
  --code:#2c2c2a;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,"Noto Sans Thai","Sarabun",system-ui,sans-serif}
main{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;font-weight:500;margin:0}
.goal{color:var(--muted);margin:2px 0 12px}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.conn{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.conn.on{color:var(--done-tx);background:var(--done-bg);border-color:var(--done-bd)}
.conn.off{color:var(--warn-tx);background:var(--warn-bg);border-color:var(--warn-bd)}
.banner,.problems{border:1.5px solid var(--warn-bd);background:var(--warn-bg);color:var(--warn-tx);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:14px}
.problems ul{margin:4px 0 0;padding-left:20px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid}
.stepbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1.5px solid;border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;background:var(--card)}
.chip.sel{outline:2px solid var(--text);outline-offset:2px}
.chip.all{border-color:var(--line);color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button.on{border-color:var(--text);font-weight:500}
.lane{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 16px;margin-bottom:14px}
.lane-title{font-size:13px;color:var(--muted);margin-bottom:10px}
.row{display:flex;align-items:stretch;flex-wrap:wrap;row-gap:12px}
.node{flex:1 1 140px;min-width:140px;border:1.5px solid;border-radius:10px;padding:10px 12px;cursor:pointer;position:relative;transition:transform .25s,opacity .25s}
.node .name{font-weight:500;font-size:14px}
.node .what{font-size:12px;margin-top:2px}
.node .tag{position:absolute;top:-9px;right:8px;font-size:11px;padding:0 6px;border-radius:6px;border:1px solid;background:var(--card)}
.done{background:var(--done-bg);border-color:var(--done-bd);color:var(--done-tx)}
.new,.doing{background:var(--new-bg);border-color:var(--new-bd);color:var(--new-tx)}
.node.new{box-shadow:0 0 0 3px color-mix(in srgb,var(--new-bd) 35%,transparent)}
.todo{background:var(--todo-bg);border-color:var(--todo-bd);color:var(--todo-tx);border-style:dashed}
.node.todo{opacity:.6}
.ext{background:var(--ext-bg);border-color:var(--ext-bd);color:var(--ext-tx)}
#view .dim{opacity:.2}
.node.active{transform:translateY(-3px);opacity:1;outline:2px solid var(--text);outline-offset:2px}
.arrow{flex:0 0 28px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.arrow svg{width:26px;height:14px}
.arrow line{stroke:currentColor;stroke-width:1.6;stroke-dasharray:4 4}
@media (prefers-reduced-motion:no-preference){.node.new{animation:pulse 1.8s ease-in-out infinite}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--new-bd) 35%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--new-bd) 12%,transparent)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:6px}
.panel h3{margin:0 0 4px;font-size:16px;font-weight:500}
.panel .meta{font-size:13px;color:var(--muted);margin-bottom:12px;word-break:break-all}
.io{display:grid;grid-template-columns:1fr 40px 1fr;gap:10px;align-items:center}
@media (max-width:720px){.io{grid-template-columns:1fr}.io .mid{transform:rotate(90deg)}}
.box{border:1px solid var(--line);border-radius:8px;padding:10px;min-height:70px}
.box .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code);border-radius:6px;padding:8px}
.mid{text-align:center;color:var(--muted);font-size:20px}
.why{margin:12px 0 0;font-size:14px}
.insteps{margin:10px 0 0;font-size:12px;color:var(--muted)}
.controls{display:flex;gap:8px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
button{font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px;font-size:12px;color:var(--muted)}
.badges span{border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.badges .listen{border-color:var(--done-bd);color:var(--done-tx);background:var(--done-bg)}
.stepcard{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.stepcard h3{margin:0 0 6px;font-size:15px;font-weight:500}
.talk{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.talk .quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.talk textarea{width:100%;min-height:56px;resize:vertical;font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.talk .send{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.thread{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.msg{max-width:88%;border-radius:10px;padding:6px 10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--new-bg);color:var(--new-tx)}
.msg.agent{align-self:flex-start;background:var(--ext-bg);color:var(--ext-tx)}
.msg .who{display:block;font-size:11px;opacity:.75}
.count{position:absolute;bottom:-9px;right:8px;font-size:11px;padding:0 6px;border-radius:6px;border:1px solid var(--ext-bd);background:var(--card);color:var(--ext-tx)}
.err{color:var(--warn-tx)}
.diagram{position:relative}
.scroll{overflow-x:auto;margin-bottom:14px}
svg.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.links path{fill:none;stroke-width:1.8}
svg.links text{font-size:11px;fill:var(--muted)}
.l-uses{stroke:var(--muted);stroke-width:1.1!important;opacity:.7}
.l-ok{stroke:var(--done-bd)}
.l-todo{stroke:var(--new-bd);stroke-dasharray:6 4}
.l-blocked{stroke:var(--warn-bd);stroke-dasharray:3 4}
.k8s{display:grid;grid-template-columns:minmax(130px,170px) 1fr minmax(150px,210px);gap:44px;min-width:880px;align-items:start;padding:12px 8px}
.col{display:flex;flex-direction:column;gap:18px}
.col .node{flex:none;min-width:0}
.ns{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.ns-title{font-size:12px;color:var(--muted);margin-bottom:14px}
.ns-grid{display:grid;grid-template-columns:minmax(140px,1fr) 1.7fr;gap:40px;align-items:start}
.policy{border:1.5px dashed var(--new-bd);border-radius:12px;padding:24px 10px 10px;position:relative;display:flex;flex-direction:column;gap:20px}
.policy.none{border-color:transparent;padding-top:0}
.plabel{position:absolute;top:-11px;left:10px;font-size:12px;background:var(--card);padding:0 8px;border-radius:6px;border:1px solid var(--new-bd);color:var(--new-tx);cursor:pointer}
.plabel.active{outline:2px solid var(--text);outline-offset:2px}
.containers{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.containers span{font-size:11px;border:1px solid currentColor;border-radius:6px;padding:0 6px}
.seq{padding:8px 4px 4px}
.seq-head,.seq-row{display:grid;column-gap:12px}
.seq-head{margin-bottom:6px}
.seq-head .node{flex:none;min-width:0}
.seq-row{position:relative;min-height:46px}
.seq-cell{position:relative;grid-row:1}
.seq-cell::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1.5px dashed var(--line)}
.seq-msg{grid-row:1;align-self:center;z-index:1;cursor:pointer;border-radius:6px}
.seq-msg:hover .lbl{text-decoration:underline}
.seq-msg .lbl{font-size:13px;text-align:center;line-height:1.3;padding:0 4px}
.seq-msg .num{display:inline-block;min-width:18px;font-size:11px;border-radius:9px;background:var(--text);color:var(--bg);text-align:center;margin-right:4px}
.seq-msg .line{border-top:1.6px solid var(--muted);position:relative;margin-top:4px}
.seq-msg.reply .line{border-top-style:dashed}
.seq-msg .line::after{content:"";position:absolute;top:-6px;border:5px solid transparent}
.seq-msg.right .line::after{right:-3px;border-left-color:var(--muted)}
.seq-msg.left .line::after{left:-3px;border-right-color:var(--muted)}
.seq-msg.self{margin-left:calc(50% + 8px);font-size:13px;border:1px dashed var(--muted);padding:2px 8px;justify-self:start}
.tf{display:flex;flex-wrap:wrap;align-items:stretch;row-gap:12px;margin-bottom:14px}
.stage{flex:1 1 230px;min-width:230px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;transition:opacity .25s}
.stage.active{outline:2px solid var(--text);outline-offset:2px}
.stage .shead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.stage .sname{font-weight:500;font-size:14px;border-radius:6px;padding:0 8px;border:1.5px solid}
.stage .slabel{font-size:12px;color:var(--muted)}
.stage table{border-collapse:collapse;width:100%;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
.stage .tbl{overflow-x:auto}
.stage th,.stage td{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top;white-space:nowrap}
.stage th{background:var(--code);font-weight:500}
.stage .snote{font-size:12px;color:var(--muted);margin:8px 0 0;padding-left:16px}
.linklegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 6px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1 id="title">planview</h1><p class="goal" id="goal"></p></div>
    <span class="conn off" id="conn">○ ยังไม่ได้ต่อกับ agent</span>
  </div>
  <div class="badges" id="badges"></div>
  <div id="banner" class="banner" hidden>หน้านี้เปิดจากไฟล์โดยตรง จึงไม่ได้ต่อกับ agent คลิกแล้วจะไม่ไปถึงใคร เปิดผ่าน <code>planview open</code> แทน</div>
  <div id="problems" class="problems" hidden></div>
  <div class="legend">
    <span><i class="sw done"></i>ทำแล้ว</span>
    <span><i class="sw new"></i>ทำอยู่ / เพิ่งทำ</span>
    <span><i class="sw todo"></i>ยังไม่ทำ</span>
    <span><i class="sw ext"></i>ระบบภายนอก</span>
  </div>
  <div class="stepbar" id="stepbar"></div>
  <div class="controls">
    <button id="prev">◀ ขั้นก่อน</button>
    <button id="play">▶ เล่นทีละขั้น</button>
    <button id="next">ขั้นถัดไป ▶</button>
  </div>
  <div id="stepcard"></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
  <div class="panel" id="panel"><h3>กดกล่องเพื่อดูรายละเอียด</h3></div>
</main>
<script type="module">
const token = new URLSearchParams(location.search).get("token");
const served = location.protocol !== "file:" && token;
const {NODE_STATUS, STEP_STATUS, LINK_STATE, validate} = served ? await import("/schema.mjs?token=" + encodeURIComponent(token)) : {NODE_STATUS: {}, STEP_STATUS: {}, LINK_STATE: {}, validate: () => []};
let plan, viewId, stepIdx = -1, nodeId = null, timer = null;
let thread = [], waiting = 0, connected = false;
const drafts = {};
const KIND = {ok: "เข้าใจแล้ว", confused: "ยังงง", change: "ขอแก้", question: "ถาม", teachback: "ทวน"};

const ctxKey = (c) => (c.node ? "node:" + c.node : c.step ? "step:" + c.step : "plan");
const inCtx = (m, c) => (c.node ? m.node === c.node : c.step ? m.step === c.step && !m.node : !m.node && !m.step);

function msgEl(m) {
  const d = el("div", "msg " + (m.from === "agent" ? "agent" : "user"));
  const who = m.from === "agent" ? "agent" : `คุณ · ${KIND[m.kind] || "ถาม"} · ${m.delivered ? "agent รับแล้ว" : "รอ agent"}`;
  d.append(el("span", "who", who), document.createTextNode(m.text));
  return d;
}

function refreshThreads() {
  document.querySelectorAll(".thread[data-ctx]").forEach((t) => {
    const c = JSON.parse(t.dataset.ctx);
    t.replaceChildren(...thread.filter((m) => inCtx(m, c)).map(msgEl));
  });
  document.querySelectorAll(".node[data-id]").forEach((d) => {
    d.querySelector(".count")?.remove();
    const n = thread.filter((m) => m.node === d.dataset.id).length;
    if (n) d.append(el("span", "count", `💬 ${n}`));
  });
  renderBadges();
}

async function send(c, kind, text) {
  const body = {kind, text};
  if (c.node) body.node = c.node;
  if (c.step) body.step = c.step;
  if (viewId) body.view = viewId;
  const r = await fetch("/api/feedback?token=" + encodeURIComponent(token), {
    method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
}

function talkBox(c, {placeholder, kinds}) {
  const key = ctxKey(c);
  const box = el("div", "talk");
  const ta = el("textarea");
  ta.placeholder = placeholder;
  ta.value = drafts[key] || "";
  ta.oninput = () => (drafts[key] = ta.value);
  const note = el("span", "hint", connected ? "⌘/Ctrl + Enter เพื่อส่ง" : "ยังไม่ได้ต่อกับ agent");
  const go = async (kind, fallback) => {
    const text = ta.value.trim() || fallback;
    if (!text) {
      note.textContent = "พิมพ์สิ่งที่อยากให้แก้ก่อน";
      note.className = "err";
      return ta.focus();
    }
    try {
      await send(c, kind, text);
      ta.value = drafts[key] = "";
      note.textContent = "ส่งแล้ว";
      note.className = "";
    } catch (e) {
      note.textContent = "ส่งไม่สำเร็จ: " + e.message;
      note.className = "err";
    }
  };
  if (kinds.length > 1) {
    const quick = el("div", "quick");
    const fallbacks = {ok: "เข้าใจแล้ว", confused: "ยังงงตรงนี้ อธิบายใหม่ได้ไหม", change: ""};
    for (const k of kinds.filter((k) => k in fallbacks)) {
      const b = el("button", null, KIND[k]);
      b.onclick = () => go(k, fallbacks[k]);
      quick.append(b);
    }
    box.append(quick);
  }
  const mainKind = kinds.includes("teachback") ? "teachback" : "question";
  const sendBtn = el("button", "primary", "ส่ง");
  sendBtn.onclick = () => go(mainKind, "");
  ta.onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) go(mainKind, ""); };
  const row = el("div", "send");
  row.append(note, sendBtn);
  const t = el("div", "thread");
  t.dataset.ctx = JSON.stringify(c);
  box.append(ta, row, t);
  return box;
}

function renderBadges() {
  if (!plan) return;
  const s = plan.settings || {};
  const items = [
    el("span", null, `ทวนทีละขั้น: ${s.teachBack ? "เปิด" : "ปิด"}`),
    el("span", null, `commit: ${s.commit === "auto" ? "agent ทำให้" : "แนะนำข้อความ"}`),
  ];
  if (connected) items.push(waiting ? el("span", "listen", "agent กำลังรอฟัง") : el("span", null, "agent ไม่ได้รอฟัง · ข้อความจะรอในคิว"));
  document.getElementById("badges").replaceChildren(...items);
}

function renderStepCard() {
  const card = document.getElementById("stepcard");
  const step = plan.steps?.[stepIdx];
  if (!step) {
    const c = el("div", "stepcard");
    c.append(el("h3", null, "คุยเรื่องทั้งแผน"), talkBox({}, {placeholder: "ถามหรือสั่งเกี่ยวกับแผนทั้งหมด…", kinds: ["question"]}));
    card.replaceChildren(c);
  } else {
    const c = el("div", "stepcard " + (STEP_STATUS[step.status] || "todo"));
    c.append(el("h3", null, `ขั้น ${stepIdx + 1}: ${step.title}`));
    const teach = plan.settings?.teachBack;
    c.append(talkBox({step: step.id}, teach
      ? {placeholder: "ทวนความเข้าใจขั้นนี้ด้วยคำพูดของคุณ…", kinds: ["teachback"]}
      : {placeholder: "ถามหรือสั่งเกี่ยวกับขั้นนี้…", kinds: ["question"]}));
    card.replaceChildren(c);
  }
  refreshThreads();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function arrow() {
  const a = el("div", "arrow");
  a.innerHTML = '<svg viewBox="0 0 26 14" aria-hidden="true"><line x1="1" y1="7" x2="20" y2="7"/><path d="M17 2l6 5-6 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  return a;
}

function nodeBox(id) {
  const n = plan.nodes[id];
  if (!n) return el("div", "node todo", `? ${id}`);
  const status = NODE_STATUS[n.status] ? n.status : "todo";
  const d = el("div", "node " + status);
  d.dataset.id = id;
  d.tabIndex = 0;
  d.append(el("span", "tag", NODE_STATUS[status]), el("div", "name", n.name));
  if (n.what) d.append(el("div", "what", n.what));
  d.onclick = () => selectNode(id);
  d.onkeydown = (e) => { if (e.key === "Enter") selectNode(id); };
  return d;
}

function renderFlow(v) {
  const wrap = el("div");
  for (const lane of v.lanes || []) {
    const box = el("div", "lane");
    if (lane.title) box.append(el("div", "lane-title", lane.title));
    const row = el("div", "row");
    (lane.nodes || []).forEach((id, i) => {
      if (i > 0 && lane.arrows !== false) row.append(arrow());
      row.append(nodeBox(id));
    });
    box.append(row);
    wrap.append(box);
  }
  return wrap;
}

let linkDrawer = null, linkObserver = null;

function drawLinks(container, specs) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.classList.add("links");
  container.append(svg);
  const box = (id) => container.querySelector(`[data-anchor="${CSS.escape(id)}"]`);
  linkDrawer = () => {
    const base = container.getBoundingClientRect();
    svg.setAttribute("width", container.scrollWidth);
    svg.setAttribute("height", container.scrollHeight);
    svg.replaceChildren();
    const step = plan.steps?.[stepIdx];
    const inStep = step ? new Set(step.nodes || []) : null;
    const fan = {};
    for (const l of specs) if (!l.down) (fan[l.from] ||= []).push(l);
    for (const l of specs) {
      const a = box(l.from)?.getBoundingClientRect(), b = box(l.to)?.getBoundingClientRect();
      if (!a || !b) continue;
      let d, head;
      if (l.down) {
        const x = a.left + a.width / 2 - base.left, y1 = a.bottom - base.top, y2 = b.top - base.top - 2;
        d = `M${x} ${y1} L${x} ${y2}`;
        head = `M${x - 4} ${y2 - 7} L${x} ${y2} L${x + 4} ${y2 - 7}`;
      } else {
        const x1 = a.right - base.left, x2 = b.left - base.left - 2;
        const out = fan[l.from], k = out.indexOf(l);
        const y1 = a.top + (a.height * (k + 1)) / (out.length + 1) - base.top, y2 = b.top + Math.min(b.height / 2, 40) - base.top;
        const dx = Math.max(24, (x2 - x1) / 2);
        d = `M${x1} ${y1} C${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
        head = `M${x2 - 7} ${y2 - 4} L${x2} ${y2} L${x2 - 7} ${y2 + 4}`;
        if (l.label) {
          const t = document.createElementNS(svg.namespaceURI, "text");
          t.setAttribute("x", x2 - 10);
          t.setAttribute("y", y2 - 6);
          t.setAttribute("text-anchor", "end");
          t.textContent = l.label;
          svg.append(t);
        }
      }
      const dim = inStep && !inStep.has(l.from) && !inStep.has(l.to);
      for (const [path, extra] of [[d, ""], [head, " head"]]) {
        const e = document.createElementNS(svg.namespaceURI, "path");
        e.setAttribute("d", path);
        e.setAttribute("class", `l-${l.state || "uses"}${extra}`);
        if (extra) e.style.strokeDasharray = "none";
        if (dim) e.style.opacity = ".15";
        svg.append(e);
      }
    }
  };
  linkObserver?.disconnect();
  linkObserver = new ResizeObserver(() => linkDrawer?.());
  linkObserver.observe(container);
}

function anchored(id, elx = nodeBox(id)) {
  elx.dataset.anchor = id;
  return elx;
}

function linkLegend(states) {
  const lg = el("div", "linklegend");
  const color = {ok: "var(--done-bd)", todo: "var(--new-bd)", blocked: "var(--warn-bd)"};
  for (const st of states) {
    const sp = el("span", null, (st === "ok" ? "━ " : "╍ ") + LINK_STATE[st]);
    sp.style.color = color[st];
    lg.append(sp);
  }
  return lg;
}

function renderK8s(v) {
  const scroll = el("div", "scroll");
  const states = [...new Set((v.links || []).map((l) => l.state || "ok"))];
  if (states.length) scroll.append(linkLegend(states));
  const grid = el("div", "k8s diagram");
  const outside = el("div", "col");
  (v.outside || []).forEach((id) => outside.append(anchored(id)));
  const ns = el("div", "ns");
  ns.dataset.anchor = "#namespace";
  ns.append(el("div", "ns-title", [v.namespace && `namespace ${v.namespace}`, v.cluster && `cluster ${v.cluster}`].filter(Boolean).join(" · ") || "namespace"));
  const nsGrid = el("div", "ns-grid");
  const configs = el("div", "col");
  (v.configs || []).forEach((id) => configs.append(anchored(id)));
  const policy = el("div", "policy" + (v.policy ? "" : " none"));
  if (v.policy) {
    const pl = el("span", "plabel", "🛡 " + (plan.nodes[v.policy]?.name || v.policy));
    pl.dataset.id = v.policy;
    pl.tabIndex = 0;
    pl.onclick = () => selectNode(v.policy);
    policy.append(pl);
  }
  for (const w of v.workloads || []) {
    const b = anchored(w.node);
    if (w.containers?.length) {
      const c = el("div", "containers");
      w.containers.forEach((name) => c.append(el("span", null, name)));
      b.append(c);
    }
    policy.append(b);
  }
  nsGrid.append(configs, policy);
  ns.append(nsGrid);
  const targets = el("div", "col");
  (v.targets || []).forEach((id) => targets.append(anchored(id)));
  grid.append(outside, ns, targets);
  scroll.append(grid);
  const specs = [];
  const out = v.outside || [];
  out.forEach((id, i) => specs.push(i < out.length - 1 ? {from: id, to: out[i + 1], down: true, state: "uses"} : {from: id, to: "#namespace", state: "uses"}));
  for (const w of v.workloads || []) for (const u of w.uses || []) specs.push({from: u, to: w.node, state: "uses"});
  for (const l of v.links || []) specs.push({...l, state: l.state || "ok"});
  drawLinks(grid, specs);
  return scroll;
}

function renderSequence(v) {
  const actors = v.actors || [];
  const cols = `repeat(${actors.length}, minmax(130px, 1fr))`;
  const scroll = el("div", "scroll");
  const seq = el("div", "seq");
  seq.style.minWidth = actors.length * 150 + "px";
  const head = el("div", "seq-head");
  head.style.gridTemplateColumns = cols;
  actors.forEach((id) => head.append(nodeBox(id)));
  seq.append(head);
  (v.messages || []).forEach((m, i) => {
    const row = el("div", "seq-row");
    row.style.gridTemplateColumns = cols;
    actors.forEach((_, c) => {
      const cell = el("div", "seq-cell");
      cell.style.gridColumn = String(c + 1);
      row.append(cell);
    });
    const a = actors.indexOf(m.from), b = actors.indexOf(m.to);
    const msg = el("div", "seq-msg");
    if (m.step) msg.dataset.step = m.step;
    const lbl = el("div", "lbl");
    lbl.append(el("span", "num", String(i + 1)), document.createTextNode(m.text || ""));
    if (a === b) {
      msg.classList.add("self");
      msg.style.gridColumn = String(a + 1);
      msg.append(lbl);
    } else {
      const lo = Math.min(a, b), span = Math.abs(a - b) + 1;
      msg.classList.add(a < b ? "right" : "left");
      if (m.reply) msg.classList.add("reply");
      msg.style.gridColumn = `${lo + 1} / span ${span}`;
      msg.style.margin = `0 calc(50% / ${span})`;
      msg.append(lbl, el("div", "line"));
    }
    const target = m.node || m.to;
    msg.title = "คลิกเพื่อดู " + (plan.nodes[target]?.name || target);
    msg.onclick = () => selectNode(target);
    row.append(msg);
    seq.append(row);
  });
  scroll.append(seq);
  return scroll;
}

function renderTransform(v) {
  const wrap = el("div", "tf");
  (v.stages || []).forEach((st, i) => {
    if (i > 0) wrap.append(arrow());
    const n = plan.nodes[st.node] || {name: st.node};
    const card = el("div", "stage");
    card.dataset.id = st.node;
    card.tabIndex = 0;
    card.onclick = () => selectNode(st.node);
    const head = el("div", "shead");
    head.append(el("span", "sname " + (NODE_STATUS[n.status] ? n.status : "todo"), n.name));
    if (st.label) head.append(el("span", "slabel", st.label));
    card.append(head);
    if (st.columns) {
      const t = el("table"), tr = el("tr");
      st.columns.forEach((c) => tr.append(el("th", null, c)));
      t.append(tr);
      for (const r of st.rows || []) {
        const row = el("tr");
        r.forEach((c) => row.append(el("td", null, c == null || c === "" ? "∅" : String(c).replace(/^ +| +$/g, (sp) => "␠".repeat(sp.length)))));
        t.append(row);
      }
      const tbl = el("div", "tbl");
      tbl.append(t);
      card.append(tbl);
    }
    if (st.text) card.append(el("pre", null, st.text));
    if (st.notes?.length) {
      const ul = el("ul", "snote");
      st.notes.forEach((t) => ul.append(el("li", null, t)));
      card.append(ul);
    }
    wrap.append(card);
  });
  return wrap;
}

const VIEWS = {
  flow: {render: renderFlow},
  k8s: {render: renderK8s, after: () => requestAnimationFrame(() => linkDrawer?.())},
  sequence: {render: renderSequence},
  transform: {render: renderTransform},
};

function renderView() {
  const v = plan.views.find((x) => x.id === viewId) || plan.views[0];
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren(...(plan.views.length > 1 ? plan.views.map((x) => {
    const b = el("button", x.id === v.id ? "on" : "", x.title || x.id);
    b.onclick = () => { viewId = x.id; renderView(); };
    return b;
  }) : []));
  const kind = VIEWS[v.kind];
  linkDrawer = null;
  linkObserver?.disconnect();
  document.getElementById("view").replaceChildren(kind ? kind.render(v) : el("p", null, `ยังวาด ${v.kind} ไม่ได้`));
  kind?.after?.();
  highlight();
}

function renderSteps() {
  const bar = document.getElementById("stepbar");
  const all = el("span", "chip all" + (stepIdx < 0 ? " sel" : ""), "ทั้งหมด");
  all.onclick = () => { stop(); selectStep(-1); };
  bar.replaceChildren(all, ...(plan.steps || []).map((s, i) => {
    const c = el("span", "chip " + (STEP_STATUS[s.status] || "todo") + (i === stepIdx ? " sel" : ""), `${i + 1}. ${s.title}`);
    c.onclick = () => { stop(); selectStep(i); };
    return c;
  }));
}

function highlight() {
  const step = plan.steps?.[stepIdx];
  const inStep = step ? new Set(step.nodes || []) : null;
  document.querySelectorAll("#view [data-id]").forEach((d) => {
    d.classList.toggle("dim", !!inStep && !inStep.has(d.dataset.id));
    d.classList.toggle("active", d.dataset.id === nodeId);
  });
  document.querySelectorAll("#view [data-step]").forEach((d) => d.classList.toggle("dim", !!step && d.dataset.step !== step.id));
  linkDrawer?.();
}

function selectStep(i) {
  stepIdx = i;
  renderSteps();
  renderStepCard();
  highlight();
  const step = plan.steps?.[i];
  if (step?.nodes?.length) selectNode(step.nodes[0]);
}

function selectNode(id) {
  nodeId = id;
  highlight();
  const n = plan.nodes[id];
  const p = document.getElementById("panel");
  if (!n) return p.replaceChildren(el("h3", null, `ไม่มี node "${id}"`));
  const parts = [el("h3", null, `${n.name} · ${NODE_STATUS[n.status] || NODE_STATUS.todo}`)];
  if (n.file) parts.push(el("div", "meta", n.file));
  if (n.in || n.out) {
    const io = el("div", "io");
    for (const [lbl, txt] of [["รับเข้า", n.in], ["ได้ออกมา", n.out]]) {
      const b = el("div", "box");
      b.append(el("div", "lbl", lbl), el("pre", null, txt || "—"));
      io.append(b);
      if (lbl === "รับเข้า") io.append(el("div", "mid", "→"));
    }
    parts.push(io);
  }
  if (n.why) parts.push(el("p", "why", n.why));
  const steps = (plan.steps || []).map((s, i) => (s.nodes || []).includes(id) ? `${i + 1}. ${s.title}` : null).filter(Boolean);
  if (steps.length) parts.push(el("p", "insteps", "อยู่ในขั้น: " + steps.join(", ")));
  parts.push(talkBox({node: id}, {placeholder: `ถามหรือสั่งเกี่ยวกับ "${n.name}"…`, kinds: ["ok", "confused", "change", "question"]}));
  p.replaceChildren(...parts);
  refreshThreads();
}

function stop() {
  clearInterval(timer);
  timer = null;
  document.getElementById("play").textContent = "▶ เล่นทีละขั้น";
}
function step(d) {
  const n = (plan.steps || []).length;
  if (n) selectStep(((stepIdx < 0 ? (d > 0 ? -1 : 0) : stepIdx) + d + n) % n);
}
document.getElementById("prev").onclick = () => { stop(); step(-1); };
document.getElementById("next").onclick = () => { stop(); step(1); };
document.getElementById("play").onclick = () => {
  if (timer) return stop();
  document.getElementById("play").textContent = "❚❚ หยุด";
  step(1);
  timer = setInterval(() => step(1), 3200);
};

function render(p) {
  plan = p;
  plan.nodes ||= {};
  plan.views ||= [];
  document.title = plan.title ? `${plan.title} · planview` : "planview";
  document.getElementById("title").textContent = plan.title || "planview";
  document.getElementById("goal").textContent = plan.goal || "";
  const problems = validate(plan);
  const box = document.getElementById("problems");
  box.hidden = !problems.length;
  if (problems.length) {
    const ul = el("ul");
    problems.forEach((t) => ul.append(el("li", null, t)));
    box.replaceChildren(el("b", null, "plan.json มีปัญหา"), ul);
  }
  if (stepIdx >= (plan.steps || []).length) stepIdx = -1;
  renderSteps();
  renderStepCard();
  if (plan.views.length) renderView();
  refreshThreads();
  if (!rendered) {
    rendered = true;
    const cur = (plan.steps || []).findIndex((s) => s.status === "doing" || s.status === "review");
    if (cur >= 0) selectStep(cur);
  } else if (nodeId && plan.nodes[nodeId]) {
    selectNode(nodeId);
  }
}
let rendered = false;

function setConn(on) {
  connected = on;
  document.querySelectorAll(".talk .hint").forEach((n) => (n.textContent = on ? "⌘/Ctrl + Enter เพื่อส่ง" : "ยังไม่ได้ต่อกับ agent"));
  renderBadges();
  const conn = document.getElementById("conn");
  conn.className = "conn " + (on ? "on" : "off");
  conn.textContent = on ? "● ต่อกับ agent แล้ว" : "○ หลุดจาก server";
}

async function fetchPlan() {
  const r = await fetch("/api/plan?token=" + encodeURIComponent(token));
  const box = document.getElementById("problems");
  if (!r.ok) {
    box.hidden = false;
    box.textContent = `โหลดแผนไม่ได้ (${r.status}): ${await r.text()}`;
    return;
  }
  try {
    render(JSON.parse(await r.text()));
  } catch (e) {
    box.hidden = false;
    box.textContent = "plan.json อ่านไม่ได้: " + e.message;
  }
}

async function load() {
  if (!served) {
    document.getElementById("banner").hidden = false;
    return;
  }
  await fetchPlan();
  const events = new EventSource("/api/events?token=" + encodeURIComponent(token));
  events.onopen = async () => {
    const r = await fetch("/api/thread?token=" + encodeURIComponent(token));
    if (r.ok) ({items: thread, waiting} = await r.json());
    thread.sort((a, b) => a.at.localeCompare(b.at));
    setConn(true);
    refreshThreads();
  };
  events.onerror = () => setConn(false);
  events.addEventListener("plan", fetchPlan);
  const on = (name, fn) => events.addEventListener(name, (e) => { fn(JSON.parse(e.data)); refreshThreads(); });
  on("feedback", (m) => thread.push({...m, from: "user", delivered: false}));
  on("reply", (m) => thread.push(m));
  on("delivered", ({ids}) => thread.forEach((m) => { if (ids.includes(m.id)) m.delivered = true; }));
  on("agent", (a) => (waiting = a.waiting));
}
window.__planview = {get plan() { return plan; }, selectStep, selectNode, render};
load();
</script>
